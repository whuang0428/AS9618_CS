<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title description">
  <title id="title">Vector drawing list: objects, properties and redrawing</title>
  <desc id="description">A three-stage diagram shows drawing objects, their stored properties and the same shapes redrawn at two sizes without pixelation.</desc>
  <rect width="1536" height="1024" fill="#f8fafc"/>
  <text x="96" y="110" fill="#102a56" font-family="Arial, sans-serif" font-size="54" font-weight="700">Vector drawing list</text>
  <text x="96" y="166" fill="#41536b" font-family="Arial, sans-serif" font-size="26">Store objects and properties; redraw the geometry at the required size.</text>
  <g font-family="Arial, sans-serif">
    <rect x="82" y="238" width="400" height="620" rx="28" fill="#ffffff" stroke="#9aa9bd" stroke-width="4"/>
    <text x="122" y="306" fill="#174ea6" font-size="30" font-weight="700">1  Drawing objects</text>
    <circle cx="278" cy="475" r="98" fill="#d94841" stroke="#742a2a" stroke-width="10"/>
    <rect x="160" y="650" width="236" height="128" rx="18" fill="#2459a9" stroke="#102a56" stroke-width="10"/>
    <text x="212" y="825" fill="#41536b" font-size="24">circle + rectangle</text>

    <path d="M500 546h76" stroke="#174ea6" stroke-width="12"/>
    <path d="M576 546l-28-22v44z" fill="#174ea6"/>

    <rect x="596" y="238" width="400" height="620" rx="28" fill="#ffffff" stroke="#9aa9bd" stroke-width="4"/>
    <text x="636" y="306" fill="#174ea6" font-size="30" font-weight="700">2  Stored properties</text>
    <rect x="640" y="365" width="312" height="350" rx="18" fill="#101827"/>
    <text x="678" y="422" fill="#f8fafc" font-size="25" font-family="Menlo, monospace">OBJECT circle</text>
    <text x="678" y="472" fill="#b9d4ff" font-size="23" font-family="Menlo, monospace">centre = (x, y)</text>
    <text x="678" y="516" fill="#b9d4ff" font-size="23" font-family="Menlo, monospace">radius = 98</text>
    <text x="678" y="560" fill="#b9d4ff" font-size="23" font-family="Menlo, monospace">fill = red</text>
    <text x="678" y="626" fill="#f8fafc" font-size="25" font-family="Menlo, monospace">OBJECT rectangle</text>
    <text x="678" y="670" fill="#b9d4ff" font-size="23" font-family="Menlo, monospace">width, height, colour</text>
    <text x="655" y="778" fill="#41536b" font-size="24">type • coordinates • dimensions</text>
    <text x="704" y="816" fill="#41536b" font-size="24">line • fill • thickness</text>

    <path d="M1014 546h76" stroke="#174ea6" stroke-width="12"/>
    <path d="M1090 546l-28-22v44z" fill="#174ea6"/>

    <rect x="1110" y="238" width="344" height="620" rx="28" fill="#ffffff" stroke="#9aa9bd" stroke-width="4"/>
    <text x="1150" y="306" fill="#174ea6" font-size="30" font-weight="700">3  Redraw</text>
    <circle cx="1204" cy="442" r="54" fill="#d94841" stroke="#742a2a" stroke-width="7"/>
    <rect x="1290" y="405" width="100" height="74" rx="10" fill="#2459a9" stroke="#102a56" stroke-width="7"/>
    <text x="1194" y="528" fill="#41536b" font-size="22">small</text>
    <circle cx="1236" cy="680" r="91" fill="#d94841" stroke="#742a2a" stroke-width="10"/>
    <rect x="1340" y="618" width="88" height="124" rx="12" fill="#2459a9" stroke="#102a56" stroke-width="10"/>
    <text x="1192" y="810" fill="#41536b" font-size="22">scaled geometry</text>
  </g>
  <rect x="202" y="904" width="1132" height="70" rx="20" fill="#e8f1ff" stroke="#174ea6" stroke-width="3"/>
  <text x="768" y="950" text-anchor="middle" fill="#102a56" font-family="Arial, sans-serif" font-size="28" font-weight="700">The renderer follows the list again, so resizing does not create pixelation.</text>
</svg>
