<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title description"><title id="title">A moving coil: reverse the direction of conversion</title><desc id="description">Dynamic microphone: diaphragm moves a coil relative to a permanent magnet and induces voltage. Loudspeaker: changing coil current produces a force and moves the cone.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#155e75"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#172f4e}.wire{stroke:#155e75;stroke-width:3;fill:none;stroke-linejoin:round}.box,.gate{fill:#eef7f7;stroke:#172f4e;stroke-width:2.5}.gate{stroke-width:3}.muted{fill:#f4f6f9;stroke:#7c8b9c;stroke-width:2}.accent{fill:#fff3d9;stroke:#9a5b0b;stroke-width:2}</style><rect width="100%" height="100%" fill="white"/><text x="600" y="47" font-size="30" text-anchor="middle">A moving coil: reverse the direction of conversion</text><text x="600" y="100" font-size="27" text-anchor="middle">Dynamic microphone · sound drives movement</text><rect class="box" x="35" y="135" width="220" height="105" rx="9"/><text x="145" y="171" font-size="24" text-anchor="middle">Sound pressure</text><text x="145" y="200" font-size="24" text-anchor="middle">moves diaphragm</text><rect class="box" x="335" y="135" width="240" height="105" rx="9"/><text x="455" y="171" font-size="24" text-anchor="middle">Attached coil moves</text><text x="455" y="200" font-size="24" text-anchor="middle">in magnetic field</text><rect class="box" x="655" y="135" width="240" height="105" rx="9"/><text x="775" y="171" font-size="24" text-anchor="middle">Induced voltage</text><text x="775" y="200" font-size="24" text-anchor="middle">analogue signal</text><rect class="box" x="975" y="135" width="190" height="105" rx="9"/><text x="1070" y="171" font-size="24" text-anchor="middle">ADC</text><text x="1070" y="200" font-size="24" text-anchor="middle">digital samples</text><path class="wire" d="M255 185 L335 185" marker-end="url(#arrow)"/><path class="wire" d="M575 185 L655 185" marker-end="url(#arrow)"/><path class="wire" d="M895 185 L975 185" marker-end="url(#arrow)"/><text x="600" y="320" font-size="27" text-anchor="middle">Loudspeaker · an electrical signal drives movement</text><rect class="box" x="35" y="355" width="220" height="105" rx="9"/><text x="145" y="391" font-size="24" text-anchor="middle">Samples → DAC</text><text x="145" y="420" font-size="24" text-anchor="middle">→ amplifier</text><rect class="box" x="335" y="355" width="240" height="105" rx="9"/><text x="455" y="391" font-size="24" text-anchor="middle">Changing coil current</text><text x="455" y="420" font-size="24" text-anchor="middle">in magnetic field</text><rect class="box" x="655" y="355" width="240" height="105" rx="9"/><text x="775" y="391" font-size="24" text-anchor="middle">Force moves coil</text><text x="775" y="420" font-size="24" text-anchor="middle">and attached cone</text><rect class="box" x="975" y="355" width="190" height="105" rx="9"/><text x="1070" y="391" font-size="24" text-anchor="middle">Air pressure</text><text x="1070" y="420" font-size="24" text-anchor="middle">sound waves</text><path class="wire" d="M255 405 L335 405" marker-end="url(#arrow)"/><path class="wire" d="M575 405 L655 405" marker-end="url(#arrow)"/><path class="wire" d="M895 405 L975 405" marker-end="url(#arrow)"/><text x="600" y="550" font-size="24" text-anchor="middle">The permanent magnet supplies the field; the coil and diaphragm/cone can move.</text><text x="600" y="590" font-size="24" text-anchor="middle">Functional conversion diagram. This microphone example does not describe every microphone type.</text></svg>