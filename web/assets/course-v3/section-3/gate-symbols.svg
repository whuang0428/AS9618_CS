<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="635" viewBox="0 0 1200 635" role="img" aria-labelledby="title description"><title id="title">Read the symbol before applying its rule</title><desc id="description">Six standard gate symbols. NOT has one input. AND, OR, NAND, NOR and XOR have two inputs; the output bubble inverts the result.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#155e75"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#172f4e}.wire{stroke:#155e75;stroke-width:3;fill:none;stroke-linejoin:round}.box,.gate{fill:#eef7f7;stroke:#172f4e;stroke-width:2.5}.gate{stroke-width:3}.muted{fill:#f4f6f9;stroke:#7c8b9c;stroke-width:2}.accent{fill:#fff3d9;stroke:#9a5b0b;stroke-width:2}</style><rect width="100%" height="100%" fill="white"/><text x="600" y="47" font-size="30" text-anchor="middle">Read the symbol before applying its rule</text><text x="165" y="95" font-size="29" text-anchor="middle">NOT</text><g transform="translate(100 175)" data-gate="NOT"><path class="gate" d="M0 -35 L85 0 L0 35 Z"/><circle class="gate" cx="95" cy="0" r="10"/></g><path class="wire" d="M40 175 L100 175"/><path class="wire" d="M205 175 L275 175"/><text x="165" y="260" font-size="23" text-anchor="middle">opposite input</text><text x="565" y="95" font-size="29" text-anchor="middle">AND</text><g transform="translate(500 175)" data-gate="AND"><path class="gate" d="M0 -40 H50 A40 40 0 0 1 50 40 H0 Z"/></g><path class="wire" d="M440 155 L500 155"/><path class="wire" d="M440 195 L500 195"/><path class="wire" d="M590 175 L675 175"/><text x="565" y="260" font-size="23" text-anchor="middle">both inputs 1</text><text x="965" y="95" font-size="29" text-anchor="middle">OR</text><g transform="translate(900 175)" data-gate="OR"><path class="gate" d="M0 -40 Q60 -40 100 0 Q60 40 0 40 Q30 0 0 -40 Z"/></g><path class="wire" d="M840 155 L911 155"/><path class="wire" d="M840 195 L911 195"/><path class="wire" d="M1000 175 L1075 175"/><text x="965" y="260" font-size="23" text-anchor="middle">at least one input 1</text><text x="165" y="350" font-size="29" text-anchor="middle">NAND</text><g transform="translate(100 430)" data-gate="NAND"><path class="gate" d="M0 -40 H50 A40 40 0 0 1 50 40 H0 Z"/><circle class="gate" cx="100" cy="0" r="10"/></g><path class="wire" d="M40 410 L100 410"/><path class="wire" d="M40 450 L100 450"/><path class="wire" d="M210 430 L275 430"/><text x="165" y="515" font-size="23" text-anchor="middle">NOT of AND</text><text x="565" y="350" font-size="29" text-anchor="middle">NOR</text><g transform="translate(500 430)" data-gate="NOR"><path class="gate" d="M0 -40 Q60 -40 100 0 Q60 40 0 40 Q30 0 0 -40 Z"/><circle class="gate" cx="110" cy="0" r="10"/></g><path class="wire" d="M440 410 L511 410"/><path class="wire" d="M440 450 L511 450"/><path class="wire" d="M620 430 L675 430"/><text x="565" y="515" font-size="23" text-anchor="middle">NOT of OR</text><text x="965" y="350" font-size="29" text-anchor="middle">XOR</text><g transform="translate(900 430)" data-gate="XOR"><path class="gate" d="M0 -40 Q60 -40 100 0 Q60 40 0 40 Q30 0 0 -40 Z"/><path class="wire" d="M-12 -40 Q18 0 -12 40"/></g><path class="wire" d="M840 410 L911 410"/><path class="wire" d="M840 450 L911 450"/><path class="wire" d="M1000 430 L1075 430"/><text x="965" y="515" font-size="23" text-anchor="middle">exactly one of two inputs 1</text><text x="600" y="590" font-size="24" text-anchor="middle">Output bubble = inversion. Extra input curve = XOR (EOR).</text></svg>