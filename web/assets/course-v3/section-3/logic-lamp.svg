<svg xmlns="http://www.w3.org/2000/svg" width="1090" height="525" viewBox="0 0 1090 525" role="img" aria-labelledby="title description"><title id="title">One valid circuit · L</title><desc id="description">Circuit for lamp. Repeated input names refer to the same independent input.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#155e75"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#172f4e}.wire{stroke:#155e75;stroke-width:3;fill:none;stroke-linejoin:round}.box,.gate{fill:#eef7f7;stroke:#172f4e;stroke-width:2.5}.gate{stroke-width:3}.muted{fill:#f4f6f9;stroke:#7c8b9c;stroke-width:2}.accent{fill:#fff3d9;stroke:#9a5b0b;stroke-width:2}</style><rect width="100%" height="100%" fill="white"/><text x="545" y="47" font-size="30" text-anchor="middle">One valid circuit · L</text><text x="35" y="143" font-size="25" text-anchor="start">S</text><text x="35" y="263" font-size="25" text-anchor="start">U</text><path class="wire" d="M115 255 H335 V255 H390"/><g transform="translate(390 255)" data-gate="NOT"><path class="gate" d="M0 -35 L85 0 L0 35 Z"/><circle class="gate" cx="95" cy="0" r="10"/></g><text x="35" y="383" font-size="25" text-anchor="start">V</text><path class="wire" d="M115 375 H335 V375 H390"/><g transform="translate(390 375)" data-gate="NOT"><path class="gate" d="M0 -35 L85 0 L0 35 Z"/><circle class="gate" cx="95" cy="0" r="10"/></g><path class="wire" d="M495 255 H565 V295 H620"/><path class="wire" d="M495 375 H550 V335 H620"/><g transform="translate(620 315)" data-gate="AND"><path class="gate" d="M0 -40 H50 A40 40 0 0 1 50 40 H0 Z"/></g><path class="wire" d="M115 135 H795 V205 H850"/><path class="wire" d="M710 315 H780 V245 H850"/><g transform="translate(850 225)" data-gate="AND"><path class="gate" d="M0 -40 H50 A40 40 0 0 1 50 40 H0 Z"/></g><path class="wire" d="M940 225 L995 225"/><text x="1020" y="233" font-size="27" text-anchor="middle">L</text><text x="545" y="470" font-size="23" text-anchor="middle">Independent inputs: S, U, V. Repeated labels carry the same input signal.</text><text x="545" y="502" font-size="23" text-anchor="middle">NOT has one input; every other gate shown has two inputs.</text></svg>