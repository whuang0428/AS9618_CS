<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img"><title>Two ways to store a volatile bit</title><style>text{font-family:Arial,sans-serif;fill:#142b45} .wire,.gate{stroke:#142b45;stroke-width:4;fill:none;stroke-linejoin:round;stroke-linecap:round}.gate{fill:#e8f5f5} .label{font-size:28px;font-weight:bold}.note{font-size:23px}</style><rect width="1100" height="560" fill="white"/><text x="45" y="55" class="label">Two ways to store a volatile bit</text><rect x="45" y="95" width="480" height="330" rx="12" fill="#f0f7fa" stroke="#53788b"/><rect x="575" y="95" width="480" height="330" rx="12" fill="#f0f7fa" stroke="#53788b"/><text x="70" y="138" class="label">SRAM — powered bistable latch</text><text x="600" y="138" class="label">DRAM — capacitor charge</text><rect x="180" y="190" width="210" height="80" rx="8" fill="#d9eeee" stroke="#142b45" stroke-width="3"/><text x="218" y="240" class="label">0 or 1</text><text x="70" y="310" class="note">Power maintains the stable state.</text><text x="70" y="349" class="note">Access circuitry reads or writes the bit.</text><text x="70" y="388" class="note">No periodic refresh while powered.</text><path class="wire" d="M815 174 V218 M765 218 H865 M765 234 H865 M815 234 V275"/><text x="600" y="310" class="note">Charge represents the stored state.</text><text x="600" y="349" class="note">Charge leaks; refresh restores it.</text><text x="600" y="388" class="note">Access circuitry reads or writes the bit.</text><text x="45" y="485" class="note">Both lose stored data without power.</text><text x="45" y="519" class="note">Functional comparison only: this is not a transistor-level circuit.</text></svg>
