<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="645" viewBox="0 0 1200 645" role="img" aria-labelledby="title description"><title id="title">Touch coordinates select a displayed control</title><desc id="description">An illustrative screen uses coordinates increasing rightward and downward. A reported touch at (240, 120) is inside the Start button, bounded by x 200 to 300 and y 80 to 160.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#155e75"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#172f4e}.wire{stroke:#155e75;stroke-width:3;fill:none;stroke-linejoin:round}.box,.gate{fill:#eef7f7;stroke:#172f4e;stroke-width:2.5}.gate{stroke-width:3}.muted{fill:#f4f6f9;stroke:#7c8b9c;stroke-width:2}.accent{fill:#fff3d9;stroke:#9a5b0b;stroke-width:2}</style><rect width="100%" height="100%" fill="white"/><text x="600" y="47" font-size="30" text-anchor="middle">Touch coordinates select a displayed control</text><rect class="muted" x="75" y="135" width="480" height="300"/><path class="wire" d="M75 135 L75 435"/><path class="wire" d="M155 135 L155 435"/><path class="wire" d="M235 135 L235 435"/><path class="wire" d="M315 135 L315 435"/><path class="wire" d="M395 135 L395 435"/><path class="wire" d="M475 135 L475 435"/><path class="wire" d="M555 135 L555 435"/><path class="wire" d="M75 135 L555 135"/><path class="wire" d="M75 195 L555 195"/><path class="wire" d="M75 255 L555 255"/><path class="wire" d="M75 315 L555 315"/><path class="wire" d="M75 375 L555 375"/><path class="wire" d="M75 435 L555 435"/><rect class="accent" x="275" y="215" width="100" height="80"/><circle cx="315" cy="255" r="9" fill="#155e75"/><text x="325" y="282" font-size="22" text-anchor="middle">Start</text><text x="75" y="115" font-size="22" text-anchor="middle">(0, 0)</text><text x="545" y="475" font-size="22" text-anchor="middle">x increases →</text><text x="190" y="475" font-size="22" text-anchor="middle">y increases downward</text><rect class="box" x="665" y="145" width="480" height="105" rx="9"/><text x="905" y="181" font-size="24" text-anchor="middle">Capacitance changes locally</text><text x="905" y="210" font-size="24" text-anchor="middle">Controller estimates x = 240, y = 120</text><rect class="box" x="665" y="330" width="480" height="105" rx="9"/><text x="905" y="366" font-size="24" text-anchor="middle">Software checks button bounds</text><text x="905" y="395" font-size="24" text-anchor="middle">200 ≤ x ≤ 300 and 80 ≤ y ≤ 160</text><path class="wire" d="M555 255 L665 195" marker-end="url(#arrow)"/><path class="wire" d="M905 250 L905 330" marker-end="url(#arrow)"/><text x="600" y="565" font-size="24" text-anchor="middle">The sensing grid supplies input; the display is a separate output layer.</text><text x="600" y="603" font-size="24" text-anchor="middle">The coordinates are a declared teaching example, not a calibration of an actual electrode grid.</text></svg>