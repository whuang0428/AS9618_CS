<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="625" viewBox="0 0 1200 625" role="img" aria-labelledby="title description"><title id="title">Flash: retain charge, then sense the threshold</title><desc id="description">Illustrative single-level floating-gate cell. Insulation retains charge. An erased low-threshold cell reads 1; a programmed high-threshold cell reads 0 in this declared model.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#155e75"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#172f4e}.wire{stroke:#155e75;stroke-width:3;fill:none;stroke-linejoin:round}.box,.gate{fill:#eef7f7;stroke:#172f4e;stroke-width:2.5}.gate{stroke-width:3}.muted{fill:#f4f6f9;stroke:#7c8b9c;stroke-width:2}.accent{fill:#fff3d9;stroke:#9a5b0b;stroke-width:2}</style><rect width="100%" height="100%" fill="white"/><text x="600" y="47" font-size="30" text-anchor="middle">Flash: retain charge, then sense the threshold</text><text x="195" y="112" font-size="27" text-anchor="middle">1 · Erased</text><rect class="muted" x="60" y="145" width="270" height="200" rx="12"/><rect class="box" x="105" y="190" width="180" height="85" rx="8"/><text x="195" y="177" font-size="21" text-anchor="middle">Insulating layer</text><text x="195" y="240" font-size="23" text-anchor="middle">Uncharged</text><text x="195" y="320" font-size="22" text-anchor="middle">Floating gate</text><text x="195" y="390" font-size="24" text-anchor="middle">Lower threshold</text><text x="195" y="430" font-size="24" text-anchor="middle">Read as 1</text><text x="595" y="112" font-size="27" text-anchor="middle">2 · Programmed</text><rect class="muted" x="460" y="145" width="270" height="200" rx="12"/><rect class="box" x="505" y="190" width="180" height="85" rx="8"/><text x="595" y="177" font-size="21" text-anchor="middle">Insulating layer</text><text x="595" y="240" font-size="23" text-anchor="middle">−  −  −  −</text><text x="595" y="320" font-size="22" text-anchor="middle">Floating gate</text><text x="595" y="390" font-size="24" text-anchor="middle">Higher threshold</text><text x="595" y="430" font-size="24" text-anchor="middle">Read as 0</text><text x="995" y="112" font-size="27" text-anchor="middle">3 · Power restored</text><rect class="muted" x="860" y="145" width="270" height="200" rx="12"/><rect class="box" x="905" y="190" width="180" height="85" rx="8"/><text x="995" y="177" font-size="21" text-anchor="middle">Insulating layer</text><text x="995" y="240" font-size="23" text-anchor="middle">−  −  −  −</text><text x="995" y="320" font-size="22" text-anchor="middle">Floating gate</text><text x="995" y="390" font-size="24" text-anchor="middle">Higher threshold</text><text x="995" y="430" font-size="24" text-anchor="middle">Read as 0</text><path class="wire" d="M330 250 L460 250" marker-end="url(#arrow)"/><path class="wire" d="M730 250 L860 250" marker-end="url(#arrow)"/><text x="795" y="490" font-size="22" text-anchor="middle">Power off, then on</text><text x="600" y="540" font-size="24" text-anchor="middle">Reading senses whether the transistor conducts at the chosen test voltage.</text><text x="600" y="582" font-size="24" text-anchor="middle">Erasing removes stored charge. No DRAM-style periodic refresh is needed to retain data.</text></svg>