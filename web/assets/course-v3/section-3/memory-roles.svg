<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title description"><title id="title">Classify the job separately from the memory technology</title><desc id="description">Working data can use SRAM or DRAM; firmware requires nonvolatile instruction storage; saved user files use secondary storage. A buffer is a temporary storage role.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#155e75"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#172f4e}.wire{stroke:#155e75;stroke-width:3;fill:none;stroke-linejoin:round}.box,.gate{fill:#eef7f7;stroke:#172f4e;stroke-width:2.5}.gate{stroke-width:3}.muted{fill:#f4f6f9;stroke:#7c8b9c;stroke-width:2}.accent{fill:#fff3d9;stroke:#9a5b0b;stroke-width:2}</style><rect width="100%" height="100%" fill="white"/><text x="600" y="47" font-size="30" text-anchor="middle">Classify the job separately from the memory technology</text><rect class="box" x="35" y="120" width="345" height="105" rx="9"/><text x="207.5" y="156" font-size="24" text-anchor="middle">Working data</text><text x="207.5" y="185" font-size="24" text-anchor="middle">Read/write workspace</text><rect class="box" x="425" y="120" width="345" height="105" rx="9"/><text x="597.5" y="156" font-size="24" text-anchor="middle">Persistent firmware</text><text x="597.5" y="185" font-size="24" text-anchor="middle">Start-up / control instructions</text><rect class="box" x="815" y="120" width="345" height="105" rx="9"/><text x="987.5" y="156" font-size="24" text-anchor="middle">Saved user files</text><text x="987.5" y="185" font-size="24" text-anchor="middle">Retain completed records</text><rect class="box" x="35" y="320" width="345" height="105" rx="9"/><text x="207.5" y="356" font-size="24" text-anchor="middle">SRAM or DRAM</text><text x="207.5" y="385" font-size="24" text-anchor="middle">Select by latency, density, cost</text><rect class="box" x="425" y="320" width="345" height="105" rx="9"/><text x="597.5" y="356" font-size="24" text-anchor="middle">PROM / EPROM / EEPROM</text><text x="597.5" y="385" font-size="24" text-anchor="middle">Select by update requirement</text><rect class="box" x="815" y="320" width="345" height="105" rx="9"/><text x="987.5" y="356" font-size="24" text-anchor="middle">Flash, HDD or optical storage</text><text x="987.5" y="385" font-size="24" text-anchor="middle">Select by use and constraints</text><path class="wire" d="M207 225 L207 320" marker-end="url(#arrow)"/><path class="wire" d="M597 225 L597 320" marker-end="url(#arrow)"/><path class="wire" d="M987 225 L987 320" marker-end="url(#arrow)"/><text x="600" y="520" font-size="24" text-anchor="middle">A buffer is an area used temporarily during a transfer; it may be implemented in RAM.</text><text x="600" y="562" font-size="24" text-anchor="middle">Flash can hold firmware or user files. A technology name alone does not identify the role.</text></svg>