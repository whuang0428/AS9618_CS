<svg xmlns="http://www.w3.org/2000/svg" width="870" height="405" viewBox="0 0 870 405" role="img" aria-labelledby="title description"><title id="title">One valid circuit · Q</title><desc id="description">Circuit for fromExamTable. Repeated input names refer to the same independent input.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#155e75"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#172f4e}.wire{stroke:#155e75;stroke-width:3;fill:none;stroke-linejoin:round}.box,.gate{fill:#eef7f7;stroke:#172f4e;stroke-width:2.5}.gate{stroke-width:3}.muted{fill:#f4f6f9;stroke:#7c8b9c;stroke-width:2}.accent{fill:#fff3d9;stroke:#9a5b0b;stroke-width:2}</style><rect width="100%" height="100%" fill="white"/><text x="435" y="47" font-size="30" text-anchor="middle">One valid circuit · Q</text><text x="35" y="143" font-size="25" text-anchor="start">A</text><text x="35" y="263" font-size="25" text-anchor="start">B</text><path class="wire" d="M115 255 H335 V255 H390"/><g transform="translate(390 255)" data-gate="NOT"><path class="gate" d="M0 -35 L85 0 L0 35 Z"/><circle class="gate" cx="95" cy="0" r="10"/></g><path class="wire" d="M115 135 H565 V175 H631"/><path class="wire" d="M495 255 H550 V215 H631"/><g transform="translate(620 195)" data-gate="OR"><path class="gate" d="M0 -40 Q60 -40 100 0 Q60 40 0 40 Q30 0 0 -40 Z"/></g><path class="wire" d="M720 195 L775 195"/><text x="800" y="203" font-size="27" text-anchor="middle">Q</text><text x="435" y="350" font-size="23" text-anchor="middle">Independent inputs: A, B. Repeated labels carry the same input signal.</text><text x="435" y="382" font-size="23" text-anchor="middle">NOT has one input; every other gate shown has two inputs.</text></svg>