<svg xmlns="http://www.w3.org/2000/svg" width="870" height="525" viewBox="0 0 870 525" role="img" aria-labelledby="title description"><title id="title">One valid circuit · Q</title><desc id="description">Circuit for norXor. Repeated input names refer to the same independent input.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#155e75"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#172f4e}.wire{stroke:#155e75;stroke-width:3;fill:none;stroke-linejoin:round}.box,.gate{fill:#eef7f7;stroke:#172f4e;stroke-width:2.5}.gate{stroke-width:3}.muted{fill:#f4f6f9;stroke:#7c8b9c;stroke-width:2}.accent{fill:#fff3d9;stroke:#9a5b0b;stroke-width:2}</style><rect width="100%" height="100%" fill="white"/><text x="435" y="47" font-size="30" text-anchor="middle">One valid circuit · Q</text><text x="35" y="143" font-size="25" text-anchor="start">A</text><text x="35" y="263" font-size="25" text-anchor="start">B</text><path class="wire" d="M115 135 H335 V175 H401"/><path class="wire" d="M115 255 H320 V215 H401"/><g transform="translate(390 195)" data-gate="NOR"><path class="gate" d="M0 -40 Q60 -40 100 0 Q60 40 0 40 Q30 0 0 -40 Z"/><circle class="gate" cx="110" cy="0" r="10"/></g><text x="35" y="383" font-size="25" text-anchor="start">C</text><path class="wire" d="M510 195 H565 V265 H631"/><path class="wire" d="M115 375 H550 V305 H631"/><g transform="translate(620 285)" data-gate="XOR"><path class="gate" d="M0 -40 Q60 -40 100 0 Q60 40 0 40 Q30 0 0 -40 Z"/><path class="wire" d="M-12 -40 Q18 0 -12 40"/></g><path class="wire" d="M720 285 L775 285"/><text x="800" y="293" font-size="27" text-anchor="middle">Q</text><text x="435" y="470" font-size="23" text-anchor="middle">Independent inputs: A, B, C. Repeated labels carry the same input signal.</text><text x="435" y="502" font-size="23" text-anchor="middle">NOT has one input; every other gate shown has two inputs.</text></svg>