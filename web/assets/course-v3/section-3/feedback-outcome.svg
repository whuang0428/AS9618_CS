<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description"><title id="title">Feedback returns a measurement of the physical outcome</title><desc id="description">Controller to actuator is an output command. Environment to sensor to controller is the feedback path. A failed actuator can leave the reading unchanged.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#155e75"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#172f4e}.wire{stroke:#155e75;stroke-width:3;fill:none;stroke-linejoin:round}.box,.gate{fill:#eef7f7;stroke:#172f4e;stroke-width:2.5}.gate{stroke-width:3}.muted{fill:#f4f6f9;stroke:#7c8b9c;stroke-width:2}.accent{fill:#fff3d9;stroke:#9a5b0b;stroke-width:2}</style><rect width="100%" height="100%" fill="white"/><text x="600" y="47" font-size="30" text-anchor="middle">Feedback returns a measurement of the physical outcome</text><rect class="box" x="50" y="140" width="290" height="105" rx="9"/><text x="195" y="176" font-size="24" text-anchor="middle">Sensor + conversion</text><text x="195" y="205" font-size="24" text-anchor="middle">read actual temperature</text><rect class="box" x="455" y="140" width="290" height="105" rx="9"/><text x="600" y="176" font-size="24" text-anchor="middle">Controller</text><text x="600" y="205" font-size="24" text-anchor="middle">compare with target</text><rect class="box" x="865" y="140" width="285" height="105" rx="9"/><text x="1007.5" y="176" font-size="24" text-anchor="middle">Actuator + driver</text><text x="1007.5" y="205" font-size="24" text-anchor="middle">apply heating output</text><path class="wire" d="M340 190 L455 190" marker-end="url(#arrow)"/><path class="wire" d="M745 190 L865 190" marker-end="url(#arrow)"/><rect class="box" x="455" y="400" width="290" height="105" rx="9"/><text x="600" y="436" font-size="24" text-anchor="middle">Physical environment</text><text x="600" y="465" font-size="24" text-anchor="middle">temperature may change</text><path class="wire" marker-end="url(#arrow)" d="M1005 245 V285 H805 V450 H745"/><path class="wire" marker-end="url(#arrow)" d="M455 450 H195 V245"/><text x="320" y="350" font-size="24" text-anchor="middle">Feedback path</text><text x="980" y="340" font-size="24" text-anchor="middle">Physical action</text><text x="600" y="100" font-size="24" text-anchor="middle">Target / switching rule</text><path class="wire" d="M600 110 L600 140" marker-end="url(#arrow)"/><rect class="box" x="865" y="420" width="285" height="105" rx="9"/><text x="1007.5" y="456" font-size="24" text-anchor="middle">Disturbance</text><text x="1007.5" y="485" font-size="24" text-anchor="middle">e.g. an open door</text><path class="wire" d="M865 470 L765 470" marker-end="url(#arrow)"/><text x="600" y="575" font-size="24" text-anchor="middle">A returned command is not evidence that heating actually happened.</text></svg>