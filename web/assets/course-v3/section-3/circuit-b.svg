<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img"><title>Circuit B</title><style>text{font-family:Arial,sans-serif;fill:#142b45} .wire,.gate{stroke:#142b45;stroke-width:4;fill:none;stroke-linejoin:round;stroke-linecap:round}.gate{fill:#e8f5f5} .label{font-size:28px;font-weight:bold}.note{font-size:23px}</style><rect width="1100" height="560" fill="white"/><text x="45" y="55" class="label">Circuit B</text><g transform="translate(280 110)"><path class="gate" d="M0 0 Q95 0 160 60 Q95 120 0 120 Q45 60 0 0 Z"/><path class="wire" d="M-18 0 Q27 60 -18 120"/></g><g transform="translate(280 320)"><path class="gate" d="M0 0 L100 40 L0 80 Z"/><circle class="gate" cx="110" cy="40" r="10"/></g><g transform="translate(700 190)"><path class="gate" d="M0 0 H70 A60 60 0 0 1 70 120 H0 Z"/></g><path class="wire" d="M95 140 H297 M95 200 H297 M95 360 H280 M440 170 H575 V220 H700 M400 360 H610 V280 H700 M830 250 H995"/><text x="55" y="148" class="label">A</text><text x="55" y="208" class="label">B</text><text x="55" y="368" class="label">C</text><text x="485" y="153" class="label">X</text><text x="480" y="345" class="label">Y</text><text x="970" y="232" class="label">Q</text><text x="45" y="485" class="note">X is the output of XOR; Y is the output of NOT.</text><text x="45" y="519" class="note">Read X and Y before evaluating the final AND gate.</text></svg>
