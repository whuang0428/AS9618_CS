<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title description"><title id="title">A three-layer model: every slice contributes</title><desc id="description">Each illustrative layer is 1 mm thick. Bottom: 3 by 3 filled cells; middle: 2 by 2; top: 1 by 1. Stack them in that order.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#155e75"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#172f4e}.wire{stroke:#155e75;stroke-width:3;fill:none;stroke-linejoin:round}.box,.gate{fill:#eef7f7;stroke:#172f4e;stroke-width:2.5}.gate{stroke-width:3}.muted{fill:#f4f6f9;stroke:#7c8b9c;stroke-width:2}.accent{fill:#fff3d9;stroke:#9a5b0b;stroke-width:2}</style><rect width="100%" height="100%" fill="white"/><text x="600" y="47" font-size="30" text-anchor="middle">A three-layer model: every slice contributes</text><text x="180" y="105" font-size="24" text-anchor="middle">Layer 1 · 3 × 3</text><rect class="box" x="90" y="150" width="58" height="58"/><rect class="box" x="148" y="150" width="58" height="58"/><rect class="box" x="206" y="150" width="58" height="58"/><rect class="box" x="90" y="208" width="58" height="58"/><rect class="box" x="148" y="208" width="58" height="58"/><rect class="box" x="206" y="208" width="58" height="58"/><rect class="box" x="90" y="266" width="58" height="58"/><rect class="box" x="148" y="266" width="58" height="58"/><rect class="box" x="206" y="266" width="58" height="58"/><text x="180" y="390" font-size="24" text-anchor="middle">9 filled cells</text><text x="180" y="430" font-size="24" text-anchor="middle">Height: 0–1 mm</text><text x="580" y="105" font-size="24" text-anchor="middle">Layer 2 · 2 × 2</text><rect class="box" x="490" y="150" width="58" height="58"/><rect class="box" x="548" y="150" width="58" height="58"/><rect class="box" x="490" y="208" width="58" height="58"/><rect class="box" x="548" y="208" width="58" height="58"/><text x="580" y="390" font-size="24" text-anchor="middle">4 filled cells</text><text x="580" y="430" font-size="24" text-anchor="middle">Height: 1–2 mm</text><text x="980" y="105" font-size="24" text-anchor="middle">Layer 3 · 1 × 1</text><rect class="box" x="890" y="150" width="58" height="58"/><text x="980" y="390" font-size="24" text-anchor="middle">1 filled cell</text><text x="980" y="430" font-size="24" text-anchor="middle">Height: 2–3 mm</text><text x="600" y="525" font-size="24" text-anchor="middle">Deposit/solidify each cross-section; reposition by one layer height; continue to the final slice.</text><text x="600" y="570" font-size="24" text-anchor="middle">After layer 1: only the base exists. After layer 3: the complete stepped object exists.</text></svg>