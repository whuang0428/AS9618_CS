195 H795 V295 H861"/><path class="wire" d="M710 435 H780 V335 H861"/><g transform="translate(850 315)" data-gate="OR"><path class="gate" d="M0 -40 Q60 -40 100 0 Q60 40 0 40 Q30 0 0 -40 Z"/></g><path class="wire" d="M950 315 L1005 315"/><text x="1030" y="323" font-size="27" text-anchor="middle">Q</text><text x="550" y="590" font-size="23" text-anchor="middle">Independent inputs: A, B. Repeated labels carry the same input signal.</text><text x="550" y="622" font-size="23" text-anchor="middle">NOT has one input; every other gate shown has two inputs.</text></svg>