<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="635" viewBox="0 0 1200 635" role="img" aria-labelledby="title description"><title id="title">Reporting a measurement and regulating it are different tasks</title><desc id="description">The top lane records or displays temperature. The bottom lane compares temperature with a rule and drives refrigeration to change it, then measures again.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#155e75"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#172f4e}.wire{stroke:#155e75;stroke-width:3;fill:none;stroke-linejoin:round}.box,.gate{fill:#eef7f7;stroke:#172f4e;stroke-width:2.5}.gate{stroke-width:3}.muted{fill:#f4f6f9;stroke:#7c8b9c;stroke-width:2}.accent{fill:#fff3d9;stroke:#9a5b0b;stroke-width:2}</style><rect width="100%" height="100%" fill="white"/><text x="600" y="47" font-size="30" text-anchor="middle">Reporting a measurement and regulating it are different tasks</text><text x="600" y="105" font-size="27" text-anchor="middle">Monitoring: observe and report</text><rect class="box" x="40" y="145" width="300" height="105" rx="9"/><text x="190" y="181" font-size="24" text-anchor="middle">Temperature sensor</text><text x="190" y="210" font-size="24" text-anchor="middle">measures 25 °C</text><rect class="box" x="450" y="145" width="300" height="105" rx="9"/><text x="600" y="181" font-size="24" text-anchor="middle">Processor</text><text x="600" y="210" font-size="24" text-anchor="middle">records / checks limit</text><rect class="box" x="860" y="145" width="300" height="105" rx="9"/><text x="1010" y="181" font-size="24" text-anchor="middle">Display / alert</text><text x="1010" y="210" font-size="24" text-anchor="middle">reports the condition</text><path class="wire" d="M340 195 L450 195" marker-end="url(#arrow)"/><path class="wire" d="M750 195 L860 195" marker-end="url(#arrow)"/><text x="600" y="345" font-size="27" text-anchor="middle">Closed-loop control: act and measure again</text><rect class="box" x="40" y="385" width="250" height="105" rx="9"/><text x="165" y="421" font-size="24" text-anchor="middle">Temperature</text><text x="165" y="450" font-size="24" text-anchor="middle">sensor</text><rect class="box" x="350" y="385" width="250" height="105" rx="9"/><text x="475" y="421" font-size="24" text-anchor="middle">Controller</text><text x="475" y="450" font-size="24" text-anchor="middle">compares with rule</text><rect class="box" x="660" y="385" width="230" height="105" rx="9"/><text x="775" y="421" font-size="24" text-anchor="middle">Refrigeration</text><text x="775" y="450" font-size="24" text-anchor="middle">actuator</text><rect class="box" x="950" y="385" width="210" height="105" rx="9"/><text x="1055" y="421" font-size="24" text-anchor="middle">Physical</text><text x="1055" y="450" font-size="24" text-anchor="middle">temperature</text><path class="wire" d="M290 435 L350 435" marker-end="url(#arrow)"/><path class="wire" d="M600 435 L660 435" marker-end="url(#arrow)"/><path class="wire" d="M890 435 L950 435" marker-end="url(#arrow)"/><path class="wire" marker-end="url(#arrow)" d="M1055 490 V555 H165 V490"/><text x="600" y="593" font-size="24" text-anchor="middle">New measurements describe the actual result, including no change when the actuator fails.</text></svg>