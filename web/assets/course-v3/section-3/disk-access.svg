<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title description"><title id="title">HDD access: select the track, then wait for the sector</title><desc id="description">A head moves radially to a circular track. Rotation brings a selected sector under the head. Writing and reading use different magnetic actions.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#155e75"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#172f4e}.wire{stroke:#155e75;stroke-width:3;fill:none;stroke-linejoin:round}.box,.gate{fill:#eef7f7;stroke:#172f4e;stroke-width:2.5}.gate{stroke-width:3}.muted{fill:#f4f6f9;stroke:#7c8b9c;stroke-width:2}.accent{fill:#fff3d9;stroke:#9a5b0b;stroke-width:2}</style><rect width="100%" height="100%" fill="white"/><text x="600" y="47" font-size="30" text-anchor="middle">HDD access: select the track, then wait for the sector</text><circle cx="280" cy="305" r="80" fill="none" stroke="#7c8b9c" stroke-width="3"/><circle cx="280" cy="305" r="140" fill="none" stroke="#b66a06" stroke-width="6"/><circle cx="280" cy="305" r="200" fill="none" stroke="#7c8b9c" stroke-width="3"/><circle cx="280" cy="305" r="25" class="box"/><path d="M410 254 A140 140 0 0 1 420 305" stroke="#b66a06" stroke-width="16" fill="none"/><path class="wire" d="M545 305 L426 305" marker-end="url(#arrow)"/><text x="580" y="305" font-size="25" text-anchor="middle">Head</text><text x="520" y="410" font-size="22" text-anchor="middle">Seek across tracks</text><text x="280" y="560" font-size="24" text-anchor="middle">Highlighted ring: target track</text><rect class="box" x="700" y="115" width="440" height="105" rx="9"/><text x="920" y="151" font-size="24" text-anchor="middle">1 · Seek</text><text x="920" y="180" font-size="24" text-anchor="middle">Move head to required track</text><rect class="box" x="700" y="265" width="440" height="105" rx="9"/><text x="920" y="301" font-size="24" text-anchor="middle">2 · Rotational wait</text><text x="920" y="330" font-size="24" text-anchor="middle">Bring target sector beneath head</text><rect class="box" x="700" y="415" width="440" height="105" rx="9"/><text x="920" y="451" font-size="24" text-anchor="middle">3 · Transfer</text><text x="920" y="480" font-size="24" text-anchor="middle">Write pattern OR sense and decode</text><path class="wire" d="M920 220 L920 265" marker-end="url(#arrow)"/><path class="wire" d="M920 370 L920 415" marker-end="url(#arrow)"/><text x="920" y="580" font-size="22" text-anchor="middle">The head normally stays above the surface.</text></svg>