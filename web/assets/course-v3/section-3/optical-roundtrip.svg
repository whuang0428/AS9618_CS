<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title description"><title id="title">An optical recording must survive a later read</title><desc id="description">Higher writing power changes the recordable layer. After writing, lower reading power senses optical differences without rewriting the recording.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#155e75"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#172f4e}.wire{stroke:#155e75;stroke-width:3;fill:none;stroke-linejoin:round}.box,.gate{fill:#eef7f7;stroke:#172f4e;stroke-width:2.5}.gate{stroke-width:3}.muted{fill:#f4f6f9;stroke:#7c8b9c;stroke-width:2}.accent{fill:#fff3d9;stroke:#9a5b0b;stroke-width:2}</style><rect width="100%" height="100%" fill="white"/><text x="600" y="47" font-size="30" text-anchor="middle">An optical recording must survive a later read</text><text x="600" y="105" font-size="27" text-anchor="middle">Write to a recordable disc</text><rect class="box" x="40" y="140" width="310" height="105" rx="9"/><text x="195" y="176" font-size="24" text-anchor="middle">Data to record</text><text x="195" y="205" font-size="24" text-anchor="middle">controller selects positions</text><rect class="box" x="445" y="140" width="310" height="105" rx="9"/><text x="600" y="176" font-size="24" text-anchor="middle">Higher-power laser</text><text x="600" y="205" font-size="24" text-anchor="middle">changes recording layer</text><rect class="box" x="850" y="140" width="310" height="105" rx="9"/><text x="1005" y="176" font-size="24" text-anchor="middle">Recorded pattern</text><text x="1005" y="205" font-size="24" text-anchor="middle">persists without power</text><path class="wire" d="M350 190 L445 190" marker-end="url(#arrow)"/><path class="wire" d="M755 190 L850 190" marker-end="url(#arrow)"/><text x="600" y="350" font-size="27" text-anchor="middle">Read the same recorded track</text><rect class="box" x="40" y="385" width="310" height="105" rx="9"/><text x="195" y="421" font-size="24" text-anchor="middle">Low-power laser</text><text x="195" y="450" font-size="24" text-anchor="middle">illuminates the track</text><rect class="box" x="445" y="385" width="310" height="105" rx="9"/><text x="600" y="421" font-size="24" text-anchor="middle">Detector senses</text><text x="600" y="450" font-size="24" text-anchor="middle">reflected-light differences</text><rect class="box" x="850" y="385" width="310" height="105" rx="9"/><text x="1005" y="421" font-size="24" text-anchor="middle">Controller decodes</text><text x="1005" y="450" font-size="24" text-anchor="middle">recovered data</text><path class="wire" d="M350 435 L445 435" marker-end="url(#arrow)"/><path class="wire" d="M755 435 L850 435" marker-end="url(#arrow)"/><text x="600" y="570" font-size="24" text-anchor="middle">Pressed, recordable and rewritable discs have different recording layers and update possibilities.</text></svg>