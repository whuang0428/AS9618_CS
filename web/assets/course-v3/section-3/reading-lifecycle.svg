<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="615" viewBox="0 0 1200 615" role="img" aria-labelledby="title description"><title id="title">One reading: capture, save, switch off and reload</title><desc id="description">A recorder reads 23, saves it, changes only the RAM value to 24, switches off and reloads the saved 23.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#155e75"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#172f4e}.wire{stroke:#155e75;stroke-width:3;fill:none;stroke-linejoin:round}.box,.gate{fill:#eef7f7;stroke:#172f4e;stroke-width:2.5}.gate{stroke-width:3}.muted{fill:#f4f6f9;stroke:#7c8b9c;stroke-width:2}.accent{fill:#fff3d9;stroke:#9a5b0b;stroke-width:2}</style><rect width="100%" height="100%" fill="white"/><text x="600" y="47" font-size="30" text-anchor="middle">One reading: capture, save, switch off and reload</text><rect class="box" x="40" y="110" width="325" height="105" rx="9"/><text x="202.5" y="146" font-size="24" text-anchor="middle">1 · Sensor input</text><text x="202.5" y="175" font-size="24" text-anchor="middle">Reading: 23</text><rect class="box" x="435" y="110" width="325" height="105" rx="9"/><text x="597.5" y="146" font-size="24" text-anchor="middle">2 · RAM workspace</text><text x="597.5" y="175" font-size="24" text-anchor="middle">Process and display 23</text><rect class="box" x="830" y="110" width="325" height="105" rx="9"/><text x="992.5" y="146" font-size="24" text-anchor="middle">3 · Save completes</text><text x="992.5" y="175" font-size="24" text-anchor="middle">Flash file: 23</text><path class="wire" d="M365 160 L435 160" marker-end="url(#arrow)"/><path class="wire" d="M760 160 L830 160" marker-end="url(#arrow)"/><rect class="box" x="40" y="330" width="325" height="105" rx="9"/><text x="202.5" y="366" font-size="24" text-anchor="middle">4 · Unsaved edit</text><text x="202.5" y="395" font-size="24" text-anchor="middle">RAM: 24; file: 23</text><rect class="box" x="435" y="330" width="325" height="105" rx="9"/><text x="597.5" y="366" font-size="24" text-anchor="middle">5 · Power removed</text><text x="597.5" y="395" font-size="24" text-anchor="middle">RAM lost; file remains</text><rect class="box" x="830" y="330" width="325" height="105" rx="9"/><text x="992.5" y="366" font-size="24" text-anchor="middle">6 · Restart and read</text><text x="992.5" y="395" font-size="24" text-anchor="middle">Load 23 into RAM</text><path class="wire" marker-end="url(#arrow)" d="M990 215 V270 H200 V330"/><path class="wire" d="M365 380 L435 380" marker-end="url(#arrow)"/><path class="wire" d="M760 380 L830 380" marker-end="url(#arrow)"/><text x="600" y="520" font-size="24" text-anchor="middle">Persistent firmware provides start-up instructions; it is separate from the saved reading.</text><text x="600" y="565" font-size="24" text-anchor="middle">A completed copy to removable storage can be disconnected and kept separately.</text></svg>