<svg xmlns="http://www.w3.org/2000/svg" width="1330" height="885" viewBox="0 0 1330 885" role="img" aria-labelledby="title description"><title id="title">One valid circuit · Q</title><desc id="description">Circuit for acceptedRows. Repeated input names refer to the same independent input.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#155e75"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#172f4e}.wire{stroke:#155e75;stroke-width:3;fill:none;stroke-linejoin:round}.box,.gate{fill:#eef7f7;stroke:#172f4e;stroke-width:2.5}.gate{stroke-width:3}.muted{fill:#f4f6f9;stroke:#7c8b9c;stroke-width:2}.accent{fill:#fff3d9;stroke:#9a5b0b;stroke-width:2}</style><rect width="100%" height="100%" fill="white"/><text x="665" y="47" font-size="30" text-anchor="middle">One valid circuit · Q</text><text x="35" y="143" font-size="25" text-anchor="start">A</text><path class="wire" d="M115 135 H335 V135 H390"/><g transform="translate(390 135)" data-gate="NOT"><path class="gate" d="M0 -35 L85 0 L0 35 Z"/><circle class="gate" cx="95" cy="0" r="10"/></g><text x="35" y="263" font-size="25" text-anchor="start">B</text><path class="wire" d="M115 255 H335 V255 H390"/><g transform="translate(390 255)" data-gate="NOT"><path class="gate" d="M0 -35 L85 0 L0 35 Z"/><circle class="gate" cx="95" cy="0" r="10"/></g><path class="wire" d="M495 135 H565 V175 H620"/><path class="wire" d="M495 255 H550 V215 H620"/><g transform="translate(620 195)" data-gate="AND"><path class="gate" d="M0 -40 H50 A40 40 0 0 1 50 40 H0 Z"/></g><text x="35" y="383" font-size="25" text-anchor="start">C</text><path class="wire" d="M710 195 H795 V265 H850"/><path class="wire" d="M115 375 H780 V305 H850"/><g transform="translate(850 285)" data-gate="AND"><path class="gate" d="M0 -40 H50 A40 40 0 0 1 50 40 H0 Z"/></g><text x="35" y="503" font-size="25" text-anchor="start">A</text><text x="35" y="623" font-size="25" text-anchor="start">B</text><path class="wire" d="M115 615 H335 V615 H390"/><g transform="translate(390 615)" data-gate="NOT"><path class="gate" d="M0 -35 L85 0 L0 35 Z"/><circle class="gate" cx="95" cy="0" r="10"/></g><path class="wire" d="M115 495 H565 V535 H620"/><path class="wire" d="M495 615 H550 V575 H620"/><g transform="translate(620 555)" data-gate="AND"><path class="gate" d="M0 -40 H50 A40 40 0 0 1 50 40 H0 Z"/></g><text x="35" y="743" font-size="25" text-anchor="start">C</text><path class="wire" d="M710 555 H795 V625 H850"/><path class="wire" d="M115 735 H780 V665 H850"/><g transform="translate(850 645)" data-gate="AND"><path class="gate" d="M0 -40 H50 A40 40 0 0 1 50 40 H0 Z"/></g><path class="wire" d="M940 285 H1025 V445 H1091"/><path class="wire" d="M940 645 H1010 V485 H1091"/><g transform="translate(1080 465)" data-gate="OR"><path class="gate" d="M0 -40 Q60 -40 100 0 Q60 40 0 40 Q30 0 0 -40 Z"/></g><path class="wire" d="M1180 465 L1235 465"/><text x="1260" y="473" font-size="27" text-anchor="middle">Q</text><text x="665" y="830" font-size="23" text-anchor="middle">Independent inputs: A, B, C. Repeated labels carry the same input signal.</text><text x="665" y="862" font-size="23" text-anchor="middle">NOT has one input; every other gate shown has two inputs.</text></svg>