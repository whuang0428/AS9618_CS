<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img"><title>Circuit A</title><style>text{font-family:Arial,sans-serif;fill:#142b45} .wire,.gate{stroke:#142b45;stroke-width:4;fill:none;stroke-linejoin:round;stroke-linecap:round}.gate{fill:#e8f5f5} .label{font-size:28px;font-weight:bold}.note{font-size:23px}</style><rect width="1100" height="560" fill="white"/><text x="45" y="55" class="label">Circuit A</text><g transform="translate(290 300)"><path class="gate" d="M0 0 L100 40 L0 80 Z"/><circle class="gate" cx="110" cy="40" r="10"/></g><g transform="translate(700 180)"><path class="gate" d="M0 0 H70 A60 60 0 0 1 70 120 H0 Z"/></g><path class="wire" d="M95 180 H600 V210 H700 M95 340 H290 M410 340 H620 V270 H700 M830 240 H995"/><text x="55" y="188" class="label">D</text><text x="55" y="348" class="label">C</text><text x="975" y="222" class="label">P</text><text x="440" y="328" class="label">NOT C</text><text x="45" y="485" class="note">Follow each wire from its input to the next gate.</text><text x="45" y="519" class="note">Each gate has at most two inputs; the small output circle means NOT.</text></svg>
