<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc"><title id="title">Check that the original facts remain recoverable</title><desc id="desc">Reconstruct order 501, product P1, from the four related 3NF tables. All seven original values are present. A decomposition that loses a linking field can lose information.</desc><defs><marker id="teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#177f7b"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2369a0"/></marker><marker id="amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b66a22"/></marker></defs><rect width="1200" height="880" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="44" y="58" font-size="35" fill="#183448" text-anchor="start" font-weight="700">Check that the original facts remain recoverable</text><text x="44" y="103" font-size="24" fill="#637887" text-anchor="start" font-weight="400">Reconstruct order 501, product P1, from the four related 3NF tables.</text><rect x="70" y="170" width="420" height="194" rx="10" fill="#ffffff" stroke="#2369a0" stroke-width="2"/><rect x="70" y="170" width="420" height="54" rx="10" fill="#eaf5f4" stroke="#2369a0" stroke-width="2"/><text x="88" y="206" font-size="27" fill="#2369a0" text-anchor="start" font-weight="700">OrderLine</text><text x="88" y="261" font-size="24" fill="#183448" text-anchor="start" font-weight="400">OrderID 501</text><text x="88" y="297" font-size="24" fill="#183448" text-anchor="start" font-weight="400">ProductID P1</text><text x="88" y="333" font-size="24" fill="#183448" text-anchor="start" font-weight="400">Quantity 3</text><rect x="700" y="165" width="430" height="158" rx="10" fill="#ffffff" stroke="#2369a0" stroke-width="2"/><rect x="700" y="165" width="430" height="54" rx="10" fill="#eaf5f4" stroke="#2369a0" stroke-width="2"/><text x="718" y="201" font-size="27" fill="#2369a0" text-anchor="start" font-weight="700">SalesOrder</text><text x="718" y="256" font-size="24" fill="#183448" text-anchor="start" font-weight="400">OrderID 501</text><text x="718" y="292" font-size="24" fill="#183448" text-anchor="start" font-weight="400">CustomerID C7</text><rect x="700" y="420" width="430" height="158" rx="10" fill="#ffffff" stroke="#2369a0" stroke-width="2"/><rect x="700" y="420" width="430" height="54" rx="10" fill="#eaf5f4" stroke="#2369a0" stroke-width="2"/><text x="718" y="456" font-size="27" fill="#2369a0" text-anchor="start" font-weight="700">Customer</text><text x="718" y="511" font-size="24" fill="#183448" text-anchor="start" font-weight="400">CustomerID C7</text><text x="718" y="547" font-size="24" fill="#183448" text-anchor="start" font-weight="400">CustomerName Amina</text><rect x="70" y="420" width="420" height="194" rx="10" fill="#ffffff" stroke="#2369a0" stroke-width="2"/><rect x="70" y="420" width="420" height="54" rx="10" fill="#eaf5f4" stroke="#2369a0" stroke-width="2"/><text x="88" y="456" font-size="27" fill="#2369a0" text-anchor="start" font-weight="700">Product</text><text x="88" y="511" font-size="24" fill="#183448" text-anchor="start" font-weight="400">ProductID P1</text><text x="88" y="547" font-size="24" fill="#183448" text-anchor="start" font-weight="400">ProductName Pen</text><text x="88" y="583" font-size="24" fill="#183448" text-anchor="start" font-weight="400">UnitPrice 2</text><path d="M494 245L690 245" stroke="#2369a0" stroke-width="4" fill="none" marker-end="url(#blue)"/><path d="M910 330L910 408" stroke="#177f7b" stroke-width="4" fill="none" marker-end="url(#teal)"/><path d="M280 369L280 408" stroke="#177f7b" stroke-width="4" fill="none" marker-end="url(#teal)"/><rect x="70" y="666" width="1060" height="46" rx="23" fill="#eaf5f4" stroke="#177f7b" stroke-width="2"/><text x="600" y="697" font-size="23" fill="#177f7b" text-anchor="middle" font-weight="700">501  |  C7  |  Amina  |  P1  |  Pen  |  2  |  3</text><rect x="35" y="767" width="1130" height="87" rx="10" fill="#f3f7f9" stroke="#b7cbd5" stroke-width="2"/><text x="55" y="802" font-size="23" fill="#183448" text-anchor="start" font-weight="400">All seven original values are present. A decomposition that loses a linking field can</text><text x="55" y="833" font-size="23" fill="#183448" text-anchor="start" font-weight="400">lose information.</text></g></svg>