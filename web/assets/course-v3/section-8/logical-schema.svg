<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830" role="img" aria-labelledby="title desc"><title id="title">A logical schema describes organisation</title><desc id="desc">Programs name tables and fields; the DBMS handles their physical storage. The logical schema is the database's organised definition; the dictionary stores metadata about that definition.</desc><defs><marker id="teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#177f7b"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2369a0"/></marker><marker id="amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b66a22"/></marker></defs><rect width="1200" height="830" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="44" y="58" font-size="35" fill="#183448" text-anchor="start" font-weight="700">A logical schema describes organisation</text><text x="44" y="103" font-size="24" fill="#637887" text-anchor="start" font-weight="400">Programs name tables and fields; the DBMS handles their physical storage.</text><rect x="65" y="165" width="380" height="158" rx="10" fill="#ffffff" stroke="#2369a0" stroke-width="2"/><rect x="65" y="165" width="380" height="54" rx="10" fill="#eaf5f4" stroke="#2369a0" stroke-width="2"/><text x="83" y="201" font-size="27" fill="#2369a0" text-anchor="start" font-weight="700">Application</text><text x="83" y="256" font-size="24" fill="#183448" text-anchor="start" font-weight="400">Requests PupilName</text><text x="83" y="292" font-size="24" fill="#183448" text-anchor="start" font-weight="400">and GroupName</text><path d="M455 245L550 245" stroke="#2369a0" stroke-width="4" fill="none" marker-end="url(#blue)"/><rect x="580" y="163" width="535" height="194" rx="10" fill="#ffffff" stroke="#2369a0" stroke-width="2"/><rect x="580" y="163" width="535" height="54" rx="10" fill="#eaf5f4" stroke="#2369a0" stroke-width="2"/><text x="598" y="199" font-size="27" fill="#2369a0" text-anchor="start" font-weight="700">Logical schema</text><text x="598" y="254" font-size="24" fill="#183448" text-anchor="start" font-weight="400">TutorGroup(GroupID PK, GroupName)</text><text x="598" y="290" font-size="24" fill="#183448" text-anchor="start" font-weight="400">Pupil(PupilID PK, PupilName, GroupID FK)</text><text x="598" y="326" font-size="24" fill="#183448" text-anchor="start" font-weight="400">Pupil.GroupID → TutorGroup.GroupID</text><path d="M850 366L850 446" stroke="#177f7b" stroke-width="4" fill="none" marker-end="url(#teal)"/><rect x="605" y="470" width="470" height="158" rx="10" fill="#ffffff" stroke="#177f7b" stroke-width="2"/><rect x="605" y="470" width="470" height="54" rx="10" fill="#eaf5f4" stroke="#177f7b" stroke-width="2"/><text x="623" y="506" font-size="27" fill="#177f7b" text-anchor="start" font-weight="700">DBMS storage management</text><text x="623" y="561" font-size="24" fill="#183448" text-anchor="start" font-weight="400">Translate logical access</text><text x="623" y="597" font-size="24" fill="#183448" text-anchor="start" font-weight="400">into physical retrieval.</text><rect x="65" y="470" width="380" height="194" rx="10" fill="#ffffff" stroke="#b66a22" stroke-width="2"/><rect x="65" y="470" width="380" height="54" rx="10" fill="#eaf5f4" stroke="#b66a22" stroke-width="2"/><text x="83" y="506" font-size="27" fill="#b66a22" text-anchor="start" font-weight="700">Physical storage</text><text x="83" y="561" font-size="24" fill="#183448" text-anchor="start" font-weight="400">Pages, files and devices</text><text x="83" y="597" font-size="24" fill="#183448" text-anchor="start" font-weight="400">No disk-sector names</text><text x="83" y="633" font-size="24" fill="#183448" text-anchor="start" font-weight="400">in the pupil query.</text><path d="M595 552L455 552" stroke="#b66a22" stroke-width="4" fill="none" marker-end="url(#amber)"/><rect x="35" y="717" width="1130" height="87" rx="10" fill="#f3f7f9" stroke="#b7cbd5" stroke-width="2"/><text x="55" y="752" font-size="23" fill="#183448" text-anchor="start" font-weight="400">The logical schema is the database's organised definition; the dictionary stores</text><text x="55" y="783" font-size="23" fill="#183448" text-anchor="start" font-weight="400">metadata about that definition.</text></g></svg>