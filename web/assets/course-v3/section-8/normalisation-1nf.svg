<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><title id="title">1NF: expand a repeating group</title><desc id="desc">For this example, a product occurs at most once in each order. Atomic values remove the repeating group. Other duplicated facts can still require 2NF and 3NF work.</desc><defs><marker id="teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#177f7b"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2369a0"/></marker><marker id="amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b66a22"/></marker></defs><rect width="1200" height="780" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="44" y="58" font-size="35" fill="#183448" text-anchor="start" font-weight="700">1NF: expand a repeating group</text><text x="44" y="103" font-size="24" fill="#637887" text-anchor="start" font-weight="400">For this example, a product occurs at most once in each order.</text><rect x="55" y="190" width="405" height="194" rx="10" fill="#ffffff" stroke="#b66a22" stroke-width="2"/><rect x="55" y="190" width="405" height="54" rx="10" fill="#eaf5f4" stroke="#b66a22" stroke-width="2"/><text x="73" y="226" font-size="27" fill="#b66a22" text-anchor="start" font-weight="700">Order 501</text><text x="73" y="281" font-size="24" fill="#183448" text-anchor="start" font-weight="400">Items:</text><text x="73" y="317" font-size="24" fill="#183448" text-anchor="start" font-weight="400">P1 / quantity 3</text><text x="73" y="353" font-size="24" fill="#183448" text-anchor="start" font-weight="400">P2 / quantity 1</text><path d="M468 320L573 320" stroke="#177f7b" stroke-width="4" fill="none" marker-end="url(#teal)"/><text x="592" y="224" font-size="27" fill="#177f7b" text-anchor="start" font-weight="400">One product line per row</text><rect x="590" y="280" width="180" height="46" rx="0" fill="#183448" stroke="#b7cbd5" stroke-width="2"/><text x="603" y="310.36" font-size="23" fill="#ffffff" text-anchor="start" font-weight="700">OrderID</text><rect x="770" y="280" width="190" height="46" rx="0" fill="#183448" stroke="#b7cbd5" stroke-width="2"/><text x="783" y="310.36" font-size="23" fill="#ffffff" text-anchor="start" font-weight="700">ProductID</text><rect x="960" y="280" width="180" height="46" rx="0" fill="#183448" stroke="#b7cbd5" stroke-width="2"/><text x="973" y="310.36" font-size="23" fill="#ffffff" text-anchor="start" font-weight="700">Quantity</text><rect x="590" y="326" width="180" height="46" rx="0" fill="#d9efea" stroke="#b7cbd5" stroke-width="2"/><text x="603" y="356.36" font-size="23" fill="#183448" text-anchor="start" font-weight="400">501</text><rect x="770" y="326" width="190" height="46" rx="0" fill="#d9efea" stroke="#b7cbd5" stroke-width="2"/><text x="783" y="356.36" font-size="23" fill="#183448" text-anchor="start" font-weight="400">P1</text><rect x="960" y="326" width="180" height="46" rx="0" fill="#ffffff" stroke="#b7cbd5" stroke-width="2"/><text x="973" y="356.36" font-size="23" fill="#183448" text-anchor="start" font-weight="400">3</text><rect x="590" y="372" width="180" height="46" rx="0" fill="#d9efea" stroke="#b7cbd5" stroke-width="2"/><text x="603" y="402.36" font-size="23" fill="#183448" text-anchor="start" font-weight="400">501</text><rect x="770" y="372" width="190" height="46" rx="0" fill="#d9efea" stroke="#b7cbd5" stroke-width="2"/><text x="783" y="402.36" font-size="23" fill="#183448" text-anchor="start" font-weight="400">P2</text><rect x="960" y="372" width="180" height="46" rx="0" fill="#ffffff" stroke="#b7cbd5" stroke-width="2"/><text x="973" y="402.36" font-size="23" fill="#183448" text-anchor="start" font-weight="400">1</text><path d="M610 464H1115" stroke="#2369a0" stroke-width="3" fill="none"/><text x="608" y="513" font-size="25" fill="#2369a0" text-anchor="start" font-weight="400">Key: (OrderID, ProductID)</text><text x="85" y="576" font-size="27" fill="#183448" text-anchor="start" font-weight="400">Retain the order identifier in every product-line row.</text><rect x="35" y="667" width="1130" height="87" rx="10" fill="#f3f7f9" stroke="#b7cbd5" stroke-width="2"/><text x="55" y="702" font-size="23" fill="#183448" text-anchor="start" font-weight="400">Atomic values remove the repeating group. Other duplicated facts can still require 2NF</text><text x="55" y="733" font-size="23" fill="#183448" text-anchor="start" font-weight="400">and 3NF work.</text></g></svg>