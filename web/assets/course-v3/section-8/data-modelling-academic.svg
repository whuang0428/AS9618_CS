<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description"><title id="title">Data modelling: from a business rule to a relationship</title><desc id="description">The school rule states that each student has one tutor and one tutor may advise many students. Tutor has TutorID as its primary key and TutorName. Student has StudentID as its primary key, StudentName, TutorID as a required foreign key, and Mark. Student.TutorID references Tutor.TutorID. If a student may have several tutors, the model needs a StudentTutor association instead of one tutor reference.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1L9 5L0 9" fill="none" stroke="#294c66" stroke-width="1.5"/></marker></defs><rect width="1440" height="900" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="60" y="74" font-size="38" font-weight="600" fill="#20262c">Data modelling: from a business rule to a relationship</text><line x1="60" y1="107" x2="1380" y2="107" stroke="#bac2c8" stroke-width="1.5"/><text x="60" y="164" font-size="29" font-weight="600" fill="#294c66">Confirm the organisation’s rule</text><text x="60" y="212" font-size="28" font-weight="400" fill="#20262c">Each student has one tutor. One tutor may advise many students.</text><text x="60" y="260" font-size="28" font-weight="400" fill="#52606b">Identify the entities, assign their attributes, then represent the relationship.</text><text x="80" y="335" font-size="32" font-weight="600" fill="#20262c">Tutor</text><rect x="80" y="356" width="500" height="186" fill="white" stroke="#bac2c8" stroke-width="1.5"/><rect x="80" y="356" width="500" height="62" fill="#f4f6f7" stroke="#bac2c8" stroke-width="1.5"/><line x1="185" y1="356" x2="185" y2="542" stroke="#bac2c8" stroke-width="1.5"/><text x="98" y="397" font-size="28" font-weight="600" fill="#20262c">Key</text><text x="203" y="397" font-size="28" font-weight="600" fill="#20262c">Attribute</text><line x1="80" y1="418" x2="580" y2="418" stroke="#bac2c8" stroke-width="1.5"/><text x="98" y="459" font-size="28" font-weight="400" fill="#20262c">PK</text><text x="203" y="459" font-size="28" font-weight="400" fill="#20262c">TutorID</text><line x1="80" y1="480" x2="580" y2="480" stroke="#bac2c8" stroke-width="1.5"/><text x="98" y="521" font-size="28" font-weight="400" fill="#20262c"></text><text x="203" y="521" font-size="28" font-weight="400" fill="#20262c">TutorName</text><text x="860" y="335" font-size="32" font-weight="600" fill="#20262c">Student</text><rect x="860" y="356" width="500" height="310" fill="white" stroke="#bac2c8" stroke-width="1.5"/><rect x="860" y="356" width="500" height="62" fill="#f4f6f7" stroke="#bac2c8" stroke-width="1.5"/><line x1="965" y1="356" x2="965" y2="666" stroke="#bac2c8" stroke-width="1.5"/><text x="878" y="397" font-size="28" font-weight="600" fill="#20262c">Key</text><text x="983" y="397" font-size="28" font-weight="600" fill="#20262c">Attribute</text><line x1="860" y1="418" x2="1360" y2="418" stroke="#bac2c8" stroke-width="1.5"/><text x="878" y="459" font-size="28" font-weight="400" fill="#20262c">PK</text><text x="983" y="459" font-size="28" font-weight="400" fill="#20262c">StudentID</text><line x1="860" y1="480" x2="1360" y2="480" stroke="#bac2c8" stroke-width="1.5"/><text x="878" y="521" font-size="28" font-weight="400" fill="#20262c"></text><text x="983" y="521" font-size="28" font-weight="400" fill="#20262c">StudentName</text><line x1="860" y1="542" x2="1360" y2="542" stroke="#bac2c8" stroke-width="1.5"/><text x="878" y="583" font-size="28" font-weight="400" fill="#20262c">FK</text><text x="983" y="583" font-size="28" font-weight="400" fill="#20262c">TutorID (required)</text><line x1="860" y1="604" x2="1360" y2="604" stroke="#bac2c8" stroke-width="1.5"/><text x="878" y="645" font-size="28" font-weight="400" fill="#20262c"></text><text x="983" y="645" font-size="28" font-weight="400" fill="#20262c">Mark</text><path d="M580 449H710V573H860" fill="none" stroke="#294c66" stroke-width="2.5"/><text x="615" y="430" font-size="30" font-weight="600" fill="#294c66">1</text><text x="762" y="552" font-size="30" font-weight="600" fill="#294c66">many</text><text x="80" y="727" font-size="29" font-weight="600" fill="#366a69">Student.TutorID references Tutor.TutorID.</text><line x1="60" y1="762" x2="1380" y2="762" stroke="#bac2c8" stroke-width="1.5"/><text x="60" y="807" font-size="28" font-weight="400" fill="#20262c">Validate a changed rule: if a student may have several tutors,</text><text x="60" y="849" font-size="28" font-weight="400" fill="#20262c">one TutorID field is insufficient; model a StudentTutor association.</text></g></svg>