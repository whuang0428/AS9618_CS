<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="title desc"><title id="title">Clinic entity-relationship diagram</title><desc id="desc">One Patient can have many Appointments. One Doctor can have many Appointments. Each Appointment refers to exactly one Patient and one Doctor. PatientID and DoctorID are foreign keys in Appointment; AppointmentID is its primary key. Labels 1 and many show maximum cardinality.</desc><rect width="1200" height="730" fill="white"/><g fill="#183448" font-family="Arial, Helvetica, sans-serif"><text x="45" y="55" font-size="36" font-weight="700">Clinic appointments: two one-to-many relationships</text><text x="45" y="97" font-size="24">Each appointment records one patient, one doctor and a visit date.</text><g transform="translate(50 145)"><rect width="330" height="159" rx="12" fill="#f1f7f7" stroke="#507885" stroke-width="2"/><text x="22" y="43" font-size="30" font-weight="700">Patient</text><path d="M0 62H330" stroke="#507885"/><text x="22" y="96" font-size="25">PatientID  PK</text><text x="22" y="138" font-size="25">PatientName</text></g><g transform="translate(820 145)"><rect width="330" height="159" rx="12" fill="#f1f7f7" stroke="#507885" stroke-width="2"/><text x="22" y="43" font-size="30" font-weight="700">Doctor</text><path d="M0 62H330" stroke="#507885"/><text x="22" y="96" font-size="25">DoctorID  PK</text><text x="22" y="138" font-size="25">DoctorName</text></g><g transform="translate(435 370)"><rect width="330" height="243" rx="12" fill="#f1f7f7" stroke="#507885" stroke-width="2"/><text x="22" y="43" font-size="30" font-weight="700">Appointment</text><path d="M0 62H330" stroke="#507885"/><text x="22" y="96" font-size="25">AppointmentID  PK</text><text x="22" y="138" font-size="25">PatientID  FK</text><text x="22" y="180" font-size="25">DoctorID  FK</text><text x="22" y="222" font-size="25">VisitDate</text></g><g fill="none" stroke="#507885" stroke-width="4"><path d="M215 304V345H470V370"/><path d="M985 304V345H730V370"/></g><g font-size="24" font-weight="700"><text x="180" y="338">1</text><text x="477" y="365">many</text><text x="998" y="338">1</text><text x="656" y="365">many</text></g><text x="45" y="660" font-size="24">PK = primary key · FK = foreign key · 1 / many = maximum cardinality</text><text x="45" y="700" font-size="23">A patient's or doctor's identifier may occur in several Appointment records.</text></g></svg>