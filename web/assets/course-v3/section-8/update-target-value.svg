<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><title id="title">UPDATE changes a field in the selected record</title><desc id="desc">SET Returned = TRUE changes LoanID 203; other loans retain their values. Loan 203 remains, its fee is still 6, and loan 205 stays unreturned even though it belongs to the same member.</desc><defs><marker id="teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#177f7b"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2369a0"/></marker><marker id="amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b66a22"/></marker></defs><rect width="1200" height="780" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="44" y="58" font-size="35" fill="#183448" text-anchor="start" font-weight="700">UPDATE changes a field in the selected record</text><text x="44" y="103" font-size="24" fill="#637887" text-anchor="start" font-weight="400">SET Returned = TRUE changes LoanID 203; other loans retain their values.</text><rect x="60" y="238" width="150" height="46" rx="0" fill="#183448" stroke="#b7cbd5" stroke-width="2"/><text x="73" y="268.36" font-size="23" fill="#ffffff" text-anchor="start" font-weight="700">LoanID</text><rect x="210" y="238" width="120" height="46" rx="0" fill="#183448" stroke="#b7cbd5" stroke-width="2"/><text x="223" y="268.36" font-size="23" fill="#ffffff" text-anchor="start" font-weight="700">Fee</text><rect x="330" y="238" width="200" height="46" rx="0" fill="#183448" stroke="#b7cbd5" stroke-width="2"/><text x="343" y="268.36" font-size="23" fill="#ffffff" text-anchor="start" font-weight="700">Returned</text><rect x="60" y="284" width="150" height="46" rx="0" fill="#ffffff" stroke="#b7cbd5" stroke-width="2"/><text x="73" y="314.36" font-size="23" fill="#