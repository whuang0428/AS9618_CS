<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><title id="title">DML works with records</title><desc id="desc">The definition stays in place while data is retrieved or maintained. SELECT is DML retrieval. INSERT INTO, UPDATE and DELETE FROM are DML maintenance.</desc><defs><marker id="teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#177f7b"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2369a0"/></marker><marker id="amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b66a22"/></marker></defs><rect width="1200" height="780" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="44" y="58" font-size="35" fill="#183448" text-anchor="start" font-weight="700">DML works with records</text><text x="44" y="103" font-size="24" fill="#637887" text-anchor="start" font-weight="400">The definition stays in place while data is retrieved or maintained.</text><rect x="447" y="220" width="290" height="46" rx="0" fill="#183448" stroke="#b7cbd5" stroke-width="2"/><text x="460" y="250.36" font-size="25" fill="#ffffff" text-anchor="start" font-weight="700">MemberID</text><rect x="447" y="266" width="290" height="46" rx="0" fill="#ffffff" stroke="#b7cbd5" stroke-width="2"/><text x="460" y="296.36" font-size="25" fill="#183448" text-anchor="start" font-weight="400">1</text><rect x="447" y="312" width="290" height="46" rx="0" fill="#ffffff" stroke="#b7cbd5" stroke-width="2"/><text x="460" y="342.36" font-size="25" fill="#183448" text-anchor="start" font-weight="400">2</text><rect x="447" y="358" width="290" height="46" rx="0" fill="#ffffff" stroke="#b7cbd5" stroke-width="2"/><text x="460" y="388.36" font-size="25" fill="#183448" text-anchor="start" font-weight="400">3</text><rect x="437" y="160" width="310" height="46" rx="23" fill="#eaf5f4" stroke="#2369a0" stroke-width="2"/><text x="592" y="191" font-size="23" fill="#2369a0" text-anchor="middle" font-weight="700">Stored Member rows</text><rect x="55" y="205" width="275" height="158" rx="10" fill="#ffffff" stroke="#2369a0" stroke-width="2"/><rect x="55" y="205" width="275" height="54" rx="10" fill="#eaf5f4" stroke="#2369a0" stroke-width="2"/><text x="73" y="241" font-size="27" fill="#2369a0" text-anchor="start" font-weight="700">SELECT</text><text x="73" y="296" font-size="24" fill="#183448" text-anchor="start" font-weight="400">Read a result</text><text x="73" y="332" font-size="24" fill="#183448" text-anchor="start" font-weight="400">Stored rows remain.</text><path d="M438 305L337 305" stroke="#2369a0" stroke-width="4" fill="none" marker-end="url(#blue)"/><rect x="860" y="205" width="285" height="158" rx="10" fill="#ffffff" stroke="#177f7b" stroke-width="2"/><rect x="860" y="205" width="285" height="54" rx="10" fill="#eaf5f4" stroke="#177f7b" stroke-width="2"/><text x="878" y="241" font-size="27" fill="#177f7b" text-anchor="start" font-weight="700">INSERT INTO</text><text x="878" y="296" font-size="24" fill="#183448" text-anchor="start" font-weight="400">Add a new row</text><text x="878" y="332" font-size="24" fill="#183448" text-anchor="start" font-weight="400">for MemberID 4.</text><path d="M850 305L749 305" stroke="#177f7b" stroke-width="4" fill="none" marker-end="url(#teal)"/><rect x="55" y="478" width="425" height="158" rx="10" fill="#ffffff" stroke="#b66a22" stroke-width="2"/><rect x="55" y="478" width="425" height="54" rx="10" fill="#eaf5f4" stroke="#b66a22" stroke-width="2"/><text x="73" y="514" font-size="27" fill="#b66a22" text-anchor="start" font-weight="700">UPDATE</text><text x="73" y="569" font-size="24" fill="#183448" text-anchor="start" font-weight="400">Change a field value</text><text x="73" y="605" font-size="24" fill="#183448" text-anchor="start" font-weight="400">in an identified record.</text><path d="M500 412V438H333V466" stroke="#b66a22" stroke-width="3" fill="none" marker-end="url(#amber)"/><rect x="700" y="478" width="445" height="158" rx="10" fill="#ffffff" stroke="#b66a22" stroke-width="2"/><rect x="700" y="478" width="445" height="54" rx="10" fill="#eaf5f4" stroke="#b66a22" stroke-width="2"/><text x="718" y="514" font-size="27" fill="#b66a22" text-anchor="start" font-weight="700">DELETE FROM</text><text x="718" y="569" font-size="24" fill="#183448" text-anchor="start" font-weight="400">Remove an identified row</text><text x="718" y="605" font-size="24" fill="#183448" text-anchor="start" font-weight="400">from the stored table.</text><path d="M685 412V438H845V466" stroke="#b66a22" stroke-width="3" fill="none" marker-end="url(#amber)"/><rect x="35" y="667" width="1130" height="87" rx="10" fill="#f3f7f9" stroke="#b7cbd5" stroke-width="2"/><text x="55" y="702" font-size="23" fill="#183448" text-anchor="start" font-weight="400">SELECT is DML retrieval. INSERT INTO, UPDATE and DELETE FROM are DML maintenance.</text></g></svg>