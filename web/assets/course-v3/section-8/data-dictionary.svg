<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><title id="title">Metadata describes the data</title><desc id="desc">A data dictionary stores definitions, rather than one person's field value. The dictionary can support validation and query processing without being a second copy of pupil records.</desc><defs><marker id="teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#177f7b"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2369a0"/></marker><marker id="amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b66a22"/></marker></defs><rect width="1200" height="780" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="44" y="58" font-size="35" fill="#183448" text-anchor="start" font-weight="700">Metadata describes the data</text><text x="44" y="103" font-size="24" fill="#637887" text-anchor="start" font-weight="400">A data dictionary stores definitions, rather than one person's field value.</text><rect x="60" y="190" width="450" height="194" rx="10" fill="#ffffff" stroke="#2369a0" stroke-width="2"/><rect x="60" y="190" width="450" height="54" rx="10" fill="#eaf5f4" stroke="#2369a0" stroke-width="2"/><text x="78" y="226" font-size="27" fill="#2369a0" text-anchor="start" font-weight="700">Dictionary entry</text><text x="78" y="281" font-size="24" fill="#183448" text-anchor="start" font-weight="400">Field: BirthDate</text><text x="78" y="317" font-size="24" fill="#183448" text-anchor="start" font-weight="400">Data type: DATE</text><text x="78" y="353" font-size="24" fill="#183448" text-anchor="start" font-weight="400">Null allowed: no</text><rect x="720" y="190" width="415" height="158" rx="10" fill="#ffffff" stroke="#2369a0" stroke-width="2"/><rect x="720" y="190" width="415" height="54" rx="10" fill="#eaf5f4" stroke="#2369a0" stroke-width="2"/><text x="738" y="226" font-size="27" fill="#2369a0" text-anchor="start" font-weight="700">Pupil record</text><text x="738" y="281" font-size="24" fill="#183448" text-anchor="start" font-weight="400">PupilID: 41</text><text x="738" y="317" font-size="24" fill="#183448" text-anchor="start" font-weight="400">BirthDate: 2010-03-18</text><path d="M510 276H610V480H720" stroke="#2369a0" stroke-width="3" fill="none" marker-end="url(#blue)"/><rect x="740" y="422" width="390" height="158" rx="10" fill="#ffffff" stroke="#177f7b" stroke-width="2"/><rect x="740" y="422" width="390" height="54" rx="10" fill="#eaf5f4" stroke="#177f7b" stroke-width="2"/><text x="758" y="458" font-size="27" fill="#177f7b" text-anchor="start" font-weight="700">Definition check</text><text x="758" y="513" font-size="24" fill="#183448" text-anchor="start" font-weight="400">Use the declared type</text><text x="758" y="549" font-size="24" fill="#183448" text-anchor="start" font-weight="400">and null constraint.</text><text x="63" y="514" font-size="28" fill="#2369a0" text-anchor="start" font-weight="400">Definition / metadata</text><text x="725" y="387" font-size="26" fill="#177f7b" text-anchor="start" font-weight="400">Stored occurrence / data</text><rect x="35" y="667" width="1130" height="87" rx="10" fill="#f3f7f9" stroke="#b7cbd5" stroke-width="2"/><text x="55" y="702" font-size="23" fill="#183448" text-anchor="start" font-weight="400">The dictionary can support validation and query processing without being a second copy</text><text x="55" y="733" font-size="23" fill="#183448" text-anchor="start" font-weight="400">of pupil records.</text></g></svg>