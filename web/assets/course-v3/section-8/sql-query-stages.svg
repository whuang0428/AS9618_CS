<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="890" viewBox="0 0 1200 890" role="img" aria-labelledby="title desc"><title id="title">Follow a complete query through its results</title><desc id="desc">The join gives five matching pairs. Returned = FALSE retains loans 201, 203 and 205. Grouping gives Asha: count 1, sum 2, mean 2; Ben: count 2, sum 9, mean 4.5. Descending totals place Ben before Asha. These are logical reasoning stages, not a physical execution plan.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#177f7b"/></marker></defs><rect width="1200" height="890" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="45" y="57" font-size="34" fill="#183448">Follow a complete query through its results</text><text x="45" y="105" font-size="25" fill="#183448">Logical reasoning stages; stored Member and Loan rows are unchanged.</text><rect x="45" y="145" width="1100" height="106" rx="12" fill="#f1f7f7" stroke="#177f7b" stroke-width="2"/><text x="65" y="183" font-size="28" fill="#177f7b">FROM Member INNER JOIN Loan ON matching MemberID</text><text x="65" y="223" font-size="25" fill="#183448">5 pairs: Asha 201, Asha 202, Ben 203, Chen 204, Ben 205</text><path d="M590 255L590 295" fill="none" stroke="#177f7b" stroke-width="3" marker-end="url(#arrow)"/><rect x="45" y="310" width="1100" height="106" rx="12" fill="#f1f7f7" stroke="#177f7b" stroke-width="2"/><text x="65" y="348" font-size="28" fill="#177f7b">WHERE Loan.Returned = FALSE</text><text x="65" y="388" font-size="25" fill="#183448">3 rows: Asha / 201 / fee 2; Ben / 203 / fee 6; Ben / 205 / fee 3</text><path d="M590 420L590 460" fill="none" stroke="#177f7b" stroke-width="3" marker-end="url(#arrow)"/><rect x="45" y="475" width="1100" height="140" rx="12" fill="#f1f7f7" stroke="#177f7b" stroke-width="2"/><text x="65" y="513" font-size="28" fill="#177f7b">GROUP BY MemberID, MemberName; calculate aggregates</text><text x="65" y="553" font-size="25" fill="#183448">Asha: COUNT = 1, SUM = 2, AVG = 2</text><text x="65" y="587" font-size="25" fill="#183448">Ben: COUNT = 2, SUM = 9, AVG = 4.5</text><path d="M590 620L590 660" fill="none" stroke="#177f7b" stroke-width="3" marker-end="url(#arrow)"/><rect x="45" y="675" width="1100" height="106" rx="12" fill="#f1f7f7" stroke="#177f7b" stroke-width="2"/><text x="65" y="713" font-size="28" fill="#177f7b">ORDER BY SUM(Loan.Fee) DESC, MemberID ASC</text><text x="65" y="753" font-size="25" fill="#183448">Output: Ben / 2 / 9 / 4.5, then Asha / 1 / 2 / 2</text><text x="45" y="850" font-size="26" fill="#183448">Chen has no unreturned loan. Dara has no matching loan at all.</text></g></svg>