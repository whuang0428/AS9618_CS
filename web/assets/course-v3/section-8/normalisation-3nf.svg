<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><title id="title">3NF: remove the transitive dependency</title><desc id="desc">CustomerName describes the customer identified by CustomerID. Keep CustomerID in SalesOrder so each order can still retrieve its customer's name from Customer.</desc><defs><marker id="teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#177f7b"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2369a0"/></marker><marker id="amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b66a22"/></marker></defs><rect width="1200" height="780" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="44" y="58" font-size="35" fill="#183448" text-anchor="start" font-weight="700">3NF: remove the transitive dependency</text><text x="44" y="103" font-size="24" fill="#637887" text-anchor="start" font-weight="400">CustomerName describes the customer identified by CustomerID.</text><rect x="65" y="187" width="260" height="46" rx="23" fill="#eaf5f4" stroke="#2369a0" stroke-width="2"/><text x="195" y="218" font-size="23" fill="#2369a0" text-anchor="middle" font-weight="700">OrderID</text><rect x="468" y="187" width="265" height="46" rx="23" fill="#eaf5f4" stroke="#177f7b" stroke-width="2"/><text x="600.5" y="218" font-size="23" fill="#177f7b" text-anchor="middle" font-weight="700">CustomerID</text><rect x="865" y="187" width="280" height="46" rx="23" fill="#eaf5f4" stroke="#b66a22" stroke-width="2"/><text x="1005" y="218" font-size="23" fill="#b66a22" text-anchor="middle" font-weight="700">CustomerName</text><path d="M333 210L456 210" stroke="#2369a0" stroke-width="4" fill="none" marker-end="url(#blue)"/><path d="M741 210L852 210" stroke="#b66a22" stroke-width="4" fill="none" marker-end="url(#amber)"/><text x="410" y="286" font-size="25" fill="#b66a22" text-anchor="start" font-weight="400">The name depends on a non-key attribute.</text><path d="M600 316L600 389" stroke="#177f7b" stroke-width="4" fill="none" marker-end="url(#teal)"/><rect x="90" y="420" width="430" height="158" rx="10" fill="#ffffff" stroke="#2369a0" stroke-width="2"/><rect x="90" y="420" width="430" height="54" rx="10" fill="#eaf5f4" stroke="#2369a0" stroke-width="2"/><text x="108" y="456" font-size="27" fill="#2369a0" text-anchor="start" font-weight="700">SalesOrder</text><text x="108" y="511" font-size="24" fill="#183448" text-anchor="start" font-weight="400">OrderID  PK</text><text x="108" y="547" font-size="24" fill="#183448" text-anchor="start" font-weight="400">CustomerID  FK</text><rect x="700" y="420" width="410" height="158" rx="10" fill="#ffffff" stroke="#2369a0" stroke-width="2"/><rect x="700" y="420" width="410" height="54" rx="10" fill="#eaf5f4" stroke="#2369a0" stroke-width="2"/><text x="718" y="456" font-size="27" fill="#2369a0" text-anchor="start" font-weight="700">Customer</text><text x="718" y="511" font-size="24" fill="#183448" text-anchor="start" font-weight="400">CustomerID  PK</text><text x="718" y="547" font-size="24" fill="#183448" text-anchor="start" font-weight="400">CustomerName</text><path d="M528 541L690 505" stroke="#177f7b" stroke-width="4" fill="none" marker-end="url(#teal)"/><text x="530" y="575" font-size="23" fill="#177f7b" text-anchor="start" font-weight="400">references</text><rect x="35" y="667" width="1130" height="87" rx="10" fill="#f3f7f9" stroke="#b7cbd5" stroke-width="2"/><text x="55" y="702" font-size="23" fill="#183448" text-anchor="start" font-weight="400">Keep CustomerID in SalesOrder so each order can still retrieve its customer's name from</text><text x="55" y="733" font-size="23" fill="#183448" text-anchor="start" font-weight="400">Customer.</text></g></svg>