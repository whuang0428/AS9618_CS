<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc"><title id="title">Aggregates calculate over the selected records</title><desc id="desc">Count rows, add known numeric values, and calculate their mean. Zero is a known value and remains included. COUNT(Fee), SUM(Fee) and AVG(Fee) ignore null Fee values.</desc><defs><marker id="teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#177f7b"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2369a0"/></marker><marker id="amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b66a22"/></marker></defs><rect width="1200" height="850" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="44" y="58" font-size="35" fill="#183448" text-anchor="start" font-weight="700">Aggregates calculate over the selected records</text><text x="44" y="103" font-size="24" fill="#637887" text-anchor="start" font-weight="400">Count rows, add known numeric values, and calculate their mean.</text><text x="65" y="190" font-size="27" fill="#2369a0" text-anchor="start" font-weight="700">Loan fees</text><rect x="80" y="220" width="150" height="46" rx="23" fill="#eaf5f4" stroke="#177f7b" stroke-width="2"/><text x="155" y="251" font-size="23" fill="#177f7b" text-anchor="middle" font-weight="700">2</text><rect x="305" y="220" width="150" height="46" rx="23" fill="#eaf5f4" stroke="#177f7b" stroke-width="2"/><text x="380" y="251" font-size="23" fill="#177f7b" text-anchor="middle" font-weight="700">4</text><rect x="530" y="220" width="150" height="46" rx="23" fill="#eaf5f4" stroke="#177f7b" stroke-width="2"/><text x="605" y="251" font-size="23" fill="#177f7b" text-anchor="middle" font-weight="700">6</text><rect x="755" y="220" width="150" height="46" rx="23" fill="#eaf5f4" stroke="#2369a0" stroke-width="2"/><text x="830" y="251" font-size="23" fill="#2369a0" text-anchor="middle" font-weight="700">0</text><rect x="980" y="220" width="150" height="46" rx="23" fill="#eaf5f4" stroke="#177f7b" stroke-width="2"/><text x="1055" y="251" font-size="23" fill="#177f7b" text-anchor="middle" font-weight="700">3</text><rect x="55" y="335" width="340" height="158" rx="10" fill="#ffffff" stroke="#177f7b" stroke-width="2"/><rect x="55" y="335" width="340" height="54" rx="10" fill="#eaf5f4" stroke="#177f7b" stroke-width="2"/><text x="73" y="371" font-size="27" fill="#177f7b" text-anchor="start" font-weight="700">SUM(Fee)</text><text x="73" y="426" font-size="24" fill="#183448" text-anchor="start" font-weight="400">2 + 4 + 6 + 0 + 3</text><text x="73" y="462" font-size="24" fill="#183448" text-anchor="start" font-weight="400">= 15</text><rect x="430" y="335" width="340" height="158" rx="10" fill="#ffffff" stroke="#2369a0" stroke-width="2"/><rect x="430" y="335" width="340" height="54" rx="10" fill="#eaf5f4" stroke="#2369a0" stroke-width="2"/><text x="448" y="371" font-size="27" fill="#2369a0" text-anchor="start" font-weight="700">COUNT(*)</text><text x="448" y="426" font-size="24" fill="#183448" text-anchor="start" font-weight="400">Five Loan rows</text><text x="448" y="462" font-size="24" fill="#183448" text-anchor="start" font-weight="400">= 5</text><rect x="805" y="335" width="340" height="158" rx="10" fill="#ffffff" stroke="#177f7b" stroke-width="2"/><rect x="805" y="335" width="340" height="54" rx="10" fill="#eaf5f4" stroke="#177f7b" stroke-width="2"/><text x="823" y="371" font-size="27" fill="#177f7b" text-anchor="start" font-weight="700">AVG(Fee)</text><text x="823" y="426" font-size="24" fill="#183448" text-anchor="start" font-weight="400">15 / 5</text><text x="823" y="462" font-size="24" fill="#183448" text-anchor="start" font-weight="400">= 3</text><text x="60" y="592" font-size="25" fill="#b66a22" text-anchor="start" font-weight="400">Separate sample: 2, NULL, 4</text><text x="60" y="632" font-size="25" fill="#183448" text-anchor="start" font-weight="400">COUNT(*) = 3   COUNT(Fee) = 2   SUM = 6   AVG = 3</text><rect x="35" y="737" width="1130" height="87" rx="10" fill="#f3f7f9" stroke="#b7cbd5" stroke-width="2"/><text x="55" y="772" font-size="23" fill="#183448" text-anchor="start" font-weight="400">Zero is a known value and remains included. COUNT(Fee), SUM(Fee) and AVG(Fee) ignore</text><text x="55" y="803" font-size="23" fill="#183448" text-anchor="start" font-weight="400">null Fee values.</text></g></svg>