<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><title id="title">An index provides another access path</title><desc id="desc">An index on Town can locate several records with the same town value. The actual index stores record references or locations; the IDs here identify the illustrated target records.</desc><defs><marker id="teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#177f7b"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2369a0"/></marker><marker id="amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b66a22"/></marker></defs><rect width="1200" height="780" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="44" y="58" font-size="35" fill="#183448" text-anchor="start" font-weight="700">An index provides another access path</text><text x="44" y="103" font-size="24" fill="#637887" text-anchor="start" font-weight="400">An index on Town can locate several records with the same town value.</text><rect x="50" y="200" width="250" height="46" rx="23" fill="#eaf5f4" stroke="#2369a0" stroke-width="2"/><text x="175" y="231" font-size="23" fill="#2369a0" text-anchor="middle" font-weight="700">Find Town = York</text><path d="M300 225L395 225" stroke="#177f7b" stroke-width="4" fill="none" marker-end="url(#teal)"/><rect x="420" y="172" width="245" height="194" rx="10" fill="#ffffff" stroke="#177f7b" stroke-width="2"/><rect x="420" y="172" width="245" height="54" rx="10" fill="#eaf5f4" stroke="#177f7b" stroke-width="2"/><text x="438" y="208" font-size="27" fill="#177f7b" text-anchor="start" font-weight="700">Town index</text><text x="438" y="263" font-size="24" fill="#183448" text-anchor="start" font-weight="400">Bath → 31</text><text x="438" y="299" font-size="24" fill="#183448" text-anchor="start" font-weight="400">Leeds → 18</text><text x="438" y="335" font-size="24" fill="#183448" text-anchor="start" font-weight="400">York → 14, 22</text><rect x="735" y="209" width="205" height="46" rx="0" fill="#183448" stroke="#b7cbd5" stroke-width="2"/><text x="748" y="239.36" font-size="23" fill="#ffffff" text-anchor="start" font-weight="700">PatientID</text><rect x="940" y="209" width="200" height="46" rx="0" fill="#183448" stroke="#b7cbd5" stroke-width="2"/><text x="953" y="239.36" font-size="23" fill="#ffffff" text-anchor="start" font-weight="700">Town</text><rect x="735" y="255" width="205" height="46" rx="0" fill="#d9efea" stroke="#b7cbd5" stroke-width="2"/><text x="748" y="285.36" font-size="23" fill="#183448" text-anchor="start" font-weight="400">14</text><rect x="940" y="255" width="200" height="46" rx="0" fill="#d9efea" stroke="#b7cbd5" stroke-width="2"/><text x="953" y="285.36" font-size="23" fill="#183448" text-anchor="start" font-weight="400">York</text><rect x="735" y="301" width="205" height="46" rx="0" fill="#ffffff" stroke="#b7cbd5" stroke-width="2"/><text x="748" y="331.36" font-size="23" fill="#183448" text-anchor="start" font-weight="400">18</text><rect x="940" y="301" width="200" height="46" rx="0" fill="#ffffff" stroke="#b7cbd5" stroke-width="2"/><text x="953" y="331.36" font-size="23" fill="#183448" text-anchor="start" font-weight="400">Leeds</text><rect x="735" y="347" width="205" height="46" rx="0" fill="#d9efea" stroke="#b7cbd5" stroke-width="2"/><text x="748" y="377.36" font-size="23" fill="#183448" text-anchor="start" font-weight="400">22</text><rect x="940" y="347" width="200" height="46" rx="0" fill="#d9efea" stroke="#b7cbd5" stroke-width="2"/><text x="953" y="377.36" font-size="23" fill="#183448" text-anchor="start" font-weight="400">York</text><rect x="735" y="393" width="205" height="46" rx="0" fill="#ffffff" stroke="#b7cbd5" stroke-width="2"/><text x="748" y="423.36" font-size="23" fill="#183448" text-anchor="start" font-weight="400">31</text><rect x="940" y="393" width="200" height="46" rx="0" fill="#ffffff" stroke="#b7cbd5" stroke-width="2"/><text x="953" y="423.36" font-size="23" fill="#183448" text-anchor="start" font-weight="400">Bath</text><path d="M667 350H698V278H728" stroke="#177f7b" stroke-width="3" fill="none" marker-end="url(#teal)"/><path d="M698 350V369H728" stroke="#177f7b" stroke-width="3" fill="none" marker-end="url(#teal)"/><rect x="95" y="490" width="435" height="158" rx="10" fill="#ffffff" stroke="#177f7b" stroke-width="2"/><rect x="95" y="490" width="435" height="54" rx="10" fill="#eaf5f4" stroke="#177f7b" stroke-width="2"/><text x="113" y="526" font-size="27" fill="#177f7b" text-anchor="start" font-weight="700">Benefit</text><text x="113" y="581" font-size="24" fill="#183448" text-anchor="start" font-weight="400">Locate suitable matches</text><text x="113" y="617" font-size="24" fill="#183448" text-anchor="start" font-weight="400">without scanning every row.</text><rect x="625" y="490" width="470" height="158" rx="10" fill="#ffffff" stroke="#b66a22" stroke-width="2"/><rect x="625" y="490" width="470" height="54" rx="10" fill="#eaf5f4" stroke="#b66a22" stroke-width="2"/><text x="643" y="526" font-size="27" fill="#b66a22" text-anchor="start" font-weight="700">Cost</text><text x="643" y="581" font-size="24" fill="#183448" text-anchor="start" font-weight="400">Extra storage and maintenance</text><text x="643" y="617" font-size="24" fill="#183448" text-anchor="start" font-weight="400">when indexed values change.</text><rect x="35" y="667" width="1130" height="87" rx="10" fill="#f3f7f9" stroke="#b7cbd5" stroke-width="2"/><text x="55" y="702" font-size="23" fill="#183448" text-anchor="start" font-weight="400">The actual index stores record references or locations; the IDs here identify the</text><text x="55" y="733" font-size="23" fill="#183448" text-anchor="start" font-weight="400">illustrated target records.</text></g></svg>