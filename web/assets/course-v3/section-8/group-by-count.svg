<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><title id="title">GROUP BY forms one group per key value</title><desc id="desc">Count Loan rows separately within each represented MemberID group. The groups are (1, 2), (2, 2) and (3, 1). Member 4 has no Loan record, so Loan alone supplies no group for 4.</desc><defs><marker id="teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#177f7b"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2369a0"/></marker><marker id="amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b66a22"/></marker></defs><rect width="1200" height="780" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="44" y="58" font-size="35" fill="#183448" text-anchor="start" font-weight="700">GROUP BY forms one group per key value</text><text x="44" y="103" font-size="24" fill="#637887" text-anchor="start" font-weight="400">Count Loan rows separately within each represented MemberID group.</text><rect x="60" y="195" width="325" height="158" rx="10" fill="#ffffff" stroke="#177f7b" stroke-width="2"/><rect x="60" y="195" width="325" height="54" rx="10" fill="#eaf5f4" stroke="#177f7b" stroke-width="2"/><text x="78" y="231" font-size="27" fill="#177f7b" text-anchor="start" font-weight="700">MemberID 1</text><text x="78" y="286" font-size="24" fill="#183448" text-anchor="start" font-weight="400">Loan 201</text><text x="78" y="322" font-size="24" fill="#183448" text-anchor="start" font-weight="400">Loan 202</text><path d="M220 363L220 465" stroke="#177f7b" stroke-width="4" fill="none" marker-end="url(#teal)"/><rect x="85" y="490" width="275" height="46" rx="23" fill="#eaf5f4" stroke="#177f7b" stroke-width="2"/><text x="222.5" y="521" font-size="23" fill="#177f7b" text-anchor="middle" font-weight="700">COUNT(*) = 2</text><rect x="445" y="195" width="325" height="158" rx="10" fill="#ffffff" stroke="#2369a0" stroke-width="2"/><rect x="445" y="195" width="325" height="54" rx="10" fill="#eaf5f4" stroke="#2369a0" stroke-width="2"/><text x="463" y="231" font-size="27" fill="#2369a0" text-anchor="start" font-weight="700">MemberID 2</text><text x="463" y="286" font-size="24" fill="#183448" text-anchor="start" font-weight="400">Loan 203</text><text x="463" y="322" font-size="24" fill="#183448" text-anchor="start" font-weight="400">Loan 205</text><path d="M605 363L605 465" stroke="#177f7b" stroke-width="4" fill="none" marker-end="url(#teal)"/><rect x="470" y="490" width="275" height="46" rx="23" fill="#eaf5f4" stroke="#2369a0" stroke-width="2"/><text x="607.5" y="521" font-size="23" fill="#2369a0" text-anchor="middle" font-weight="700">COUNT(*) = 2</text><rect x="830" y="195" width="325" height="122" rx="10" fill="#ffffff" stroke="#177f7b" stroke-width="2"/><rect x="830" y="195" width="325" height="54" rx="10" fill="#eaf5f4" stroke="#177f7b" stroke-width="2"/><text x="848" y="231" font-size="27" fill="#177f7b" text-anchor="start" font-weight="700">MemberID 3</text><text x="848" y="286" font-size="24" fill="#183448" text-anchor="start" font-weight="400">Loan 204</text><path d="M990 327L990 465" stroke="#177f7b" stroke-width="4" fill="none" marker-end="url(#teal)"/><rect x="855" y="490" width="275" height="46" rx="23" fill="#eaf5f4" stroke="#177f7b" stroke-width="2"/><text x="992.5" y="521" font-size="23" fill="#177f7b" text-anchor="middle" font-weight="700">COUNT(*) = 1</text><rect x="35" y="667" width="1130" height="87" rx="10" fill="#f3f7f9" stroke="#b7cbd5" stroke-width="2"/><text x="55" y="702" font-size="23" fill="#183448" text-anchor="start" font-weight="400">The groups are (1, 2), (2, 2) and (3, 1). Member 4 has no Loan record, so Loan alone</text><text x="55" y="733" font-size="23" fill="#183448" text-anchor="start" font-weight="400">supplies no group for 4.</text></g></svg>