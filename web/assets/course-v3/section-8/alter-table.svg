<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><title id="title">ALTER TABLE adds a field to the definition</title><desc id="desc">Existing records remain; this added Email field has no default value. A later UPDATE supplies a value for a selected student. The other existing Student fields are omitted here.</desc><defs><marker id="teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#177f7b"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2369a0"/></marker><marker id="amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b66a22"/></marker></defs><rect width="1200" height="780" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="44" y="58" font-size="35" fill="#183448" text-anchor="start" font-weight="700">ALTER TABLE adds a field to the definition</text><text x="44" y="103" font-size="24" fill="#637887" text-anchor="start" font-weight="400">Existing records remain; this added Email field has no default value.</text><rect x="85" y="167" width="1030" height="86" rx="10" fill="#ffffff" stroke="#2369a0" stroke-width="2"/><rect x="85" y="167" width="1030" height="54" rx="10" fill="#eaf5f4" stroke="#2369a0" stroke-width="2"/><text x="103" y="203" font-size="27" fill="#2369a0" text-anchor="start" font-weight="700">ALTER TABLE Student ADD Email VARCHAR(80);</text><rect x="60" y="340" width="240" height="46" rx="0" fill="#183448" stroke="#b7cbd5" stroke-width="2"/><text x="73" y="370.36" font-size="23" fill="#ffffff" text-anchor="start" font-weight="700">StudentID</text><rect x="300" y="340" width="200" height="46" rx="0" fill="#183448" stroke="#b7cbd5" stroke-width="2"/><text x="313" y="370.36" font-size="23" fill="#ffffff" text-anchor="start" font-weight="700">TutorID</text><rect x="60" y="386" width="240" height="46" rx="0" fill="#ffffff" stroke="#b7cbd5" stroke-width="2"/><text x="73" y="416.36" font-size="23" fill="#183448" text-anchor="start" font-weight="400">21</text><rect x="300" y="386" width="200" height="46" rx="0" fill="#ffffff" stroke="#b7cbd5" stroke-width="2"/><text x="313" y="416.36" font-size="23" fill="#183448" text-anchor="start" font-weight="400">7</text><path d="M514 386L636 386" stroke="#177f7b" stroke-width="4" fill="none" marker-end="url(#teal)"/><rect x="650" y="340" width="175" height="46" rx="0" fill="#183448" stroke="#b7cbd5" stroke-width="2"/><text x="663" y="370.36" font-size="23" fill="#ffffff" text-anchor="start" font-weight="700">StudentID</text><rect x="825" y="340" width="160" height="46" rx="0" fill="#183448" stroke="#b7cbd5" stroke-width="2"/><text x="838" y="370.36" font-size="23" fill="#ffffff" text-anchor="start" font-weight="700">TutorID</text><rect x="985" y="340" width="155" height="46" rx="0" fill="#183448" stroke="#b7cbd5" stroke-width="2"/><text x="998" y="370.36" font-size="23" fill="#ffffff" text-anchor="start" font-weight="700">Email</text><rect x="650" y="386" width="175" height="46" rx="0" fill="#ffffff" stroke="#b7cbd5" stroke-width="2"/><text x="663" y="416.36" font-size="23" fill="#183448" text-anchor="start" font-weight="400">21</text><rect x="825" y="386" width="160" height="46" rx="0" fill="#ffffff" stroke="#b7cbd5" stroke-width="2"/><text x="838" y="416.36" font-size="23" fill="#183448" text-anchor="start" font-weight="400">7</text><rect x="985" y="386" width="155" height="46" rx="0" fill="#d9efea" stroke="#b7cbd5" stroke-width="2"/><text x="998" y="416.36" font-size="23" fill="#183448" text-anchor="start" font-weight="400">NULL</text><text x="68" y="306" font-size="25" fill="#183448" text-anchor="start" font-weight="400">Before: selected fields</text><text x="655" y="306" font-size="25" fill="#183448" text-anchor="start" font-weight="400">After: same record, new field</text><text x="112" y="517" font-size="28" fill="#2369a0" text-anchor="start" font-weight="400">The table definition gains Email.</text><text x="112" y="563" font-size="27" fill="#183448" text-anchor="start" font-weight="400">No particular email address is assigned by this statement.</text><rect x="35" y="667" width="1130" height="87" rx="10" fill="#f3f7f9" stroke="#b7cbd5" stroke-width="2"/><text x="55" y="702" font-size="23" fill="#183448" text-anchor="start" font-weight="400">A later UPDATE supplies a value for a selected student. The other existing Student</text><text x="55" y="733" font-size="23" fill="#183448" text-anchor="start" font-weight="400">fields are omitted here.</text></g></svg>