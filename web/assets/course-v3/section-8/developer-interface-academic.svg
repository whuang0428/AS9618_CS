<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description"><title id="title">Developer interface: configure objects before use</title><desc id="description">A developer configures three DBMS objects. The Student table defines StudentID as the primary key, StudentName, TutorID as a foreign key and a Mark range of zero to one hundred. The entry form binds four controls to those fields. The report formats StudentName and Mark; the illustrated preview shows Amina 73 and Ben 80 after a successful insertion. When an Editor submits the form for student 22, Ben, tutor 7, mark 80, the DBMS checks permission and constraints before storing the new row. Form checks assist input; database rules also apply to requests made through other tools.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1L9 5L0 9" fill="none" stroke="#294c66" stroke-width="1.5"/></marker></defs><rect width="1440" height="900" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="60" y="74" font-size="38" font-weight="600" fill="#20262c">Developer interface: configure objects before use</text><line x1="60" y1="107" x2="1380" y2="107" stroke="#bac2c8" stroke-width="1.5"/><text x="60" y="159" font-size="28" font-weight="400" fill="#52606b">Define the structure, arrange input controls and format retrieved information.</text><text x="60" y="220" font-size="30" font-weight="600" fill="#294c66">Table definition</text><text x="520" y="220" font-size="30" font-weight="600" fill="#294c66">Student-entry form</text><text x="980" y="220" font-size="30" font-weight="600" fill="#294c66">Class-list report</text><line x1="480" y1="200" x2="480" y2="550" stroke="#bac2c8" stroke-width="1.5"/><line x1="960" y1="200" x2="960" y2="550" stroke="#bac2c8" stroke-width="1.5"/><rect x="60" y="247" width="400" height="290" fill="white" stroke="#bac2c8" stroke-width="1.5"/><rect x="60" y="247" width="400" height="58" fill="#f4f6f7" stroke="#bac2c8" stroke-width="1.5"/><line x1="340" y1="247" x2="340" y2="537" stroke="#bac2c8" stroke-width="1.5"/><text x="78" y="286" font-size="28" font-weight="600" fill="#20262c">Student field</text><text x="358" y="286" font-size="28" font-weight="600" fill="#20262c">Rule</text><line x1="60" y1="305" x2="460" y2="305" stroke="#bac2c8" stroke-width="1.5"/><text x="78" y="344" font-size="28" font-weight="400" fill="#20262c">StudentID</text><text x="358" y="344" font-size="28" font-weight="400" fill="#20262c">PK</text><line x1="60" y1="363" x2="460" y2="363" stroke="#bac2c8" stroke-width="1.5"/><text x="78" y="402" font-size="28" font-weight="400" fill="#20262c">StudentName</text><text x="358" y="402" font-size="28" font-weight="400" fill="#20262c"></text><line x1="60" y1="421" x2="460" y2="421" stroke="#bac2c8" stroke-width="1.5"/><text x="78" y="460" font-size="28" font-weight="400" fill="#20262c">TutorID</text><text x="358" y="460" font-size="28" font-weight="400" fill="#20262c">FK</text><line x1="60" y1="479" x2="460" y2="479" stroke="#bac2c8" stroke-width="1.5"/><text x="78" y="518" font-size="28" font-weight="400" fill="#20262c">Mark</text><text x="358" y="518" font-size="28" font-weight="400" fill="#20262c">0–100</text><text x="520" y="282" font-size="28" font-weight="400" fill="#20262c">StudentID</text><rect x="728" y="247" width="192" height="48" fill="white" stroke="#bac2c8" stroke-width="1.5"/><text x="746" y="281" font-size="28" font-weight="400" fill="#20262c">22</text><text x="520" y="341" font-size="28" font-weight="400" fill="#20262c">StudentName</text><rect x="728" y="306" width="192" height="48" fill="white" stroke="#bac2c8" stroke-width="1.5"/><text x="746" y="340" font-size="28" font-weight="400" fill="#20262c">Ben</text><text x="520" y="400" font-size="28" font-weight="400" fill="#20262c">TutorID</text><rect x="728" y="365" width="192" height="48" fill="white" stroke="#bac2c8" stroke-width="1.5"/><text x="746" y="399" font-size="28" font-weight="400" fill="#20262c">7</text><text x="520" y="459" font-size="28" font-weight="400" fill="#20262c">Mark</text><rect x="728" y="424" width="192" height="48" fill="white" stroke="#bac2c8" stroke-width="1.5"/><text x="746" y="458" font-size="28" font-weight="400" fill="#20262c">80</text><rect x="728" y="492" width="192" height="48" fill="#f4f6f7" stroke="#bac2c8" stroke-width="1.5"/><text x="778" y="526" font-size="28" font-weight="400" fill="#20262c">Submit</text><text x="980" y="277" font-size="28" font-weight="400" fill="#52606b">Preview after insertion</text><rect x="980" y="305" width="400" height="195" fill="white" stroke="#bac2c8" stroke-width="1.5"/><rect x="980" y="305" width="400" height="65" fill="#f4f6f7" stroke="#bac2c8" stroke-width="1.5"/><line x1="1260" y1="305" x2="1260" y2="500" stroke="#bac2c8" stroke-width="1.5"/><text x="998" y="347.5" font-size="28" font-weight="600" fill="#20262c">StudentName</text><text x="1278" y="347.5" font-size="28" font-weight="600" fill="#20262c">Mark</text><line x1="980" y1="370" x2="1380" y2="370" stroke="#bac2c8" stroke-width="1.5"/><text x="998" y="412.5" font-size="28" font-weight="400" fill="#20262c">Amina</text><text x="1278" y="412.5" font-size="28" font-weight="400" fill="#20262c">73</text><line x1="980" y1="435" x2="1380" y2="435" stroke="#bac2c8" stroke-width="1.5"/><text x="998" y="477.5" font-size="28" font-weight="400" fill="#20262c">Ben</text><text x="1278" y="477.5" font-size="28" font-weight="400" fill="#20262c">80</text><line x1="60" y1="586" x2="1380" y2="586" stroke="#bac2c8" stroke-width="1.5"/><text x="60" y="633" font-size="29" font-weight="600" fill="#294c66">When an Editor submits the form</text><rect x="60" y="663" width="365" height="106" fill="white" stroke="#bac2c8" stroke-width="1.5"/><text x="78" y="704" font-size="28" font-weight="600" fill="#20262c">Form sends a request</text><text x="78" y="746" font-size="28" font-weight="400" fill="#20262c">(22, Ben, 7, 80)</text><path d="M425 716H505" fill="none" stroke="#294c66" stroke-width="2" marker-end="url(#arrow)"/><rect x="515" y="663" width="405" height="106" fill="white" stroke="#bac2c8" stroke-width="1.5"/><text x="533" y="704" font-size="28" font-weight="600" fill="#20262c">DBMS checks</text><text x="533" y="746" font-size="28" font-weight="400" fill="#20262c">Permission + constraints</text><path d="M920 716H1000" fill="none" stroke="#294c66" stroke-width="2" marker-end="url(#arrow)"/><rect x="1010" y="663" width="370" height="106" fill="white" stroke="#bac2c8" stroke-width="1.5"/><text x="1028" y="704" font-size="28" font-weight="600" fill="#20262c">Student record stored</text><text x="1028" y="746" font-size="28" font-weight="400" fill="#20262c">Form confirms success</text><text x="60" y="815" font-size="28" font-weight="400" fill="#20262c">Form checks assist input. Database rules must also apply to requests</text><text x="60" y="857" font-size="28" font-weight="400" fill="#20262c">from another form or query tool.</text></g></svg>