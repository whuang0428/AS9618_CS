"585" y="436" font-size="23" fill="#2369a0" text-anchor="middle" font-weight="700">ExamNumber: candidate</text><rect x="825" y="175" width="315" height="158" rx="10" fill="#ffffff" stroke="#177f7b" stroke-width="2"/><rect x="825" y="175" width="315" height="54" rx="10" fill="#eaf5f4" stroke="#177f7b" stroke-width="2"/><text x="843" y="211" font-size="27" fill="#177f7b" text-anchor="start" font-weight="700">Secondary key</text><text x="843" y="266" font-size="24" fill="#183448" text-anchor="start" font-weight="400">TutorGroup = 12A</text><text x="843" y="302" font-size="24" fill="#183448" text-anchor="start" font-weight="400">finds pupils 41, 42</text><rect x="690" y="470" width="250" height="46" rx="0" fill="#183448" stroke="#b7cbd5" stroke-width="2"/><text x="703" y="500.36" font-size="23" fill="#ffffff" text-anchor="start" font-weight="700">AttendanceID</text><rect x="940" y="470" width="200" height="46" rx="0" fill="#183448" stroke="#b7cbd5" stroke-width="2"/><text x="953" y="500.36" font-size="23" fill="#ffffff" text-anchor="start" font-weight="700">PupilID</text><rect x="690" y="516" width="250" height="46" rx="0" fill="#ffffff" stroke="#b7cbd5" stroke-width="2"/><text x="703" y="546.36" font-size="23" fill="#183448" text-anchor="start" font-weight="400">901</text><rect x="940" y="516" width="200" height="46" rx="0" fill="#d9efea" stroke="#b7cbd5" stroke-width="2"/><text x="953" y="546.36" font-size="23" fill="#183448" text-anchor="start" font-weight="400">41</text><rect x="690" y="562" width="250" height="46" rx="0" fill="#ffffff" stroke="#b7cbd5" stroke-width="2"/><text x="703" y="592.36" font-size="23" fill="#183448" text-anchor="start" font-weight="400">902</text><rect x="940" y="562" width="200" height="46" rx="0" fill="#d9efea" stroke="#b7cbd5" stroke-width="2"/><text x="953" y="592.36" font-size="23" fill="#183448" text-anchor="start" font-weight="400">41</text><path d="M1146 539H1175V130H30V254H43" stroke="#177f7b" stroke-width="3" fill="none" marker-end="url(#teal)"/><path d="M1146 585H1175V539" stroke="#177f7b" stroke-width="3" fill="none"/><text x="60" y="535" font-size="25" fill="#183448" text-anchor="start" font-weight="400">Attendance.PupilID is a foreign key.</text><text x="60" y="578" font-size="25" fill="#183448" text-anchor="start" font-weight="400">Repeated references to pupil 41 are valid.</text><rect x="35" y="667" width="1130" height="87" rx="10" fill="#f3f7f9" stroke="#b7cbd5" stroke-width="2"/><text x="55" y="702" font-size="23" fill="#183448" text-anchor="start" font-weight="400">A secondary key supports retrieval. A foreign key refers to a related key; it need not</text><text x="55" y="733" font-size="23" fill="#183448" text-anchor="start" font-weight="400">be unique.</text></g></svg>