<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><title id="title">Keys answer different questions</title><desc id="desc">PupilID and ExamNumber are independently unique; TutorGroup may repeat. A secondary key supports retrieval. A foreign key refers to a related key; it need not be unique.</desc><defs><marker id="teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#177f7b"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2369a0"/></marker><marker id="amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b66a22"/></marker></defs><rect width="1200" height="780" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="44" y="58" font-size="35" fill="#183448" text-anchor="start" font-weight="700">Keys answer different questions</text><text x="44" y="103" font-size="24" fill="#637887" text-anchor="start" font-weight="400">PupilID and ExamNumber are independently unique; TutorGroup may repeat.</text><rect x="50" y="185" width="200" height="46" rx="0" fill="#183448" stroke="#b7cbd5" stroke-width="2"/><text x="63" y="215.36" font-size="23" fill="#ffffff" text-anchor="start" font-weight="700">PupilID</text><rect x="250" y="185" width="270" height="46" rx="0" fill="#183448" stroke="#b7cbd5" stroke-width="2"/><text x="263" y="215.36" font-size="23" fill="#ffffff" text-anchor="start" font-weight="700">ExamNumber</text><rect x="520" y="185" width="260" height="46" rx="0" fill="#183448" stroke="#b7cbd5" stroke-width="2"/><text x="533" y="215.36" font-size="23" fill="#ffffff" text-anchor="start" font-weight="700">TutorGroup</text><rect x="50" y="231" width="200" height="46" rx="0" fill="#d9efea" stroke="#b7cbd5" stroke-width="2"/><text x="63" y="261.36" font-size="23" fill="#183448" text-anchor="start" font-