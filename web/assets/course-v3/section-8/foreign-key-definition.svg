<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><title id="title">Declare which field references which key</title><desc id="desc">Allocation is the child table; Locker supplies the referenced primary key. Both allocations can reference locker 3. This foreign-key declaration alone does not make the child field unique.</desc><defs><marker id="teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#177f7b"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2369a0"/></marker><marker id="amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b66a22"/></marker></defs><rect width="1200" height="780" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="44" y="58" font-size="35" fill="#183448" text-anchor="start" font-weight="700">Declare which field references which key</text><text x="44" y="103" font-size="24" fill="#637887" text-anchor="start" font-weight="400">Allocation is the child table; Locker supplies the referenced primary key.</text><text x="70" y="190" font-size="27" fill="#2369a0" text-anchor="start" font-weight="700">Locker</text><rect x="70" y="225" width="350" height="46" rx="0" fill="#183448" stroke="#b7cbd5" stroke-width="2"/><text x="83" y="255.36" font-size="23" fill="#ffffff" text-anchor="start" font-weight="700">LockerID (PK)</text><rect x="70" y="271" width="350" height="46" rx="0" fill="#ffffff" stroke="#b7cbd5" stroke-width="2"/><text x="83" y="301.36" font-size="23" fill="#183448" text-anchor="start" font-weight="400">3</text><rect x="70" y="317" width="350" height="46" rx="0" fill="#ffffff" stroke="#b7cbd5" stroke-width="2"/><text x="83" y="347.36" font-size="23" fill="#183448" text-anchor="start" font-weight="400">8</text><text x="700" y="190" font-size="27" fill="#177f7b" text-anchor="start" font-weight="700">Allocation</text><rect x="700" y="225" width="210" height="46" rx="0" fill="#183448" stroke="#b7cbd5" stroke-width="2"/><text x="713" y="255.36" font-size="23" fill="#ffffff" text-anchor="start" font-weight="700">AllocationID</text><rect x="910" y="225" width="225" height="46" rx="0" fill="#183448" stroke="#b7cbd5" stroke-width="2"/><text x="923" y="255.36" font-size="23" fill="#ffffff" text-anchor="start" font-weight="700">LockerID (FK)</text><rect x="700" y="271" width="210" height="46" rx="0" fill="#ffffff" stroke="#b7cbd5" stroke-width="2"/><text x="713" y="301.36" font-size="23" fill="#183448" text-anchor="start" font-weight="400">71</text><rect x="910" y="271" width="225" height="46" rx="0" fill="#d9efea" stroke="#b7cbd5" stroke-width="2"/><text x="923" y="301.36" font-size="23" fill="#183448" text-anchor="start" font-weight="400">3</text><rect x="700" y="317" width="210" height="46" rx="0" fill="#ffffff" stroke="#b7cbd5" stroke-width="2"/><text x="713" y="347.36" font-size="23" fill="#183448" text-anchor="start" font-weight="400">72</text><rect x="910" y="317" width="225" height="46" rx="0" fill="#d9efea" stroke="#b7cbd5" stroke-width="2"/><text x="923" y="347.36" font-size="23" fill="#183448" text-anchor="start" font-weight="400">3</text><path d="M1141 294H1170V135H30V294H62" stroke="#177f7b" stroke-width="3" fill="none" marker-end="url(#teal)"/><path d="M1141 340H1170V294" stroke="#177f7b" stroke-width="3" fill="none"/><rect x="68" y="456" width="1060" height="122" rx="10" fill="#ffffff" stroke="#2369a0" stroke-width="2"/><rect x="68" y="456" width="1060" height="54" rx="10" fill="#eaf5f4" stroke="#2369a0" stroke-width="2"/><text x="86" y="492" font-size="27" fill="#2369a0" text-anchor="start" font-weight="700">FOREIGN KEY (LockerID) REFERENCES Locker(LockerID)</text><text x="86" y="547" font-size="24" fill="#183448" text-anchor="start" font-weight="400">Allocation.LockerID refers to Locker.LockerID.</text><rect x="35" y="667" width="1130" height="87" rx="10" fill="#f3f7f9" stroke="#b7cbd5" stroke-width="2"/><text x="55" y="702" font-size="23" fill="#183448" text-anchor="start" font-weight="400">Both allocations can reference locker 3. This foreign-key declaration alone does not</text><text x="55" y="733" font-size="23" fill="#183448" text-anchor="start" font-weight="400">make the child field unique.</text></g></svg>