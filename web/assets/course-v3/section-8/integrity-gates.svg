<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><title id="title">Check a change before accepting it</title><desc id="desc">A proposed ExamResult must satisfy every applicable constraint. A valid mark such as 73 may still be factually wrong. Constraints do not prove correct transcription.</desc><defs><marker id="teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#177f7b"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2369a0"/></marker><marker id="amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b66a22"/></marker></defs><rect width="1200" height="780" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="44" y="58" font-size="35" fill="#183448" text-anchor="start" font-weight="700">Check a change before accepting it</text><text x="44" y="103" font-size="24" fill="#637887" text-anchor="start" font-weight="400">A proposed ExamResult must satisfy every applicable constraint.</text><rect x="80" y="176" width="1030" height="46" rx="23" fill="#eaf5f4" stroke="#2369a0" stroke-width="2"/><text x="595" y="207" font-size="23" fill="#2369a0" text-anchor="middle" font-weight="700">Proposed record → ResultID, CandidateID, Mark</text><path d="M210 240L210 313" stroke="#2369a0" stroke-width="4" fill="none" marker-end="url(#blue)"/><path d="M600 240L600 313" stroke="#177f7b" stroke-width="4" fill="none" marker-end="url(#teal)"/><path d="M990 240L990 313" stroke="#b66a22" stroke-width="4" fill="none" marker-end="url(#amber)"/><rect x="45" y="340" width="345" height="158" rx="10" fill="#ffffff" stroke="#2369a0" stroke-width="2"/><rect x="45" y="340" width="345" height="54" rx="10" fill="#eaf5f4" stroke="#2369a0" stroke-width="2"/><text x="63" y="376" font-size="27" fill="#2369a0" text-anchor="start" font-weight="700">Primary key</text><text x="63" y="431" font-size="24" fill="#183448" text-anchor="start" font-weight="400">ResultID already used?</text><text x="63" y="467" font-size="24" fill="#183448" text-anchor="start" font-weight="400">Reject a duplicate.</text><rect x="428" y="340" width="345" height="158" rx="10" fill="#ffffff" stroke="#177f7b" stroke-width="2"/><rect x="428" y="340" width="345" height="54" rx="10" fill="#eaf5f4" stroke="#177f7b" stroke-width="2"/><text x="446" y="376" font-size="27" fill="#177f7b" text-anchor="start" font-weight="700">Foreign key</text><text x="446" y="431" font-size="24" fill="#183448" text-anchor="start" font-weight="400">CandidateID absent?</text><text x="446" y="467" font-size="24" fill="#183448" text-anchor="start" font-weight="400">Reject the reference.</text><rect x="813" y="340" width="345" height="158" rx="10" fill="#ffffff" stroke="#b66a22" stroke-width="2"/><rect x="813" y="340" width="345" height="54" rx="10" fill="#eaf5f4" stroke="#b66a22" stroke-width="2"/><text x="831" y="376" font-size="27" fill="#b66a22" text-anchor="start" font-weight="700">Range rule</text><text x="831" y="431" font-size="24" fill="#183448" text-anchor="start" font-weight="400">Mark outside 0–100?</text><text x="831" y="467" font-size="24" fill="#183448" text-anchor="start" font-weight="400">Reject 145.</text><rect x="215" y="591" width="770" height="46" rx="23" fill="#eaf5f4" stroke="#177f7b" stroke-width="2"/><text x="600" y="622" font-size="23" fill="#177f7b" text-anchor="middle" font-weight="700">All checks pass → permit the proposed change</text><rect x="35" y="667" width="1130" height="87" rx="10" fill="#f3f7f9" stroke="#b7cbd5" stroke-width="2"/><text x="55" y="702" font-size="23" fill="#183448" text-anchor="start" font-weight="400">A valid mark such as 73 may still be factually wrong. Constraints do not prove correct</text><text x="55" y="733" font-size="23" fill="#183448" text-anchor="start" font-weight="400">transcription.</text></g></svg>