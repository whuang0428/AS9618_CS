<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc"><title id="title">2NF: separate facts with a partial dependency</title><desc id="desc">Start from the composite key (OrderID, ProductID) in the 1NF relation. Keep both foreign keys on OrderLine. CustomerName still depends on CustomerID, which is addressed in 3NF.</desc><defs><marker id="teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#177f7b"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2369a0"/></marker><marker id="amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b66a22"/></marker></defs><rect width="1200" height="880" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="44" y="58" font-size="35" fill="#183448" text-anchor="start" font-weight="700">2NF: separate facts with a partial dependency</text><text x="44" y="103" font-size="24" fill="#637887" text-anchor="start" font-weight="400">Start from the composite key (OrderID, ProductID) in the 1NF relation.</text><rect x="100" y="170" width="350" height="46" rx="23" fill="#eaf5f4" stroke="#2369a0" stroke-width="2"/><text x="275" y="201" font-size="23" fill="#2369a0" text-anchor="middle" font-weight="700">OrderID</text><rect x="720" y="170" width="350" height="46" rx="23" fill="#eaf5f4" stroke="#177f7b" stroke-width="2"/><text x="895" y="201" font-size="23" fill="#177f7b" text-anchor="middle" font-weight="700">ProductID</text><path d="M275 224L275 300" stroke="#2369a0" stroke-width="4" fill="none" marker-end="url(#blue)"/><path d="M895 224L895 300" stroke="#177f7b" stroke-width="4" fill="none" marker-end="url(#teal)"/><rect x="65" y="322" width="435" height="194" rx="10" fill="#ffffff" stroke="#2369a0" stroke-width="2"/><rect x="65" y="322" width="435" height="54" rx="10" fill="#eaf5f4" stroke="#2369a0" stroke-width="2"/><text x="83" y="358" font-size="27" fill="#2369a0" text-anchor="start" font-weight="700">SalesOrder</text><text x="83" y="413" font-size="24" fill="#183448" text-anchor="start" font-weight="400">OrderID  PK</text><text x="83" y="449" font-size="24" fill="#183448" text-anchor="start" font-weight="400">CustomerID</text><text x="83" y="485" font-size="24" fill="#183448" text-anchor="start" font-weight="400">CustomerName</text><rect x="700" y="322" width="435" height="194" rx="10" fill="#ffffff" stroke="#2369a0" stroke-width="2"/><rect x="700" y="322" width="435" height="54" rx="10" fill="#eaf5f4" stroke="#2369a0" stroke-width="2"/><text x="718" y="358" font-size="27" fill="#2369a0" text-anchor="start" font-weight="700">Product</text><text x="718" y="413" font-size="24" fill="#183448" text-anchor="start" font-weight="400">ProductID  PK</text><text x="718" y="449" font-size="24" fill="#183448" text-anchor="start" font-weight="400">ProductName</text><text x="718" y="485" font-size="24" fill="#183448" text-anchor="start" font-weight="400">UnitPrice</text><path d="M450 193H535V545" stroke="#2369a0" stroke-width="3" fill="none" marker-end="url(#blue)"/><path d="M720 193H660V545" stroke="#177f7b" stroke-width="3" fill="none" marker-end="url(#teal)"/><rect x="390" y="557" width="420" height="158" rx="10" fill="#ffffff" stroke="#b66a22" stroke-width="2"/><rect x="390" y="557" width="420" height="54" rx="10" fill="#eaf5f4" stroke="#b66a22" stroke-width="2"/><text x="408" y="593" font-size="27" fill="#b66a22" text-anchor="start" font-weight="700">OrderLine</text><text x="408" y="648" font-size="24" fill="#183448" text-anchor="start" font-weight="400">OrderID + ProductID  PK</text><text x="408" y="684" font-size="24" fill="#183448" text-anchor="start" font-weight="400">Quantity depends on both</text><rect x="35" y="767" width="1130" height="87" rx="10" fill="#f3f7f9" stroke="#b7cbd5" stroke-width="2"/><text x="55" y="802" font-size="23" fill="#183448" text-anchor="start" font-weight="400">Keep both foreign keys on OrderLine. CustomerName still depends on CustomerID, which is</text><text x="55" y="833" font-size="23" fill="#183448" text-anchor="start" font-weight="400">addressed in 3NF.</text></g></svg>