<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc"><title id="title">SQL includes both DDL and DML</title><desc id="desc">Classify a statement by its effect on the definition or on the records. DDL and DML describe roles within SQL. They are not two alternative database products.</desc><defs><marker id="teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#177f7b"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2369a0"/></marker><marker id="amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b66a22"/></marker></defs><rect width="1200" height="850" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="44" y="58" font-size="35" fill="#183448" text-anchor="start" font-weight="700">SQL includes both DDL and DML</text><text x="44" y="103" font-size="24" fill="#637887" text-anchor="start" font-weight="400">Classify a statement by its effect on the definition or on the records.</text><rect x="420" y="165" width="360" height="122" rx="10" fill="#ffffff" stroke="#2369a0" stroke-width="2"/><rect x="420" y="165" width="360" height="54" rx="10" fill="#eaf5f4" stroke="#2369a0" stroke-width="2"/><text x="438" y="201" font-size="27" fill="#2369a0" text-anchor="start" font-weight="700">SQL</text><text x="438" y="256" font-size="24" fill="#183448" text-anchor="start" font-weight="400">Structured Query Language</text><path d="M490 297V350H285V399" stroke="#2369a0" stroke-width="3" fill="none" marker-end="url(#blue)"/><path d="M710 297V350H915V399" stroke="#177f7b" stroke-width="3" fill="none" marker-end="url(#teal)"/><rect x="65" y="425" width="440" height="194" rx="10" fill="#ffffff" stroke="#2369a0" stroke-width="2"/><rect x="65" y="425" width="440" height="54" rx="10" fill="#eaf5f4" stroke="#2369a0" stroke-width="2"/><text x="83" y="461" font-size="27" fill="#2369a0" text-anchor="start" font-weight="700">DDL</text><text x="83" y="516" font-size="24" fill="#183448" text-anchor="start" font-weight="400">Define or alter structure</text><text x="83" y="552" font-size="24" fill="#183448" text-anchor="start" font-weight="400">CREATE TABLE</text><text x="83" y="588" font-size="24" fill="#183448" text-anchor="start" font-weight="400">ALTER TABLE</text><rect x="685" y="425" width="445" height="194" rx="10" fill="#ffffff" stroke="#177f7b" stroke-width="2"/><rect x="685" y="425" width="445" height="54" rx="10" fill="#eaf5f4" stroke="#177f7b" stroke-width="2"/><text x="703" y="461" font-size="27" fill="#177f7b" text-anchor="start" font-weight="700">DML</text><text x="703" y="516" font-size="24" fill="#183448" text-anchor="start" font-weight="400">Retrieve or maintain records</text><text x="703" y="552" font-size="24" fill="#183448" text-anchor="start" font-weight="400">SELECT / INSERT INTO</text><text x="703" y="588" font-size="24" fill="#183448" text-anchor="start" font-weight="400">UPDATE / DELETE FROM</text><rect x="35" y="737" width="1130" height="87" rx="10" fill="#f3f7f9" stroke="#b7cbd5" stroke-width="2"/><text x="55" y="772" font-size="23" fill="#183448" text-anchor="start" font-weight="400">DDL and DML describe roles within SQL. They are not two alternative database products.</text></g></svg>