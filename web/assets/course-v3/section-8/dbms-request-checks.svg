<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="950" viewBox="0 0 1200 950" role="img" aria-labelledby="title desc"><title id="title">Separate permission from valid data</title><desc id="desc">A request identifies the account, operation and proposed record. Permission and all applicable data constraints are required. A denied request leaves the database unchanged; an accepted insertion adds one record. This teaching trace does not specify an internal DBMS implementation order.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#177f7b"/></marker></defs><rect width="1200" height="950" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="45" y="57" font-size="34" fill="#183448">Separate permission from valid data</text><text x="45" y="100" font-size="25" fill="#183448">Teaching trace: a valid value does not give a user permission.</text><rect x="45" y="140" width="1100" height="106" rx="12" fill="#f1f7f7" stroke="#177f7b" stroke-width="2"/><text x="65" y="178" font-size="28" fill="#177f7b">Request: add Student (22, Ben, 7, 80)</text><text x="65" y="218" font-size="25" fill="#183448">Account: Editor. Existing TutorID: 7. Existing StudentID: 21.</text><path d="M350 250L350 295" fill="none" stroke="#177f7b" stroke-width="3" marker-end="url(#arrow)"/><rect x="45" y="310" width="620" height="106" rx="12" fill="#f1f7f7" stroke="#177f7b" stroke-width="2"/><text x="65" y="348" font-size="28" fill="#177f7b">1. Permission</text><text x="65" y="388" font-size="25" fill="#183448">May this role insert Student records?</text><rect x="790" y="310" width="355" height="106" rx="12" fill="#f1f7f7" stroke="#a55922" stroke-width="2"/><text x="810" y="348" font-size="28" fill="#a55922">No permission</text><text x="810" y="388" font-size="25" fill="#183448">Reject: no change.</text><path d="M670 365L775 365" fill="none" stroke="#177f7b" stroke-width="3" marker-end="url(#arrow)"/><path d="M350 420L350 465" fill="none" stroke="#177f7b" stroke-width="3" marker-end="url(#arrow)"/><rect x="45" y="480" width="620" height="106" rx="12" fill="#f1f7f7" stroke="#177f7b" stroke-width="2"/><text x="65" y="518" font-size="28" fill="#177f7b">2. Identity and reference</text><text x="65" y="558" font-size="25" fill="#183448">Is ID 22 new? Does tutor 7 exist?</text><rect x="790" y="480" width="355" height="106" rx="12" fill="#f1f7f7" stroke="#a55922" stroke-width="2"/><text x="810" y="518" font-size="28" fill="#a55922">Invalid key or link</text><text x="810" y="558" font-size="25" fill="#183448">Reject: no change.</text><path d="M670 535L775 535" fill="none" stroke="#177f7b" stroke-width="3" marker-end="url(#arrow)"/><path d="M350 590L350 635" fill="none" stroke="#177f7b" stroke-width="3" marker-end="url(#arrow)"/><rect x="45" y="650" width="620" height="106" rx="12" fill="#f1f7f7" stroke="#177f7b" stroke-width="2"/><text x="65" y="688" font-size="28" fill="#177f7b">3. Field rules</text><text x="65" y="728" font-size="25" fill="#183448">Are required values present and in range?</text><rect x="790" y="650" width="355" height="106" rx="12" fill="#f1f7f7" stroke="#a55922" stroke-width="2"/><text x="810" y="688" font-size="28" fill="#a55922">Invalid field value</text><text x="810" y="728" font-size="25" fill="#183448">Reject: no change.</text><path d="M670 705L775 705" fill="none" stroke="#177f7b" stroke-width="3" marker-end="url(#arrow)"/><path d="M350 760L350 805" fill="none" stroke="#177f7b" stroke-width="3" marker-end="url(#arrow)"/><rect x="45" y="820" width="1100" height="106" rx="12" fill="#f1f7f7" stroke="#177f7b" stroke-width="2"/><text x="65" y="858" font-size="28" fill="#177f7b">All applicable checks pass: add Student 22</text><text x="65" y="898" font-size="25" fill="#183448">Student 21 and tutor 7 remain unchanged. A permitted score may still be wrong.</text></g></svg>