<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc"><title id="title">Choose a type from the meaning of a value</title><desc id="desc">The seven syllabus types represent different kinds of Student information. Digits alone do not make a number: a code such as 007B needs character data to retain its meaning.</desc><defs><marker id="teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#177f7b"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2369a0"/></marker><marker id="amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b66a22"/></marker></defs><rect width="1200" height="850" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="44" y="58" font-size="35" fill="#183448" text-anchor="start" font-weight="700">Choose a type from the meaning of a value</text><text x="44" y="103" font-size="24" fill="#637887" text-anchor="start" font-weight="400">The seven syllabus types represent different kinds of Student information.</text><rect x="65" y="180" width="315" height="158" rx="10" fill="#ffffff" stroke="#2369a0" stroke-width="2"/><rect x="65" y="180" width="315" height="54" rx="10" fill="#eaf5f4" stroke="#2369a0" stroke-width="2"/><text x="83" y="216" font-size="27" fill="#2369a0" text-anchor="start" font-weight="700">INTEGER</text><text x="83" y="271" font-size="24" fill="#183448" text-anchor="start" font-weight="400">StudentID</text><text x="83" y="307" font-size="24" fill="#183448" text-anchor="start" font-weight="400">41</text><rect x="445" y="180" width="315" height="158" rx="10" fill="#ffffff" stroke="#2369a0" stroke-width="2"/><rect x="445" y="180" width="315" height="54" rx="10" fill="#eaf5f4" stroke="#2369a0" stroke-width="2"/><text x="463" y="216" font-size="27" fill="#2369a0" text-anchor="start" font-weight="700">REAL</text><text x="463" y="271" font-size="24" fill="#183448" text-anchor="start" font-weight="400">Score</text><text x="463" y="307" font-size="24" fill="#183448" text-anchor="start" font-weight="400">82.5</text><rect x="825" y="180" width="315" height="158" rx="10" fill="#ffffff" stroke="#2369a0" stroke-width="2"/><rect x="825" y="180" width="315" height="54" rx="10" fill="#eaf5f4" stroke="#2369a0" stroke-width="2"/><text x="843" y="216" font-size="27" fill="#2369a0" text-anchor="start" font-weight="700">BOOLEAN</text><text x="843" y="271" font-size="24" fill="#183448" text-anchor="start" font-weight="400">Active</text><text x="843" y="307" font-size="24" fill="#183448" text-anchor="start" font-weight="400">TRUE</text><rect x="55" y="420" width="260" height="158" rx="10" fill="#ffffff" stroke="#177f7b" stroke-width="2"/><rect x="55" y="420" width="260" height="54" rx="10" fill="#eaf5f4" stroke="#177f7b" stroke-width="2"/><text x="73" y="456" font-size="27" fill="#177f7b" text-anchor="start" font-weight="700">CHARACTER(1)</text><text x="73" y="511" font-size="24" fill="#183448" text-anchor="start" font-weight="400">Initial</text><text x="73" y="547" font-size="24" fill="#183448" text-anchor="start" font-weight="400">'A'</text><rect x="345" y="420" width="260" height="158" rx="10" fill="#ffffff" stroke="#177f7b" stroke-width="2"/><rect x="345" y="420" width="260" height="54" rx="10" fill="#eaf5f4" stroke="#177f7b" stroke-width="2"/><text x="363" y="456" font-size="27" fill="#177f7b" text-anchor="start" font-weight="700">VARCHAR(40)</text><text x="363" y="511" font-size="24" fill="#183448" text-anchor="start" font-weight="400">StudentName</text><text x="363" y="547" font-size="24" fill="#183448" text-anchor="start" font-weight="400">'Amina'</text><rect x="635" y="420" width="260" height="158" rx="10" fill="#ffffff" stroke="#177f7b" stroke-width="2"/><rect x="635" y="420" width="260" height="54" rx="10" fill="#eaf5f4" stroke="#177f7b" stroke-width="2"/><text x="653" y="456" font-size="27" fill="#177f7b" text-anchor="start" font-weight="700">DATE</text><text x="653" y="511" font-size="24" fill="#183448" text-anchor="start" font-weight="400">BirthDate</text><text x="653" y="547" font-size="24" fill="#183448" text-anchor="start" font-weight="400">2010-03-18</text><rect x="925" y="420" width="260" height="158" rx="10" fill="#ffffff" stroke="#177f7b" stroke-width="2"/><rect x="925" y="420" width="260" height="54" rx="10" fill="#eaf5f4" stroke="#177f7b" stroke-width="2"/><text x="943" y="456" font-size="27" fill="#177f7b" text-anchor="start" font-weight="700">TIME</text><text x="943" y="511" font-size="24" fill="#183448" text-anchor="start" font-weight="400">ArrivalTime</text><text x="943" y="547" font-size="24" fill="#183448" text-anchor="start" font-weight="400">08:30:00</text><rect x="35" y="737" width="1130" height="87" rx="10" fill="#f3f7f9" stroke="#b7cbd5" stroke-width="2"/><text x="55" y="772" font-size="23" fill="#183448" text-anchor="start" font-weight="400">Digits alone do not make a number: a code such as 007B needs character data to retain</text><text x="55" y="803" font-size="23" fill="#183448" text-anchor="start" font-weight="400">its meaning.</text></g></svg>