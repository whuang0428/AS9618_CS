<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><title id="title">A primary key identifies each record</title><desc id="desc">The LockerID constraint requires unique, non-null identifiers. For a composite primary key, the combination must be unique; each component is part of the identifier.</desc><defs><marker id="teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#177f7b"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2369a0"/></marker><marker id="amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b66a22"/></marker></defs><rect width="1200" height="780" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="44" y="58" font-size="35" fill="#183448" text-anchor="start" font-weight="700">A primary key identifies each record</text><text x="44" y="103" font-size="24" fill="#637887" text-anchor="start" font-weight="400">The LockerID constraint requires unique, non-null identifiers.</text><rect x="200" y="169" width="800" height="46" rx="23" fill="#eaf5f4" stroke="#2369a0" stroke-width="2"/><text x="600" y="200" font-size="23" fill="#2369a0" text-anchor="middle" font-weight="700">PRIMARY KEY (LockerID)</text><rect x="65" y="269" width="245" height="46" rx="0" fill="#183448" stroke="#b7cbd5" stroke-width="2"/><text x="78" y="299.36" font-size="23" fill="#ffffff" text-anchor="start" font-weight="700">LockerID (PK)</text><rect x="310" y="269" width="205" height="46" rx="0" fill="#183448" stroke="#b7cbd5" stroke-width="2"/><text x="323" y="299.36" font-size="23" fill="#ffffff" text-anchor="start" font-weight="700">Location</text><rect x="65" y="315" width="245" height="46" rx="0" fill="#ffffff" stroke="#b7cbd5" stroke-width="2"/><text x="78" y="345.36" font-size="23" fill="#183448" text-anchor="start" font-weight="400">1</text><rect x="310" y="315" width="205" height="46" rx="0" fill="#ffffff" stroke="#b7cbd5" stroke-width="2"/><text x="323" y="345.36" font-size="23" fill="#183448" text-anchor="start" font-weight="400">East</text><rect x="65" y="361" width="245" height="46" rx="0" fill="#ffffff" stroke="#b7cbd5" stroke-width="2"/><text x="78" y="391.36" font-size="23" fill="#183448" text-anchor="start" font-weight="400">2</text><rect x="310" y="361" width="205" height="46" rx="0" fill="#ffffff" stroke="#b7cbd5" stroke-width="2"/><text x="323" y="391.36" font-size="23" fill="#183448" text-anchor="start" font-weight="400">West</text><text x="75" y="236" font-size="26" fill="#183448" text-anchor="start" font-weight="400">Existing Locker records</text><rect x="705" y="253" width="425" height="122" rx="10" fill="#ffffff" stroke="#b66a22" stroke-width="2"/><rect x="705" y="253" width="425" height="54" rx="10" fill="#eaf5f4" stroke="#b66a22" stroke-width="2"/><text x="723" y="289" font-size="27" fill="#b66a22" text-anchor="start" font-weight="700">Proposed LockerID 1</text><text x="723" y="344" font-size="24" fill="#183448" text-anchor="start" font-weight="400">Already present → reject</text><rect x="705" y="458" width="425" height="122" rx="10" fill="#ffffff" stroke="#b66a22" stroke-width="2"/><rect x="705" y="458" width="425" height="54" rx="10" fill="#eaf5f4" stroke="#b66a22" stroke-width="2"/><text x="723" y="494" font-size="27" fill="#b66a22" text-anchor="start" font-weight="700">Proposed NULL key</text><text x="723" y="549" font-size="24" fill="#183448" text-anchor="start" font-weight="400">No identifier → reject</text><path d="M520 335H608V310H693" stroke="#b66a22" stroke-width="3" fill="none" marker-end="url(#amber)"/><path d="M607 335V515H693" stroke="#b66a22" stroke-width="3" fill="none" marker-end="url(#amber)"/><rect x="35" y="667" width="1130" height="87" rx="10" fill="#f3f7f9" stroke="#b7cbd5" stroke-width="2"/><text x="55" y="702" font-size="23" fill="#183448" text-anchor="start" font-weight="400">For a composite primary key, the combination must be unique; each component is part of</text><text x="55" y="733" font-size="23" fill="#183448" text-anchor="start" font-weight="400">the identifier.</text></g></svg>