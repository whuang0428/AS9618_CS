<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description"><title id="title">Access rights: permission and integrity are separate checks</title><desc id="description">In this example policy, Readers may retrieve Student records but cannot insert them; Editors may retrieve and insert. Three independent attempts restart from the same state: Editor inserts student 22, Ben, tutor 7, mark 80, which is permitted and valid; Reader attempts the same row but permission is denied; Editor attempts student 23, Chen, tutor 9, mark 80, but the missing tutor reference fails integrity checks. Tutor 7 exists, tutor 9 does not, StudentID must be unique, and Mark must be between zero and one hundred.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1L9 5L0 9" fill="none" stroke="#294c66" stroke-width="1.5"/></marker></defs><rect width="1440" height="900" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="60" y="74" font-size="38" font-weight="600" fill="#20262c">Access rights: permission and integrity are separate checks</text><line x1="60" y1="107" x2="1380" y2="107" stroke="#bac2c8" stroke-width="1.5"/><text x="60" y="164" font-size="29" font-weight="600" fill="#294c66">Example group policy for an authenticated account</text><rect x="60" y="192" width="1320" height="174" fill="white" stroke="#bac2c8" stroke-width="1.5"/><rect x="60" y="192" width="1320" height="58" fill="#f4f6f7" stroke="#bac2c8" stroke-width="1.5"/><line x1="460" y1="192" x2="460" y2="366" stroke="#bac2c8" stroke-width="1.5"/><line x1="920" y1="192" x2="920" y2="366" stroke="#bac2c8" stroke-width="1.5"/><text x="78" y="231" font-size="28" font-weight="600" fill="#20262c">Group</text><text x="478" y="231" font-size="28" font-weight="600" fill="#20262c">Retrieve Student</text><text x="938" y="231" font-size="28" font-weight="600" fill="#20262c">Insert Student</text><line x1="60" y1="250" x2="1380" y2="250" stroke="#bac2c8" stroke-width="1.5"/><text x="78" y="289" font-size="28" font-weight="400" fill="#20262c">Readers</text><text x="478" y="289" font-size="28" font-weight="400" fill="#20262c">Allowed</text><text x="938" y="289" font-size="28" font-weight="400" fill="#20262c">Denied</text><line x1="60" y1="308" x2="1380" y2="308" stroke="#bac2c8" stroke-width="1.5"/><text x="78" y="347" font-size="28" font-weight="400" fill="#20262c">Editors</text><text x="478" y="347" font-size="28" font-weight="400" fill="#20262c">Allowed</text><text x="938" y="347" font-size="28" font-weight="400" fill="#20262c">Allowed</text><text x="60" y="432" font-size="29" font-weight="600" fill="#294c66">Independent insertion attempts — restart from the same records</text><rect x="60" y="461" width="1320" height="288" fill="white" stroke="#bac2c8" stroke-width="1.5"/><rect x="60" y="461" width="1320" height="72" fill="#f4f6f7" stroke="#bac2c8" stroke-width="1.5"/><line x1="600" y1="461" x2="600" y2="749" stroke="#bac2c8" stroke-width="1.5"/><line x1="810" y1="461" x2="810" y2="749" stroke="#bac2c8" stroke-width="1.5"/><line x1="1090" y1="461" x2="1090" y2="749" stroke="#bac2c8" stroke-width="1.5"/><text x="78" y="507" font-size="28" font-weight="600" fill="#20262c">Request</text><text x="618" y="507" font-size="28" font-weight="600" fill="#20262c">Permission</text><text x="828" y="507" font-size="28" font-weight="600" fill="#20262c">Integrity</text><text x="1108" y="507" font-size="28" font-weight="600" fill="#20262c">Stored result</text><line x1="60" y1="533" x2="1380" y2="533" stroke="#bac2c8" stroke-width="1.5"/><text x="78" y="579" font-size="28" font-weight="400" fill="#20262c">Editor: (22, Ben, 7, 80)</text><text x="618" y="579" font-size="28" font-weight="400" fill="#20262c">Allowed</text><text x="828" y="579" font-size="28" font-weight="400" fill="#20262c">Passes rules</text><text x="1108" y="579" font-size="28" font-weight="400" fill="#20262c">Student added</text><line x1="60" y1="605" x2="1380" y2="605" stroke="#bac2c8" stroke-width="1.5"/><text x="78" y="651" font-size="28" font-weight="400" fill="#20262c">Reader: (22, Ben, 7, 80)</text><text x="618" y="651" font-size="28" font-weight="400" fill="#20262c">Denied</text><text x="828" y="651" font-size="28" font-weight="400" fill="#20262c">Same valid row</text><text x="1108" y="651" font-size="28" font-weight="400" fill="#20262c">No change</text><line x1="60" y1="677" x2="1380" y2="677" stroke="#bac2c8" stroke-width="1.5"/><text x="78" y="723" font-size="28" font-weight="400" fill="#20262c">Editor: (23, Chen, 9, 80)</text><text x="618" y="723" font-size="28" font-weight="400" fill="#20262c">Allowed</text><text x="828" y="723" font-size="28" font-weight="400" fill="#20262c">Tutor 9 absent</text><text x="1108" y="723" font-size="28" font-weight="400" fill="#20262c">No change</text><text x="60" y="808" font-size="28" font-weight="400" fill="#52606b">Row order: StudentID, StudentName, TutorID, Mark.</text><text x="60" y="854" font-size="28" font-weight="400" fill="#20262c">Tutor 7 exists; Tutor 9 does not. StudentID is unique; Mark must be 0–100.</text></g></svg>