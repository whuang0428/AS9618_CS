<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><title id="title">A reference must reach an existing record</title><desc id="desc">Check a proposed Appointment.PatientID against Patient.PatientID. Each non-null foreign-key value must match the referenced key. Null is allowed only when the field permits it.</desc><defs><marker id="teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#177f7b"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2369a0"/></marker><marker id="amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b66a22"/></marker></defs><rect width="1200" height="780" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="44" y="58" font-size="35" fill="#183448" text-anchor="start" font-weight="700">A reference must reach an existing record</text><text x="44" y="103" font-size="24" fill="#637887" text-anchor="start" font-weight="400">Check a proposed Appointment.PatientID against Patient.PatientID.</text><text x="70" y="187" font-size="28" fill="#183448" text-anchor="start" font-weight="700">Patient</text><rect x="70" y="215" width="360" height="46" rx="0" fill="#183448" stroke="#b7cbd5" stroke-width="2"/><text x="83" y="245.36" font-size="23" fill="#ffffff" text-anchor="start" font-weight="700">PatientID</text><rect x="70" y="261" width="360" height="46" rx="0" fill="#ffffff" stroke="#b7cbd5" stroke-width="2"/><text x="83" y="291.36" font-size="23" fill="#183448" text-anchor="start" font-weight="400">14</text><rect x="70" y="307" width="360" height="46" rx="0" fill="#ffffff" stroke="#b7cbd5" stroke-width="2"/><text x="83" y="337.36" font-size="23" fill="#183448" text-anchor="start" font-weight="400">18</text><text x="730" y="187" font-size="28" fill="#183448" text-anchor="start" font-weight="700">Proposed appointments</text><rect x="730" y="215" width="380" height="46" rx="0" fill="#183448" stroke="#b7cbd5" stroke-width="2"/><text x="743" y="245.36" font-size="23" fill="#ffffff" text-anchor="start" font-weight="700">PatientID (FK)</text><rect x="730" y="261" width="380" height="46" rx="0" fill="#ffffff" stroke="#b7cbd5" stroke-width="2"/><text x="743" y="291.36" font-size="23" fill="#183448" text-anchor="start" font-weight="400">14</text><rect x="730" y="307" width="380" height="46" rx="0" fill="#ffffff" stroke="#b7cbd5" stroke-width="2"/><text x="743" y="337.36" font-size="23" fill="#183448" text-anchor="start" font-weight="400">99</text><path d="M726 284L438 284" stroke="#177f7b" stroke-width="4" fill="none" marker-end="url(#teal)"/><rect x="465" y="213" width="204" height="46" rx="23" fill="#eaf5f4" stroke="#177f7b" stroke-width="2"/><text x="567" y="244" font-size="23" fill="#177f7b" text-anchor="middle" font-weight="700">14: match</text><path d="M730 330H570V447" stroke="#b66a22" stroke-width="3" fill="none" marker-end="url(#amber)"/><rect x="340" y="466" width="460" height="46" rx="23" fill="#eaf5f4" stroke="#b66a22" stroke-width="2"/><text x="570" y="497" font-size="23" fill="#b66a22" text-anchor="middle" font-weight="700">99: no matching patient</text><text x="115" y="572" font-size="27" fill="#177f7b" text-anchor="start" font-weight="400">Allow reference to 14</text><text x="700" y="572" font-size="27" fill="#b66a22" text-anchor="start" font-weight="400">Reject reference to 99</text><rect x="35" y="667" width="1130" height="87" rx="10" fill="#f3f7f9" stroke="#b7cbd5" stroke-width="2"/><text x="55" y="702" font-size="23" fill="#183448" text-anchor="start" font-weight="400">Each non-null foreign-key value must match the referenced key. Null is allowed only when</text><text x="55" y="733" font-size="23" fill="#183448" text-anchor="start" font-weight="400">the field permits it.</text></g></svg>