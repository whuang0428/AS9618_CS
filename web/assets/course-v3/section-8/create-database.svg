<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><title id="title">Create the database before defining its tables</title><desc id="desc">A database is a container for the definitions and records added later. Choose SchoolLibrary in the DBMS before defining tables. CREATE DATABASE does not insert Student records.</desc><defs><marker id="teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#177f7b"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2369a0"/></marker><marker id="amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b66a22"/></marker></defs><rect width="1200" height="780" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="44" y="58" font-size="35" fill="#183448" text-anchor="start" font-weight="700">Create the database before defining its tables</text><text x="44" y="103" font-size="24" fill="#637887" text-anchor="start" font-weight="400">A database is a container for the definitions and records added later.</text><rect x="80" y="170" width="1035" height="122" rx="10" fill="#ffffff" stroke="#2369a0" stroke-width="2"/><rect x="80" y="170" width="1035" height="54" rx="10" fill="#eaf5f4" stroke="#2369a0" stroke-width="2"/><text x="98" y="206" font-size="27" fill="#2369a0" text-anchor="start" font-weight="700">CREATE DATABASE SchoolLibrary;</text><text x="98" y="261" font-size="24" fill="#183448" text-anchor="start" font-weight="400">Creates the named database.</text><path d="M600 312L600 375" stroke="#2369a0" stroke-width="4" fill="none" marker-end="url(#blue)"/><rect x="265" y="402" width="675" height="225" rx="25" fill="#f0f7fb" stroke="#2369a0" stroke-width="2"/><text x="600" y="457" font-size="31" fill="#2369a0" text-anchor="middle" font-weight="700">SchoolLibrary</text><rect x="322" y="489" width="250" height="87" rx="10" fill="#ffffff" stroke="#b7cbd5" stroke-width="2"/><rect x="629" y="489" width="250" height="87" rx="10" fill="#ffffff" stroke="#b7cbd5" stroke-width="2"/><text x="447" y="541" font-size="25" fill="#637887" text-anchor="middle" font-weight="400">Future tables</text><text x="754" y="541" font-size="25" fill="#637887" text-anchor="middle" font-weight="400">Future records</text><rect x="35" y="667" width="1130" height="87" rx="10" fill="#f3f7f9" stroke="#b7cbd5" stroke-width="2"/><text x="55" y="702" font-size="23" fill="#183448" text-anchor="start" font-weight="400">Choose SchoolLibrary in the DBMS before defining tables. CREATE DATABASE does not insert</text><text x="55" y="733" font-size="23" fill="#183448" text-anchor="start" font-weight="400">Student records.</text></g></svg>