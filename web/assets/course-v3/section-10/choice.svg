<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc"><title id="title">Choose dimensions from the required indices</title><desc id="desc">Task: One total per day; Structure: 1D array; Required access: Totals[Day]. Task: One mark per pupil per test; Structure: 2D array; Required access: Marks[Pupil, Test]. Task: One occupancy flag per seat; Structure: 2D array; Required access: Occupied[Row, Seat]. Task: One total per performance; Structure: 1D array; Required access: Bookings[Performance]. A 2D array uses two indices separated by a comma, for example Marks[2, 3]. One index identifies each 1D value; two independent indices identify each 2D value.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="54" fill="#15354d" font-size="30" font-weight="700">Choose dimensions from the required indices</text><g data-row="0" data-column="0"><rect x="30" y="100" width="240" height="90" fill="#e2edf2" stroke="#91a8b4"/><text x="42" y="130" font-size="23" fill="#16394d"><tspan x="42" dy="0">Task</tspan></text></g><g data-row="0" data-column="1"><rect x="270" y="100" width="400" height="90" fill="#e2edf2" stroke="#91a8b4"/><text x="282" y="130" font-size="23" fill="#16394d"><tspan x="282" dy="0">Structure</tspan></text></g><g data-row="0" data-column="2"><rect x="670" y="100" width="400" height="90" fill="#e2edf2" stroke="#91a8b4"/><text x="682" y="130" font-size="23" fill="#16394d"><tspan x="682" dy="0">Required access</tspan></text></g><g data-row="1" data-column="0"><rect x="30" y="190" width="240" height="90" fill="#ffffff" stroke="#91a8b4"/><text x="42" y="220" font-size="23" fill="#16394d"><tspan x="42" dy="0">One total per day</tspan></text></g><g data-row="1" data-column="1"><rect x="270" y="190" width="400" height="90" fill="#ffffff" stroke="#91a8b4"/><text x="282" y="220" font-size="23" fill="#16394d"><tspan x="282" dy="0">1D array</tspan></text></g><g data-row="1" data-column="2"><rect x="670" y="190" width="400" height="90" fill="#ffffff" stroke="#91a8b4"/><text x="682" y="220" font-size="23" fill="#16394d"><tspan x="682" dy="0">Totals[Day]</tspan></text></g><g data-row="2" data-column="0"><rect x="30" y="280" width="240" height="90" fill="#f2f7f8" stroke="#91a8b4"/><text x="42" y="310" font-size="23" fill="#16394d"><tspan x="42" dy="0">One mark per pupil</tspan><tspan x="42" dy="27">per test</tspan></text></g><g data-row="2" data-column="1"><rect x="270" y="280" width="400" height="90" fill="#f2f7f8" stroke="#91a8b4"/><text x="282" y="310" font-size="23" fill="#16394d"><tspan x="282" dy="0">2D array</tspan></text></g><g data-row="2" data-column="2"><rect x="670" y="280" width="400" height="90" fill="#f2f7f8" stroke="#91a8b4"/><text x="682" y="310" font-size="23" fill="#16394d"><tspan x="682" dy="0">Marks[Pupil, Test]</tspan></text></g><g data-row="3" data-column="0"><rect x="30" y="370" width="240" height="90" fill="#ffffff" stroke="#91a8b4"/><text x="42" y="400" font-size="23" fill="#16394d"><tspan x="42" dy="0">One occupancy flag</tspan><tspan x="42" dy="27">per seat</tspan></text></g><g data-row="3" data-column="1"><rect x="270" y="370" width="400" height="90" fill="#ffffff" stroke="#91a8b4"/><text x="282" y="400" font-size="23" fill="#16394d"><tspan x="282" dy="0">2D array</tspan></text></g><g data-row="3" data-column="2"><rect x="670" y="370" width="400" height="90" fill="#ffffff" stroke="#91a8b4"/><text x="682" y="400" font-size="23" fill="#16394d"><tspan x="682" dy="0">Occupied[Row, Seat]</tspan></text></g><g data-row="4" data-column="0"><rect x="30" y="460" width="240" height="90" fill="#f2f7f8" stroke="#91a8b4"/><text x="42" y="490" font-size="23" fill="#16394d"><tspan x="42" dy="0">One total per</tspan><tspan x="42" dy="27">performance</tspan></text></g><g data-row="4" data-column="1"><rect x="270" y="460" width="400" height="90" fill="#f2f7f8" stroke="#91a8b4"/><text x="282" y="490" 