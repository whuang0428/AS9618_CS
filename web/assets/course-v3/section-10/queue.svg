<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="810" viewBox="0 0 1100 810" role="img" aria-labelledby="title desc"><title id="title">A queue removes the earliest item still waiting</title><desc id="desc">Operation: ENQUEUE A; Index 1: A; Index 2: —; Index 3: —; Front / Rear / Count: 1 / 1 / 1. Operation: ENQUEUE B; Index 1: A; Index 2: B; Index 3: —; Front / Rear / Count: 1 / 2 / 2. Operation: DEQUEUE returns A; Index 1: unused; Index 2: B; Index 3: —; Front / Rear / Count: 2 / 2 / 1. Operation: ENQUEUE C; Index 1: unused; Index 2: B; Index 3: C; Front / Rear / Count: 2 / 3 / 2. Operation: ENQUEUE D: wrap; Index 1: D; Index 2: B; Index 3: C; Front / Rear / Count: 2 / 1 / 3. This circular queue uses Count to distinguish empty (0) from full (3). The logical order is B, C, D even though D is stored at array index 1.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="54" fill="#15354d" font-size="30" font-weight="700">A queue removes the earliest item still waiting</text><g data-row="0" data-column="0"><rect x="30" y="100" width="240" height="90" fill="#e2edf2" stroke="#91a8b4"/><text x="42" y="130" font-size="23" fill="#16394d"><tspan x="42" dy="0">Operation</tspan></text></g><g data-row="0" data-column="1"><rect x="270" y="100" width="200" height="90" fill="#e2edf2" stroke="#91a8b4"/><text x="282" y="130" font-size="23" fill="#16394d"><tspan x="282" dy="0">Index 1</tspan></text></g><g data-row="0" data-column="2"><rect x="470" y="100" width="200" height="90" fill="#e2edf2" stroke="#91a8b4"/><text x="482" y="130" font-size="23" fill="#16394d"><tspan x="482" dy="0">Index 2</tspan></text></g><g data-row="0" data-column="3"><rect x="670" y="100" width="200" height="90" fill="#e2edf2" stroke="#91a8b4"/><text x="682" y="130" font-size="23" fill="#16394d"><tspan x="682" dy="0">Index 3</tspan></text></g><g data-row="0" data-column="4"><rect x="870" y="100" width="200" height="90" fill="#e2edf2" stroke="#91a8b4"/><text x="882" y="130" font-size="23" fill="#16394d"><tspan x="882" dy="0">Front / Rear /</tspan><tspan x="882" dy="27">Count</tspan></text></g><g data-row="1" data-column="0"><rect x="30" y="190" width="240" height="90" fill="#ffffff" stroke="#91a8b4"/><text x="42" y="220" font-size="23" fill="#16394d"><tspan x="42" dy="0">ENQUEUE A</tspan></text></g><g data-row="1" data-column="1"><rect x="270" y="190" width="200" height="90" fill="#ffffff" stroke="#91a8b4"/><text x="282" y="220" font-size="23" fill="#16394d"><tspan x="282" dy="0">A</tspan></text></g><g data-row="1" data-column="2"><rect x="470" y="190" width="200" height="90" fill="#ffffff" stroke="#91a8b4"/><text x="482" y="220" font-size="23" fill="#16394d"><tspan x="482" dy="0">—</tspan></text></g><g data-row="1" data-column="3"><rect x="670" y="190" width="200" height="90" fill="#ffffff" stroke="#91a8b4"/><text x="682" y="220" font-size="23" fill="#16394d"><tspan x="682" dy="0">—</tspan></text></g><g data-row="1" data-column="4"><rect x="870" y="190" width="200" height="90" fill="#ffffff" stroke="#91a8b4"/><text x="882" y="220" font-size="23" fill="#16394d"><tspan x="882" dy="0">1 / 1 / 1</tspan></text></g><g data-row="2" data-column="0"><rect x="30" y="280" width="240" height="90" fill="#f2f7f8" stroke="#91a8b4"/><text x="42" y="310" font-size="23" fill="#16394d"><tspan x="42" dy="0">ENQUEUE B</tspan></text></g><g data-row="2" data-column="1"><rect x="270" y="280" width="200" height="90" fill="#f2f7f8" stroke="#91a8b4"/><text x="282" y="310" font-size="23" fill="#16394d"><tspan x="282" dy="0">A</tspan></text></g><g data-row="2" data-column="2"><rect x="470" y="280" width="200" height="90" fill="#f2f7f8" stroke="#91a8b4"/><text x="482" y="310" font-size="23" fill="#16394d"><tspan x="482" dy="0">B</tspan></text></g><g data-row="2" data-column="3"><rect x="670" y="280" width="200" height="90" fill="#f2f7f8" stroke="#91a8b4"/><text x="682" y="310" font-size="23" fill="#16394d"><tspan x="682" dy="0">—</tspan></text></g><g data-row="2" data-column="4"><rect x="870" y="280" width="200" height="90" fill="#f2f7f8" stroke="#91a8b4"/><text x="882" y="310" font-size="23" fill="#16394d"><tspan x="882" dy="0">1 / 2 / 2</tspan></text></g><g data-row="3" data-column="0"><rect x="30" y="370" width="240" height="90" fill="#ffffff" stroke="#91a8b4"/><text x="42" y="400" font-size="23" fill="#16394d"><tspan x="42" dy="0">DEQUEUE returns A</tspan></text></g><g data-row="3" data-column="1"><rect x="270" y="370" width="200" height="90" fill="#ffffff" stroke="#91a8b4"/><text x="282" y="400" font-size="23" fill="#16394d"><tspan x="282" dy="0">unused</tspan></text></g><g data-row="3" data-column="2"><rect x="470" y="370" width="200" height="90" fill="#ffffff" stroke="#91a8b4"/><text x="482" y="400" font-size="23" fill="#16394d"><tspan x="482" dy="0">B</tspan></text></g><g data-row="3" data-column="3"><rect x="670" y="370" width="200" height="90" fill="#ffffff" stroke="#91a8b4"/><text x="682" y="400" font-size="23" fill="#16394d"><tspan x="682" dy="0">—</tspan></text></g><g data-row="3" data-column="4"><rect x="870" y="370" width="200" height="90" fill="#ffffff" stroke="#91a8b4"/><text x="882" y="400" font-size="23" fill="#16394d"><tspan x="882" dy="0">2 / 2 / 1</tspan></text></g><g data-row="4" data-column="0"><rect x="30" y="460" width="240" height="90" fill="#f2f7f8" stroke="#91a8b4"/><text x="42" y="490" font-size="23" fill="#16394d"><tspan x="42" dy="0">ENQUEUE C</tspan></text></g><g data-row="4" data-column="1"><rect x="270" y="460" width="200" height="90" fill="#f2f7f8" stroke="#91a8b4"/><text x="282" y="490" font-size="23" fill="#16394d"><tspan x="282" dy="0">unused</tspan></text></g><g data-row="4" data-column="2"><rect x="470" y="460" width="200" height="90" fill="#f2f7f8" stroke="#91a8b4"/><text x="482" y="490" font-size="23" fill="#16394d"><tspan x="482" dy="0">B</tspan></text></g><g data-row="4" data-column="3"><rect x="670" y="460" width="200" height="90" fill="#f2f7f8" stroke="#91a8b4"/><text x="682" y="490" font-size="23" fill="#16394d"><tspan x="682" dy="0">C</tspan></text></g><g data-row="4" data-column="4"><rect x="870" y="460" width="200" height="90" fill="#f2f7f8" stroke="#91a8b4"/><text x="882" y="490" font-size="23" fill="#16394d"><tspan x="882" dy="0">2 / 3 / 2</tspan></text></g><g data-row="5" data-column="0"><rect x="30" y="550" width="240" height="90" fill="#ffffff" stroke="#91a8b4"/><text x="42" y="580" font-size="23" fill="#16394d"><tspan x="42" dy="0">ENQUEUE D: wrap</tspan></text></g><g data-row="5" data-column="1"><rect x="270" y="550" width="200" height="90" fill="#ffffff" stroke="#91a8b4"/><text x="282" y="580" font-size="23" fill="#16394d"><tspan x="282" dy="0">D</tspan></text></g><g data-row="5" data-column="2"><rect x="470" y="550" width="200" height="90" fill="#ffffff" stroke="#91a8b4"/><text x="482" y="580" font-size="23" fill="#16394d"><tspan x="482" dy="0">B</tspan></text></g><g data-row="5" data-column="3"><rect x="670" y="550" width="200" height="90" fill="#ffffff" stroke="#91a8b4"/><text x="682" y="580" font-size="23" fill="#16394d"><tspan x="682" dy="0">C</tspan></text></g><g data-row="5" data-column="4"><rect x="870" y="550" width="200" height="90" fill="#ffffff" stroke="#91a8b4"/><text x="882" y="580" font-size="23" fill="#16394d"><tspan x="882" dy="0">2 / 1 / 3</tspan></text></g><text x="30" y="676" fill="#244b65" font-size="22"><tspan x="30" dy="0">This circular queue uses Count to distinguish empty (0) from full (3).</tspan><tspan x="30" dy="28">The logical order is B, C, D even though D is stored at array index 1.</tspan></text></g></svg>