<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="810" viewBox="0 0 1100 810" role="img" aria-labelledby="title desc"><title id="title">A stack removes the most recently added item</title><desc id="desc">Operation: Empty; Index 1: —; Index 2: —; Index 3: —; Top: 0. Operation: PUSH A; Index 1: A; Index 2: —; Index 3: —; Top: 1. Operation: PUSH B; Index 1: A; Index 2: B; Index 3: —; Top: 2. Operation: PUSH C; Index 1: A; Index 2: B; Index 3: C; Top: 3. Operation: POP returns C; Index 1: A; Index 2: B; Index 3: unused; Top: 2. Top identifies the last occupied position; Top = 0 means empty in this 1-based model. A popped value may remain in memory, but its position is outside the active stack.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="54" fill="#15354d" font-size="30" font-weight="700">A stack removes the most recently added item</text><g data-row="0" data-column="0"><rect x="30" y="100" width="240" height="90" fill="#e2edf2" stroke="#91a8b4"/><text x="42" y="130" font-size="23" fill="#16394d"><tspan x="42" dy="0">Operation</tspan></text></g><g data-row="0" data-column="1"><rect x="270" y="100" width="200" height="90" fill="#e2edf2" stroke="#91a8b4"/><text x="282" y="130" font-size="23" fill="#16394d"><tspan x="282" dy="0">Index 1</tspan></text></g><g data-row="0" data-column="2"><rect x="470" y="100" width="200" height="90" fill="#e2edf2" stroke="#91a8b4"/><text x="482" y="130" font-size="23" fill="#16394d"><tspan x="482" dy="0">Index 2</tspan></text></g><g data-row="0" data-column="3"><rect x="670" y="100" width="200" height="90" fill="#e2edf2" stroke="#91a8b4"/><text x="682" y="130" font-size="23" fill="#16394d"><tspan x="682" dy="0">Index 3</tspan></text></g><g data-row="0" data-column="4"><rect x="870" y="100" width="200" height="90" fill="#e2edf2" stroke="#91a8b4"/><text x="882" y="130" font-size="23" fill="#16394d"><tspan x="882" dy="0">Top</tspan></text></g><g data-row="1" data-column="0"><rect x="30" y="190" width="240" height="90" fill="#ffffff" stroke="#91a8b4"/><text x="42" y="220" font-size="23" fill="#16394d"><tspan x="42" dy="0">Empty</tspan></text></g><g data-row="1" data-column="1"><rect x="270" y="190" width="200" height="90" fill="#ffffff" stroke="#91a8b4"/><text x="282" y="220" font-size="23" fill="#16394d"><tspan x="282" dy="0">—</tspan></text></g><g data-row="1" data-column="2"><rect x="470" y="190" width="200" height="90" fill="#ffffff" stroke="#91a8b4"/><text x="482" y="220" font-size="23" fill="#16394d"><tspan x="482" dy="0">—</tspan></text></g><g data-row="1" data-column="3"><rect x="670" y="190" width="200" height="90" fill="#ffffff" stroke="#91a8b4"/><text x="682" y="220" font-size="23" fill="#16394d"><tspan x="682" dy="0">—</tspan></text></g><g data-row="1" data-column="4"><rect x="870" y="190" width="200" height="90" fill="#ffffff" stroke="#91a8b4"/><text x="882" y="220" font-size="23" fill="#16394d"><tspan x="882" dy="0">0</tspan></text></g><g data-row="2" data-column="0"><rect x="30" y="280" width="240" height="90" fill="#f2f7f8" stroke="#91a8b4"/><text x="42" y="310" font-size="23" fill="#16394d"><tspan x="42" dy="0">PUSH A</tspan></text></g><g data-row="2" data-column="1"><rect x="270" y="280" width="200" height="90" fill="#f2f7f8" stroke="#91a8b4"/><text x="282" y="310" font-size="23" fill="#16394d"><tspan x="282" dy="0">A</tspan></text></g><g data-row="2" data-column="2"><rect x="470" y="280" width="200" height="90" fill="#f2f7f8" stroke="#91a8b4"/><text x="482" y="310" font-size="23" fill="#16394d"><tspan x="482" dy="0">—</tspan></text></g><g data-row="2" data-column="3"><rect x="670" y="280" width="200" height="90" fill="#f2f7f8" stroke="#91a8b4"/><text x="682" y="310" font-size="23" fill="#16394d"><tspan x="682" dy="0">—</tspan></text></g><g data-row="2" data-column="4"><rect x="870" y="280" width="200" height="90" fill="#f2f7f8" stroke="#91a8b4"/><text x="882" y="310" font-size="23" fill="#16394d"><tspan x="882" dy="0">1</tspan></text></g><g data-row="3" data-column="0"><rect x="30" y="370" width="240" height="90" fill="#ffffff" stroke="#91a8b4"/><text x="42" y="400" font-size="23" fill="#16394d"><tspan x="42" dy="0">PUSH B</tspan></text></g><g data-row="3" data-column="1"><rect x="270" y="370" width="200" height="90" fill="#ffffff" stroke="#91a8b4"/><text x="282" y="400" font-size="23" fill="#16394d"><tspan x="282" dy="0">A</tspan></text></g><g data-row="3" data-column="2"><rect x="470" y="370" width="200" height="90" fill="#ffffff" stroke="#91a8b4"/><text x="482" y="400" font-size="23" fill="#16394d"><tspan x="482" dy="0">B</tspan></text></g><g data-row="3" data-column="3"><rect x="670" y="370" width="200" height="90" fill="#ffffff" stroke="#91a8b4"/><text x="682" y="400" font-size="23" fill="#16394d"><tspan x="682" dy="0">—</tspan></text></g><g data-row="3" data-column="4"><rect x="870" y="370" width="200" height="90" fill="#ffffff" stroke="#91a8b4"/><text x="882" y="400" font-size="23" fill="#16394d"><tspan x="882" dy="0">2</tspan></text></g><g data-row="4" data-column="0"><rect x="30" y="460" width="240" height="90" fill="#f2f7f8" stroke="#91a8b4"/><text x="42" y="490" font-size="23" fill="#16394d"><tspan x="42" dy="0">PUSH C</tspan></text></g><g data-row="4" data-column="1"><rect x="270" y="460" width="200" height="90" fill="#f2f7f8" stroke="#91a8b4"/><text x="282" y="490" font-size="23" fill="#16394d"><tspan x="282" dy="0">A</tspan></text></g><g data-row="4" data-column="2"><rect x="470" y="460" width="200" height="90" fill="#f2f7f8" stroke="#91a8b4"/><text x="482" y="490" font-size="23" fill="#16394d"><tspan x="482" dy="0">B</tspan></text></g><g data-row="4" data-column="3"><rect x="670" y="460" width="200" height="90" fill="#f2f7f8" stroke="#91a8b4"/><text x="682" y="490" font-size="23" fill="#16394d"><tspan x="682" dy="0">C</tspan></text></g><g data-row="4" data-column="4"><rect x="870" y="460" width="200" height="90" fill="#f2f7f8" stroke="#91a8b4"/><text x="