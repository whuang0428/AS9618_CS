<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="860" viewBox="0 0 1100 860" role="img" aria-labelledby="title desc"><title id="title">One request: accept or reject, then continue</title><desc id="desc">If the request queue is empty, stop processing requests. Otherwise dequeue the earliest request and inspect its seat. An occupied seat is rejected with no occupancy or undo change; append REJECT. An available seat is changed to TRUE, its previous FALSE state is pushed, and ACCEPT is appended. Both branches return to the queue check. A later Undo pops the latest successful change, restores its old value and appends UNDO. All coordinates are valid and capacity is sufficient in this example. Requests use FIFO. Only a successful change enters the undo stack; Undo restores the saved previous state.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#24576d"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="55" text-anchor="start" font-size="30" fill="#16394d"><tspan x="30" dy="0">One request: accept or reject, then continue</tspan></text><rect x="335" y="100" width="430" height="75" rx="10" fill="#eef5f7" stroke="#668494" stroke-width="2"/><text x="355" y="135" text-anchor="start" font-size="24" fill="#16394d"><tspan x="355" dy="0">Any waiting requests?</tspan></text><path d="M765 138 H865" fill="none" stroke="#24576d" stroke-width="3" marker-end="url(#arrow)"/><text x="785" y="123" text-anchor="start" font-size="24" fill="#16394d"><tspan x="785" dy="0">No</tspan></text><rect x="870" y="103" width="180" height="70" rx="10" fill="#eef5f7" stroke="#668494" stroke-width="2"/><text x="890" y="138" text-anchor="start" font-size="24" fill="#16394d"><tspan x="890" dy="0">Finish</tspan></text><path d="M550 175 V215" fill="none" stroke="#24576d" stroke-width="3" marker-end="url(#arrow)"/><text x="570" y="204" text-anchor="start" font-size="24" fill="#16394d"><tspan x="570" dy="0">Yes</tspan></text><rect x="310" y="220" width="480" height="105" rx="10" fill="#eef5f7" stroke="#668494" stroke-width="2"/><text x="330" y="255" text-anchor="start" font-size="24" fill="#16394d"><tspan x="330" dy="0">Dequeue earliest request.</tspan><tspan x="330" dy="31">Inspect Occupied[Row, Seat].</tspan></text><path d="M550 325 V365" fill="none" stroke="#24576d" stroke-width="3" marker-end="url(#arrow)"/><rect x="365" y="370" width="370" height="70" rx="10" fill="#eef5f7" stroke="#668494" stroke-width="2"/><text x="385" y="405" text-anchor="start" font-size="24" fill="#16394d"><tspan x="385" dy="0">Is the seat occupied?</tspan></text><path d="M365 405 H235 V470" fill="none" stroke="#24576d" stroke-width="3" marker-end="url(#arrow)"/><text x="255" y="389" text-anchor="start" font-size="24" fill="#16394d"><tspan x="255" dy="0">Yes</tspan></text><path d="M735 405 H855 V470" fill="none" stroke="#24576d" stroke-width="3" marker-end="url(#arrow)"/><text x="780" y="389" text-anchor="start" font-size="24" fill="#16394d"><tspan x="780" dy="0">No</tspan></text><rect x="55" y="475" width="425" height="145" rx="10" fill="#eef5f7" stroke="#668494" stroke-width="2"/><text x="75" y="510" text-anchor="start" font-size="24" fill="#16394d"><tspan x="75" dy="0">Keep occupancy unchanged.</tspan><tspan x="75" dy="31">Keep undo stack unchanged.</tspan><tspan x="75" dy="31">Append REJECT event.</tspan></text><rect x="595" y="475" width="455" height="145" rx="10" fill="#eef5f7" stroke="#668494" stroke-width="2"/><text x="615" y="510" text-anchor="start" font-size="24" fill="#16394d"><tspan x="615" dy="0">Save old state; set seat TRUE.</tspan><tspan x="615" dy="31">Push the saved undo record.</tspan><tspan x="615" dy="31">Append ACCEPT event.</tspan></text><path d="M235 620 V665 H30 V138 H330" fill="none" stroke="#24576d" stroke-width="3" marker-end="url(#arrow)"/><path d="M855 620 V665 H235" fill="none" stroke="#24576d" stroke-width="3" marker-end="url(#arrow)"/><text x="320" y="698" text-anchor="start" font-size="24" fill="#16394d"><tspan x="320" dy="0">Both branches return to the queue check.</tspan></text><rect x="80" y="735" width="940" height="85" rx="10" fill="#eef5f7" stroke="#668494" stroke-width="2"/><text x="100" y="770" text-anchor="start" font-size="24" fill="#16394d"><tspan x="100" dy="0">Later Undo: pop latest success → restore old state → append UNDO.</tspan></text></g></svg>