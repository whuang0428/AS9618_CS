<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc"><title id="title">Save, close, extend, close, then read back</title><desc id="desc">Initial contents: Old. WRITE session: Ada, empty string, Bo; close. APPEND session: Cy; close. READ session outputs Ada, empty string, Bo, Cy; close; output count 4. Names.txt starts with Old. WRITE replaces it with Ada, a blank line and Bo. After closing, APPEND adds Cy. Close and reopen FOR READ: four lines, including the blank.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#24576d"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="55" text-anchor="start" font-size="30" fill="#16394d"><tspan x="30" dy="0">Save, close, extend, close, then read back</tspan></text><rect x="80" y="100" width="940" height="85" rx="10" fill="#eef5f7" stroke="#668494" stroke-width="2"/><text x="100" y="135" text-anchor="start" font-size="24" fill="#16394d"><tspan x="100" dy="0">Before opening: Names.txt contains one line: Old.</tspan></text><path d="M550 185 V220" fill="none" stroke="#24576d" stroke-width="3" marker-end="url(#arrow)"/><rect x="80" y="225" width="940" height="115" rx="10" fill="#eef5f7" stroke="#668494" stroke-width="2"/><text x="100" y="260" text-anchor="start" font-size="24" fill="#16394d"><tspan x="100" dy="0">WRITE → write Ada, an empty string, then Bo → CLOSE</tspan><tspan x="100" dy="31">Saved lines: Ada | [blank line] | Bo</tspan></text><path d="M550 340 V380" fill="none" stroke="#24576d" stroke-width="3" marker-end="url(#arrow)"/><rect x="80" y="385" width="940" height="115" rx="10" fill="#eef5f7" stroke="#668494" stroke-width="2"/><text x="100" y="420" text-anchor="start" font-size="24" fill="#16394d"><tspan x="100" dy="0">APPEND → write Cy → CLOSE</tspan><tspan x="100" dy="31">Saved lines: Ada | [blank line] | Bo | Cy</tspan></text><path d="M550 500 V540" fill="none" stroke="#24576d" stroke-width="3" marker-end="url(#arrow)"/><rect x="80" y="545" width="940" height="115" rx="10" fill="#eef5f7" stroke="#668494" stroke-width="2"/><text x="100" y="580" text-anchor="start" font-size="24" fill="#16394d"><tspan x="100" dy="0">READ → while NOT EOF: read, display, count → CLOSE</tspan><tspan x="100" dy="31">Outputs: Ada | [blank line] | Bo | Cy | count 4</tspan></text><text x="80" y="710" text-anchor="start" font-size="24" fill="#16394d"><tspan x="80" dy="0">[blank line] labels a zero-character line in this diagram.</tspan><tspan x="80" dy="31">It is not the literal text stored or displayed by the program.</tspan></text></g></svg>