<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="630" viewBox="0 0 1100 630" role="img" aria-labelledby="title desc"><title id="title">One matrix, three kinds of total</title><desc id="desc">Row / column: Row 1; Column 1: 4; Column 2: 7; Column 3: 2; Row total: 13. Row / column: Row 2; Column 1: 8; Column 2: 1; Column 3: 6; Row total: 15. Row / column: Column totals; Column 1: 12; Column 2: 8; Column 3: 8; Row total: Grand: 28. 13 + 15 = 28 and 12 + 8 + 8 = 28: both checks account for the same six values. A row total holds the row fixed; a column total holds the column fixed.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="54" fill="#15354d" font-size="30" font-weight="700">One matrix, three kinds of total</text><g data-row="0" data-column="0"><rect x="30" y="100" width="240" height="90" fill="#e2edf2" stroke="#91a8b4"/><text x="42" y="130" font-size="23" fill="#16394d"><tspan x="42" dy="0">Row / column</tspan></text></g><g data-row="0" data-column="1"><rect x="270" y="100" width="200" height="90" fill="#e2edf2" stroke="#91a8b4"/><text x="282" y="130" font-size="23" fill="#16394d"><tspan x="282" dy="0">Column 1</tspan></text></g><g data-row="0" data-column="2"><rect x="470" y="100" width="200" height="90" fill="#e2edf2" stroke="#91a8b4"/><text x="482" y="130" font-size="23" fill="#16394d"><tspan x="482" dy="0">Column 2</tspan></text></g><g data-row="0" data-column="3"><rect x="670" y="100" width="200" height="90" fill="#e2edf2" stroke="#91a8b4"/><text x="682" y="130" font-size="23" fill="#16394d"><tspan x="682" dy="0">Column 3</tspan></text></g><g data-row="0" data-column="4"><rect x="870" y="100" width="200" height="90" fill="#e2edf2" stroke="#91a8b4"/><text x="882" y="130" font-size="23" fill="#16394d"><tspan x="882" dy="0">Row total</tspan></text></g><g data-row="1" data-column="0"><rect x="30" y="190" width="240" height="90" fill="#ffffff" stroke="#91a8b4"/><text x="42" y="220" font-size="23" fill="#16394d"><tspan x="42" dy="0">Row 1</tspan></text></g><g data-row="1" data-column="1"><rect x="270" y="190" width="200" height="90" fill="#ffffff" stroke="#91a8b4"/><text x="282" y="220" font-size="23" fill="#16394d"><tspan x="282" dy="0">4</tspan></text></g><g data-row="1" data-column="2"><rect x="470" y="190" width="200" height="90" fill="#ffffff" stroke="#91a8b4"/><text x="482" y="220" font-size="23" fill="#16394d"><tspan x="482" dy="0">7</tspan></text></g><g data-row="1" data-column="3"><rect x="670" y="190" width="200" height="90" fill="#ffffff" stroke="#91a8b4"/><text x="682" y="220" font-size="23" fill="#16394d"><tspan x="682" dy="0">2</tspan></text></g><g data-row="1" data-column="4"><rect x="870" y="190" width="200" height="90" fill="#ffffff" stroke="#91a8b4"/><text x="882" y="220" font-size="23" fill="#16394d"><tspan x="882" dy="0">13</tspan></text></g><g data-row="2" data-column="0"><rect x="30" y="280" width="240" height="90" fill="#f2f7f8" stroke="#91a8b4"/><text x="42" y="310" font-size="23" fill="#16394d"><tspan x="42" dy="0">Row 2</tspan></text></g><g data-row="2" data-column="1"><rect x="270" y="280" width="200" height="90" fill="#f2f7f8" stroke="#91a8b4"/><text x="282" y="310" font-size="23" fill="#16394d"><tspan x="282" dy="0">8</tspan></text></g><g data-row="2" data-column="2"><rect x="470" y="280" width="200" height="90" fill="#f2f7f8" stroke="#91a8b4"/><text x="482" y="310" font-size="23" fill="#16394d"><tspan x="482" dy="0">1</tspan></text></g><g data-row="2" data-column="3"><rect x="670" y="280" width="200" height="90" fill="#f2f7f8" stroke="#91a8b4"/><text x="682" y="310" font-size="23" fill="#16394d"><tspan x="682" dy="0">6</tspan></text></g><g data-row="2" data-column="4"><rect x="870" y="280" width="200" height="90" fill="#f2f7f8" stroke="#91a8b4"/><text x="882" y="310" font-size="23" fill="#16394d"><tspan x="882" dy="0">15</tspan></text></g><g data-row="3" data-column="0"><rect x="30" y="370" width="240" height="90" fill="#ffffff" stroke="#91a8b4"/><text x="42" y="400" font-size="23" fill="#16394d"><tspan x="42" dy="0">Column totals</tspan></text></g><g data-row="3" data-column="1"><rect x="270" y="370" width="200" height="90" fill="#ffffff" stroke="#91a8b4"/><text x="282" y="400" font-size="23" fill="#16394d"><tspan x="282" dy="0">12</tspan></text></g><g data-row="3" data-column="2"><rect x="470" y="370" width="200" height="90" fill="#ffffff" stroke="#91a8b4"/><text x="482" y="400" font-size="23" fill="#16394d"><tspan x="482" dy="0">8</tspan></text></g><g data-row="3" data-column="3"><rect x="670" y="370" width="200" height="90" fill="#ffffff" stroke="#91a8b4"/><text x="682" y="400" font-size="23" fill="#16394d"><tspan x="682" dy="0">8</tspan></text></g><g data-row="3" data-column="4"><rect x="870" y="370" width="200" height="90" fill="#ffffff" stroke="#91a8b4"/><text x="882" y="400" font-size="23" fill="#16394d"><tspan x="882" dy="0">Grand: 28</tspan></text></g><text x="30" y="496" fill="#244b65" font-size="22"><tspan x="30" dy="0">13 + 15 = 28 and 12 + 8 + 8 = 28: both checks account for the same six values.</tspan><tspan x="30" dy="28">A row total holds the row fixed; a column total holds the column fixed.</tspan></text></g></svg>