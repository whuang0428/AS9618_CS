<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc"><title id="title">Boundary cases change the head or a null link</title><desc id="desc">Empty insertion: Head 0 becomes Head 3, with Data[3] X and Next[3] 0. Head insertion: the old chain 2(A),4(B),1(C) gains node 3(X) before 2. Only-node deletion: Head 3 and Next[3] 0 become Head 0; release slot 3. Each row is a separate case; null link = 0. Numbered boxes are physical array slots. Head insertion links the new node to the old head. Deleting the only node leaves Head = 0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#24576d"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="55" text-anchor="start" font-size="30" fill="#16394d"><tspan x="30" dy="0">Boundary cases change the head or a null link</tspan></text><text x="50" y="110" text-anchor="start" font-size="26" fill="#16394d"><tspan x="50" dy="0">1. Insert into empty list: Head 0 → 3</tspan></text><rect x="50" y="140" width="190" height="70" rx="10" fill="#eef5f7" stroke="#668494" stroke-width="2"/><text x="70" y="175" text-anchor="start" font-size="24" fill="#16394d"><tspan x="70" dy="0">Head = 3</tspan></text><path d="M240 175 H300" fill="none" stroke="#24576d" stroke-width="3" marker-end="url(#arrow)"/><rect x="305" y="140" width="230" height="70" rx="10" fill="#eef5f7" stroke="#668494" stroke-width="2"/><text x="325" y="175" text-anchor="start" font-size="24" fill="#16394d"><tspan x="325" dy="0">3: X | Next 0</tspan></text><path d="M535 175 H600" fill="none" stroke="#24576d" stroke-width="3" marker-end="url(#arrow)"/><rect x="605" y="140" width="130" height="70" rx="10" fill="#eef5f7" stroke="#668494" stroke-width="2"/><text x="625" y="175" text-anchor="start" font-size="24" fill="#16394d"><tspan x="625" dy="0">0 / null</tspan></text><text x="50" y="265" text-anchor="start" font-size="26" fill="#16394d"><tspan x="50" dy="0">2. Insert X at head of 2(A) → 4(B) → 1(C) → 0</tspan></text><rect x="50" y="295" width="195" height="70" rx="10" fill="#eef5f7" stroke="#668494" stroke-width="2"/><text x="70" y="330" text-anchor="start" font-size="24" fill="#16394d"><tspan x="70" dy="0">Head = 3</tspan></text><path d="M245 330 H280" fill="none" stroke="#24576d" stroke-width="3" marker-end="url(#arrow)"/><rect x="285" y="295" width="135" height="70" rx="10" fill="#eef5f7" stroke="#668494" stroke-width="2"/><text x="305" y="330" text-anchor="start" font-size="24" fill="#16394d"><tspan x="305" dy="0">3: X</tspan></text><path d="M420 330 H455" fill="none" stroke="#24576d" stroke-width="3" marker-end="url(#arrow)"/><rect x="460" y="295" width="135" height="70" rx="10" fill="#eef5f7" stroke="#668494" stroke-width="2"/><text x="480" y="330" text-anchor="start" font-size="24" fill="#16394d"><tspan x="480" dy="0">2: A</tspan></text><path d="M595 330 H630" fill="none" stroke="#24576d" stroke-width="3" marker-end="url(#arrow)"/><rect x="635" y="295" width="135" height="70" rx="10" fill="#eef5f7" stroke="#668494" stroke-width="2"/><text x="655" y="330" text-anchor="start" font-size="24" fill="#16394d"><tspan x="655" dy="0">4: B</tspan></text><path d="M770 330 H805" fill="none" stroke="#24576d" stroke-width="3" marker-end="url(#arrow)"/><rect x="810" y="295" width="135" height="70" rx="10" fill="#eef5f7" stroke="#668494" stroke-width="2"/><text x="830" y="330" text-anchor="start" font-size="24" fill="#16394d"><tspan x="830" dy="0">1: C</tspan></text><path d="M945 330 H985" fill="none" stroke="#24576d" stroke-width="3" marker-end="url(#arrow)"/><text x="1000" y="339" text-anchor="start" font-size="24" fill="#16394d"><tspan x="1000" dy="0">0</tspan></text><text x="50" y="420" text-anchor="start" font-size="26" fill="#16394d"><tspan x="50" dy="0">3. Delete the only node: Head 3 → 0; release slot 3</tspan></text><rect x="50" y="450" width="195" height="70" rx="10" fill="#eef5f7" stroke="#668494" stroke-width="2"/><text x="70" y="485" text-anchor="start" font-size="24" fill="#16394d"><tspan x="70" dy="0">Head = 0</tspan></text><path d="M245 485 H300" fill="none" stroke="#24576d" stroke-width="3" marker-end="url(#arrow)"/><rect x="305" y="450" width="130" height="70" rx="10" fill="#eef5f7" stroke="#668494" stroke-width="2"/><text x="325" y="485" text-anchor="start" font-size="24" fill="#16394d"><tspan x="325" dy="0">0 / null</tspan></text><rect x="530" y="450" width="480" height="70" rx="10" fill="#eef5f7" stroke="#668494" stroke-width="2"/><text x="550" y="485" text-anchor="start" font-size="24" fill="#16394d"><tspan x="550" dy="0">Slot 3 is now available for reuse.</tspan></text></g></svg>