<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540" role="img" aria-labelledby="title desc"><title id="title">Rows are horizontal; columns are vertical</title><desc id="desc">Row / column: Row 1; Column 1: 4 · visit 1; Column 2: 7 · visit 2; Column 3: 2 · visit 3. Row / column: Row 2; Column 1: 8 · visit 4; Column 2: 1 · visit 5; Column 3: 6 · visit 6. Scores[2, 3] = 6. Each element uses a row index and a column index. Ascending nested loops visit (1,1), (1,2), (1,3), then (2,1), (2,2), (2,3).</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="54" fill="#15354d" font-size="30" font-weight="700">Rows are horizontal; columns are vertical</text><g data-row="0" data-column="0"><rect x="30" y="100" width="240" height="90" fill="#e2edf2" stroke="#91a8b4"/><text x="42" y="130" font-size="23" fill="#16394d"><tspan x="42" dy="0">Row / column</tspan></text></g><g data-row="0" data-column="1"><rect x="270" y="100" width="266.6666666666667" height="90" fill="#e2edf2" stroke="#91a8b4"/><text x="282" y="130" font-size="23" fill="#16394d"><tspan x="282" dy="0">Column 1</tspan></text></g><g data-row="0" data-column="2"><rect x="536.6666666666667" y="100" width="266.6666666666667" height="90" fill="#e2edf2" stroke="#91a8b4"/><text x="548.6666666666667" y="130" font-size="23" fill="#16394d"><tspan x="548.6666666666667" dy="0">Column 2</tspan></text></g><g data-row="0" data-column="3"><rect x="803.3333333333334" y="100" width="266.6666666666667" height="90" fill="#e2edf2" stroke="#91a8b4"/><text x="815.3333333333334" y="130" font-size="23" fill="#16394d"><tspan x="815.3333333333334" dy="0">Column 3</tspan></text></g><g data-row="1" data-column="0"><rect x="30" y="190" width="240" height="90" fill="#ffffff" stroke="#91a8b4"/><text x="42" y="220" font-size="23" fill="#16394d"><tspan x="42" dy="0">Row 1</tspan></text></g><g data-row="1" data-column="1"><rect x="270" y="190" width="266.666