<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc"><title id="title">Follow links, not consecutive array positions</title><desc id="desc">Array index: 1; Data: C; Next: 0; Reachability: Last active node. Array index: 2; Data: A; Next: 4; Reachability: Head = 2. Array index: 3; Data: unused; Next: 0; Reachability: Free slot. Array index: 4; Data: B; Next: 1; Reachability: Second active node. Head = 2 and null link = 0. Traversal follows 2 → 4 → 1 → 0, producing A, B, C. Inserting X at slot 3 after A sets Next[3] = 4, then Next[2] = 3.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="54" fill="#15354d" font-size="30" font-weight="700">Follow links, not consecutive array positions</text><g data-row="0" data-column="0"><rect x="30" y="100" width="240" height="90" fill="#e2edf2" stroke="#91a8b4"/><text x="42" y="130" font-size="23" fill="#16394d"><tspan x="42" dy="0">Array index</tspan></text></g><g data-row="0" data-column="1"><rect x="270" y="100" width="266.6666666666667" height="90" fill="#e2edf2" stroke="#91a8b4"/><text x="282" y="130" font-size="23" fill="#16394d"><tspan x="282" dy="0">Data</tspan></text></g><g data-row="0" data-column="2"><rect x="536.6666666666667" y="100" width="266.6666666666667" height="90" fill="#e2edf2" stroke="#91a8b4"/><text x="548.6666666666667" y="130" font-size="23" fill="#16394d"><tspan x="548.6666666666667" dy="0">Next</tspan></text></g><g data-row="0" data-column="3"><rect x="803.3333333333334" y="100" width="266.6666666666667" height="90" fill="#e2edf2" stroke="#91a8b4"/><text x="815.3333333333334" y="130" font-size="23" fill="#16394d"><tspan x="815.3333333333334" dy="0">Reachability</tspan></text></g><g data-row="1" data-column="0"><rect x="30" y="190" width="240" height="90" fill="#ffffff" stroke="#91a8b4"/><text x="42" y="220" font-size="23" fill="#16394d"><tspan x="42" dy="0">1</tspan></text></g><g data-row="1" data-column="1"><rect x="270" y="190" width="266.6666666666667" height="90" fill="#ffffff" stroke="#91a8b4"/><text x="282" y="220" font-size="23" fill="#16394d"><tspan x="282" dy="0">C</tspan></text></g><g data-row="1" data-column="2"><rect x="536.6666666666667" y="190" width="266.6666666666667" height="90" fill="#ffffff" stroke="#91a8b4"/><text x="548.6666666666667" y="220" font-size="23" fill="#16394d"><tspan x="548.6666666666667" dy="0">0</tspan></text></g><g data-row="1" data-column="3"><rect x="803.3333333333334" y="190" width="266.6666666666667" height="90" fill="#ffffff" stroke="#91a8b4"/><text x="815.3333333333334" y="220" font-size="23" fill="#16394d"><tspan x="815.3333333333334" dy="0">Last active node</tspan></text></g><g data-row="2" data-column="0"><rect x="30" y="280" width="240" height="90" fill="#f2f7f8" stroke="#91a8b4"/><text x="42" y="310" font-size="23" fill="#16394d"><tspan x="42" dy="0">2</tspan></text></g><g data-row="2" data-column="1"><rect x="270" y="280" width="266.6666666666667" height="90" fill="#f2f7f8" stroke="#91a8b4"/><text x="282" y="310" font-size="23" fill="#16394d"><tspan x="282" dy="0">A</tspan></text></g><g data-row="2" data-column="2"><rect x="536.6666666666667" y="280" width="266.6666666666667" height="90" fill="#f2f7f8" stroke="#91a8b4"/><text x="548.6666666666667" y="310" font-size="23" fill="#16394d"><tspan x="548.6666666666667" dy="0">4</tspan></text></g><g data-row="2" data-column="3"><rect x="803.3333333333334" y="280" width="266.6666666666667" height="90" fill="#f2f7f8" stroke="#91a8b4"/><text x="815.3333333333334" y="310" font-size="23" fill="#16394d"><tspan x="815.3333333333334" dy="0">Head = 2</tspan></text></g><g data-row="3" data-column="0"><rect x="30" y="370" width="240" height="90" fill="#ffffff" stroke="#91a8b4"/><text x="42" y="400" font-size="23" fill="#16394d"><tspan x="42" dy="0">3</tspan></text></g><g data-row="3" data-column="1"><rect x="270" y="370" width="266.6666666666667" height="90" fill="#ffffff" stroke="#91a8b4"/><text x="282" y="400" font-size="23" fill="#16394d"><tspan x="282" dy="0">unused</tspan></text></g><g data-row="3" data-column="2"><rect x="536.6666666666667" y="370" width="266.6666666666667" height="90" fill="#ffffff" stroke="#91a8b4"/><text x="548.6666666666667" y="400" font-size="23" fill="#16394d"><tspan x="548.6666666666667" dy="0">0</tspan></text></g><g data-row="3" data-column="3"><rect x="803.3333333333334" y="370" width="266.6666666666667" height="90" fill="#ffffff" stroke="#91a8b4"/><text x="815.3333333333334" y="400" font-size="23" fill="#16394d"><tspan x="815.3333333333334" dy="0">Free slot</tspan></text></g><g data-row="4" data-column="0"><rect x="30" y="460" width="240" height="90" fill="#f2f7f8" stroke="#91a8b4"/><text x="42" y="490" font-size="23" fill="#16394d"><tspan x="42" dy="0">4</tspan></text></g><g data-row="4" data-column="1"><rect x="270" y="460" width="266.6666666666667" height="90" fill="#f2f7f8" stroke="#91a8b4"/><text x="282" y="490" font-size="23" fill="#16394d"><tspan x="282" dy="0">B</tspan></text></g><g data-row="4" data-column="2"><rect x="536.6666666666667" y="460" width="266.6666666666667" height="90" fill="#f2f7f8" stroke="#91a8b4"/><text x="548.6666666666667" y="490" font-size="23" fill="#16394d"><tspan x="548.6666666666667" dy="0">1</tspan></text></g><g data-row="4" data-column="3"><rect x="803.3333333333334" y="460" width="266.6666666666667" height="90" fill="#f2f7f8" stroke="#91a8b4"/><text x="815.3333333333334" y="490" font-size="23" fill="#16394d"><tspan x="815.3333333333334" dy="0">Second active node</tspan></text></g><text x="30" y="586" fill="#244b65" font-size="22"><tspan x="30" dy="0">Head = 2 and null link = 0. Traversal follows 2 → 4 → 1 → 0, producing A, B, C.</tspan><tspan x="30" dy="28">Inserting X at slot 3 after A sets Next[3] = 4, then Next[2] = 3.</tspan></text></g></svg>