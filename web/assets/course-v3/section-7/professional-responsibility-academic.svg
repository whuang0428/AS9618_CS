<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
<title id="title">Professional knowledge and responsibility</title>
<desc id="description">Specialist knowledge lets a professional identify a hidden fault. An honest explanation gives the customer evidence for an informed decision. A code of conduct, peer guidance and continuing professional development support the professional’s judgement; they do not replace personal responsibility or product testing.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9" fill="none" stroke="#24485d" stroke-width="1.5"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif}path,line,rect{vector-effect:non-scaling-stroke}</style>
<rect width="1440" height="900" fill="white"/>
<text x="70" y="70" font-size="38" font-weight="600" fill="#20272d" text-anchor="start">Professional knowledge and responsibility</text>
<line x1="70" y1="135" x2="1370" y2="135" stroke="#b8c1c7" stroke-width="1.6"/>
<text x="70" y="111" font-size="28" font-weight="400" fill="#535d66" text-anchor="start">Responsibility follows from the effects of specialist decisions on other people.</text><rect x="70" y="225" width="390" height="210" fill="white" stroke="#b8c1c7" stroke-width="1.8"/><text x="95" y="272" font-size="30" font-weight="600" fill="#20272d" text-anchor="start">Specialist knowledge</text><text x="95" y="327" font-size="28" font-weight="400" fill="#20272d" text-anchor="start">Identify a hidden fault</text><text x="95" y="366" font-size="28" font-weight="400" fill="#20272d" text-anchor="start">that the customer cannot</text><text x="95" y="405" font-size="28" font-weight="400" fill="#20272d" text-anchor="start">independently assess.</text><rect x="525" y="225" width="390" height="210" fill="white" stroke="#b8c1c7" stroke-width="1.8"/><text x="550" y="272" font-size="30" font-weight="600" fill="#20272d" text-anchor="start">Professional duty</text><text x="550" y="327" font-size="28" font-weight="400" fill="#20272d" text-anchor="start">Disclose the evidence.</text><text x="550" y="366" font-size="28" font-weight="400" fill="#20272d" text-anchor="start">Explain the likely risk</text><text x="550" y="405" font-size="28" font-weight="400" fill="#20272d" text-anchor="start">and its limits.</text><rect x="980" y="225" width="390" height="210" fill="white" stroke="#b8c1c7" stroke-width="1.8"/><text x="1005" y="272" font-size="30" font-weight="600" fill="#20272d" text-anchor="start">Informed decision</text><text x="1005" y="327" font-size="28" font-weight="400" fill="#20272d" text-anchor="start">The customer can decide</text><text x="1005" y="366" font-size="28" font-weight="400" fill="#20272d" text-anchor="start">how to use, postpone or</text><text x="1005" y="405" font-size="28" font-weight="400" fill="#20272d" text-anchor="start">reject the system.</text><path data-from="specialist-knowledge" data-to="professional-duty" d="M460 330H515" fill="none" stroke="#24485d" stroke-width="2.2" marker-end="url(#arrow)"/><path data-from="professional-duty" data-to="informed-decision" d="M915 330H970" fill="none" stroke="#24485d" stroke-width="2.2" marker-end="url(#arrow)"/><path data-from="professional-support" data-to="professional-duty" d="M720 592V449" fill="none" stroke="#24485d" stroke-width="2.2" marker-end="url(#arrow)"/><text x="752" y="511" font-size="27" font-weight="400" fill="#535d66" text-anchor="start">supports judgement</text><line x1="265" y1="592" x2="1175" y2="592" stroke="#24485d" stroke-width="2"/><line x1="265" y1="592" x2="265" y2="623" stroke="#24485d" stroke-width="2"/><line x1="720" y1="592" x2="720" y2="623" stroke="#24485d" stroke-width="2"/><line x1="1175" y1="592" x2="1175" y2="623" stroke="#24485d" stroke-width="2"/><text x="70" y="549" font-size="28" font-weight="600" fill="#20272d" text-anchor="start">Professional-body support</text><text x="70" y="665" font-size="30" font-weight="600" fill="#20272d" text-anchor="start">Code of conduct</text><text x="70" y="711" font-size="28" font-weight="400" fill="#20272d" text-anchor="start">States expected conduct</text><text x="70" y="750" font-size="28" font-weight="400" fill="#20272d" text-anchor="start">and supports accountability.</text><text x="525" y="665" font-size="30" font-weight="600" fill="#20272d" text-anchor="start">Peer guidance</text><text x="525" y="711" font-size="28" font-weight="400" fill="#20272d" text-anchor="start">Offers advice when applying</text><text x="525" y="750" font-size="28" font-weight="400" fill="#20272d" text-anchor="start">standards to a difficult case.</text><text x="980" y="665" font-size="29" font-weight="600" fill="#20272d" text-anchor="start">Continuing development</text><text x="980" y="711" font-size="28" font-weight="400" fill="#20272d" text-anchor="start">Maintains relevant knowledge</text><text x="980" y="750" font-size="28" font-weight="400" fill="#20272d" text-anchor="start">and professional competence.</text><line x1="70" y1="805" x2="1370" y2="805" stroke="#b8c1c7" stroke-width="1.6"/><text x="70" y="851" font-size="29" font-weight="400" fill="#20272d" text-anchor="start">Professional support does not replace personal responsibility or product testing.</text>
</svg>