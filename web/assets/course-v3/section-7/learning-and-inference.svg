<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="690" viewBox="0 0 1120 690" role="img"><title>Data-driven AI: learning and later inference</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#14747b"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#142b45}</style><rect width="1120" height="690" fill="white"/><text x="30" y="48" font-size="30">Data-driven AI: learning and later inference</text><text x="30" y="100" font-size="22">1 · LEARNING AND CHECKING</text><rect x="30" y="130" width="310" height="140" rx="9" fill="#edf6f8" stroke="#4c7185" stroke-width="2"/><text x="48" y="166" font-size="26">Past examples</text><text x="48" y="204" font-size="24">Measurements +</text><text x="48" y="236" font-size="24">known outcomes</text><path data-from="past-examples" data-to="learning" d="M340 200H405" fill="none" stroke="#14747b" stroke-width="3" marker-end="url(#arrow)"/><rect x="405" y="130" width="310" height="140" rx="9" fill="#edf6f8" stroke="#4c7185" stroke-width="2"/><text x="423" y="166" font-size="26">Learning procedure</text><text x="423" y="204" font-size="24">Adjust a model to</text><text x="423" y="236" font-size="24">patterns in examples</text><path data-from="learning" data-to="model" d="M715 200H780" fill="none" stroke="#14747b" stroke-width="3" marker-end="url(#arrow)"/><rect x="780" y="130" width="310" height="140" rx="9" fill="#edf6f8" stroke="#4c7185" stroke-width="2"/><text x="798" y="166" font-size="26">Resulting model</text><text x="798" y="204" font-size="24">Test on separate</text><text x="798" y="236" font-size="24">known-outcome cases</text><text x="30" y="334" font-size="22">2 · USING THE MODEL ON A NEW CASE</text><rect x="30" y="375" width="310" height="140" rx="9" fill="#edf6f8" stroke="#4c7185" stroke-width="2"/><text x="48" y="411" font-size="26">New measurements</text><text x="48" y="449" font-size="24">Vibration + temperature</text><text x="48" y="481" font-size="24">Future fault unknown</text><path data-from="new-input" data-to="inference" d="M340 445H405" fill="none" stroke="#14747b" stroke-width="3" marker-end="url(#arrow)"/><rect x="405" y="375" width="310" height="140" rx="9" fill="#edf6f8" stroke="#4c7185" stroke-width="2"/><text x="423" y="411" font-size="26">Inference</text><text x="423" y="449" font-size="24">Apply the model</text><text x="423" y="481" font-size="24">Estimate fault risk</text><path data-from="model" data-to="inference" d="M935 270V350H560V375" fill="none" stroke="#14747b" stroke-width="3" marker-end="url(#arrow)"/><path data-from="inference" data-to="human-decision" d="M715 445H780" fill="none" stroke="#14747b" stroke-width="3" marker-end="url(#arrow)"/><rect x="780" y="375" width="310" height="140" rx="9" fill="#edf6f8" stroke="#4c7185" stroke-width="2"/><text x="798" y="411" font-size="26">Use the output</text><text x="798" y="449" font-size="24">Technician inspects</text><text x="798" y="481" font-size="24">and plans maintenance</text><text x="30" y="579" font-size="23">A new prediction can be wrong. Test and monitor the system in its intended setting.</text><text x="30" y="628" font-size="23">Scope: one data-driven approach; rule-based AI can use expert-written knowledge.</text></svg>