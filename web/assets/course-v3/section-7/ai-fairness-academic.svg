<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
<title id="title">An overall score can conceal unequal performance</title>
<desc id="description">Illustrative speech-to-text data: group A has 90 correct captions in 90 tests, an accuracy of 100 per cent. Group B has 5 correct captions in 10 tests, an accuracy of 50 per cent. Together there are 95 correct captions out of 100 tests, an overall accuracy of 95 per cent. Group A supplies 90 per cent of the tests, so the combined score is weighted towards its result. The difference is system performance for the tested groups and does not establish differences in the ability or value of users.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9" fill="none" stroke="#24485d" stroke-width="1.5"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif}path,line,rect{vector-effect:non-scaling-stroke}</style>
<rect width="1440" height="900" fill="white"/>
<text x="70" y="70" font-size="38" font-weight="600" fill="#20272d" text-anchor="start">An overall score can conceal unequal performance</text>
<line x1="70" y1="135" x2="1370" y2="135" stroke="#b8c1c7" stroke-width="1.6"/>
<text x="70" y="111" font-size="28" font-weight="400" fill="#535d66" text-anchor="start">Illustrative data · Two user groups tested with the same speech-to-text system</text><text x="330" y="204" font-size="29" font-weight="600" fill="#20272d" text-anchor="start">Correct captions (%)</text><line x1="330" y1="237" x2="330" y2="501" stroke="#d8dee2" stroke-width="1"/><text x="330" y="547" font-size="27" font-weight="400" fill="#535d66" text-anchor="middle">0</text><line x1="540" y1="237" x2="540" y2="501" stroke="#d8dee2" stroke-width="1"/><text x="540" y="547" font-size="27" font-weight="400" fill="#535d66" text-anchor="middle">25</text><line x1="750" y1="237" x2="750" y2="501" stroke="#d8dee2" stroke-width="1"/><text x="750" y="547" font-size="27" font-weight="400" fill="#535d66" text-anchor="middle">50</text><line x1="960" y1="237" x2="960" y2="501" stroke="#d8dee2" stroke-width="1"/><text x="960" y="547" font-size="27" font-weight="400" fill="#535d66" text-anchor="middle">75</text><line x1="1170" y1="237" x2="1170" y2="501" stroke="#d8dee2" stroke-width="1"/><text x="1170" y="547" font-size="27" font-weight="400" fill="#535d66" text-anchor="middle">100</text><line x1="330" y1="501" x2="1170" y2="501" stroke="#535d66" stroke-width="1.8"/><text x="70" y="312" font-size="30" font-weight="600" fill="#20272d" text-anchor="start">Group A</text><text x="70" y="354" font-size="28" font-weight="400" fill="#535d66" text-anchor="start">90 / 90 correct</text><rect x="330" y="276" width="840" height="60" fill="#24485d"/><text x="1192" y="317" font-size="31" font-weight="600" fill="#20272d" text-anchor="start">100%</text><text x="70" y="442" font-size="30" font-weight="600" fill="#20272d" text-anchor="start">Group B</text><text x="70" y="484" font-size="28" font-weight="400" fill="#535d66" text-anchor="start">5 / 10 correct</text><rect x="330" y="406" width="420" height="60" fill="#24485d"/><text x="772" y="447" font-size="31" font-weight="600" fill="#20272d" text-anchor="start">50%</text><line x1="70" y1="594" x2="1370" y2="594" stroke="#b8c1c7" stroke-width="1.6"/><text x="70" y="647" font-size="30" font-weight="600" fill="#20272d" text-anchor="start">Overall accuracy</text><text x="440" y="647" font-size="33" font-weight="600" fill="#20272d" text-anchor="start">(90 + 5) / (90 + 10) = 95%</text><text x="70" y="708" font-size="29" font-weight="400" fill="#20272d" text-anchor="start">Test composition</text><text x="440" y="708" font-size="28" font-weight="400" fill="#20272d" text-anchor="start">The larger group contributes more to the overall score.</text><rect x="440" y="738" width="756" height="32" fill="#24485d"/><rect x="1196" y="738" width="84" height="32" fill="#537d7a"/><text x="440" y="810" font-size="27" font-weight="400" fill="#535d66" text-anchor="start">Group A: 90 of 100 tests</text><text x="1280" y="810" font-size="27" font-weight="400" fill="#535d66" text-anchor="end">Group B: 10</text><text x="70" y="871" font-size="28" font-weight="400" fill="#20272d" text-anchor="start">Report group results and test conditions; the overall score hides this gap.</text>
</svg>