<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
<title id="title">Compare the consequences of alternative actions</title>
<desc id="description">The shared fault is a route incorrectly labelled wheelchair-accessible even though it includes steps. In one branch the developer reports the fault and the operator corrects the information, so travellers can avoid the steps although launch may be delayed. In the alternative branch the developer conceals the fault and publishes the route, leaving inaccurate information that may lead travellers to steps and create a need for assistance. Each branch has its own consequences; neither branch causes the other.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9" fill="none" stroke="#24485d" stroke-width="1.5"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif}path,line,rect{vector-effect:non-scaling-stroke}</style>
<rect width="1440" height="900" fill="white"/>
<text x="70" y="70" font-size="38" font-weight="600" fill="#20272d" text-anchor="start">Compare the consequences of alternative actions</text>
<line x1="70" y1="135" x2="1370" y2="135" stroke="#b8c1c7" stroke-width="1.6"/>
<text x="70" y="111" font-size="28" font-weight="400" fill="#535d66" text-anchor="start">Shared evidence, separate courses of action, consequences for named people.</text><rect x="350" y="167" width="740" height="105" fill="white" stroke="#b8c1c7" stroke-width="1.8"/><text x="720" y="208" font-size="31" font-weight="600" fill="#20272d" text-anchor="middle">Known accessibility fault</text><text x="720" y="248" font-size="29" font-weight="400" fill="#20272d" text-anchor="middle">A route labelled accessible includes steps.</text><path data-from="known-fault" data-to="report-and-correct" d="M720 272V306H375V342" fill="none" stroke="#24485d" stroke-width="2.2" marker-end="url(#arrow)"/><path data-from="known-fault" data-to="conceal-and-publish" d="M720 272V306H1065V342" fill="none" stroke="#24485d" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="70" y="351" width="610" height="99" fill="white" stroke="#b8c1c7" stroke-width="1.8"/><text x="97" y="392" font-size="31" font-weight="600" fill="#20272d" text-anchor="start">Report and correct</text><text x="97" y="431" font-size="29" font-weight="400" fill="#20272d" text-anchor="start">Developer discloses the fault.</text><rect x="760" y="351" width="610" height="99" fill="white" stroke="#b8c1c7" stroke-width="1.8"/><text x="787" y="392" font-size="31" font-weight="600" fill="#20272d" text-anchor="start">Conceal and publish</text><text x="787" y="431" font-size="29" font-weight="400" fill="#20272d" text-anchor="start">Developer withholds the fault report.</text><path data-from="report-and-correct" data-to="corrected-information" d="M375 450V495" fill="none" stroke="#24485d" stroke-width="2.2" marker-end="url(#arrow)"/><path data-from="conceal-and-publish" data-to="incorrect-information" d="M1065 450V495" fill="none" stroke="#24485d" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="70" y="504" width="610" height="103" fill="white" stroke="#b8c1c7" stroke-width="1.8"/><text x="97" y="547" font-size="28" font-weight="400" fill="#20272d" text-anchor="start">Operator corrects the route information</text><text x="97" y="586" font-size="28" font-weight="400" fill="#20272d" text-anchor="start">before releasing the service.</text><rect x="760" y="504" width="610" height="103" fill="white" stroke="#b8c1c7" stroke-width="1.8"/><text x="787" y="547" font-size="28" font-weight="400" fill="#20272d" text-anchor="start">The incorrect accessibility label</text><text x="787" y="586" font-size="28" font-weight="400" fill="#20272d" text-anchor="start">remains available to users.</text><path data-from="corrected-information" data-to="report-consequences" d="M375 607V651" fill="none" stroke="#24485d" stroke-width="2.2" marker-end="url(#arrow)"/><path data-from="incorrect-information" data-to="conceal-consequences" d="M1065 607V651" fill="none" stroke="#24485d" stroke-width="2.2" marker-end="url(#arrow)"/><text x="97" y="697" font-size="29" font-weight="600" fill="#20272d" text-anchor="start">Travellers can avoid the steps.</text><text x="97" y="740" font-size="28" font-weight="400" fill="#20272d" text-anchor="start">The operator’s launch may be delayed.</text><text x="787" y="697" font-size="29" font-weight="600" fill="#20272d" text-anchor="start">Travellers may reach the steps.</text><text x="787" y="740" font-size="28" font-weight="400" fill="#20272d" text-anchor="start">Assistance and complaints may follow.</text><line x1="70" y1="805" x2="1370" y2="805" stroke="#b8c1c7" stroke-width="1.6"/><text x="70" y="851" font-size="29" font-weight="400" fill="#20272d" text-anchor="start">For each branch, explain how the action changes the situation for a stakeholder.</text>
</svg>