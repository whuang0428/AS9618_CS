<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="865" viewBox="0 0 1120 865" role="img"><title>Follow the information from a label to spoken words</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#14747b"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#142b45}</style><rect width="1120" height="865" fill="white"/><text x="30" y="48" font-size="30">Follow the information from a label to spoken words</text><text x="30" y="100" font-size="23">ILLUSTRATIVE INPUT: a clear French label reading Sortie; output language: English</text><rect x="30" y="140" width="310" height="155" rx="9" fill="#edf6f8" stroke="#4c7185" stroke-width="2"/><text x="48" y="176" font-size="26">1 · Camera image</text><text x="48" y="214" font-size="24">Pixels showing Sortie</text><text x="48" y="246" font-size="24">No text recognised yet</text><path data-from="image" data-to="ocr" d="M340 218H405" fill="none" stroke="#14747b" stroke-width="3" marker-end="url(#arrow)"/><rect x="405" y="140" width="310" height="155" rx="9" fill="#edf6f8" stroke="#4c7185" stroke-width="2"/><text x="423" y="176" font-size="26">2 · OCR</text><text x="423" y="214" font-size="24">Locate character shapes</text><text x="423" y="246" font-size="24">Produce text: Sortie</text><path data-from="ocr" data-to="language" d="M715 218H780" fill="none" stroke="#14747b" stroke-width="3" marker-end="url(#arrow)"/><rect x="780" y="140" width="310" height="155" rx="9" fill="#edf6f8" stroke="#4c7185" stroke-width="2"/><text x="798" y="176" font-size="26">3 · Language processing</text><text x="798" y="214" font-size="24">Interpret the word</text><text x="798" y="246" font-size="24">using language/context</text><path data-from="language" data-to="translation" d="M935 295V385" fill="none" stroke="#14747b" stroke-width="3" marker-end="url(#arrow)"/><rect x="780" y="385" width="310" height="155" rx="9" fill="#edf6f8" stroke="#4c7185" stroke-width="2"/><text x="798" y="421" font-size="26">4 · Translation</text><text x="798" y="459" font-size="24">French → English</text><text x="798" y="491" font-size="24">Target text: Exit</text><path data-from="translation" data-to="tts" d="M780 463H715" fill="none" stroke="#14747b" stroke-width="3" marker-end="url(#arrow)"/><rect x="405" y="385" width="310" height="155" rx="9" fill="#edf6f8" stroke="#4c7185" stroke-width="2"/><text x="423" y="421" font-size="26">5 · Text-to-speech</text><text x="423" y="459" font-size="24">Text Exit → waveform</text><text x="423" y="491" font-size="24">Represent spoken words</text><path data-from="tts" data-to="speaker" d="M405 463H340" fill="none" stroke="#14747b" stroke-width="3" marker-end="url(#arrow)"/><rect x="30" y="385" width="310" height="155" rx="9" fill="#edf6f8" stroke="#4c7185" stroke-width="2"/><text x="48" y="421" font-size="26">6 · Speaker / user</text><text x="48" y="459" font-size="24">Waveform → sound</text><text x="48" y="491" font-size="24">The user hears Exit</text><rect x="30" y="610" width="1060" height="140" rx="9" fill="#edf6f8" stroke="#4c7185" stroke-width="2"/><text x="48" y="646" font-size="26">Check an uncertain result before use</text><text x="48" y="684" font-size="24">Blurred image → wrong recognised word → wrong translation → wrong spoken message.</text><text x="48" y="716" font-size="24">Retake the image or verify the text; fluent speech does not prove correct recognition.</text><text x="30" y="811" font-size="23">Conceptual flow: stages may be combined in a product. Text-to-speech is not speech-to-text.</text></svg>