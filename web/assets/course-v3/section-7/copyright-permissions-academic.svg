<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
<title id="title">Copyright ownership and licence permissions</title>
<desc id="description">A copyright holder grants permissions through a licence. Separate licence branches lead to running, modifying and redistributing the software, each only if the terms permit that activity. Conditions may continue to apply to copies. Publishing source does not itself remove copyright or authorise every activity.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9" fill="none" stroke="#24485d" stroke-width="1.5"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif}path,line,rect{vector-effect:non-scaling-stroke}</style>
<rect width="1440" height="900" fill="white"/>
<text x="70" y="70" font-size="38" font-weight="600" fill="#20272d" text-anchor="start">Copyright ownership and licence permissions</text>
<line x1="70" y1="135" x2="1370" y2="135" stroke="#b8c1c7" stroke-width="1.6"/>
<text x="70" y="111" font-size="28" font-weight="400" fill="#535d66" text-anchor="start">Ownership of copyright and permission to perform an activity are different.</text><rect x="490" y="171" width="460" height="88" fill="white" stroke="#b8c1c7" stroke-width="1.8"/><text x="720" y="225" font-size="31" font-weight="600" fill="#20272d" text-anchor="middle">Copyright holder</text><path data-from="copyright-holder" data-to="licence" d="M720 259V339" fill="none" stroke="#24485d" stroke-width="2.2" marker-end="url(#arrow)"/><text x="754" y="308" font-size="28" font-weight="400" fill="#535d66" text-anchor="start">grants permissions through</text><rect x="430" y="349" width="580" height="112" fill="white" stroke="#b8c1c7" stroke-width="1.8"/><text x="720" y="392" font-size="31" font-weight="600" fill="#20272d" text-anchor="middle">Licence</text><text x="720" y="434" font-size="28" font-weight="400" fill="#20272d" text-anchor="middle">Permitted activities and their conditions</text><path data-from="licence" data-to="run" d="M720 461V507H265V598" fill="none" stroke="#24485d" stroke-width="2.2" marker-end="url(#arrow)"/><path data-from="licence" data-to="modify" d="M720 461V598" fill="none" stroke="#24485d" stroke-width="2.2" marker-end="url(#arrow)"/><path data-from="licence" data-to="redistribute" d="M720 461V507H1175V598" fill="none" stroke="#24485d" stroke-width="2.2" marker-end="url(#arrow)"/><text x="285" y="562" font-size="27" font-weight="400" fill="#535d66" text-anchor="start">if permitted</text><text x="740" y="562" font-size="27" font-weight="400" fill="#535d66" text-anchor="start">if permitted</text><text x="1195" y="562" font-size="27" font-weight="400" fill="#535d66" text-anchor="start">if permitted</text><rect x="70" y="608" width="390" height="153" fill="white" stroke="#b8c1c7" stroke-width="1.8"/><text x="95" y="652" font-size="31" font-weight="600" fill="#20272d" text-anchor="start">Run</text><text x="95" y="698" font-size="28" font-weight="400" fill="#20272d" text-anchor="start">Use the software for</text><text x="95" y="737" font-size="28" font-weight="400" fill="#20272d" text-anchor="start">an authorised purpose.</text><rect x="525" y="608" width="390" height="153" fill="white" stroke="#b8c1c7" stroke-width="1.8"/><text x="550" y="652" font-size="31" font-weight="600" fill="#20272d" text-anchor="start">Modify</text><text x="550" y="698" font-size="28" font-weight="400" fill="#20272d" text-anchor="start">Change source code</text><text x="550" y="737" font-size="28" font-weight="400" fill="#20272d" text-anchor="start">where terms allow it.</text><rect x="980" y="608" width="390" height="153" fill="white" stroke="#b8c1c7" stroke-width="1.8"/><text x="1005" y="652" font-size="31" font-weight="600" fill="#20272d" text-anchor="start">Redistribute</text><text x="1005" y="698" font-size="28" font-weight="400" fill="#20272d" text-anchor="start">Supply copies under</text><text x="1005" y="737" font-size="28" font-weight="400" fill="#20272d" text-anchor="start">the applicable conditions.</text><text x="70" y="808" font-size="28" font-weight="400" fill="#20272d" text-anchor="start">Conditions, such as retaining notices, can continue to apply to redistributed copies.</text><line x1="70" y1="831" x2="1370" y2="831" stroke="#b8c1c7" stroke-width="1.6"/><text x="70" y="871" font-size="29" font-weight="400" fill="#20272d" text-anchor="start">Publishing source does not itself remove copyright.</text>
</svg>