<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">CSMA/CD: sense again before every retry</title><desc id="desc">Shared half-duplex Ethernet example. Both stations sense idle before the other signal arrives. Collision detection stops transmission; random backoff is followed by another carrier-sense decision.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#146b68"/></marker></defs><style>text{font:22px Arial,sans-serif;fill:#183047;text-anchor:middle}.title{font-size:30px;font-weight:700}.small{font-size:20px}.label{font-weight:700}.box{fill:#fff;stroke:#183047;stroke-width:2.5}.edge{stroke:#146b68;stroke-width:3;fill:none}.dashed{stroke-dasharray:9 7}.failed{stroke:#ad3934;stroke-dasharray:8 6}.muted{stroke:#9aa9b5;stroke-width:2}.note{fill:#8e302d}.panel{fill:#e7f2f0;stroke:none}</style><rect width="1200" height="680" fill="#f8fbfc"/><text x="600" y="45" class="title">CSMA/CD: sense again before every retry</text><text x="290" y="102" class="label">Station A</text><text x="910" y="102" class="label">Station B</text><line data-link="time-A" x1="290" y1="120" x2="290" y2="535" class="edge muted"/><line data-link="time-B" x1="910" y1="120" x2="910" y2="535" class="edge muted"/><g data-node="start-A"><rect x="65" y="130" width="450" height="64" rx="10" class="box"/><text x="290" y="162" class="">Sense idle → begin transmitting</text></g><g data-node="start-B"><rect x="685" y="130" width="450" height="64" rx="10" class="box"/><text x="910" y="162" class="">Sense idle → begin transmitting</text></g><line data-link="signal-A" x1="515" y1="195" x2="685" y2="255" class="edge " marker-end="url(#arrow)"/><line data-link="signal-B" x1="685" y1="195" x2="515" y2="255" class="edge " marker-end="url(#arrow)"/><text x="600" y="155" class="small">travel time</text><g data-node="collision-A"><rect x="65" y="265" width="450" height="64" rx="10" class="box"/><text x="290" y="297" class="">Detect collision; stop frame; jam</text></g><g data-node="collision-B"><rect x="685" y="265" width="450" height="64" rx="10" class="box"/><text x="910" y="297" class="">Detect collision; stop frame; jam</text></g><g data-node="wait-A"><rect x="65" y="365" width="450" height="64" rx="10" class="box"/><text x="290" y="397" class="">Choose a random wait: shorter</text></g><g data-node="wait-B"><rect x="685" y="365" width="450" height="64" rx="10" class="box"/><text x="910" y="397" class="">Choose a random wait: longer</text></g><g data-node="retry-A"><rect x="65" y="465" width="450" height="64" rx="10" class="box"/><text x="290" y="497" class="">Wait ends → sense idle → retry</text></g><g data-node="retry-B"><rect x="685" y="465" width="450" height="64" rx="10" class="box"/><text x="910" y="497" class="">Wait ends → sense busy → defer</text></g><text x="600" y="585" class="">When A finishes, B senses idle and retries; equal waits can cause another collision.</text><text x="600" y="625" class="">Scope: shared half-duplex Ethernet. Modern switched full-duplex links do not use CSMA/CD.</text></svg>