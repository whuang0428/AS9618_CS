<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Telephone access: modulation in both directions</title><desc id="desc">An illustrative telephone access connection places a modem at each end. The sending modem modulates; the receiving modem demodulates. Return data reverses those roles. Internal PSTN trunks need not be analogue.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#146b68"/></marker></defs><style>text{font:22px Arial,sans-serif;fill:#183047;text-anchor:middle}.title{font-size:30px;font-weight:700}.small{font-size:20px}.label{font-weight:700}.box{fill:#fff;stroke:#183047;stroke-width:2.5}.edge{stroke:#146b68;stroke-width:3;fill:none}.dashed{stroke-dasharray:9 7}.failed{stroke:#ad3934;stroke-dasharray:8 6}.muted{stroke:#9aa9b5;stroke-width:2}.note{fill:#8e302d}.panel{fill:#e7f2f0;stroke:none}</style><rect width="1200" height="680" fill="#f8fbfc"/><text x="600" y="45" class="title">Telephone access: modulation in both directions</text><line data-link="home-modem" x1="220" y1="260" x2="315" y2="260" class="edge "/><line data-link="telephone-access" x1="505" y1="260" x2="690" y2="260" class="edge "/><line data-link="provider-network" x1="880" y1="260" x2="990" y2="260" class="edge "/><g data-node="home"><rect x="35" y="210" width="185" height="92" rx="10" class="box"/><text x="127.5" y="242" class="">Home digital</text><text x="127.5" y="270" class="">device / router</text></g><g data-node="home-modem"><rect x="315" y="210" width="190" height="64" rx="10" class="box"/><text x="410" y="242" class="">Home modem</text></g><g data-node="provider-modem"><rect x="690" y="210" width="190" height="64" rx="10" class="box"/><text x="785" y="242" class="">Provider modem</text></g><g data-node="provider"><rect x="990" y="210" width="180" height="92" rx="10" class="box"/><text x="1080" y="242" class="">Provider</text><text x="1080" y="270" class="">network</text></g><text x="595" y="205" class="small">Telephone / PSTN</text><line data-link="request" x1="210" y1="390" x2="1010" y2="390" class="edge " marker-end="url(#arrow)"/><text x="600" y="355" class="">Request: home modem MODULATES → provider modem DEMODULATES</text><line data-link="response" x1="1010" y1="500" x2="210" y2="500" class="edge " marker-end="url(#arrow)"/><text x="600" y="465" class="">Response: provider modem MODULATES → home modem DEMODULATES</text><text x="600" y="595" class="">The diagram illustrates telephone access; it does not claim that every PSTN link is analogue.</text><text x="600" y="635" class="">A router chooses an onward network; a modem adapts data to the access signal.</text></svg>