<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Read links before predicting failures</title><desc id="desc">A terminated shared bus, a star with four independent links, and a four-node full mesh with all six edges. Crossings in the mesh are not nodes.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#146b68"/></marker></defs><style>text{font:22px Arial,sans-serif;fill:#183047;text-anchor:middle}.title{font-size:30px;font-weight:700}.small{font-size:20px}.label{font-weight:700}.box{fill:#fff;stroke:#183047;stroke-width:2.5}.edge{stroke:#146b68;stroke-width:3;fill:none}.dashed{stroke-dasharray:9 7}.failed{stroke:#ad3934;stroke-dasharray:8 6}.muted{stroke:#9aa9b5;stroke-width:2}.note{fill:#8e302d}.panel{fill:#e7f2f0;stroke:none}</style><rect width="1200" height="680" fill="#f8fbfc"/><text x="600" y="45" class="title">Read links before predicting failures</text><text x="200" y="100" class="label">Bus: one shared backbone</text><line data-link="bus" x1="55" y1="195" x2="345" y2="195" class="edge "/><line data-link="terminator-L" x1="55" y1="175" x2="55" y2="215" class="edge "/><line data-link="terminator-R" x1="345" y1="175" x2="345" y2="215" class="edge "/><line data-link="bus-0" x1="110" y1="195" x2="110" y2="240" class="edge "/><g data-node="bus-0"><rect x="74" y="240" width="72" height="64" rx="10" class="box"/><text x="110" y="272" class="">A</text></g><line data-link="bus-1" x1="200" y1="195" x2="200" y2="240" class="edge "/><g data-node="bus-1"><rect x="164" y="240" width="72" height="64" rx="10" class="box"/><text x="200" y="272" class="">B</text></g><line data-link="bus-2" x1="290" y1="195" x2="290" y2="240" class="edge "/><g data-node="bus-2"><rect x="254" y="240" width="72" height="64" rx="10" class="box"/><text x="290" y="272" class="">C</text></g><text x="200" y="350" class="">Both ends are terminated.</text><text x="200" y="382" class="">A backbone break disrupts the bus.</text><text x="600" y="100" class="label">Star: separate links to S</text><line data-link="star-0" x1="600" y1="240" x2="600" y2="150" class="edge "/><g data-node="star-0"><rect x="565" y="120" width="70" height="64" rx="10" class="box"/><text x="600" y="152" class="">A</text></g><line data-link="star-1" x1="600" y1="240" x2="760" y2="230" class="edge "/><g data-node="star-1"><rect x="725" y="200" width="70" height="64" rx="10" class="box"/><text x="760" y="232" class="">B</text></g><line data-link="star-2" x1="600" y1="240" x2="600" y2="325" class="edge "/><g data-node="star-2"><rect x="565" y="295" width="70" height="64" rx="10" class="box"/><text x="600" y="327" class="">C</text></g><line data-link="star-3" x1="600" y1="240" x2="440" y2="230" class="edge "/><g data-node="star-3"><rect x="405" y="200" width="70" height="64" rx="10" class="box"/><text x="440" y="232" class="">D</text></g><g data-node="S"><rect x="565" y="210" width="70" height="64" rx="10" class="box"/><text x="600" y="242" class="">S</text></g><text x="600" y="430" class="">B–S fails: only B loses its link.</text><text x="600" y="462" class="">S fails: all four lose this connection.</text><text x="1000" y="100" class="label">Full mesh: four nodes</text><line data-link="AB" x1="880" y1="170" x2="1120" y2="170" class="edge "/><line data-link="AC" x1="880" y1="170" x2="880" y2="350" class="edge "/><line data-link="AD" x1="880" y1="170" x2="1120" y2="350" class="edge "/><line data-link="BC" x1="1120" y1="170" x2="880" y2="350" class="edge "/><line data-link="BD" x1="1120" y1="170" x2="1120" y2="350" class="edge "/><line data-link="CD" x1="880" y1="350" x2="1120" y2="350" class="edge "/><g data-node="A"><rect x="850" y="140" width="60" height="64" rx="10" class="box"/><text x="880" y="172" class="">A</text></g><g data-node="B"><rect x="1090" y="140" width="60" height="64" rx="10" class="box"/><text x="1120" y="172" class="">B</text></g><g data-node="C"><rect x="850" y="320" width="60" height="64" rx="10" class="box"/><text x="880" y="352" class="">C</text></g><g data-node="D"><rect x="1090" y="320" width="60" height="64" rx="10" class="box"/><text x="1120" y="352" class="">D</text></g><text x="1000" y="430" class="">AB, AC, AD, BC, BD, CD</text><text x="1000" y="462" class="">6 links; crossings are not nodes.</text><text x="600" y="550" class="label">A topology describes physical links. A route also needs a forwarding decision.</text><text x="600" y="588" class="">A redundant link is useful only if the network can select and activate a working path.</text></svg>