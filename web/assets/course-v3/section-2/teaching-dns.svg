<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Resolve the name, then request the resource</title><desc id="desc">Three lanes show browser, DNS resolver and web server. DNS maps only the domain name to an IP address. The browser then contacts the web server and requests the path; the server returns the resource.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#146b68"/></marker></defs><style>text{font:22px Arial,sans-serif;fill:#183047;text-anchor:middle}.title{font-size:30px;font-weight:700}.small{font-size:20px}.label{font-weight:700}.box{fill:#fff;stroke:#183047;stroke-width:2.5}.edge{stroke:#146b68;stroke-width:3;fill:none}.dashed{stroke-dasharray:9 7}.failed{stroke:#ad3934;stroke-dasharray:8 6}.muted{stroke:#9aa9b5;stroke-width:2}.note{fill:#8e302d}.panel{fill:#e7f2f0;stroke:none}</style><rect width="1200" height="680" fill="#f8fbfc"/><text x="600" y="45" class="title">Resolve the name, then request the resource</text><text x="180" y="110" class="label">Browser</text><text x="600" y="110" class="label">DNS resolver</text><text x="1020" y="110" class="label">Web server</text><line data-link="lane-180" x1="180" y1="140" x2="180" y2="525" class="edge muted"/><line data-link="lane-600" x1="600" y1="140" x2="600" y2="525" class="edge muted"/><line data-link="lane-1020" x1="1020" y1="140" x2="1020" y2="525" class="edge muted"/><line data-link="dns-question" x1="180" y1="200" x2="600" y2="200" class="edge " marker-end="url(#arrow)"/><text x="390" y="177" class="small">1. museum.example.org?</text><line data-link="dns-answer" x1="600" y1="275" x2="180" y2="275" class="edge " marker-end="url(#arrow)"/><text x="390" y="252" class="small">2. 203.0.113.60</text><line data-link="resource-request" x1="180" y1="365" x2="1020" y2="365" class="edge " marker-end="url(#arrow)"/><text x="600" y="342" class="small">3. Connect to server; request /gallery/map.html</text><line data-link="resource-response" x1="1020" y1="455" x2="180" y2="455" class="edge " marker-end="url(#arrow)"/><text x="600" y="432" class="small">4. Server returns the resource</text><text x="600" y="570" class="">URL: https://museum.example.org/gallery/map.html</text><text x="600" y="610" class="">Hypothetical mapping: 203.0.113.60 is reserved for documentation, not a live service.</text></svg>