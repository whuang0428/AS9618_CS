<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Track buffer contents, not just the network rate</title><desc id="desc">Playback begins at time zero with 12 Mbit buffered. Playback consumes 4 Mbit per second. Arrival rates are 6 from 0 to 4 seconds, 4 from 4 to 9 seconds and 2 from 9 to 19 seconds. Contents are 12,20,20,0 Mbit. Capacity is 32 Mbit.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#146b68"/></marker></defs><style>text{font:22px Arial,sans-serif;fill:#183047;text-anchor:middle}.title{font-size:30px;font-weight:700}.small{font-size:20px}.label{font-weight:700}.box{fill:#fff;stroke:#183047;stroke-width:2.5}.edge{stroke:#146b68;stroke-width:3;fill:none}.dashed{stroke-dasharray:9 7}.failed{stroke:#ad3934;stroke-dasharray:8 6}.muted{stroke:#9aa9b5;stroke-width:2}.note{fill:#8e302d}.panel{fill:#e7f2f0;stroke:none}</style><rect width="1200" height="680" fill="#f8fbfc"/><text x="600" y="45" class="title">Track buffer contents, not just the network rate</text><line data-link="axis-y" x1="130" y1="475" x2="130" y2="115" class="edge muted"/><line data-link="axis-x" x1="130" y1="475" x2="1080" y2="475" class="edge muted"/><line data-link="grid-0" x1="130" y1="475" x2="1080" y2="475" class="edge muted"/><text x="85" y="482" class="">0</text><line data-link="grid-12" x1="130" y1="355" x2="1080" y2="355" class="edge muted"/><text x="85" y="362" class="">12</text><line data-link="grid-20" x1="130" y1="275" x2="1080" y2="275" class="edge muted"/><text x="85" y="282" class="">20</text><line data-link="grid-32" x1="130" y1="155" x2="1080" y2="155" class="edge muted"/><text x="85" y="162" class="">32</text><text x="130" y="515" class="">0</text><text x="318" y="515" class="">4</text><text x="553" y="515" class="">9</text><text x="1023" y="515" class="">19</text><polyline points="130,355 318,275 553,275 1023,475" class="edge" stroke-width="5"/><circle cx="130" cy="355" r="6" fill="#146b68"/><circle cx="318" cy="275" r="6" fill="#146b68"/><circle cx="553" cy="275" r="6" fill="#146b68"/><circle cx="1023" cy="475" r="6" fill="#146b68"/><text x="110" y="92" class="label">Mbit</text><text x="1070" y="553" class="label">Time / s</text><text x="223" y="235" class="">6 − 4 = +2</text><text x="435" y="235" class="">4 − 4 = 0</text><text x="790" y="340" class="">2 − 4 = −2</text><text x="830" y="135" class="">Capacity: 32 Mbit</text><text x="600" y="585" class="">12 + (6 − 4) × 4 = 20; then unchanged; then 20 + (2 − 4) × 10 = 0.</text><text x="600" y="625" class="">At 19 s the reserve is exhausted. Continued input of 2 Mbit/s cannot sustain playback at 4.</text></svg>