<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">One /26 subnet and the next hop</title><desc id="desc">Laptop 192.168.20.150 and local server 192.168.20.180 share subnet 192.168.20.128/26. Gateway LAN interface is 192.168.20.129. Destination 192.168.20.210 is outside this subnet and must be sent through the gateway.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#146b68"/></marker></defs><style>text{font:22px Arial,sans-serif;fill:#183047;text-anchor:middle}.title{font-size:30px;font-weight:700}.small{font-size:20px}.label{font-weight:700}.box{fill:#fff;stroke:#183047;stroke-width:2.5}.edge{stroke:#146b68;stroke-width:3;fill:none}.dashed{stroke-dasharray:9 7}.failed{stroke:#ad3934;stroke-dasharray:8 6}.muted{stroke:#9aa9b5;stroke-width:2}.note{fill:#8e302d}.panel{fill:#e7f2f0;stroke:none}</style><rect width="1200" height="680" fill="#f8fbfc"/><text x="600" y="45" class="title">One /26 subnet and the next hop</text><rect x="30" y="120" width="825" height="335" rx="12" class="panel"/><text x="440" y="158" class="label">LAN: 192.168.20.128/26 · mask 255.255.255.192</text><line data-link="laptop-switch" x1="285" y1="275" x2="415" y2="320" class="edge "/><line data-link="server-switch" x1="285" y1="395" x2="415" y2="340" class="edge "/><line data-link="switch-gateway" x1="565" y1="330" x2="660" y2="330" class="edge "/><line data-link="gateway-remote" x1="845" y1="330" x2="935" y2="330" class="edge "/><g data-node="laptop"><rect x="55" y="220" width="230" height="92" rx="10" class="box"/><text x="170" y="252" class="">Laptop</text><text x="170" y="280" class="">192.168.20.150</text></g><g data-node="local"><rect x="55" y="350" width="230" height="92" rx="10" class="box"/><text x="170" y="382" class="">Local server</text><text x="170" y="410" class="">192.168.20.180</text></g><g data-node="switch"><rect x="385" y="285" width="180" height="64" rx="10" class="box"/><text x="475" y="317" class="">Switch</text></g><g data-node="gateway"><rect x="650" y="260" width="195" height="92" rx="10" class="box"/><text x="747.5" y="292" class="">Gateway LAN</text><text x="747.5" y="320" class="">192.168.20.129</text></g><g data-node="remote"><rect x="935" y="260" width="235" height="92" rx="10" class="box"/><text x="1052.5" y="292" class="">Other subnet</text><text x="1052.5" y="320" class="">192.168.20.210</text></g><text x="600" y="520" class="">Block 128–191: network 128, ordinary hosts 129–190, broadcast 191.</text><text x="600" y="565" class="">180 AND 192 = 128 → local. 210 AND 192 = 192 → send via gateway.</text><text x="600" y="610" class="">The remote destination IP remains .210; the immediate LAN recipient is the gateway.</text></svg>