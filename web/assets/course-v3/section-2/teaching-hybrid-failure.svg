<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Trace a hybrid network before and after failure</title><desc id="desc">A and B have separate links to S1; C and D have separate links to S2. S1-S2, S1-S3 and S2-S3 form a mesh. The failed S1-S2 link is dashed red; the spare path goes through S3.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#146b68"/></marker></defs><style>text{font:22px Arial,sans-serif;fill:#183047;text-anchor:middle}.title{font-size:30px;font-weight:700}.small{font-size:20px}.label{font-weight:700}.box{fill:#fff;stroke:#183047;stroke-width:2.5}.edge{stroke:#146b68;stroke-width:3;fill:none}.dashed{stroke-dasharray:9 7}.failed{stroke:#ad3934;stroke-dasharray:8 6}.muted{stroke:#9aa9b5;stroke-width:2}.note{fill:#8e302d}.panel{fill:#e7f2f0;stroke:none}</style><rect width="1200" height="680" fill="#f8fbfc"/><text x="600" y="45" class="title">Trace a hybrid network before and after failure</text><line data-link="A-S1" x1="130" y1="210" x2="390" y2="260" class="edge "/><line data-link="B-S1" x1="130" y1="400" x2="390" y2="290" class="edge "/><line data-link="S1-S2" x1="440" y1="275" x2="760" y2="275" class="edge failed"/><line data-link="S1-S3" x1="425" y1="275" x2="580" y2="450" class="edge "/><line data-link="S3-S2" x1="620" y1="450" x2="775" y2="275" class="edge "/><line data-link="S2-C" x1="810" y1="260" x2="1070" y2="210" class="edge "/><line data-link="S2-D" x1="810" y1="290" x2="1070" y2="400" class="edge "/><g data-node="A"><rect x="75" y="165" width="110" height="64" rx="10" class="box"/><text x="130" y="197" class="">A</text></g><g data-node="B"><rect x="75" y="365" width="110" height="64" rx="10" class="box"/><text x="130" y="397" class="">B</text></g><g data-node="C"><rect x="1015" y="165" width="110" height="64" rx="10" class="box"/><text x="1070" y="197" class="">C</text></g><g data-node="D"><rect x="1015" y="365" width="110" height="64" rx="10" class="box"/><text x="1070" y="397" class="">D</text></g><g data-node="S1"><rect x="360" y="230" width="110" height="64" rx="10" class="box"/><text x="415" y="262" class="">S1</text></g><g data-node="S2"><rect x="730" y="230" width="110" height="64" rx="10" class="box"/><text x="785" y="262" class="">S2</text></g><g data-node="S3"><rect x="545" y="420" width="110" height="64" rx="10" class="box"/><text x="600" y="452" class="">S3</text></g><text x="600" y="160" class="">Normal A → C: A → S1 → S2 → C</text><text x="600" y="205" class="note">S1–S2 fails: A → S1 → S3 → S2 → C</text><text x="600" y="560" class="">Assume the configured network activates the spare path and avoids loops.</text><text x="600" y="600" class="">A–S1 fails: A is isolated. S1 fails: A and B are isolated.</text></svg>