<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 960 540" role="img" aria-labelledby="title description">
<title id="title">Wireless laptop and a server on another network</title><desc id="description">A laptop containing a WNIC has a wireless link to a WAP. Wired links connect the WAP to a switch, the switch to a router and the router to the server's network. No packet route is highlighted.</desc>
<style>text{font-family:Arial,sans-serif;fill:#183047;text-anchor:middle}.title{font-size:30px;font-weight:700}.note{font-size:22px}.node-label{font-size:30px;font-weight:700}.link{stroke:#176b69;stroke-width:4;fill:none}.host,.router{fill:white;stroke:#183047;stroke-width:3}.switch{fill:#183047}.switch-label{fill:white}</style>
<rect width="960" height="540" fill="#f8fbfc"/>
<text x="480" y="48" class="title">Wireless laptop and a server on another network</text>
<rect x="20" y="115" width="920" height="230" rx="12" fill="#e6f3f0"/>
<text x="120" y="155" class="note">Source LAN</text>
<rect x="520" y="365" width="420" height="155" rx="12" fill="#e6f3f0"/>
<text x="650" y="395" class="note">Other network</text>
<line class="link" data-link="WNIC-WAP" x1="210" y1="265" x2="290" y2="265" stroke-dasharray="10 8"/>
<line class="link" data-link="WAP-Switch" x1="430" y1="265" x2="500" y2="265"/><line class="link" data-link="Switch-Router" x1="640" y1="265" x2="720" y2="265"/><line class="link" data-link="Router-Server" x1="800" y1="310" x2="800" y2="415"/>
<g data-node="WNIC"><rect class="host" x="40" y="220" width="170" height="90" rx="8"/><text class="note" x="125" y="257">Laptop</text><text class="note" x="125" y="287">with WNIC</text></g><g data-node="WAP"><rect class="host" x="290" y="220" width="140" height="90" rx="8"/><text class="note" x="360" y="273">WAP</text></g><g data-node="Switch"><rect class="host" x="500" y="220" width="140" height="90" rx="8"/><text class="note" x="570" y="273">Switch</text></g><g data-node="Router"><rect class="host" x="720" y="220" width="160" height="90" rx="8"/><text class="note" x="800" y="273">Router</text></g><g data-node="Server"><rect class="host" x="720" y="415" width="160" height="90" rx="8"/><text class="note" x="800" y="468">Server</text></g>
<text x="320" y="425" class="note">Dashed line: wireless link</text>
<text x="320" y="463" class="note">Solid line: wired link</text>
</svg>