<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Mobile access and handover</title><desc id="desc">A phone uses radio to base station A or B. Both base stations connect through operator infrastructure to the internet and a service. During movement the serving station may change through handover.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#146b68"/></marker></defs><style>text{font:22px Arial,sans-serif;fill:#183047;text-anchor:middle}.title{font-size:30px;font-weight:700}.small{font-size:20px}.label{font-weight:700}.box{fill:#fff;stroke:#183047;stroke-width:2.5}.edge{stroke:#146b68;stroke-width:3;fill:none}.dashed{stroke-dasharray:9 7}.failed{stroke:#ad3934;stroke-dasharray:8 6}.muted{stroke:#9aa9b5;stroke-width:2}.note{fill:#8e302d}.panel{fill:#e7f2f0;stroke:none}</style><rect width="1200" height="680" fill="#f8fbfc"/><text x="600" y="45" class="title">Mobile access and handover</text><line data-link="radio-A" x1="220" y1="255" x2="450" y2="190" class="edge dashed"/><line data-link="radio-B" x1="220" y1="270" x2="450" y2="400" class="edge dashed"/><line data-link="A-operator" x1="575" y1="195" x2="730" y2="270" class="edge "/><line data-link="B-operator" x1="575" y1="415" x2="730" y2="275" class="edge "/><line data-link="operator-internet" x1="860" y1="290" x2="1010" y2="290" class="edge "/><g data-node="phone"><rect x="40" y="225" width="190" height="64" rx="10" class="box"/><text x="135" y="257" class="">Moving phone</text></g><g data-node="A"><rect x="430" y="150" width="190" height="64" rx="10" class="box"/><text x="525" y="182" class="">Base station A</text></g><g data-node="B"><rect x="430" y="370" width="190" height="64" rx="10" class="box"/><text x="525" y="402" class="">Base station B</text></g><g data-node="operator"><rect x="690" y="230" width="210" height="64" rx="10" class="box"/><text x="795" y="262" class="">Operator network</text></g><g data-node="service"><rect x="995" y="225" width="185" height="92" rx="10" class="box"/><text x="1087.5" y="257" class="">Internet</text><text x="1087.5" y="285" class="">service</text></g><text x="265" y="170" class="small">Initially A</text><text x="260" y="407" class="small">Then B</text><text x="600" y="535" class="">Request travels phone → serving station → operator → service; the response returns.</text><text x="600" y="580" class="">Handover changes the serving station as coverage changes; it does not create coverage.</text><text x="600" y="625" class="">A coverage gap or congestion can interrupt service even when the phone is working.</text></svg>