<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Bridge filtering depends on the destination</title><desc id="desc">Bridge port 1 joins the left LAN segment with A and B; port 2 joins right segment with C. The known table maps A and B to port 1 and C to port 2.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#146b68"/></marker></defs><style>text{font:22px Arial,sans-serif;fill:#183047;text-anchor:middle}.title{font-size:30px;font-weight:700}.small{font-size:20px}.label{font-weight:700}.box{fill:#fff;stroke:#183047;stroke-width:2.5}.edge{stroke:#146b68;stroke-width:3;fill:none}.dashed{stroke-dasharray:9 7}.failed{stroke:#ad3934;stroke-dasharray:8 6}.muted{stroke:#9aa9b5;stroke-width:2}.note{fill:#8e302d}.panel{fill:#e7f2f0;stroke:none}</style><rect width="1200" height="680" fill="#f8fbfc"/><text x="600" y="45" class="title">Bridge filtering depends on the destination</text><rect x="35" y="120" width="375" height="310" rx="12" class="panel"/><rect x="790" y="120" width="375" height="310" rx="12" class="panel"/><text x="220" y="162" class="label">Left segment: port 1</text><text x="975" y="162" class="label">Right segment: port 2</text><line data-link="left-backbone" x1="90" y1="305" x2="470" y2="305" class="edge "/><line data-link="right-backbone" x1="730" y1="305" x2="1100" y2="305" class="edge "/><line data-link="A-left" x1="130" y1="270" x2="130" y2="305" class="edge "/><line data-link="B-left" x1="330" y1="270" x2="330" y2="305" class="edge "/><line data-link="C-right" x1="980" y1="270" x2="980" y2="305" class="edge "/><g data-node="A"><rect x="90" y="205" width="80" height="64" rx="10" class="box"/><text x="130" y="237" class="">A</text></g><g data-node="B"><rect x="290" y="205" width="80" height="64" rx="10" class="box"/><text x="330" y="237" class="">B</text></g><g data-node="bridge"><rect x="470" y="245" width="260" height="92" rx="10" class="box"/><text x="600" y="277" class="">Bridge</text><text x="600" y="305" class="">A: 1 · B: 1 · C: 2</text></g><g data-node="C"><rect x="940" y="205" width="80" height="64" rx="10" class="box"/><text x="980" y="237" class="">C</text></g><text x="600" y="485" class="">Case 1: A → B arrives on port 1; destination is also on port 1. FILTER.</text><text x="600" y="535" class="">Case 2: A → C arrives on port 1; destination is on port 2. FORWARD.</text><text x="600" y="600" class="">Filtering keeps the frame off the other segment; B can still receive it on the left.</text></svg>