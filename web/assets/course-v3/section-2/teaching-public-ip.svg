<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">An address belongs to an interface</title><desc id="desc">A private LAN host 192.168.1.10 connects to a router LAN interface 192.168.1.1. The router external interface uses the documentation address 203.0.113.5 in a hypothetical public network. NAT changes the outgoing source IPv4 address and maps replies back.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#146b68"/></marker></defs><style>text{font:22px Arial,sans-serif;fill:#183047;text-anchor:middle}.title{font-size:30px;font-weight:700}.small{font-size:20px}.label{font-weight:700}.box{fill:#fff;stroke:#183047;stroke-width:2.5}.edge{stroke:#146b68;stroke-width:3;fill:none}.dashed{stroke-dasharray:9 7}.failed{stroke:#ad3934;stroke-dasharray:8 6}.muted{stroke:#9aa9b5;stroke-width:2}.note{fill:#8e302d}.panel{fill:#e7f2f0;stroke:none}</style><rect width="1200" height="680" fill="#f8fbfc"/><text x="600" y="45" class="title">An address belongs to an interface</text><line data-link="host-LAN" x1="300" y1="280" x2="445" y2="280" class="edge "/><line data-link="WAN-network" x1="775" y1="280" x2="910" y2="280" class="edge "/><g data-node="host"><rect x="50" y="225" width="250" height="92" rx="10" class="box"/><text x="175" y="257" class="">Host interface</text><text x="175" y="285" class="">192.168.1.10</text></g><g data-node="router"><rect x="445" y="190" width="330" height="120" rx="10" class="box"/><text x="610" y="222" class="">Router with IPv4 NAT</text><text x="610" y="250" class="">LAN: 192.168.1.1</text><text x="610" y="278" class="">External: 203.0.113.5</text></g><g data-node="outside"><rect x="910" y="225" width="250" height="92" rx="10" class="box"/><text x="1035" y="257" class="">Hypothetical</text><text x="1035" y="285" class="">public network</text></g><text x="600" y="435" class="">Outgoing source: 192.168.1.10 → 203.0.113.5; the destination remains the server.</text><text x="600" y="485" class="">Matching reply: translation state maps the traffic back to the private host.</text><text x="600" y="565" class="">203.0.113.5 is a documentation example, not an address to contact.</text><text x="600" y="610" class="">NAT is an address-translation mechanism; it is not a guarantee of security.</text></svg>