<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Separate switch ports; local and routed delivery</title><desc id="desc">Laptop WNIC links by radio to a WAP. WAP, desktop NIC, server NIC and router LAN interface each have an independent switch port. Router WAN interface connects to another network.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#146b68"/></marker></defs><style>text{font:22px Arial,sans-serif;fill:#183047;text-anchor:middle}.title{font-size:30px;font-weight:700}.small{font-size:20px}.label{font-weight:700}.box{fill:#fff;stroke:#183047;stroke-width:2.5}.edge{stroke:#146b68;stroke-width:3;fill:none}.dashed{stroke-dasharray:9 7}.failed{stroke:#ad3934;stroke-dasharray:8 6}.muted{stroke:#9aa9b5;stroke-width:2}.note{fill:#8e302d}.panel{fill:#e7f2f0;stroke:none}</style><rect width="1200" height="680" fill="#f8fbfc"/><text x="600" y="45" class="title">Separate switch ports; local and routed delivery</text><rect x="25" y="95" width="840" height="440" rx="16" class="panel"/><text x="430" y="130" class="label">One LAN: switch table already knows these MAC locations</text><line data-link="WNIC-WAP" x1="180" y1="230" x2="300" y2="230" class="edge dashed"/><line data-link="WAP-p1" x1="420" y1="230" x2="545" y2="300" class="edge "/><line data-link="desktop-p2" x1="360" y1="450" x2="545" y2="345" class="edge "/><line data-link="server-p3" x1="760" y1="220" x2="645" y2="320" class="edge "/><line data-link="router-p4" x1="730" y1="450" x2="645" y2="365" class="edge "/><line data-link="WAN-other" x1="830" y1="450" x2="970" y2="450" class="edge "/><g data-node="WNIC"><rect x="40" y="185" width="160" height="92" rx="10" class="box"/><text x="120" y="217" class="">Laptop WNIC</text><text x="120" y="245" class="">MAC L</text></g><g data-node="WAP"><rect x="260" y="185" width="160" height="92" rx="10" class="box"/><text x="340" y="217" class="">WAP</text><text x="340" y="245" class="">bridge to LAN</text></g><g data-node="desktop"><rect x="170" y="405" width="230" height="92" rx="10" class="box"/><text x="285" y="437" class="">Desktop NIC</text><text x="285" y="465" class="">MAC D</text></g><g data-node="switch"><rect x="495" y="295" width="190" height="92" rx="10" class="box"/><text x="590" y="327" class="">Switch</text><text x="590" y="355" class="">p1 / p2 / p3 / p4</text></g><g data-node="server"><rect x="675" y="150" width="180" height="92" rx="10" class="box"/><text x="765" y="182" class="">Server NIC</text><text x="765" y="210" class="">MAC S</text></g><g data-node="router"><rect x="685" y="410" width="165" height="92" rx="10" class="box"/><text x="767.5" y="442" class="">Router</text><text x="767.5" y="470" class="">LAN / WAN</text></g><g data-node="other"><rect x="970" y="385" width="195" height="92" rx="10" class="box"/><text x="1067.5" y="417" class="">Other network</text><text x="1067.5" y="445" class="">remote server</text></g><text x="453" y="228" class="small">p1</text><text x="445" y="417" class="small">p2</text><text x="738" y="278" class="small">p3</text><text x="690" y="402" class="small">p4</text><text x="600" y="585" class="">Local request: L → WAP → p1 → p3 → S; response: S → p3 → p1 → WAP → L.</text><text x="600" y="627" class="">Remote request: LAN frame addresses router MAC; IP packet addresses remote server.</text></svg>