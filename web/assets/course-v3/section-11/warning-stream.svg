<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1040" viewBox="0 0 1040 1040" role="img" aria-labelledby="title desc"><title id="title">Count temperatures above 30 until the sentinel 999</title><desc id="desc">Initialise Count to 0, then read Temperature before testing it. Temperature 999 leads directly to the final count output and End. Otherwise test Temperature &gt; 30: TRUE increments Count; FALSE leaves it unchanged. Both data paths read the next Temperature before returning to the sentinel test.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#176a70"/></marker></defs><style>svg{background:#fff}text{font-family:ui-monospace,monospace;fill:#10283e}</style><rect x="200" y="20" width="240" height="56" rx="28" fill="#eff7f6" stroke="#176a70" stroke-width="2"/><text x="230" y="56" style="font-size:22px">Start</text><rect x="170" y="111" width="360" height="64" rx="8" fill="#eff7f6" stroke="#176a70" stroke-width="2"/><text x="188" y="144" style="font-size:24px">Count &lt;- 0</text><polygon points="190,218 530,218 510,288 170,288" fill="#eff7f6" stroke="#176a70" stroke-width="2"/><text x="200" y="261" style="font-size:22px">INPUT Temperature</text><polygon points="350,334 560,402 350,470 140,402" fill="#eff7f6" stroke="#176a70" stroke-width="2"/><text x="190" y="409" style="font-size:22px">Temperature &lt;&gt; 999?</text><polygon points="350,536 560,604 350,672 140,604" fill="#eff7f6" stroke="#176a70" stroke-width="2"/><text x="190" y="611" style="font-size:22px">Temperature &gt; 30?</text><rect x="170" y="738" width="360" height="64" rx="8" fill="#eff7f6" stroke="#176a70" stroke-width="2"/><text x="188" y="771" style="font-size:24px">Count &lt;- Count + 1</text><polygon points="190,863 530,863 510,933 170,933" fill="#eff7f6" stroke="#176a70" stroke-width="2"/><text x="200" y="906" style="font-size:22px">INPUT Temperature</text><polygon points="690,355 990,355 970,425 670,425" fill="#eff7f6" stroke="#176a70" stroke-width="2"/><text x="700" y="398" style="font-size:22px">OUTPUT Count</text><rect x="710" y="490" width="240" height="56" rx="28" fill="#eff7f6" stroke="#176a70" stroke-width="2"/><text x="740" y="526" style="font-size:22px">End</text><path d="M350 76V110" fill="none" stroke="#176a70" stroke-width="3" marker-end="url(#arrow)"/><path d="M350 175V217" fill="none" stroke="#176a70" stroke-width="3" marker-end="url(#arrow)"/><path d="M350 288V333" fill="none" stroke="#176a70" stroke-width="3" marker-end="url(#arrow)"/><path d="M350 470V535" fill="none" stroke="#176a70" stroke-width="3" marker-end="url(#arrow)"/><text x="365" y="512" style="font-size:20px">TRUE</text><path d="M560 402H668" fill="none" stroke="#176a70" stroke-width="3" marker-end="url(#arrow)"/><text x="581" y="385" style="font-size:20px">FALSE</text><path d="M830 425V489" fill="none" stroke="#176a70" stroke-width="3" marker-end="url(#arrow)"/><path d="M350 672V737" fill="none" stroke="#176a70" stroke-width="3" marker-end="url(#arrow)"/><text x="365" y="712" style="font-size:20px">TRUE</text><path d="M560 604H605V896H533" fill="none" stroke="#176a70" stroke-width="3" marker-end="url(#arrow)"/><text x="578" y="589" style="font-size:20px">FALSE</text><path d="M350 802V862" fill="none" stroke="#176a70" stroke-width="3" marker-end="url(#arrow)"/><path d="M350 927V977H75V402H138" fill="none" stroke="#176a70" stroke-width="3" marker-end="url(#arrow)"/></svg>
