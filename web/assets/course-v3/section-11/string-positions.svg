<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="480" viewBox="0 0 1040 480" role="img" aria-labelledby="title desc"><title id="title">Positions, counts and concatenation preserve the characters</title><desc id="desc">CS2046AB has eight characters numbered 1 to 8. MID(Code, 3, 4) selects positions 3 through 6, giving the STRING 2046. RIGHT(Code, 2) selects AB. Joining 2046, a hyphen and AB gives 2046-AB.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#176a70"/></marker></defs><style>svg{background:#fff}text{font-family:ui-monospace,monospace;fill:#10283e}</style><text x="32" y="42" style="font-size:24px">Code = "CS2046AB"; positions start at 1</text><text x="103" y="95" style="font-size:22px">1</text><rect x="70" y="112" width="90" height="60" rx="8" fill="#f1f5fa" stroke="#176a70" stroke-width="2"/><text x="88" y="145" style="font-size:24px">C</text><text x="215" y="95" style="font-size:22px">2</text><rect x="182" y="112" width="90" height="60" rx="8" fill="#f1f5fa" stroke="#176a70" stroke-width="2"/><text x="200" y="145" style="font-size:24px">S</text><text x="327" y="95" style="font-size:22px">3</text><rect x="294" y="112" width="90" height="60" rx="8" fill="#d7efe9" stroke="#176a70" stroke-width="2"/><text x="312" y="145" style="font-size:24px">2</text><text x="439" y="95" style="font-size:22px">4</text><rect x="406" y="112" width="90" height="60" rx="8" fill="#d7efe9" stroke="#176a70" stroke-width="2"/><text x="424" y="145" style="font-size:24px">0</text><text x="551" y="95" style="font-size:22px">5</text><rect x="518" y="112" width="90" height="60" rx="8" fill="#d7efe9" stroke="#176a70" stroke-width="2"/><text x="536" y="145" style="font-size:24px">4</text><text x="663" y="95" style="font-size:22px">6</text><rect x="630" y="112" width="90" height="60" rx="8" fill="#d7efe9" stroke="#176a70" stroke-width="2"/><text x="648" y="145" style="font-size:24px">6</text><text x="775" y="95" style="font-size:22px">7</text><rect x="742" y="112" width="90" height="60" rx="8" fill="#f1f5fa" stroke="#176a70" stroke-width="2"/><text x="760" y="145" style="font-size:24px">A</text><text x="887" y="95" style="font-size:22px">8</text><rect x="854" y="112" width="90" height="60" rx="8" fill="#f1f5fa" stroke="#176a70" stroke-width="2"/><text x="872" y="145" style="font-size:24px">B</text><text x="34" y="224" style="font-size:24px">MID(Code, 3, 4) = "2046"</text><text x="550" y="224" style="font-size:24px">RIGHT(Code, 2) = "AB"</text><path d="M260 240V280" fill="none" stroke="#176a70" stroke-width="3" marker-end="url(#arrow)"/><path d="M750 240V280" fill="none" stroke="#176a70" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="294" width="970" height="62" rx="8" fill="#eff7f6" stroke="#176a70" stroke-width="2"/><text x="52" y="327" style="font-size:24px">Label &lt;- Digits &amp; "-" &amp; Suffix</text><path d="M510 356V394" fill="none" stroke="#176a70" stroke-width="3" marker-end="url(#arrow)"/><text x="365" y="435" style="font-size:24px">OUTPUT "2046-AB"</text></svg>
