<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="410" viewBox="0 0 1040 410" role="img" aria-labelledby="title desc"><title id="title">The inner loop restarts for each outer value</title><desc id="desc">Row ranges from 1 to 2. For each Row, Column ranges from 1 to 3. The output order is (1,1), (1,2), (1,3), (2,1), (2,2), (2,3). After (1,3), Row advances and Column restarts at 1. There are six body executions.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#176a70"/></marker></defs><style>svg{background:#fff}text{font-family:ui-monospace,monospace;fill:#10283e}</style><text x="34" y="42" style="font-size:24px">Row runs 1 to 2; each Column loop runs 1 to 3</text><rect x="180" y="85" width="220" height="75" rx="8" fill="#eff7f6" stroke="#176a70" stroke-width="2"/><text x="198" y="118" style="font-size:24px">1. (1, 1)</text><rect x="447" y="85" width="220" height="75" rx="8" fill="#eff7f6" stroke="#176a70" stroke-width="2"/><text x="465" y="118" style="font-size:24px">2. (1, 2)</text><rect x="714" y="85" width="220" height="75" rx="8" fill="#eff7f6" stroke="#176a70" stroke-width="2"/><text x="732" y="118" style="font-size:24px">3. (1, 3)</text><rect x="180" y="215" width="220" height="75" rx="8" fill="#eff7f6" stroke="#176a70" stroke-width="2"/><text x="198" y="248" style="font-size:24px">4. (2, 1)</text><rect x="447" y="215" width="220" height="75" rx="8" fill="#eff7f6" stroke="#176a70" stroke-width="2"/><text x="465" y="248" style="font-size:24px">5. (2, 2)</text><rect x="714" y="215" width="220" height="75" rx="8" fill="#eff7f6" stroke="#176a70" stroke-width="2"/><text x="732" y="248" style="font-size:24px">6. (2, 3)</text><path d="M400 121H443" fill="none" stroke="#176a70" stroke-width="3" marker-end="url(#arrow)"/><path d="M667 121H710" fill="none" stroke="#176a70" stroke-width="3" marker-end="url(#arrow)"/><path d="M934 160V187H140V252H178" fill="none" stroke="#176a70" stroke-width="3" marker-end="url(#arrow)"/><path d="M400 251H443" fill="none" stroke="#176a70" stroke-width="3" marker-end="url(#arrow)"/><path d="M667 251H710" fill="none" stroke="#176a70" stroke-width="3" marker-end="url(#arrow)"/><text x="34" y="348" style="font-size:22px">After (1,3): Row becomes 2; the inner loop starts at Column 1.</text><text x="34" y="384" style="font-size:22px">2 rows × 3 columns = 6 body executions</text></svg>
