<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="630" viewBox="0 0 1040 630" role="img" aria-labelledby="title desc"><title id="title">A Boolean result controls acceptance; reference parameters update totals</title><desc id="desc">Main sends the input Mark to ValidMark, which returns a BOOLEAN to UNTIL. FALSE retries within the same slot; TRUE permits one RecordMark call. RecordMark reads Mark by value and updates caller Total and Passed through reference parameters. Reference updates are not a function return. After three accepted marks, main outputs the mean and pass count.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#176a70"/></marker></defs><style>svg{background:#fff}text{font-family:ui-monospace,monospace;fill:#10283e}</style><text x="34" y="42" style="font-size:24px">One accepted-mark slot: input, decide, then record</text><rect x="34" y="80" width="280" height="95" rx="8" fill="#eff7f6" stroke="#176a70" stroke-width="2"/><text x="52" y="113" style="font-size:24px">Main</text><text x="52" y="144" style="font-size:24px">INPUT Mark</text><rect x="600" y="80" width="400" height="95" rx="8" fill="#eff7f6" stroke="#176a70" stroke-width="2"/><text x="618" y="113" style="font-size:24px">ValidMark(Mark)</text><text x="618" y="144" style="font-size:24px">returns BOOLEAN</text><path d="M314 108H598" fill="none" stroke="#176a70" stroke-width="3" marker-end="url(#arrow)"/><text x="355" y="97" style="font-size:21px">Mark value</text><path d="M600 155H316" fill="none" stroke="#176a70" stroke-width="3" marker-end="url(#arrow)"/><text x="354" y="150" style="font-size:21px">TRUE / FALSE</text><rect x="34" y="241" width="440" height="126" rx="8" fill="#eff7f6" stroke="#176a70" stroke-width="2"/><text x="52" y="274" style="font-size:24px">UNTIL result:</text><text x="52" y="305" style="font-size:24px">FALSE: retry this slot</text><text x="52" y="336" style="font-size:24px">TRUE: call RecordMark</text><path d="M170 175V239" fill="none" stroke="#176a70" stroke-width="3" marker-end="url(#arrow)"/><path d="M474 310H598" fill="none" stroke="#176a70" stroke-width="3" marker-end="url(#arrow)"/><text x="484" y="288" style="font-size:20px">TRUE</text><rect x="600" y="241" width="400" height="126" rx="8" fill="#eff7f6" stroke="#176a70" stroke-width="2"/><text x="618" y="274" style="font-size:24px">RecordMark</text><text x="618" y="305" style="font-size:24px">BYVAL Mark</text><text x="618" y="336" style="font-size:24px">BYREF Total, Passed</text><rect x="34" y="455" width="440" height="104" rx="8" fill="#eff7f6" stroke="#176a70" stroke-width="2"/><text x="52" y="488" style="font-size:24px">Caller accumulators:</text><text x="52" y="519" style="font-size:24px">Total and Passed</text><path d="M800 367V506H476" fill="none" stroke="#176a70" stroke-width="3" marker-end="url(#arrow)"/><text x="553" y="442" style="font-size:21px">reference updates</text><text x="34" y="604" style="font-size:22px">After three accepted slots, main outputs Total / 3 and Passed.</text></svg>
