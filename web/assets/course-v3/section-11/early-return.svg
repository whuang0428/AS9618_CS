<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="580" viewBox="0 0 1040 580" role="img" aria-labelledby="title desc"><title id="title">RETURN completes this function call immediately</title><desc id="desc">DeliveryFee accepts a non-negative INTEGER Quantity and returns REAL. Quantity 0 reaches RETURN 0.0 and skips the later calculation. Quantity 4 reaches RETURN 2.0 + 4 * 0.5, returning 4.0. The returned value replaces DeliveryFee(Quantity) and is assigned to caller variable Fee.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#176a70"/></marker></defs><style>svg{background:#fff}text{font-family:ui-monospace,monospace;fill:#10283e}</style><text x="34" y="42" style="font-size:24px">DeliveryFee(Quantity): trace two separate calls</text><rect x="34" y="80" width="455" height="95" rx="8" fill="#eff7f6" stroke="#176a70" stroke-width="2"/><text x="52" y="113" style="font-size:24px">Quantity = 0</text><text x="52" y="144" style="font-size:24px">Zero test is TRUE</text><rect x="548" y="80" width="456" height="95" rx="8" fill="#eff7f6" stroke="#176a70" stroke-width="2"/><text x="566" y="113" style="font-size:24px">Quantity = 4</text><text x="566" y="144" style="font-size:24px">Zero test is FALSE</text><path d="M260 175V210" fill="none" stroke="#176a70" stroke-width="3" marker-end="url(#arrow)"/><path d="M775 175V210" fill="none" stroke="#176a70" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="223" width="455" height="95" rx="8" fill="#eff7f6" stroke="#176a70" stroke-width="2"/><text x="52" y="256" style="font-size:24px">RETURN 0.0</text><text x="52" y="287" style="font-size:24px">Later RETURN is skipped</text><rect x="548" y="223" width="456" height="95" rx="8" fill="#eff7f6" stroke="#176a70" stroke-width="2"/><text x="566" y="256" style="font-size:24px">RETURN 2.0 + 4 * 0.5</text><text x="566" y="287" style="font-size:24px">Return 4.0</text><path d="M260 318V368" fill="none" stroke="#176a70" stroke-width="3" marker-end="url(#arrow)"/><path d="M775 318V368" fill="none" stroke="#176a70" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="382" width="455" height="95" rx="8" fill="#eff7f6" stroke="#176a70" stroke-width="2"/><text x="52" y="415" style="font-size:24px">Caller: Fee &lt;- 0.0</text><text x="52" y="446" style="font-size:24px">OUTPUT Fee gives 0.0</text><rect x="548" y="382" width="456" height="95" rx="8" fill="#eff7f6" stroke="#176a70" stroke-width="2"/><text x="566" y="415" style="font-size:24px">Caller: Fee &lt;- 4.0</text><text x="566" y="446" style="font-size:24px">OUTPUT Fee gives 4.0</text><text x="34" y="537" style="font-size:22px">Only one RETURN executes in each call; then the caller resumes.</text></svg>
