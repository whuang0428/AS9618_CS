<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" role="img" aria-labelledby="title desc"><title id="title">Independent decisions and exclusive alternatives follow different paths</title><desc id="desc">Both programs receive Mark 85. The independent IF tests Mark &gt;= 50 and Mark &gt;= 80 are both true: Pass and Distinction are both output. The exclusive version tests Mark &gt;= 80 first. TRUE outputs Distinction and skips ELSE, giving one classification.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#176a70"/></marker></defs><style>svg{background:#fff}text{font-family:ui-monospace,monospace;fill:#10283e}</style><text x="34" y="42" style="font-size:24px">Same input: Mark = 85</text><text x="34" y="96" style="font-size:24px">Two independent IF statements</text><text x="548" y="96" style="font-size:24px">One IF / ELSE structure</text><rect x="34" y="120" width="455" height="88" rx="8" fill="#eff7f6" stroke="#176a70" stroke-width="2"/><text x="52" y="153" style="font-size:24px">Mark &gt;= 50 is TRUE</text><text x="52" y="184" style="font-size:24px">OUTPUT "Pass"</text><path d="M262 208V250" fill="none" stroke="#176a70" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="262" width="455" height="88" rx="8" fill="#eff7f6" stroke="#176a70" stroke-width="2"/><text x="52" y="295" style="font-size:24px">Mark &gt;= 80 is TRUE</text><text x="52" y="326" style="font-size:24px">OUTPUT "Distinction"</text><path d="M262 350V409" fill="none" stroke="#176a70" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="421" width="455" height="88" rx="8" fill="#eff7f6" stroke="#176a70" stroke-width="2"/><text x="52" y="454" style="font-size:24px">Observed output:</text><text x="52" y="485" style="font-size:24px">Pass, then Distinction</text><rect x="548" y="120" width="456" height="88" rx="8" fill="#eff7f6" stroke="#176a70" stroke-width="2"/><text x="566" y="153" style="font-size:24px">Mark &gt;= 80 is TRUE</text><text x="566" y="184" style="font-size:24px">OUTPUT "Distinction"</text><path d="M958 208V409" fill="none" stroke="#176a70" stroke-width="3" marker-end="url(#arrow)"/><text x="592" y="279" style="font-size:22px">ELSE is skipped</text><text x="592" y="313" style="font-size:22px">No second classification</text><rect x="548" y="421" width="456" height="88" rx="8" fill="#eff7f6" stroke="#176a70" stroke-width="2"/><text x="566" y="454" style="font-size:24px">Observed output:</text><text x="566" y="485" style="font-size:24px">Distinction</text></svg>
