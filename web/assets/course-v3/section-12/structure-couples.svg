<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="690" viewBox="0 0 1280 690" role="img" aria-labelledby="title desc"><title id="title">Read the symbols beside a module connection</title><desc id="desc">An unfilled circle represents a data couple. A filled circle represents a control couple such as a Boolean value. A data couple with arrows in both directions shows input and updated output for a reference parameter.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#176877"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#18323d}.title{font-size:32px;font-weight:700}.label{font-size:26px;font-weight:700}.body{font-size:24px}.note{font-size:22px;fill:#405c65}.box{fill:#edf5f5;stroke:#477784;stroke-width:2}.call{fill:none;stroke:#687d84;stroke-width:3}.data{fill:none;stroke:#176877;stroke-width:3;marker-end:url(#tip)}.state{fill:#fff;stroke:#176877;stroke-width:3}</style><rect width="1280" height="690" fill="#fbfcfc"/><text x="40" y="48" class="title" text-anchor="start">Read the symbols beside a module connection</text><rect x="35" y="100" width="380" height="500" rx="8" class="box"/><rect x="450" y="100" width="380" height="500" rx="8" class="box"/><rect x="865" y="100" width="380" height="500" rx="8" class="box"/><text x="225" y="145" class="label" text-anchor="middle">Data couple</text><path class="data" d="M225 202 V335"/><circle cx="225" cy="195" r="10" fill="#fff" stroke="#176877" stroke-width="3"/><text x="250" y="260" class="body" text-anchor="start">Seats</text><text x="60" y="392" class="label" text-anchor="start">Unfilled circle</text><text x="60" y="439" class="body" text-anchor="start">An INTEGER or REAL value</text><text x="60" y="479" class="body" text-anchor="start">travels in the arrow direction.</text><text x="60" y="548" class="note" text-anchor="start">Example: a quantity to use</text><text x="640" y="145" class="label" text-anchor="middle">Control couple</text><path class="data" d="M640 202 V335"/><circle cx="640" cy="195" r="10" fill="#176877"/><text x="665" y="260" class="body" text-anchor="start">Valid</text><text x="475" y="392" class="label" text-anchor="start">Filled circle</text><text x="475" y="439" class="body" text-anchor="start">A BOOLEAN value can guide</text><text x="475" y="479" class="body" text-anchor="start">a decision in another module.</text><text x="475" y="548" class="note" text-anchor="start">Example: TRUE or FALSE</text><text x="1055" y="145" class="label" text-anchor="middle">Reference parameter</text><path class="data" d="M1055 200 V335" marker-start="url(#tip)"/><circle cx="1055" cy="267" r="10" fill="#fff" stroke="#176877" stroke-width="3"/><text x="1080" y="278" class="body" text-anchor="start">Code</text><text x="890" y="392" class="label" text-anchor="start">Two directions</text><text x="890" y="439" class="body" text-anchor="start">The callee can read a value</text><text x="890" y="479" class="body" text-anchor="start">and update the caller variable.</text><text x="890" y="548" class="note" text-anchor="start">Example: BYREF Code</text><text x="40" y="647" class="note" text-anchor="start">A separate hierarchy line identifies the caller and callee. Read the circle, label and arrow together.</text></svg>