<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1135" viewBox="0 0 1200 1135" role="img" aria-label="Batch orders: hierarchy, repetition and conditional calls"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#17676f" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#18364d}.title{font-size:30px;font-weight:700}.heading{font-size:23px;font-weight:700}.body{font-size:21px}.box{fill:#edf5f7;stroke:#254963;stroke-width:2}.arrow{fill:none;stroke:#17676f;stroke-width:3;marker-end:url(#arrow)}.call{fill:none;stroke:#526b80;stroke-width:3}</style><rect width="1200" height="1135" fill="#fbfcfd"/><text x="35" y="48" class="title" text-anchor="start">Batch orders: hierarchy, repetition and conditional calls</text><text x="35" y="90" class="body" text-anchor="start">Grey lines show calls; teal arrows label transferred data. Member is BOOLEAN input data.</text><rect x="405" y="120" width="390" height="110" rx="6" class="box"/><text x="600" y="154" class="heading" text-anchor="middle">ProcessBatch</text><text x="423" y="189" class="body" text-anchor="start">Reads OrderCount; zero: No orders</text><path class="call" d="M600 230 V315"/><path d="M635 245 C720 210 725 300 645 295" class="arrow"/><text x="820" y="255" class="body" text-anchor="start">OrderCount &gt; 0:</text><text x="820" y="283" class="body" text-anchor="start">repeat ProcessOrder</text><text x="820" y="311" class="body" text-anchor="start">OrderCount times</text><rect x="405" y="315" width="390" height="75" rx="6" class="box"/><text x="600" y="349" class="heading" text-anchor="middle">ProcessOrder</text><path class="call" d="M600 390 V430 M185 430 H1015 M185 430 V545 M600 430 V545 M1015 430 V545"/><rect x="35" y="545" width="300" height="75" rx="6" class="box"/><text x="185" y="579" class="heading" text-anchor="middle">ReadOrder</text><rect x="450" y="545" width="300" height="75" rx="6" class="box"/><text x="600" y="579" class="heading" text-anchor="middle">CalculateCost</text><rect x="865" y="545" width="300" height="75" rx="6" class="box"/><text x="1015" y="579" class="heading" text-anchor="middle">DisplayCost</text><path d="M310 525 V450" class="arrow"/><text x="40" y="463" class="body" text-anchor="start">Quantity</text><text x="40" y="491" class="body" text-anchor="start">UnitPrice</text><text x="40" y="519" class="body" text-anchor="start">Member</text><path d="M465 450 V525" class="arrow"/><text x="485" y="463" class="body" text-anchor="start">Quantity</text><text x="485" y="491" class="body" text-anchor="start">UnitPrice</text><text x="485" y="519" class="body" text-anchor="start">Member</text><path d="M735 525 V450" class="arrow"/><text x="758" y="502" class="body" text-anchor="start">Cost</text><path d="M1140 450 V525" class="arrow"/><text x="1040" y="485" class="body" text-anchor="start">Cost</text><path class="call" d="M600 620 V660"/><path d="M600 660 L720 730 L600 800 L480 730 Z" class="box"/><text x="600" y="737" class="heading" text-anchor="middle">Member?</text><path class="call" d="M480 730 H255 V855 M720 730 H945 V855"/><text x="295" y="708" class="heading" text-anchor="start">FALSE</text><text x="835" y="708" class="heading" text-anchor="start">TRUE</text><rect x="55" y="855" width="400" height="130" rx="6" class="box"/><text x="255" y="889" class="heading" text-anchor="middle">StandardCost</text><text x="73" y="924" class="body" text-anchor="start">Quantity, UnitPrice in</text><text x="73" y="952" class="body" text-anchor="start">Return Quantity * UnitPrice</text><rect x="745" y="855" width="400" height="130" rx="6" class="box"/><text x="945" y="889" class="heading" text-anchor="middle">MemberCost</text><text x="763" y="924" class="body" text-anchor="start">Quantity, UnitPrice in</text><text x="763" y="952" class="body" text-anchor="start">Return Quantity * UnitPrice * 0.90</text><text x="35" y="1035" class="body" text-anchor="start">Only one price function is called per order; its returned result becomes CalculateCost’s result.</text><text x="35" y="1063" class="body" text-anchor="start">ReadOrder updates caller variables by reference. Both calculation functions receive value copies.</text><text x="35" y="1091" class="body" text-anchor="start">The zero-order path never calls ProcessOrder. The program supplies exact statement order.</text></svg>