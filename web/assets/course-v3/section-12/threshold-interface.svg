<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="770" viewBox="0 0 1200 770" role="img" aria-label="A configurable pass threshold changes an interface"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#17676f" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#18364d}.title{font-size:30px;font-weight:700}.heading{font-size:23px;font-weight:700}.body{font-size:21px}.box{fill:#edf5f7;stroke:#254963;stroke-width:2}.arrow{fill:none;stroke:#17676f;stroke-width:3;marker-end:url(#arrow)}.call{fill:none;stroke:#526b80;stroke-width:3}</style><rect width="1200" height="770" fill="#fbfcfd"/><text x="35" y="48" class="title" text-anchor="start">A configurable pass threshold changes an interface</text><rect x="35" y="120" width="535" height="200" rx="6" class="box"/><text x="302.5" y="154" class="heading" text-anchor="middle">Existing contract</text><text x="53" y="189" class="body" text-anchor="start">IsPass(Mark) RETURNS BOOLEAN</text><text x="53" y="217" class="body" text-anchor="start">Rule: Mark &gt;= 50</text><text x="53" y="245" class="body" text-anchor="start">Caller supplies one argument.</text><text x="53" y="273" class="body" text-anchor="start">Four marks → one final pass count.</text><rect x="630" y="120" width="535" height="200" rx="6" class="box"/><text x="897.5" y="154" class="heading" text-anchor="middle">Revised contract</text><text x="648" y="189" class="body" text-anchor="start">IsPass(Mark, PassMark) RETURNS BOOLEAN</text><text x="648" y="217" class="body" text-anchor="start">Rule: Mark &gt;= PassMark</text><text x="648" y="245" class="body" text-anchor="start">Caller supplies two arguments.</text><text x="648" y="273" class="body" text-anchor="start">Read PassMark once before the four marks.</text><path d="M575 215 H625" class="arrow"/><rect x="35" y="370" width="1130" height="155" rx="6" class="box"/><text x="600" y="404" class="heading" text-anchor="middle">Keep or deliberately change each responsibility</text><text x="53" y="439" class="body" text-anchor="start">Keep: four validated marks, one initialisation, one increment per pass and one final count.</text><text x="53" y="467" class="body" text-anchor="start">Change together: typed header, input of PassMark, comparison and every function call.</text><text x="53" y="495" class="body" text-anchor="start">The input sequence now begins with the selected threshold; test fixtures must include it.</text><rect x="35" y="575" width="535" height="140" rx="6" class="box"/><text x="302.5" y="609" class="heading" text-anchor="middle">Compatibility case</text><text x="53" y="644" class="body" text-anchor="start">Threshold 50; marks 49,50,69,70</text><text x="53" y="672" class="body" text-anchor="start">Old count 3; revised count 3.</text><text x="53" y="700" class="body" text-anchor="start">The original rule is preserved.</text><rect x="630" y="575" width="535" height="140" rx="6" class="box"/><text x="897.5" y="609" class="heading" text-anchor="middle">New requirement case</text><text x="648" y="644" class="body" text-anchor="start">Threshold 60; same four marks</text><text x="648" y="672" class="body" text-anchor="start">Revised count 2.</text><text x="648" y="700" class="body" text-anchor="start">The changed result is required.</text></svg>