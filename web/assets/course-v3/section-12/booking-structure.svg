<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" role="img" aria-labelledby="title desc"><title id="title">One controller, three responsibilities</title><desc id="desc">BookingController calls ReadBooking, CalculateCharge and DisplayCharge. ReadBooking supplies Seats and Price through reference parameters. CalculateCharge receives value copies and returns the total. DisplayCharge receives that total as Amount.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#176877"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#18323d}.title{font-size:32px;font-weight:700}.label{font-size:26px;font-weight:700}.body{font-size:24px}.note{font-size:22px;fill:#405c65}.box{fill:#edf5f5;stroke:#477784;stroke-width:2}.call{fill:none;stroke:#687d84;stroke-width:3}.data{fill:none;stroke:#176877;stroke-width:3;marker-end:url(#tip)}.state{fill:#fff;stroke:#176877;stroke-width:3}</style><rect width="1280" height="700" fill="#fbfcfc"/><text x="40" y="48" class="title" text-anchor="start">One controller, three responsibilities</text><rect x="410" y="90" width="460" height="110" rx="8" class="box"/><text x="640" y="130" class="label" text-anchor="middle">BookingController</text><text x="640" y="168" class="body" text-anchor="middle">Owns Seats, Price and Total</text><path class="call" d="M640 200 V250 M215 250 H1065 M215 250 V390 M640 250 V390 M1065 250 V390"/><path class="data" d="M165 370 V270"/><text x="55" y="291" class="body" text-anchor="start">Seats</text><text x="55" y="322" class="body" text-anchor="start">Price</text><text x="50" y="355" class="note" text-anchor="start">to caller</text><path class="data" d="M530 270 V370 M750 370 V270"/><text x="547" y="310" class="body" text-anchor="start">in</text><text x="767" y="334" class="body" text-anchor="start">Total</text><path class="data" d="M1130 270 V370"/><text x="915" y="297" class="body" text-anchor="start">Total</text><text x="915" y="329" class="body" text-anchor="start">as Amount</text><rect x="35" y="390" width="360" height="185" rx="8" class="box"/><text x="215" y="432" class="label" text-anchor="middle">ReadBooking</text><text x="58" y="475" class="body" text-anchor="start">BYREF Seats : INTEGER</text><text x="58" y="513" class="body" text-anchor="start">BYREF Price : REAL</text><text x="58" y="552" class="note" text-anchor="start">Reads the two input values</text><rect x="460" y="390" width="360" height="185" rx="8" class="box"/><text x="640" y="432" class="label" text-anchor="middle">CalculateCharge</text><text x="483" y="475" class="body" text-anchor="start">Quantity, PriceEach in</text><text x="483" y="513" class="body" text-anchor="start">Returns a REAL product</text><text x="483" y="552" class="note" text-anchor="start">Quantity × PriceEach</text><rect x="885" y="390" width="360" height="185" rx="8" class="box"/><text x="1065" y="432" class="label" text-anchor="middle">DisplayCharge</text><text x="908" y="475" class="body" text-anchor="start">BYVAL Amount : REAL</text><text x="908" y="513" class="body" text-anchor="start">OUTPUT Amount</text><text x="908" y="552" class="note" text-anchor="start">Displays the supplied total</text><text x="40" y="627" class="note" text-anchor="start">Grey lines: which module calls which. Teal arrows: the direction of supplied data.</text><text x="40" y="659" class="note" text-anchor="start">The parent code specifies read → calculate → display. Each child has one responsibility.</text></svg>