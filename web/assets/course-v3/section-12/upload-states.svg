<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-label="Upload states: the same event can have different outcomes"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#17676f" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#18364d}.title{font-size:30px;font-weight:700}.heading{font-size:23px;font-weight:700}.body{font-size:21px}.box{fill:#edf5f7;stroke:#254963;stroke-width:2}.arrow{fill:none;stroke:#17676f;stroke-width:3;marker-end:url(#arrow)}.call{fill:none;stroke:#526b80;stroke-width:3}</style><rect width="1200" height="880" fill="#fbfcfd"/><text x="35" y="48" class="title" text-anchor="start">Upload states: the same event can have different outcomes</text><text x="35" y="90" class="body" text-anchor="start">Start in Ready. Valid is supplied with complete; its conditions are mutually exclusive.</text><circle cx="50" cy="235" r="9" fill="#18364d"/><path d="M65 235 H145" class="arrow"/><rect x="145" y="185" width="260" height="100" rx="6" class="box"/><text x="275" y="219" class="heading" text-anchor="middle">Ready</text><text x="163" y="254" class="body" text-anchor="start">Waiting for start</text><rect x="700" y="185" width="325" height="100" rx="6" class="box"/><text x="862.5" y="219" class="heading" text-anchor="middle">Uploading</text><text x="718" y="254" class="body" text-anchor="start">Waiting for progress / complete</text><rect x="700" y="545" width="325" height="100" rx="6" class="box"/><text x="862.5" y="579" class="heading" text-anchor="middle">Error</text><text x="718" y="614" class="body" text-anchor="start">Waiting for retry / cancel</text><path d="M405 220 H700" class="arrow"/><text x="525" y="198" class="body" text-anchor="start">start</text><path d="M745 185 C670 110 1030 110 960 185" class="arrow"/><text x="827" y="127" class="body" text-anchor="start">progress</text><path d="M700 265 H430 V310 H275 V285" class="arrow"/><text x="310" y="350" class="body" text-anchor="start">complete [Valid = TRUE]</text><path d="M885 285 V545" class="arrow"/><text x="907" y="415" class="body" text-anchor="start">complete</text><text x="907" y="443" class="body" text-anchor="start">[Valid = FALSE]</text><path d="M745 545 V285" class="arrow"/><text x="675" y="458" class="body" text-anchor="start">retry</text><path d="M700 595 H160 V285" class="arrow"/><text x="180" y="569" class="body" text-anchor="start">cancel from Error → Ready</text><path d="M1025 225 H1135 V735 H95 V285 H145" class="arrow"/><text x="360" y="715" class="body" text-anchor="start">cancel from Uploading → Ready</text><path d="M210 185 C105 85 400 85 335 185" class="arrow"/><text x="245" y="127" class="body" text-anchor="start">cancel</text><text x="35" y="795" class="body" text-anchor="start">Unshown state/event combinations are unspecified. Do not assume that they are ignored.</text><text x="35" y="823" class="body" text-anchor="start">Ready is not a terminal state: the next start event can begin another upload.</text></svg>