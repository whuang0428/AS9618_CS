<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Turnstile states and the events that change them"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#16747b" stroke-width="1.5"/></marker></defs><rect width="1200" height="640" fill="#f7fafc"/><style>text{font-family:Arial,sans-serif;fill:#153451}.title{font-size:30px;font-weight:700}.label{font-size:22px}.small{font-size:18px}.call{fill:none;stroke:#53667b;stroke-width:3}.data{fill:none;stroke:#16747b;stroke-width:3;marker-end:url(#arrow)}</style><text x="40" y="55" class="title">Turnstile states and the events that change them</text><text x="40" y="95" class="small">Initial state: Locked. Only the four transitions drawn here belong to this model.</text><circle cx="80" cy="310" r="10" fill="#153451"/><path class="data" d="M95 310 H200"/><circle cx="310" cy="310" r="100" fill="#e5f3f1" stroke="#16747b" stroke-width="3"/><text x="310" y="318" text-anchor="middle" class="label">Locked</text><circle cx="865" cy="310" r="100" fill="#e9f2f7" stroke="#153451" stroke-width="3"/><text x="865" y="318" text-anchor="middle" class="label">Unlocked</text><path class="data" d="M405 275 H763"/><text x="585" y="253" text-anchor="middle" class="label">coin</text><path class="data" d="M768 355 H410"/><text x="585" y="391" text-anchor="middle" class="label">pass</text><path class="data" d="M250 230 C160 90 460 90 371 230"/><text x="310" y="180" text-anchor="middle" class="label">push</text><path class="data" d="M806 391 C705 553 1022 553 924 391"/><text x="865" y="550" text-anchor="middle" class="label">coin</text><text x="40" y="595" class="small">A loop returns to the same state. An event label does not name a processing module.</text></svg>