<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="ProcessPayroll: module hierarchy and data interfaces"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#16747b" stroke-width="1.5"/></marker></defs><rect width="1200" height="640" fill="#f7fafc"/><style>text{font-family:Arial,sans-serif;fill:#153451}.title{font-size:30px;font-weight:700}.label{font-size:22px}.small{font-size:18px}.call{fill:none;stroke:#53667b;stroke-width:3}.data{fill:none;stroke:#16747b;stroke-width:3;marker-end:url(#arrow)}</style><text x="40" y="55" class="title">ProcessPayroll: module hierarchy and data interfaces</text><text x="40" y="90" class="small">Each child is called by the controlling module. Read left to right for this sequence.</text><rect x="430" y="125" width="340" height="70" rx="5" fill="#e9f2f7" stroke="#153451" stroke-width="2"/><text x="600" y="168" text-anchor="middle" class="label">ProcessPayroll</text><path class="call" d="M600 195 V250 M190 250 H1010 M190 250 V370 M600 250 V370 M1010 250 V370"/><rect x="35" y="370" width="310" height="70" rx="5" fill="#e9f2f7" stroke="#153451" stroke-width="2"/><text x="190" y="413" text-anchor="middle" class="label">ReadHours</text><rect x="440" y="370" width="320" height="70" rx="5" fill="#e9f2f7" stroke="#153451" stroke-width="2"/><text x="600" y="413" text-anchor="middle" class="label">CalculatePay</text><rect x="855" y="370" width="310" height="70" rx="5" fill="#e9f2f7" stroke="#153451" stroke-width="2"/><text x="1010" y="413" text-anchor="middle" class="label">PrintPay</text><path class="data" d="M315 350 V270"/><circle cx="315" cy="350" r="6" fill="white" stroke="#16747b" stroke-width="2"/><text x="40" y="290" class="small">Hours</text><text x="40" y="317" class="small">Rate</text><path class="data" d="M475 272 V349"/><circle cx="475" cy="272" r="6" fill="white" stroke="#16747b" stroke-width="2"/><text x="490" y="296" class="small">Hours</text><text x="490" y="323" class="small">Rate</text><path class="data" d="M730 350 V272"/><circle cx="730" cy="350" r="6" fill="white" stroke="#16747b" stroke-width="2"/><text x="650" y="295" class="small">Pay</text><path class="data" d="M1140 272 V350"/><circle cx="1140" cy="272" r="6" fill="white" stroke="#16747b" stroke-width="2"/><text x="1040" y="309" class="small">Pay</text><text x="45" y="480" class="small">Procedure: fills caller variables</text><text x="460" y="480" class="small">Function: returns one result</text><text x="875" y="480" class="small">Procedure: displays the result</text><text x="40" y="550" class="small">Grey lines: module calls. Teal arrows with open circles: direction of data transfer.</text><text x="40" y="582" class="small">The calculation result returns to the parent before it is passed to the display procedure.</text></svg>