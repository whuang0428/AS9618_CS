<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="675" viewBox="0 0 1280 675" role="img" aria-labelledby="title desc"><title id="title">A booking changes state after an event</title><desc id="desc">Initial state Draft. Submit with a valid request enters Pending; an invalid submit stays Draft. Pay in Pending enters Confirmed. Cancel in Pending or Confirmed returns to Draft. All other state-event pairs remain unchanged in this teaching model.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#176877"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#18323d}.title{font-size:32px;font-weight:700}.label{font-size:26px;font-weight:700}.body{font-size:24px}.note{font-size:22px;fill:#405c65}.box{fill:#edf5f5;stroke:#477784;stroke-width:2}.call{fill:none;stroke:#687d84;stroke-width:3}.data{fill:none;stroke:#176877;stroke-width:3;marker-end:url(#tip)}.state{fill:#fff;stroke:#176877;stroke-width:3}</style><rect width="1280" height="675" fill="#fbfcfc"/><text x="40" y="48" class="title" text-anchor="start">A booking changes state after an event</text><text x="40" y="87" class="note" text-anchor="start">Valid means (Seats >= 1) AND (Seats &lt;= Available). Available is fixed during this trace.</text><circle cx="40" cy="280" r="9" fill="#18323d"/><path class="data" d="M55 280 H110"/><rect x="115" y="235" width="230" height="95" rx="8" class="state"/><text x="230" y="291" class="label" text-anchor="middle">Draft</text><rect x="530" y="235" width="230" height="95" rx="8" class="state"/><text x="645" y="291" class="label" text-anchor="middle">Pending</text><rect x="960" y="235" width="230" height="95" rx="8" class="state"/><text x="1075" y="291" class="label" text-anchor="middle">Confirmed</text><path class="data" d="M345 270 H530"/><text x="437" y="217" class="body" text-anchor="middle">submit [Valid]</text><path class="data" d="M760 270 H960"/><text x="860" y="247" class="body" text-anchor="middle">pay</text><path class="data" d="M170 235 C65 115 395 115 290 235"/><text x="230" y="132" class="body" text-anchor="middle">submit [NOT Valid]</text><path class="data" d="M645 330 V415 H260 V330"/><text x="450" y="404" class="body" text-anchor="middle">cancel</text><path class="data" d="M1075 330 V520 H180 V330"/><text x="810" y="508" class="body" text-anchor="middle">cancel</text><text x="40" y="591" class="note" text-anchor="start">Begin at the filled dot. Use only a transition that leaves the current state.</text><text x="40" y="629" class="note" text-anchor="start">Model rule: every other state/event pair leaves the state unchanged.</text></svg>