<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-label="Replace the called function while preserving its interface"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#17676f" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#18364d}.title{font-size:30px;font-weight:700}.heading{font-size:23px;font-weight:700}.body{font-size:21px}.box{fill:#edf5f7;stroke:#254963;stroke-width:2}.arrow{fill:none;stroke:#17676f;stroke-width:3;marker-end:url(#arrow)}.call{fill:none;stroke:#526b80;stroke-width:3}</style><rect width="1200" height="740" fill="#fbfcfd"/><text x="35" y="48" class="title" text-anchor="start">Replace the called function while preserving its interface</text><text x="35" y="90" class="body" text-anchor="start">Interface: IsAvailable(RoomID : INTEGER) RETURNS BOOLEAN. RoomID is 101 or 102.</text><rect x="35" y="150" width="350" height="150" rx="6" class="box"/><text x="210" y="184" class="heading" text-anchor="middle">Caller</text><text x="53" y="219" class="body" text-anchor="start">Input RoomID</text><text x="53" y="247" class="body" text-anchor="start">Use returned BOOLEAN</text><text x="53" y="275" class="body" text-anchor="start">Display the matching message</text><path d="M385 200 H685" class="arrow"/><text x="450" y="176" class="body" text-anchor="start">RoomID argument</text><rect x="685" y="150" width="480" height="150" rx="6" class="box"/><text x="925" y="184" class="heading" text-anchor="middle">Temporary replacement</text><text x="703" y="219" class="body" text-anchor="start">Version A returns TRUE</text><text x="703" y="247" class="body" text-anchor="start">Version B returns FALSE</text><text x="703" y="275" class="body" text-anchor="start">The RoomID argument is unused</text><path d="M685 265 H385" class="arrow"/><text x="435" y="295" class="body" text-anchor="start">controlled result</text><text x="35" y="355" class="body" text-anchor="start">A: either ID displays Available. B: either ID displays Unavailable.</text><text x="35" y="383" class="body" text-anchor="start">This checks caller branches; it does not establish which room is actually available.</text><path d="M920 305 V465" class="arrow"/><text x="935" y="420" class="body" text-anchor="start">replace</text><rect x="685" y="465" width="480" height="155" rx="6" class="box"/><text x="925" y="499" class="heading" text-anchor="middle">Real function for the stated fixture</text><text x="703" y="534" class="body" text-anchor="start">Room 101: available</text><text x="703" y="562" class="body" text-anchor="start">Room 102: unavailable</text><text x="703" y="590" class="body" text-anchor="start">RETURN RoomID = 101</text><rect x="35" y="465" width="550" height="155" rx="6" class="box"/><text x="310" y="499" class="heading" text-anchor="middle">Integration evidence after replacement</text><text x="53" y="534" class="body" text-anchor="start">101 must display Available.</text><text x="53" y="562" class="body" text-anchor="start">102 must display Unavailable.</text><text x="53" y="590" class="body" text-anchor="start">Check both the result and its use by the caller.</text><text x="35" y="695" class="body" text-anchor="start">The function name, parameter type and result type stay the same across all three versions.</text></svg>