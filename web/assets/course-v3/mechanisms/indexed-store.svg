<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="605" viewBox="0 0 1100 605" role="img" aria-labelledby="title desc"><title id="title">Resolve the index, copy the value, then store a copy</title><desc id="desc">Initially IX = 2 and Memory[402] = 31. Execute LDX 400, then STO 450. LDX reads Memory[400 + 2], so ACC becomes 31; STO copies 31 into Memory[450]. The source at 402 remains 31, ACC remains 31 and IX remains 2. Data movement does not consume its source.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176b70"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a43c35"/></marker></defs><rect width="1100" height="605" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="50" text-anchor="start" fill="#17374d" font-size="32"><tspan x="35" dy="0">Resolve the index, copy the value, then store a copy</tspan></text><text x="35" y="115" text-anchor="start" fill="#17374d" font-size="27"><tspan x="35" dy="0">Execute LDX 400, then STO 450. IX = 2.</tspan></text><rect x="35" y="170" width="235" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="152.5" y="206.875" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="152.5" dy="0">Effective address</tspan><tspan x="152.5" dy="33.75">400 + 2 = 402</tspan></text><g data-from="address" data-to="source"><path d="M270 215H300" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="300" y="170" width="235" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="417.5" y="206.875" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="417.5" dy="0">Read source</tspan><tspan x="417.5" dy="33.75">Memory[402] = 31</tspan></text><g data-from="source" data-to="acc"><path d="M535 215H565" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="565" y="170" width="235" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="682.5" y="206.875" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="682.5" dy="0">Load ACC</tspan><tspan x="682.5" dy="33.75">31</tspan></text><g data-from="acc" data-to="destination"><path d="M800 215H830" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="830" y="170" width="235" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="947.5" y="206.875" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="947.5" dy="0">Store a copy</tspan><tspan x="947.5" dy="33.75">Memory[450] = 31</tspan></text><rect x="35" y="355" width="1030" height="90" rx="10" fill="#fff4dd" stroke="#176b70" stroke-width="2"/><text x="550" y="392.2" text-anchor="middle" fill="#17374d" font-size="24"><tspan x="550" dy="0">After both instructions: Memory[402] = 31; ACC = 31; IX = 2.</tspan><tspan x="550" dy="32.400000000000006">MOV IX has another direction: it copies ACC into IX.</tspan></text></g></svg>
