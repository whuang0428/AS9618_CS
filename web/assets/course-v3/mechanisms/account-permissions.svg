<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-labelledby="title desc"><title id="title">Establish an identity before checking what that identity may do</title><desc id="desc">The supplied password is checked against the account’s stored verifier to authenticate the claimed identity. Only after successful login can permissions for that identity authorise an operation. An authenticated account can still be denied a protected file. Separate accounts also support attribution of recorded activity.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176b70"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a43c35"/></marker></defs><rect width="1100" height="640" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="50" text-anchor="start" fill="#17374d" font-size="32"><tspan x="35" dy="0">Establish an identity before checking what that identity may do</tspan></text><rect x="35" y="140" width="255" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="162.5" y="176.54999999999998" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="162.5" dy="0">Claimed account</tspan><tspan x="162.5" dy="35.1">Supplied password</tspan></text><g data-from="credentials" data-to="authenticate"><path d="M290 185H420" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><polygon points="580,115 740,185 580,255 420,185" fill="#fff4dd" stroke="#176b70" stroke-width="2"/><text x="580" y="177" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="580" dy="0">Password check</tspan><tspan x="580" dy="33.75">succeeds?</tspan></text><g data-from="authenticate" data-to="deny-login"><path d="M740 185H835" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><text x="788" y="168" text-anchor="middle" fill="#176b70" font-size="23"><tspan x="788" dy="0">NO</tspan></text></g><rect x="835" y="140" width="230" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="950" y="176.54999999999998" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="950" dy="0">Reject</tspan><tspan x="950" dy="35.1">login</tspan></text><g data-from="authenticate" data-to="permissions"><path d="M580 255V355" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><text x="629" y="306" text-anchor="middle" fill="#176b70" font-size="23"><tspan x="629" dy="0">YES</tspan></text></g><rect x="350" y="355" width="460" height="100" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="580" y="396.55" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="580" dy="0">Check permissions for the account</tspan><tspan x="580" dy="35.1">Allow or deny this operation</tspan></text><text x="35" y="577" text-anchor="start" fill="#17374d" font-size="25"><tspan x="35" dy="0">A valid password does not give the account every possible access right.</tspan></text></g></svg>
