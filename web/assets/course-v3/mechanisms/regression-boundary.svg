<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="575" viewBox="0 0 1100 575" role="img" aria-labelledby="title desc"><title id="title">Retest the failing boundary and the neighbouring behaviours</title><desc id="desc">The requirement is Pass for Mark &gt;= 50. The faulty program uses Mark &gt; 50. At 49 the original and corrected outputs are Fail. At 50 the old output Fail changes to Pass. At 51 both output Pass. Rechecking 50 demonstrates the fix; checking 49 and 51 gives regression evidence for nearby behaviour.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176b70"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a43c35"/></marker></defs><rect width="1100" height="575" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="50" text-anchor="start" fill="#17374d" font-size="32"><tspan x="35" dy="0">Retest the failing boundary and the neighbouring behaviours</tspan></text><text x="430" y="130" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="430" dy="0">Mark 49</tspan></text><text x="670" y="130" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="670" dy="0">Mark 50</tspan></text><text x="910" y="130" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="910" dy="0">Mark 51</tspan></text><text x="35" y="232" text-anchor="start" fill="#17374d" font-size="26"><tspan x="35" dy="0">Before: &gt; 50</tspan></text><g data-state="old-pass"><g data-cell="1" data-active="true"><rect x="315" y="190" width="232" height="64" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="431" y="231.8" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="431" dy="0">Fail</tspan></text></g><g data-cell="2" data-active="true"><rect x="555" y="190" width="232" height="64" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="671" y="231.8" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="671" dy="0">Fail</tspan></text></g><g data-cell="3" data-active="true"><rect x="795" y="190" width="232" height="64" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="911" y="231.8" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="911" dy="0">Pass</tspan></text></g></g><text x="35" y="363" text-anchor="start" fill="#17374d" font-size="26"><tspan x="35" dy="0">After: &gt;= 50</tspan></text><g data-state="fixed-pass"><g data-cell="1" data-active="true"><rect x="315" y="320" width="232" height="64" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="431" y="361.8" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="431" dy="0">Fail</tspan></text></g><g data-cell="2" data-active="true"><rect x="555" y="320" width="232" height="64" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="671" y="361.8" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="671" dy="0">Pass</tspan></text></g><g data-cell="3" data-active="true"><rect x="795" y="320" width="232" height="64" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="911" y="361.8" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="911" dy="0">Pass</tspan></text></g></g><text x="35" y="455" text-anchor="start" fill="#17374d" font-size="24"><tspan x="35" dy="0">49 and 51 preserve their outcomes. The boundary value 50 exposes the correction.</tspan></text><text x="35" y="535" text-anchor="start" fill="#17374d" font-size="25"><tspan x="35" dy="0">Expected results come from the requirement, not from the faulty program.</tspan></text></g></svg>
