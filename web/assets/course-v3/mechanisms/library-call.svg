<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="595" viewBox="0 0 1100 595" role="img" aria-labelledby="title desc"><title id="title">Use the routine’s contract to supply input and interpret its result</title><desc id="desc">The supplied SQRT routine accepts a non-negative number and returns its square root. The caller passes 81, receives 9 and stores it in Result without implementing square root itself. Test the surrounding program and respect the routine’s preconditions; a correct library cannot correct an inappropriate call.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176b70"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a43c35"/></marker></defs><rect width="1100" height="595" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="50" text-anchor="start" fill="#17374d" font-size="32"><tspan x="35" dy="0">Use the routine’s contract to supply input and interpret its result</tspan></text><rect x="35" y="155" width="410" height="110" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="240" y="201.54999999999998" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="240" dy="0">Caller</tspan><tspan x="240" dy="35.1">Result &lt;- SQRT(81)</tspan></text><g data-from="caller" data-to="library"><path d="M445 192H715" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><text x="580" y="174" text-anchor="middle" fill="#176b70" font-size="23"><tspan x="580" dy="0">Argument: 81</tspan></text></g><rect x="715" y="155" width="350" height="110" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="890" y="201.54999999999998" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="890" dy="0">Library routine</tspan><tspan x="890" dy="35.1">SQRT</tspan></text><g data-from="library" data-to="caller"><path d="M715 240H445" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><text x="580" y="226" text-anchor="middle" fill="#176b70" font-size="23"><tspan x="580" dy="0">Result: 9</tspan></text></g><rect x="35" y="370" width="1030" height="90" rx="10" fill="#fff4dd" stroke="#176b70" stroke-width="2"/><text x="550" y="407.2" text-anchor="middle" fill="#17374d" font-size="24"><tspan x="550" dy="0">Check the name, argument order and types, return value and preconditions.</tspan><tspan x="550" dy="32.400000000000006">For this routine, reject unsupported negative input; test zero as well as 81.</tspan></text></g></svg>
