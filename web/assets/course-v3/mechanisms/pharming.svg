<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc"><title id="title">Pharming can redirect a correctly typed address</title><desc id="desc">The user types the intended hostname. A corrupted name-resolution path supplies the attacker-controlled destination. The browser may reach a fraudulent server despite the address being entered correctly. A hostname or certificate mismatch is a warning. HTTPS alone is not proof of the organisation behind a site.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176b70"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a43c35"/></marker></defs><rect width="1100" height="620" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="50" text-anchor="start" fill="#17374d" font-size="32"><tspan x="35" dy="0">Pharming can redirect a correctly typed address</tspan></text><rect x="35" y="155" width="235" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="152.5" y="191.875" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="152.5" dy="0">User types</tspan><tspan x="152.5" dy="33.75">intended hostname</tspan></text><g data-from="typed" data-to="resolver"><path d="M270 200H300" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="300" y="155" width="235" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="417.5" y="191.875" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="417.5" dy="0">Name resolution</tspan><tspan x="417.5" dy="33.75">has been corrupted</tspan></text><g data-from="resolver" data-to="wrong-address"><path d="M535 200H565" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="565" y="155" width="235" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="682.5" y="191.875" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="682.5" dy="0">Wrong server</tspan><tspan x="682.5" dy="33.75">address supplied</tspan></text><g data-from="wrong-address" data-to="fake-server"><path d="M800 200H830" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="830" y="155" width="235" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="947.5" y="191.875" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="947.5" dy="0">Fraudulent</tspan><tspan x="947.5" dy="33.75">destination</tspan></text><rect x="35" y="365" width="500" height="110" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="285" y="411.55" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="285" dy="0">Protect name-resolution settings</tspan><tspan x="285" dy="35.1">Investigate certificate/hostname warnings</tspan></text><text x="610" y="396" text-anchor="start" fill="#17374d" font-size="24"><tspan x="610" dy="0">The changed destination is the mechanism.</tspan><tspan x="610" dy="32.400000000000006">A deceptive message is not required</tspan><tspan x="610" dy="32.400000000000006">in this example.</tspan></text><text x="35" y="574" text-anchor="start" fill="#17374d" font-size="25"><tspan x="35" dy="0">Correct spelling does not repair corrupted name-resolution information.</tspan></text></g></svg>
