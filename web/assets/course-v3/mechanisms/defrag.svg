<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="525" viewBox="0 0 1100 525" role="img" aria-labelledby="title desc"><title id="title">Rearrange file blocks without changing the file</title><desc id="desc">A1, A2 and A3 are consecutive logical parts of file A, initially separated physically by B and free blocks. After relocation A1, A2 and A3 occupy consecutive disk blocks. B1 and B2 and the amount of free space are preserved. On an HDD this can reduce mechanical seeking. An SSD has no moving read head.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176b70"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a43c35"/></marker></defs><rect width="1100" height="525" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="50" text-anchor="start" fill="#17374d" font-size="32"><tspan x="35" dy="0">Rearrange file blocks without changing the file</tspan></text><text x="35" y="125" text-anchor="start" fill="#17374d" font-size="25"><tspan x="35" dy="0">Each box is one physical block on a simplified magnetic disk.</tspan></text><text x="35" y="196" text-anchor="start" fill="#17374d" font-size="26"><tspan x="35" dy="0">Before</tspan></text><g data-state="disk-before"><g data-cell="1" data-active="true"><rect x="35" y="220" width="140" height="64" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="105" y="261.8" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="105" dy="0">A1</tspan></text></g><g data-cell="2" data-active="true"><rect x="183" y="220" width="140" height="64" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="253" y="261.8" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="253" dy="0">B1</tspan></text></g><g data-cell="3" data-active="true"><rect x="331" y="220" width="140" height="64" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="401" y="261.8" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="401" dy="0">—</tspan></text></g><g data-cell="4" data-active="true"><rect x="479" y="220" width="140" height="64" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="549" y="261.8" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="549" dy="0">A2</tspan></text></g><g data-cell="5" data-active="true"><rect x="627" y="220" width="140" height="64" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="697" y="261.8" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="697" dy="0">B2</tspan></text></g><g data-cell="6" data-active="true"><rect x="775" y="220" width="140" height="64" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="845" y="261.8" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="845" dy="0">A3</tspan></text></g><g data-cell="7" data-active="true"><rect x="923" y="220" width="140" height="64" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="993" y="261.8" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="993" dy="0">—</tspan></text></g></g><text x="35" y="346" text-anchor="start" fill="#17374d" font-size="26"><tspan x="35" dy="0">After defragmentation</tspan></text><g data-state="disk-after"><g data-cell="1" data-active="true"><rect x="35" y="370" width="140" height="64" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="105" y="411.8" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="105" dy="0">A1</tspan></text></g><g data-cell="2" data-active="true"><rect x="183" y="370" width="140" height="64" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="253" y="411.8" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="253" dy="0">A2</tspan></text></g><g data-cell="3" data-active="true"><rect x="331" y="370" width="140" height="64" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="401" y="411.8" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="401" dy="0">A3</tspan></text></g><g data-cell="4" data-active="true"><rect x="479" y="370" width="140" height="64" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="549" y="411.8" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="549" dy="0">B1</tspan></text></g><g data-cell="5" data-active="true"><rect x="627" y="370" width="140" height="64" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="697" y="411.8" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="697" dy="0">B2</tspan></text></g><g data-cell="6" data-active="true"><rect x="775" y="370" width="140" height="64" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="845" y="411.8" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="845" dy="0">—</tspan></text></g><g data-cell="7" data-active="true"><rect x="923" y="370" width="140" height="64" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="993" y="411.8" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="993" dy="0">—</tspan></text></g></g><text x="35" y="494" text-anchor="start" fill="#17374d" font-size="25"><tspan x="35" dy="0">File A still contains A1 → A2 → A3; only the physical placement changes.</tspan></text></g></svg>
