<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="565" viewBox="0 0 1100 565" role="img" aria-labelledby="title desc"><title id="title">Top marks the active stack, even if an old value remains</title><desc id="desc">Capacity is 3 and Top is the last occupied 1-based index. Start with A and B, Top = 2. PUSH C stores C at index 3 and sets Top = 3. POP then returns C and restores Top = 2. C can remain physically in cell 3 after POP, but that cell is inactive. Top = 0 is empty; Top = 3 is full.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176b70"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a43c35"/></marker></defs><rect width="1100" height="565" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="50" text-anchor="start" fill="#17374d" font-size="32"><tspan x="35" dy="0">Top marks the active stack, even if an old value remains</tspan></text><text x="35" y="130" text-anchor="start" fill="#17374d" font-size="27"><tspan x="35" dy="0">Start</tspan></text><g data-stack="0" data-index="3" data-active="false"><rect x="80" y="170" width="205" height="65" rx="10" fill="#f2f4f6" stroke="#176b70" stroke-width="2"/><text x="182.5" y="212.3" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="182.5" dy="0">—</tspan></text><text x="52" y="210" text-anchor="middle" fill="#17374d" font-size="24"><tspan x="52" dy="0">3</tspan></text></g><g data-stack="0" data-index="2" data-active="true"><rect x="80" y="247" width="205" height="65" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="182.5" y="289.3" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="182.5" dy="0">B</tspan></text><text x="52" y="287" text-anchor="middle" fill="#17374d" font-size="24"><tspan x="52" dy="0">2</tspan></text></g><g data-stack="0" data-index="1" data-active="true"><rect x="80" y="324" width="205" height="65" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="182.5" y="366.3" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="182.5" dy="0">A</tspan></text><text x="52" y="364" text-anchor="middle" fill="#17374d" font-size="24"><tspan x="52" dy="0">1</tspan></text></g><text x="185" y="452" text-anchor="middle" fill="#17374d" font-size="27"><tspan x="185" dy="0">Top = 2</tspan></text><path d="M299 280H387" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><text x="400" y="130" text-anchor="start" fill="#17374d" font-size="27"><tspan x="400" dy="0">PUSH C</tspan></text><g data-stack="1" data-index="3" data-active="true"><rect x="445" y="170" width="205" height="65" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="547.5" y="212.3" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="547.5" dy="0">C</tspan></text><text x="417" y="210" text-anchor="middle" fill="#17374d" font-size="24"><tspan x="417" dy="0">3</tspan></text></g><g data-stack="1" data-index="2" data-active="true"><rect x="445" y="247" width="205" height="65" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="547.5" y="289.3" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="547.5" dy="0">B</tspan></text><text x="417" y="287" text-anchor="middle" fill="#17374d" font-size="24"><tspan x="417" dy="0">2</tspan></text></g><g data-stack="1" data-index="1" data-active="true"><rect x="445" y="324" width="205" height="65" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="547.5" y="366.3" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="547.5" dy="0">A</tspan></text><text x="417" y="364" text-anchor="middle" fill="#17374d" font-size="24"><tspan x="417" dy="0">1</tspan></text></g><text x="550" y="452" text-anchor="middle" fill="#17374d" font-size="27"><tspan x="550" dy="0">Top = 3</tspan></text><path d="M664 280H752" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><text x="765" y="130" text-anchor="start" fill="#17374d" font-size="27"><tspan x="765" dy="0">POP returns C</tspan></text><g data-stack="2" data-index="3" data-active="false"><rect x="810" y="170" width="205" height="65" rx="10" fill="#f2f4f6" stroke="#176b70" stroke-width="2"/><text x="912.5" y="212.3" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="912.5" dy="0">C</tspan></text><text x="782" y="210" text-anchor="middle" fill="#17374d" font-size="24"><tspan x="782" dy="0">3</tspan></text></g><g data-stack="2" data-index="2" data-active="true"><rect x="810" y="247" width="205" height="65" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="912.5" y="289.3" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="912.5" dy="0">B</tspan></text><text x="782" y="287" text-anchor="middle" fill="#17374d" font-size="24"><tspan x="782" dy="0">2</tspan></text></g><g data-stack="2" data-index="1" data-active="true"><rect x="810" y="324" width="205" height="65" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="912.5" y="366.3" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="912.5" dy="0">A</tspan></text><text x="782" y="364" text-anchor="middle" fill="#17374d" font-size="24"><tspan x="782" dy="0">1</tspan></text></g><text x="915" y="452" text-anchor="middle" fill="#17374d" font-size="27"><tspan x="915" dy="0">Top = 2</tspan></text><text x="35" y="525" text-anchor="start" fill="#17374d" font-size="25"><tspan x="35" dy="0">Grey means inactive. The next PUSH overwrites the cell above Top.</tspan></text></g></svg>
