<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590" role="img" aria-labelledby="title desc"><title id="title">An infected host can carry replication to other files</title><desc id="desc">A virus attaches to or modifies a host file or program. Executing the infected host can run the virus, which can replicate into further files and run a harmful payload. Sharing an infected host can carry it to another computer. Replication here depends on the host being executed, not merely existing in a folder.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176b70"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a43c35"/></marker></defs><rect width="1100" height="590" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="50" text-anchor="start" fill="#17374d" font-size="32"><tspan x="35" dy="0">An infected host can carry replication to other files</tspan></text><rect x="35" y="170" width="235" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="152.5" y="206.875" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="152.5" dy="0">Infected host</tspan><tspan x="152.5" dy="33.75">Contains virus code</tspan></text><g data-from="host" data-to="execute"><path d="M270 215H300" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="300" y="170" width="235" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="417.5" y="206.875" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="417.5" dy="0">Host executes</tspan><tspan x="417.5" dy="33.75">Virus code can run</tspan></text><g data-from="execute" data-to="replicate"><path d="M535 215H565" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="565" y="170" width="235" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="682.5" y="206.875" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="682.5" dy="0">Replication</tspan><tspan x="682.5" dy="33.75">Other files infected</tspan></text><g data-from="replicate" data-to="share"><path d="M800 215H830" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="830" y="170" width="235" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="947.5" y="206.875" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="947.5" dy="0">Shared infected file</tspan><tspan x="947.5" dy="33.75">Reaches another PC</tspan></text><g data-from="execute" data-to="payload"><path d="M417 260V355" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="255" y="355" width="380" height="100" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="445" y="396.55" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="445" dy="0">Possible payload</tspan><tspan x="445" dy="35.1">Corrupt or disrupt data</tspan></text><text x="35" y="551" text-anchor="start" fill="#17374d" font-size="24"><tspan x="35" dy="0">Reduce risk by avoiding untrusted execution and maintaining detection software.</tspan></text></g></svg>
