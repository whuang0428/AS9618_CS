<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc"><title id="title">Rejected inputs repeat within one accepted-mark slot</title><desc id="desc">Three outer slots require three accepted marks. Inputs are -1, 0, 50, 101, 100. Slot 1 rejects -1 then accepts 0; slot 2 accepts 50; slot 3 rejects 101 then accepts 100. Only 0, 50 and 100 are recorded: Total = 150, Mean = 50, Passed = 2. The pass threshold is at least 50.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176b70"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a43c35"/></marker></defs><rect width="1100" height="660" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="50" text-anchor="start" fill="#17374d" font-size="32"><tspan x="35" dy="0">Rejected inputs repeat within one accepted-mark slot</tspan></text><text x="35" y="135" text-anchor="start" fill="#17374d" font-size="28"><tspan x="35" dy="0">Slot 1</tspan></text><rect x="35" y="180" width="300" height="110" rx="10" fill="#f3f7fa" stroke="#176b70" stroke-width="2"/><text x="185" y="226.54999999999998" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="185" dy="0">-1: reject</tspan><tspan x="185" dy="35.1">0: accept</tspan></text><g data-from="attempts-0" data-to="record-0"><path d="M185 290V365" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="35" y="365" width="300" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="185" y="401.55" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="185" dy="0">Record only</tspan><tspan x="185" dy="35.1">0</tspan></text><text x="400" y="135" text-anchor="start" fill="#17374d" font-size="28"><tspan x="400" dy="0">Slot 2</tspan></text><rect x="400" y="180" width="300" height="110" rx="10" fill="#f3f7fa" stroke="#176b70" stroke-width="2"/><text x="550" y="244.1" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="550" dy="0">50: accept</tspan></text><g data-from="attempts-1" data-to="record-1"><path d="M550 290V365" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="400" y="365" width="300" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="550" y="401.55" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="550" dy="0">Record only</tspan><tspan x="550" dy="35.1">50</tspan></text><text x="765" y="135" text-anchor="start" fill="#17374d" font-size="28"><tspan x="765" dy="0">Slot 3</tspan></text><rect x="765" y="180" width="300" height="110" rx="10" fill="#f3f7fa" stroke="#176b70" stroke-width="2"/><text x="915" y="226.54999999999998" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="915" dy="0">101: reject</tspan><tspan x="915" dy="35.1">100: accept</tspan></text><g data-from="attempts-2" data-to="record-2"><path d="M915 290V365" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="765" y="365" width="300" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="915" y="401.55" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="915" dy="0">Record only</tspan><tspan x="915" dy="35.1">100</tspan></text><rect x="35" y="520" width="1030" height="90" rx="10" fill="#fff4dd" stroke="#176b70" stroke-width="2"/><text x="550" y="557.1999999999999" text-anchor="middle" fill="#17374d" font-size="24"><tspan x="550" dy="0">Accepted values: 0 + 50 + 100 = 150; mean = 150 / 3 = 50.</tspan><tspan x="550" dy="32.400000000000006">Two accepted marks meet Mark &gt;= 50. Invalid attempts affect neither total nor count.</tspan></text></g></svg>
