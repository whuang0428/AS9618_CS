<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610" role="img" aria-labelledby="title desc"><title id="title">Phishing succeeds by persuading a person to act</title><desc id="desc">An impersonating message creates a pretext such as an urgent account problem. Following its link can take the user to a fake sign-in page where submitted credentials are captured. An independent known contact or website checks the request without trusting the supplied link.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176b70"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a43c35"/></marker></defs><rect width="1100" height="610" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="50" text-anchor="start" fill="#17374d" font-size="32"><tspan x="35" dy="0">Phishing succeeds by persuading a person to act</tspan></text><rect x="35" y="155" width="235" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="152.5" y="191.875" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="152.5" dy="0">Impersonating</tspan><tspan x="152.5" dy="33.75">message</tspan></text><g data-from="message" data-to="click"><path d="M270 200H300" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="300" y="155" width="235" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="417.5" y="191.875" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="417.5" dy="0">User follows</tspan><tspan x="417.5" dy="33.75">its link</tspan></text><g data-from="click" data-to="fake"><path d="M535 200H565" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="565" y="155" width="235" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="682.5" y="191.875" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="682.5" dy="0">Fake sign-in</tspan><tspan x="682.5" dy="33.75">page</tspan></text><g data-from="fake" data-to="capture"><path d="M800 200H830" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="830" y="155" width="235" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="947.5" y="191.875" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="947.5" dy="0">Credentials</tspan><tspan x="947.5" dy="33.75">captured</tspan></text><g data-from="message" data-to="check"><path d="M152 245V365" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="35" y="365" width="500" height="105" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="285" y="409.05" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="285" dy="0">Alternative: verify independently</tspan><tspan x="285" dy="35.1">Use a known contact or saved address</tspan></text><text x="610" y="395" text-anchor="start" fill="#17374d" font-size="24"><tspan x="610" dy="0">The deception targets the user’s trust.</tspan><tspan x="610" dy="32.400000000000006">MFA may limit password theft;</tspan><tspan x="610" dy="32.400000000000006">it does not validate every request.</tspan></text><text x="35" y="570" text-anchor="start" fill="#17374d" font-size="25"><tspan x="35" dy="0">A request’s urgency is not evidence that its sender is genuine.</tspan></text></g></svg>
