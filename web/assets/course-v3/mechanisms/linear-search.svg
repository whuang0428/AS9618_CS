<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Stop at the first match; guard the index when no match exists</title><desc id="desc">Search Values[1:5] = 9, 4, 6, 4, 2 for target 4. Index 1 is a mismatch; index 2 matches, so Position = 2 and the second 4 at index 4 is never inspected. If the target is absent, Position stays 0 and the search stops after checking index 5, before any Values[6] access.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176b70"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a43c35"/></marker></defs><rect width="1100" height="650" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="50" text-anchor="start" fill="#17374d" font-size="32"><tspan x="35" dy="0">Stop at the first match; guard the index when no match exists</tspan></text><text x="315" y="133" text-anchor="middle" fill="#17374d" font-size="24"><tspan x="315" dy="0">Index 1</tspan></text><text x="465" y="133" text-anchor="middle" fill="#17374d" font-size="24"><tspan x="465" dy="0">Index 2</tspan></text><text x="615" y="133" text-anchor="middle" fill="#17374d" font-size="24"><tspan x="615" dy="0">Index 3</tspan></text><text x="765" y="133" text-anchor="middle" fill="#17374d" font-size="24"><tspan x="765" dy="0">Index 4</tspan></text><text x="915" y="133" text-anchor="middle" fill="#17374d" font-size="24"><tspan x="915" dy="0">Index 5</tspan></text><g data-state="search-values"><g data-cell="1" data-active="true"><rect x="245" y="170" width="142" height="64" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="316" y="211.8" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="316" dy="0">9</tspan></text></g><g data-cell="2" data-active="true"><rect x="395" y="170" width="142" height="64" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="466" y="211.8" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="466" dy="0">4</tspan></text></g><g data-cell="3" data-active="true"><rect x="545" y="170" width="142" height="64" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="616" y="211.8" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="616" dy="0">6</tspan></text></g><g data-cell="4" data-active="true"><rect x="695" y="170" width="142" height="64" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="766" y="211.8" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="766" dy="0">4</tspan></text></g><g data-cell="5" data-active="true"><rect x="845" y="170" width="142" height="64" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="916" y="211.8" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="916" dy="0">2</tspan></text></g></g><text x="35" y="288" text-anchor="start" fill="#17374d" font-size="28"><tspan x="35" dy="0">Target = 4</tspan></text><g data-from="check-1" data-to="check-2"><path d="M315 234V340H465V234" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><text x="410" y="386" text-anchor="middle" fill="#176b70" font-size="23"><tspan x="410" dy="0">Mismatch → next</tspan></text></g><text x="675" y="292" text-anchor="start" fill="#17374d" font-size="27"><tspan x="675" dy="0">Match at index 2</tspan><tspan x="675" dy="36.45">Position &lt;- 2; stop</tspan></text><rect x="35" y="480" width="1030" height="90" rx="10" fill="#fff4dd" stroke="#176b70" stroke-width="2"/><text x="550" y="517.2" text-anchor="middle" fill="#17374d" font-size="24"><tspan x="550" dy="0">The reported result is the index 2, not the target value 4.</tspan><tspan x="550" dy="32.400000000000006">No match: keep Position = 0 and stop before reading outside indices 1..5.</tspan></text></g></svg>
