<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-labelledby="title desc"><title id="title">The CU coordinates the operation; the ALU calculates the result</title><desc id="desc">CIR contains ADD 410, ACC starts at 6 and Memory[410] contains 11. The CU decodes ADD and coordinates the operand read; the ALU adds 6 and 11. The result 17 is retained in ACC. Clock pulses synchronise operations; one instruction can take several cycles.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176b70"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a43c35"/></marker></defs><rect width="1100" height="700" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="50" text-anchor="start" fill="#17374d" font-size="32"><tspan x="35" dy="0">The CU coordinates the operation; the ALU calculates the result</tspan></text><rect x="35" y="130" width="270" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="170" y="166.54999999999998" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="170" dy="0">CIR</tspan><tspan x="170" dy="35.1">ADD 410</tspan></text><g data-from="cir" data-to="cu"><path d="M305 175H430" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="430" y="130" width="260" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="560" y="166.54999999999998" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="560" dy="0">Control unit</tspan><tspan x="560" dy="35.1">Decode and signal</tspan></text><rect x="795" y="130" width="270" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="930" y="166.54999999999998" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="930" dy="0">System clock</tspan><tspan x="930" dy="35.1">Regular pulses</tspan></text><g data-from="clock" data-to="cu"><path d="M795 175H690" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><g data-from="cu" data-to="alu"><path d="M560 220V320" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="35" y="320" width="270" height="100" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="170" y="361.55" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="170" dy="0">ACC before</tspan><tspan x="170" dy="35.1">6</tspan></text><g data-from="acc-old" data-to="alu"><path d="M305 370H430" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="430" y="320" width="260" height="100" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="560" y="361.55" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="560" dy="0">ALU</tspan><tspan x="560" dy="35.1">6 + 11 = 17</tspan></text><rect x="795" y="320" width="270" height="100" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="930" y="361.55" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="930" dy="0">IAS / main memory</tspan><tspan x="930" dy="35.1">Memory[410] = 11</tspan></text><g data-from="memory" data-to="alu"><path d="M795 370H690" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><g data-from="alu" data-to="acc-new"><path d="M560 420V505" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="390" y="505" width="340" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="560" y="541.5500000000001" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="560" dy="0">ACC after</tspan><tspan x="560" dy="35.1">17</tspan></text><text x="35" y="660" text-anchor="start" fill="#17374d" font-size="24"><tspan x="35" dy="0">IAS holds instructions and data during execution; secondary storage has another role.</tspan></text></g></svg>
