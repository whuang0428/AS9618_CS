<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="605" viewBox="0 0 1100 605" role="img" aria-labelledby="title desc"><title id="title">Applications request services through the operating system</title><desc id="desc">A user chooses Save in an editor; the editor requests a named file operation from the OS. The OS checks permission and coordinates a device driver and storage hardware. The application supplies editing behaviour; the OS supplies shared resource management and services.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176b70"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a43c35"/></marker></defs><rect width="1100" height="605" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="50" text-anchor="start" fill="#17374d" font-size="32"><tspan x="35" dy="0">Applications request services through the operating system</tspan></text><rect x="35" y="165" width="235" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="152.5" y="201.875" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="152.5" dy="0">User</tspan><tspan x="152.5" dy="33.75">Select Save</tspan></text><g data-from="user" data-to="application"><path d="M270 210H300" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="300" y="165" width="235" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="417.5" y="201.875" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="417.5" dy="0">Application</tspan><tspan x="417.5" dy="33.75">Request file save</tspan></text><g data-from="application" data-to="os"><path d="M535 210H565" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="565" y="165" width="235" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="682.5" y="201.875" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="682.5" dy="0">Operating system</tspan><tspan x="682.5" dy="33.75">Coordinate access</tspan></text><g data-from="os" data-to="hardware"><path d="M800 210H830" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="830" y="165" width="235" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="947.5" y="201.875" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="947.5" dy="0">Driver / hardware</tspan><tspan x="947.5" dy="33.75">Perform transfer</tspan></text><g data-from="hardware" data-to="result"><path d="M947 255V370H780" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="400" y="325" width="380" height="100" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="590" y="366.55" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="590" dy="0">Completion or error</tspan><tspan x="590" dy="35.1">Reported to the application</tspan></text><text x="35" y="537" text-anchor="start" fill="#17374d" font-size="24"><tspan x="35" dy="0">The OS also provides user interfaces and manages other shared computer resources.</tspan></text></g></svg>
