<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-labelledby="title desc"><title id="title">A finite buffer absorbs a burst but cannot remove a sustained deficit</title><desc id="desc">Illustrative buffer capacity: 8 items. It starts with 2 items; 4 arrive and 2 are consumed in each interval. Occupancy at interval boundaries is 2, 4, 6, 8: a net gain of 2 items per interval. Once full, further arrivals must be delayed or may be lost. The receiver still consumes only 2 items per interval.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176b70"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a43c35"/></marker></defs><rect width="1100" height="600" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="50" text-anchor="start" fill="#17374d" font-size="32"><tspan x="35" dy="0">A finite buffer absorbs a burst but cannot remove a sustained deficit</tspan></text><text x="35" y="113" text-anchor="start" fill="#17374d" font-size="25"><tspan x="35" dy="0">Simplified rate model: +4 received −2 consumed = +2 items per interval.</tspan></text><text x="35" y="171" text-anchor="start" fill="#17374d" font-size="24"><tspan x="35" dy="0">After 0 intervals</tspan></text><g data-buffer="0" data-level="2"><rect x="95" y="402" width="145" height="24" fill="#176b70" stroke="#bdcdd4"/><rect x="95" y="375" width="145" height="24" fill="#176b70" stroke="#bdcdd4"/><rect x="95" y="348" width="145" height="24" fill="#edf1f3" stroke="#bdcdd4"/><rect x="95" y="321" width="145" height="24" fill="#edf1f3" stroke="#bdcdd4"/><rect x="95" y="294" width="145" height="24" fill="#edf1f3" stroke="#bdcdd4"/><rect x="95" y="267" width="145" height="24" fill="#edf1f3" stroke="#bdcdd4"/><rect x="95" y="240" width="145" height="24" fill="#edf1f3" stroke="#bdcdd4"/><rect x="95" y="213" width="145" height="24" fill="#edf1f3" stroke="#bdcdd4"/></g><text x="168" y="475" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="168" dy="0">2 / 8 items</tspan></text><text x="300" y="171" text-anchor="start" fill="#17374d" font-size="24"><tspan x="300" dy="0">After 1 intervals</tspan></text><g data-buffer="1" data-level="4"><rect x="360" y="402" width="145" height="24" fill="#176b70" stroke="#bdcdd4"/><rect x="360" y="375" width="145" height="24" fill="#176b70" stroke="#bdcdd4"/><rect x="360" y="348" width="145" height="24" fill="#176b70" stroke="#bdcdd4"/><rect x="360" y="321" width="145" height="24" fill="#176b70" stroke="#bdcdd4"/><rect x="360" y="294" width="145" height="24" fill="#edf1f3" stroke="#bdcdd4"/><rect x="360" y="267" width="145" height="24" fill="#edf1f3" stroke="#bdcdd4"/><rect x="360" y="240" width="145" height="24" fill="#edf1f3" stroke="#bdcdd4"/><rect x="360" y="213" width="145" height="24" fill="#edf1f3" stroke="#bdcdd4"/></g><text x="433" y="475" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="433" dy="0">4 / 8 items</tspan></text><text x="565" y="171" text-anchor="start" fill="#17374d" font-size="24"><tspan x="565" dy="0">After 2 intervals</tspan></text><g data-buffer="2" data-level="6"><rect x="625" y="402" width="145" height="24" fill="#176b70" stroke="#bdcdd4"/><rect x="625" y="375" width="145" height="24" fill="#176b70" stroke="#bdcdd4"/><rect x="625" y="348" width="145" height="24" fill="#176b70" stroke="#bdcdd4"/><rect x="625" y="321" width="145" height="24" fill="#176b70" stroke="#bdcdd4"/><rect x="625" y="294" width="145" height="24" fill="#176b70" stroke="#bdcdd4"/><rect x="625" y="267" width="145" height="24" fill="#176b70" stroke="#bdcdd4"/><rect x="625" y="240" width="145" height="24" fill="#edf1f3" stroke="#bdcdd4"/><rect x="625" y="213" width="145" height="24" fill="#edf1f3" stroke="#bdcdd4"/></g><text x="698" y="475" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="698" dy="0">6 / 8 items</tspan></text><text x="830" y="171" text-anchor="start" fill="#17374d" font-size="24"><tspan x="830" dy="0">After 3 intervals</tspan></text><g data-buffer="3" data-level="8"><rect x="890" y="402" width="145" height="24" fill="#176b70" stroke="#bdcdd4"/><rect x="890" y="375" width="145" height="24" fill="#176b70" stroke="#bdcdd4"/><rect x="890" y="348" width="145" height="24" fill="#176b70" stroke="#bdcdd4"/><rect x="890" y="321" width="145" height="24" fill="#176b70" stroke="#bdcdd4"/><rect x="890" y="294" width="145" height="24" fill="#176b70" stroke="#bdcdd4"/><rect x="890" y="267" width="145" height="24" fill="#176b70" stroke="#bdcdd4"/><rect x="890" y="240" width="145" height="24" fill="#176b70" stroke="#bdcdd4"/><rect x="890" y="213" width="145" height="24" fill="#176b70" stroke="#bdcdd4"/></g><text x="963" y="475" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="963" dy="0">8 / 8 items</tspan></text><text x="35" y="560" text-anchor="start" fill="#17374d" font-size="25"><tspan x="35" dy="0">Back-pressure or data loss follows if the positive net arrival rate continues.</tspan></text></g></svg>
