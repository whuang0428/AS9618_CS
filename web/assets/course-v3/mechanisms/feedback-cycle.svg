<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="670" viewBox="0 0 1100 670" role="img" aria-labelledby="title desc"><title id="title">Measure the actual effect, then adjust the next output</title><desc id="desc">A controller compares a sensor reading with a target and sends an output to an actuator. The actuator changes the physical condition; the sensor measures that condition again. The new reading closes the feedback loop. Disturbances or ineffective actions are detected through the changed reading.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176b70"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a43c35"/></marker></defs><rect width="1100" height="670" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="50" text-anchor="start" fill="#17374d" font-size="32"><tspan x="35" dy="0">Measure the actual effect, then adjust the next output</tspan></text><rect x="35" y="135" width="240" height="85" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="155" y="169.04999999999998" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="155" dy="0">Target</tspan><tspan x="155" dy="35.1">Required value</tspan></text><g data-from="target" data-to="controller"><path d="M275 177H390" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="390" y="135" width="320" height="85" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="550" y="169.04999999999998" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="550" dy="0">Controller</tspan><tspan x="550" dy="35.1">Compare with reading</tspan></text><g data-from="controller" data-to="actuator"><path d="M710 177H835" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="835" y="135" width="230" height="85" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="950" y="169.04999999999998" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="950" dy="0">Actuator</tspan><tspan x="950" dy="35.1">Apply output</tspan></text><g data-from="actuator" data-to="condition"><path d="M950 220V370" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="765" y="370" width="300" height="100" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="915" y="411.55" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="915" dy="0">Physical condition</tspan><tspan x="915" dy="35.1">Actual effect</tspan></text><g data-from="condition" data-to="sensor"><path d="M765 420H525" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="225" y="370" width="300" height="100" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="375" y="411.55" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="375" dy="0">Sensor</tspan><tspan x="375" dy="35.1">Measure again</tspan></text><g data-from="sensor" data-to="controller"><path d="M375 370V290H550V220" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><text x="425" y="267" text-anchor="middle" fill="#176b70" font-size="23"><tspan x="425" dy="0">New reading</tspan></text></g><rect x="35" y="545" width="1030" height="90" rx="10" fill="#fff4dd" stroke="#176b70" stroke-width="2"/><text x="550" y="582.1999999999999" text-anchor="middle" fill="#17374d" font-size="24"><tspan x="550" dy="0">Feedback measures what happened, not merely what was requested.</tspan><tspan x="550" dy="32.400000000000006">The controller can continue, adjust or stop its output on the next comparison.</tspan></text></g></svg>
