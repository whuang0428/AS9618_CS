<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-labelledby="title desc"><title id="title">Apply the rule independently at every bit position</title><desc id="desc">Each operation starts with ACC = 10101010 and immediate mask 00001111. AND gives 00001010; OR gives 10101111; XOR gives 10100101. AND with 0 clears; OR with 1 sets; XOR with 1 toggles. The other mask bit preserves the original bit.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176b70"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a43c35"/></marker></defs><rect width="1100" height="640" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="50" text-anchor="start" fill="#17374d" font-size="32"><tspan x="35" dy="0">Apply the rule independently at every bit position</tspan></text><text x="35" y="151" text-anchor="start" fill="#17374d" font-size="25"><tspan x="35" dy="0">ACC</tspan></text><g data-state="bits-0"><g data-cell="1" data-active="true"><rect x="265" y="110" width="87" height="64" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="308.5" y="151.8" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="308.5" dy="0">1</tspan></text></g><g data-cell="2" data-active="true"><rect x="360" y="110" width="87" height="64" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="403.5" y="151.8" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="403.5" dy="0">0</tspan></text></g><g data-cell="3" data-active="true"><rect x="455" y="110" width="87" height="64" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="498.5" y="151.8" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="498.5" dy="0">1</tspan></text></g><g data-cell="4" data-active="true"><rect x="550" y="