<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="860" viewBox="0 0 1100 860" role="img" aria-labelledby="title desc"><title id="title">Update availability only after the purchase has sufficient payment</title><desc id="desc">Quantity = 2, PlacesLeft = 8, Student = TRUE and TicketPrice = 25.00. The quantity is valid; subtotal 50.00 becomes 45.00 with the 10% discount. Paid 50.00 permits confirmation, change 5.00 and PlacesLeft 6. Paid 40.00 does not change PlacesLeft.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176b70"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a43c35"/></marker></defs><rect width="1100" height="860" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="50" text-anchor="start" fill="#17374d" font-size="32"><tspan x="35" dy="0">Update availability only after the purchase has sufficient payment</tspan></text><rect x="35" y="135" width="235" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="152.5" y="171.875" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="152.5" dy="0">Check quantity</tspan><tspan x="152.5" dy="33.75">1 &lt;= 2 &lt;= 8</tspan></text><g data-from="quantity" data-to="subtotal"><path d="M270 180H300" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="300" y="135" width="235" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="417.5" y="171.875" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="417.5" dy="0">Subtotal</tspan><tspan x="417.5" dy="33.75">2 × 25.00 = 50.00</tspan></text><g data-from="subtotal" data-to="discount"><path d="M535 180H565" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="565" y="135" width="235" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="682.5" y="171.875" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="682.5" dy="0">Student discount</tspan><tspan x="682.5" dy="33.75">50.00 × 0.9 = 45.00</tspan></text><g data-from="discount" data-to="total"><path d="M800 180H830" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="830" y="135" width="235" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="947.5" y="171.875" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="947.5" dy="0">Amount due</tspan><tspan x="947.5" dy="33.75">Total = 45.00</tspan></text><g data-from="total" data-to="payment"><path d="M947 225V242H550V255" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><polygon points="550,255 725,322.5 550,390 375,322.5" fill="#fff4dd" stroke="#176b70" stroke-width="2"/><text x="550" y="314.5" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="550" dy="0">Paid &gt;=</tspan><tspan x="550" dy="33.75">45.00?</tspan></text><g data-from="payment" data-to="success"><path d="M375 322H195V480" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><text x="321" y="408" text-anchor="middle" fill="#176b70" font-size="23"><tspan x="321" dy="0">YES: Paid 50.00</tspan></text></g><rect x="35" y="480" width="430" height="170" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="250" y="539" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="250" dy="0">Confirm purchase</tspan><tspan x="250" dy="35.1">Change = 5.00</tspan><tspan x="250" dy="35.1">PlacesLeft = 8 - 2 = 6</tspan></text><g data-from="payment" data-to="failure"><path d="M725 322H890V480" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><text x="756" y="408" text-anchor="middle" fill="#176b70" font-size="23"><tspan x="756" dy="0">NO: Paid 40.00</tspan></text></g><rect x="645" y="480" width="420" height="170" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="855" y="539" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="855" dy="0">Report insufficient payment</tspan><tspan x="855" dy="35.1">No places sold</tspan><tspan x="855" dy="35.1">PlacesLeft stays 8</tspan></text><text x="35" y="765" text-anchor="start" fill="#17374d" font-size="25"><tspan x="35" dy="0">An invalid quantity must be rejected before the charge and payment stages.</tspan></text></g></svg>
