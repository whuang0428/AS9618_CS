<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc"><title id="title">RETURN supplies a value to the caller’s expression</title><desc id="desc">Illustrative function: Tax(Amount : REAL) RETURNS REAL returns Amount * 0.10. With Price = 20.00, Total &lt;- Price + Tax(Price) calls Tax with a value copy of 20.00, then receives 2.00. The caller completes 20.00 + 2.00 and stores Total = 22.00. Returning a value does not itself print it.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176b70"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a43c35"/></marker></defs><rect width="1100" height="660" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="50" text-anchor="start" fill="#17374d" font-size="32"><tspan x="35" dy="0">RETURN supplies a value to the caller’s expression</tspan></text><rect x="35" y="140" width="490" height="120" rx="10" fill="#f3f7fa" stroke="#176b70" stroke-width="2"/><text x="280" y="191.54999999999998" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="280" dy="0">Caller: Price = 20.00</tspan><tspan x="280" dy="35.1">Total &lt;- Price + Tax(Price)</tspan></text><g data-from="caller" data-to="tax"><path d="M525 200H675" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><text x="600" y="145" text-anchor="middle" fill="#17374d" font-size="20"><tspan x="600" dy="0">Argument</tspan><tspan x="600" dy="27">20.00</tspan></text><rect x="675" y="130" width="390" height="145" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="870" y="178.5" text-anchor="middle" fill="#17374d" font-size="24"><tspan x="870" dy="0">Tax(Amount) RETURNS REAL</tspan><tspan x="870" dy="32.400000000000006">RETURN Amount * 0.10</tspan><tspan x="870" dy="32.400000000000006">Result: 2.00</tspan></text><g data-from="tax" data-to="expression"><path d="M870 275V370H525" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><text x="685" y="353" text-anchor="middle" fill="#176b70" font-size="23"><tspan x="685" dy="0">Return 2.00</tspan></text></g><rect x="35" y="325" width="490" height="110" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="280" y="371.55" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="280" dy="0">Total &lt;- 20.00 + 2.00</tspan><tspan x="280" dy="35.1">Total becomes 22.00</tspan></text><rect x="35" y="520" width="1030" height="90" rx="10" fill="#fff4dd" stroke="#176b70" stroke-width="2"/><text x="550" y="557.1999999999999" text-anchor="middle" fill="#17374d" font-size="24"><tspan x="550" dy="0">The function call appears inside an expression; do not prefix it with CALL.</tspan><tspan x="550" dy="32.400000000000006">In this Cambridge notation, function parameters use value passing.</tspan></text></g></svg>
