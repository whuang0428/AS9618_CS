<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="625" viewBox="0 0 1100 625" role="img" aria-labelledby="title desc"><title id="title">Truncate first, then shift the six possible integer results</title><desc id="desc">RAND(6) returns a real value x with 0 &lt;= x &lt; 6. INT maps the six intervals [0,1), [1,2), …, [5,6) to integers 0, 1, …, 5. Adding 1 produces die values 1 through 6. The endpoint 6 is excluded from RAND(6), but included in the final integer results.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176b70"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a43c35"/></marker></defs><rect width="1100" height="625" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="50" text-anchor="start" fill="#17374d" font-size="32"><tspan x="35" dy="0">Truncate first, then shift the six possible integer results</tspan></text><text x="35" y="125" text-anchor="start" fill="#17374d" font-size="24"><tspan x="35" dy="0">RAND(6): each interval includes its left endpoint and excludes its right.</tspan></text><rect x="235" y="165" width="128" height="65" rx="10" fill="#f3f7fa" stroke="#176b70" stroke-width="2"/><text x="299" y="205.9" text-anchor="middle" fill="#17374d" font-size="24"><tspan x="299" dy="0">[0,1)</tspan></text><rect x="372" y="165" width="128" height="65" rx="10" fill="#f3f7fa" stroke="#176b70" stroke-width="2"/><text x="436" y="205.9" text-anchor="middle" fill="#17374d" font-size="24"><tspan x="436" dy="0">[1,2)</tspan></text><rect x="509" y="165" width="128" height="65" rx="10" fill="#f3f7fa" stroke="#176b70" stroke-width="2"/><text x="573" y="205.9" text-anchor="middle" fill="#17374d" font-size="24"><tspan x="573" dy="0">[2,3)</tspan></text><rect x="646" y="165" width="128" height="65" rx="10" fill="#f3f7fa" stroke="#176b70" stroke-width="2"/><text x="710" y="205.9" text-anchor="middle" fill="#17374d" font-size="24"><tspan x="710" dy="0">[3,4)</tspan></text><rect x="783" y="165" width="128" height="65" rx="10" fill="#f3f7fa" stroke="#176b70" stroke-width="2"/><text x="847" y="205.9" text-anchor="middle" fill="#17374d" font-size="24"><tspan x="847" dy="0">[4,5)</tspan></text><rect x="920" y="165" width="128" height="65" rx="10" fill="#f3f7fa" stroke="#176b70" stroke-width="2"/><text x="984" y="205.9" text-anchor="middle" fill="#17374d" font-size="24"><tspan x="984" dy="0">[5,6)</tspan></text><text x="35" y="319" text-anchor="start" fill="#17374d" font-size="25"><tspan x="35" dy="0">INT result</tspan></text><g data-state="truncated"><g data-cell="1" data-active="true"><rect x="235" y="275" width="129" height="64" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="299.5" y="316.8" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="299.5" dy="0">0</tspan></text></g><g data-cell="2" data-active="true"><rect x="372" y="275" width="129" height="64" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="436.5" y="316.8" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="436.5" dy="0">1</tspan></text></g><g data-cell="3" data-active="true"><rect x="509" y="275" width="129" height="64" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="573.5" y="316.8" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="573.5" dy="0">2</tspan></text></g><g data-cell="4" data-active="true"><rect x="646" y="275" width="129" height="64" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="710.5" y="316.8" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="710.5" dy="0">3</tspan></text></g><g data-cell="5" data-active="true"><rect x="783" y="275" width="129" height="64" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="847.5" y="316.8" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="847.5" dy="0">4</tspan></text></g><g data-cell="6" data-active="true"><rect x="920" y="275" width="129" height="64" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="984.5" y="316.8" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="984.5" dy="0">5</tspan></text></g></g><g data-from="int-0" data-to="die-1"><path d="M295 339V415" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><text x="326" y="389" text-anchor="middle" fill="#176b70" font-size="23"><tspan x="326" dy="0">+1</tspan></text></g><g data-from="int-1" data-to="die-2"><path d="M432 339V415" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><text x="463" y="389" text-anchor="middle" fill="#176b70" font-size="23"><tspan x="463" dy="0">+1</tspan></text></g><g data-from="int-2" data-to="die-3"><path d="M569 339V415" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><text x="600" y="389" text-anchor="middle" fill="#176b70" font-size="23"><tspan x="600" dy="0">+1</tspan></text></g><g data-from="int-3" data-to="die-4"><path d="M706 339V415" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><text x="737" y="389" text-anchor="middle" fill="#176b70" font-size="23"><tspan x="737" dy="0">+1</tspan></text></g><g data-from="int-4" data-to="die-5"><path d="M843 339V415" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><text x="874" y="389" text-anchor="middle" fill="#176b70" font-size="23"><tspan x="874" dy="0">+1</tspan></text></g><g data-from="int-5" data-to="die-6"><path d="M980 339V415" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><text x="1011" y="389" text-anchor="middle" fill="#176b70" font-size="23"><tspan x="1011" dy="0">+1</tspan></text></g><text x="35" y="459" text-anchor="start" fill="#17374d" font-size="25"><tspan x="35" dy="0">Die result</tspan></text><g data-state="die"><g data-cell="1" data-active="true"><rect x="235" y="415" width="129" height="64" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="299.5" y="456.8" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="299.5" dy="0">1</tspan></text></g><g data-cell="2" data-active="true"><rect x="372" y="415" width="129" height="64" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="436.5" y="456.8" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="436.5" dy="0">2</tspan></text></g><g data-cell="3" data-active="true"><rect x="509" y="415" width="129" height="64" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="573.5" y="456.8" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="573.5" dy="0">3</tspan></text></g><g data-cell="4" data-active="true"><rect x="646" y="415" width="129" height="64" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="710.5" y="456.8" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="710.5" dy="0">4</tspan></text></g><g data-cell="5" data-active="true"><rect x="783" y="415" width="129" height="64" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="847.5" y="456.8" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="847.5" dy="0">5</tspan></text></g><g data-cell="6" data-active="true"><rect x="920" y="415" width="129" height="64" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="984.5" y="456.8" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="984.5" dy="0">6</tspan></text></g></g><text x="35" y="579" text-anchor="start" fill="#17374d" font-size="25"><tspan x="35" dy="0">INT(RAND(6)) + 1 gives an INTEGER. RAND(6) alone gives a REAL.</tspan></text></g></svg>
