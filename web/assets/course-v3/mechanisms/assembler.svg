<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-labelledby="title desc"><title id="title">A complete symbol table resolves a forward reference</title><desc id="desc">Illustrative assembly model: one word per instruction or data item; the location counter starts at 20. Address 20: JMP DONE; address 21: DATA 7; address 22: DONE: END. DONE is a forward reference from address 20. Pass one records DONE = 22. Pass two resolves the jump operand to 22; opcode values depend on the instruction set.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176b70"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a43c35"/></marker></defs><rect width="1100" height="600" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="50" text-anchor="start" fill="#17374d" font-size="32"><tspan x="35" dy="0">A complete symbol table resolves a forward reference</tspan></text><rect x="35" y="130" width="370" height="190" rx="10" fill="#f3f7fa" stroke="#176b70" stroke-width="2"/><text x="220" y="179.77499999999998" text-anchor="middle" fill="#17374d" font-size="27"><tspan x="220" dy="0">Source at location 20</tspan><tspan x="220" dy="36.45">JMP DONE</tspan><tspan x="220" dy="36.45">DATA 7</tspan><tspan x="220" dy="36.45">DONE: END</tspan></text><g data-from="source" data-to="symbols"><path d="M405 225H650" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><text x="530" y="205" text-anchor="middle" fill="#176b70" font-size="23"><tspan x="530" dy="0">Pass 1</tspan></text></g><rect x="650" y="155" width="415" height="135" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="857.5" y="214.04999999999998" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="857.5" dy="0">Symbol table</tspan><tspan x="857.5" dy="35.1">DONE = 22</tspan></text><g data-from="symbols" data-to="resolved"><path d="M855 290V410" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><text x="925" y="358" text-anchor="middle" fill="#176b70" font-size="23"><tspan x="925" dy="0">Pass 2</tspan></text></g><rect x="530" y="410" width="535" height="100" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="797.5" y="451.875" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="797.5" dy="0">At address 20: jump to address 22</tspan><tspan x="797.5" dy="33.75">Translate mnemonic to opcode</tspan></text><text x="35" y="370" text-anchor="start" fill="#17374d" font-size="24"><tspan x="35" dy="0">Assumption: one word per line.</tspan><tspan x="35" dy="32.400000000000006">Advance the location counter</tspan><tspan x="35" dy="32.400000000000006">for instructions AND data.</tspan></text><text x="35" y="565" text-anchor="start" fill="#17374d" font-size="25"><tspan x="35" dy="0">An undefined label is still an error after the complete first pass.</tspan></text></g></svg>
