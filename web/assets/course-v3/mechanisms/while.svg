<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1110" viewBox="0 0 1100 1110" role="img" aria-labelledby="title desc"><title id="title">WHILE: test before entering the body</title><desc id="desc">Total starts at 0 and the first Value is read before the test. Value &lt;&gt; -1 is the continuation condition. TRUE adds Value and reads again; FALSE exits. A first input of -1 skips the body and outputs 0. Inputs 3, 4, -1 output 7; the sentinel is never added.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176b70"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a43c35"/></marker></defs><rect width="1100" height="1110" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="50" text-anchor="start" fill="#17374d" font-size="32"><tspan x="35" dy="0">WHILE: test before entering the body</tspan></text><rect x="390" y="90" width="240" height="60" rx="32" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="510" y="129.1" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="510" dy="0">Start</tspan></text><path d="M510 150V190" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><rect x="340" y="190" width="340" height="70" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="510" y="234.1" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="510" dy="0">Total &lt;- 0</tspan></text><path d="M510 260V305" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><polygon points="362,305 680,305 658,375 340,375" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="510" y="349" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="510" dy="0">INPUT Value</tspan></text><path d="M510 375V420" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><polygon points="510,420 690,485 510,550 330,485" fill="#fff4dd" stroke="#176b70" stroke-width="2"/><text x="510" y="494" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="510" dy="0">Value &lt;&gt; -1?</tspan></text><path d="M510 550V610" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><text x="620" y="586" text-anchor="middle" fill="#176b70" font-size="23"><tspan x="620" dy="0">TRUE · enter</tspan></text><rect x="295" y="610" width="430" height="75" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="510" y="656.6" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="510" dy="0">Total &lt;- Total + Value</tspan></text><path d="M510 685V730" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><polygon points="362,730 680,730 658,800 340,800" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="510" y="774" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="510" dy="0">INPUT Value</tspan></text><path d="M351 765H130V485H330" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><path d="M690 485H865V850" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><text x="955" y="575" text-anchor="middle" fill="#176b70" font-size="23"><tspan x="955" dy="0">FALSE · exit</tspan></text><polygon points="707,850 1045,850 1023,920 685,920" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="865" y="894" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="865" dy="0">OUTPUT Total</tspan></text><path d="M865 920V965" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><rect x="745" y="965" width="240" height="60" rx="32" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="865" y="1004.1" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="865" dy="0">End</tspan></text><text x="35" y="1080" text-anchor="start" fill="#17374d" font-size="25"><tspan x="35" dy="0">First input -1: output 0. Inputs 3, 4, -1: output 7; the sentinel is never added.</tspan></text></g></svg>
