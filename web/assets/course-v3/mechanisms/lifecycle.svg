<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="860" viewBox="0 0 1100 860" role="img" aria-labelledby="title desc"><title id="title">Connect each development activity with the evidence it produces</title><desc id="desc">Analysis defines requirements; design specifies the solution; coding implements it; testing compares actual with expected behaviour; maintenance changes the delivered system. The sequence illustrates the activities, not a rule that feedback is forbidden. Tests or real use can expose a need to revisit requirements, design or code.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176b70"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a43c35"/></marker></defs><rect width="1100" height="860" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="50" text-anchor="start" fill="#17374d" font-size="32"><tspan x="35" dy="0">Connect each development activity with the evidence it produces</tspan></text><rect x="70" y="125" width="300" height="85" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="220" y="176.6" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="220" dy="0">Analysis</tspan></text><g data-from="stage-0" data-to="evidence-0"><path d="M370 167H505" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="505" y="125" width="560" height="85" rx="10" fill="#f3f7fa" stroke="#176b70" stroke-width="2"/><text x="785" y="176.25" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="785" dy="0">User requirements and constraints</tspan></text><g data-from="stage-0" data-to="stage-1"><path d="M220 210V257" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="70" y="257" width="300" height="85" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="220" y="308.6" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="220" dy="0">Design</tspan></text><g data-from="stage-1" data-to="evidence-1"><path d="M370 299H505" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="505" y="257" width="560" height="85" rx="10" fill="#f3f7fa" stroke="#176b70" stroke-width="2"/><text x="785" y="308.25" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="785" dy="0">Data, algorithms, interfaces and tests</tspan></text><g data-from="stage-1" data-to="stage-2"><path d="M220 342V389" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="70" y="389" width="300" height="85" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="220" y="440.6" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="220" dy="0">Coding</tspan></text><g data-from="stage-2" data-to="evidence-2"><path d="M370 431H505" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="505" y="389" width="560" height="85" rx="10" fill="#f3f7fa" stroke="#176b70" stroke-width="2"/><text x="785" y="440.25" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="785" dy="0">Implementation of the design</tspan></text><g data-from="stage-2" data-to="stage-3"><path d="M220 474V521" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="70" y="521" width="300" height="85" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="220" y="572.6" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="220" dy="0">Testing</tspan></text><g data-from="stage-3" data-to="evidence-3"><path d="M370 563H505" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="505" y="521" width="560" height="85" rx="10" fill="#f3f7fa" stroke="#176b70" stroke-width="2"/><text x="785" y="572.25" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="785" dy="0">Expected and actual results</tspan></text><g data-from="stage-3" data-to="stage-4"><path d="M220 606V653" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="70" y="653" width="300" height="85" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="220" y="704.6" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="220" dy="0">Maintenance</tspan></text><g data-from="stage-4" data-to="evidence-4"><path d="M370 695H505" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="505" y="653" width="560" height="85" rx="10" fill="#f3f7fa" stroke="#176b70" stroke-width="2"/><text x="785" y="704.25" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="785" dy="0">Changes after delivery</tspan></text><text x="35" y="826" text-anchor="start" fill="#17374d" font-size="25"><tspan x="35" dy="0">Feedback can return the team to an earlier activity when evidence requires it.</tspan></text></g></svg>
