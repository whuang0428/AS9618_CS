<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610" role="img" aria-labelledby="title desc"><title id="title">Executing LDD fetches the operand after the instruction is decoded</title><desc id="desc">CIR contains LDD 700, PC is 201 and Memory[700] is 45. The CU selects load-direct: MAR becomes 700; the memory read supplies 45 to MDR; ACC receives 45. The instruction fetch is already complete. This operand read does not increment PC again; PC remains 201 unless another control event changes it.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176b70"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a43c35"/></marker></defs><rect width="1100" height="610" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="50" text-anchor="start" fill="#17374d" font-size="32"><tspan x="35" dy="0">Executing LDD fetches the operand after the instruction is decoded</tspan></text><text x="35" y="115" text-anchor="start" fill="#17374d" font-size="27"><tspan x="35" dy="0">Already fetched: CIR = LDD 700; PC = 201.</tspan></text><rect x="35" y="170" width="235" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="152.5" y="206.875" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="152.5" dy="0">CU decodes</tspan><tspan x="152.5" dy="33.75">Load direct</tspan></text><g data-from="decode" data-to="mar"><path d="M270 215H300" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="300" y="170" width="235" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="417.5" y="206.875" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="417.5" dy="0">MAR</tspan><tspan x="417.5" dy="33.75">Address 700</tspan></text><g data-from="mar" data-to="mdr"><path d="M535 215H565" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="565" y="170" width="235" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="682.5" y="206.875" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="682.5" dy="0">Memory read</tspan><tspan x="682.5" dy="33.75">MDR becomes 45</tspan></text><g data-from="mdr" data-to="acc"><path d="M800 215H830" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="830" y="170" width="235" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="947.5" y="206.875" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="947.5" dy="0">Copy MDR</tspan><tspan x="947.5" dy="33.75">ACC becomes 45</tspan></text><rect x="35" y="350" width="1030" height="90" rx="10" fill="#fff4dd" stroke="#176b70" stroke-width="2"/><text x="550" y="387.2" text-anchor="middle" fill="#17374d" font-size="24"><tspan x="550" dy="0">MAR holds an address. MDR and ACC hold the value read from that address.</tspan><tspan x="550" dy="32.400000000000006">Normal next fetch: PC is still 201; the operand read is not another instruction fetch.</tspan></text><text x="35" y="555" text-anchor="start" fill="#17374d" font-size="24"><tspan x="35" dy="0">Other instructions need different transfers: a store writes; a jump can replace PC.</tspan></text></g></svg>
