<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc"><title id="title">An uplink goes to the satellite; a downlink returns to Earth</title><desc id="desc">Ground station A transmits an uplink to the satellite, which relays a downlink to a receiving station. The long radio path introduces propagation delay; satellite coverage can reach remote locations. The diagram shows one relay path and is not to scale. Delay depends on the orbit and path length.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176b70"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a43c35"/></marker></defs><rect width="1100" height="620" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="50" text-anchor="start" fill="#17374d" font-size="32"><tspan x="35" dy="0">An uplink goes to the satellite; a downlink returns to Earth</tspan></text><rect x="390" y="125" width="320" height="105" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="550" y="169.04999999999998" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="550" dy="0">Satellite</tspan><tspan x="550" dy="35.1">Receives and relays</tspan></text><rect x="35" y="390" width="300" height="100" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="185" y="431.55" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="185" dy="0">Ground station A</tspan><tspan x="185" dy="35.1">Transmitter</tspan></text><rect x="765" y="390" width="300" height="100" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="915" y="431.55" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="915" dy="0">Receiving station</tspan><tspan x="915" dy="35.1">Ground, ship or aircraft</tspan></text><g data-from="ground-a" data-to="satellite"><path d="M185 390V178H390" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><text x="279" y="161" text-anchor="middle" fill="#176b70" font-size="23"><tspan x="279" dy="0">Uplink</tspan></text></g><g data-from="satellite" data-to="receiver"><path d="M710 178H915V390" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><text x="816" y="161" text-anchor="middle" fill="#176b70" font-size="23"><tspan x="816" dy="0">Downlink</tspan></text></g><path d="M35 530H1065" stroke="#176b70" stroke-width="3"/><text x="35" y="585" text-anchor="start" fill="#17374d" font-size="25"><tspan x="35" dy="0">Coverage can be broad; weather and the long path can affect service quality.</tspan></text></g></svg>
