<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="755" viewBox="0 0 1100 755" role="img" aria-labelledby="title desc"><title id="title">A condition decides either to continue or to stop</title><desc id="desc">WHILE tests before its body and enters on TRUE; it can execute zero times. REPEAT runs its body first and exits when UNTIL is TRUE; it executes at least once. Negating the condition alone does not preserve a zero-iteration path when changing WHILE into REPEAT.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176b70"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a43c35"/></marker></defs><rect width="1100" height="755" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="50" text-anchor="start" fill="#17374d" font-size="32"><tspan x="35" dy="0">A condition decides either to continue or to stop</tspan></text><text x="35" y="99" text-anchor="start" fill="#17374d" font-size="25"><tspan x="35" dy="0">The body must return to its own condition. Check the first-iteration rule.</tspan></text><rect x="35" y="125" width="1030" height="270" rx="12" fill="#fafcfd" stroke="#bdcdd4"/><rect x="35" y="430" width="1030" height="285" rx="12" fill="#fafcfd" stroke="#bdcdd4"/><text x="55" y="162" text-anchor="start" fill="#17374d" font-size="27"><tspan x="55" dy="0">WHILE Condition · body may run zero times</tspan></text><polygon points="205,215 330,270 205,325 80,270" fill="#fff4dd" stroke="#176b70" stroke-width="2"/><text x="205" y="279" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="205" dy="0">Condition?</tspan></text><path d="M330 270H425" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><text x="377" y="255" text-anchor="middle" fill="#176b70" font-size="23"><tspan x="377" dy="0">TRUE</tspan></text><rect x="425" y="230" width="230" height="80" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="540" y="279.1" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="540" dy="0">Body</tspan></text><path d="M540 310V355H205V325" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><path d="M205 215V192H925V230" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><text x="723" y="187" text-anchor="middle" fill="#176b70" font-size="23"><tspan x="723" dy="0">FALSE: skip body</tspan></text><rect x="825" y="230" width="200" height="80" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="925" y="261.55" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="925" dy="0">Next</tspan><tspan x="925" dy="35.1">statement</tspan></text><text x="55" y="468" text-anchor="start" fill="#17374d" font-size="27"><tspan x="55" dy="0">REPEAT … UNTIL Condition · body runs at least once</tspan></text><rect x="80" y="535" width="220" height="80" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="190" y="584.1" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="190" dy="0">Body</tspan></text><path d="M300 575H390" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><polygon points="525,520 660,575 525,630 390,575" fill="#fff4dd" stroke="#176b70" stroke-width="2"/><text x="525" y="584" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="525" dy="0">Condition?</tspan></text><path d="M660 575H825" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><text x="743" y="557" text-anchor="middle" fill="#176b70" font-size="23"><tspan x="743" dy="0">TRUE: stop</tspan></text><rect x="825" y="535" width="200" height="80" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="925" y="566.5500000000001" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="925" dy="0">Next</tspan><tspan x="925" dy="35.1">statement</tspan></text><path d="M525 630V680H190V615" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><text x="365" y="671" text-anchor="middle" fill="#176b70" font-size="23"><tspan x="365" dy="0">FALSE: repeat</tspan></text></g></svg>
