<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="665" viewBox="0 0 1100 665" role="img" aria-labelledby="title desc"><title id="title">A copied value and a reference use different storage</title><desc id="desc">Caller Number starts at 5. ChangeCopy receives its own BYVAL Value, adds 2 and displays 7; Number remains 5. The later ChangeOriginal call uses BYREF: Value refers to Number itself. Adding 2 changes Number to 7. The program outputs 7 inside ChangeCopy, then 5 in the caller, then 7 after ChangeOriginal. A BYREF argument must be an assignable variable of the required type.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176b70"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a43c35"/></marker></defs><rect width="1100" height="665" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="50" text-anchor="start" fill="#17374d" font-size="32"><tspan x="35" dy="0">A copied value and a reference use different storage</tspan></text><text x="35" y="99" text-anchor="start" fill="#17374d" font-size="24"><tspan x="35" dy="0">Use the same call order as the program: ChangeCopy, then ChangeOriginal.</tspan></text><text x="35" y="158" text-anchor="start" fill="#17374d" font-size="28"><tspan x="35" dy="0">1 · BYVAL: two independent locations</tspan></text><rect x="35" y="198" width="260" height="95" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="165" y="237.04999999999998" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="165" dy="0">Caller Number</tspan><tspan x="165" dy="35.1">5</tspan></text><path d="M295 245H410" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><text x="352" y="224" text-anchor="middle" fill="#176b70" font-size="23"><tspan x="352" dy="0">copy 5</tspan></text><rect x="410" y="198" width="275" height="95" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="547.5" y="237.04999999999998" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="547.5" dy="0">Local Value</tspan><tspan x="547.5" dy="35.1">5 → 7</tspan></text><text x="740" y="231" text-anchor="start" fill="#17374d" font-size="26"><tspan x="740" dy="0">Caller stays 5.</tspan><tspan x="740" dy="35.1">Local output: 7.</tspan></text><text x="35" y="375" text-anchor="start" fill="#17374d" font-size="28"><tspan x="35" dy="0">2 · BYREF: both names refer to the caller’s location</tspan></text><rect x="335" y="415" width="350" height="100" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="510" y="456.55" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="510" dy="0">Number</tspan><tspan x="510" dy="35.1">5 → 7</tspan></text><text x="35" y="444" text-anchor="start" fill="#17374d" font-size="25"><tspan x="35" dy="0">Parameter Value</tspan><tspan x="35" dy="33.75">refers to Number</tspan></text><path d="M245 462H335" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><text x="745" y="450" text-anchor="start" fill="#17374d" font-size="25"><tspan x="745" dy="0">Value &lt;- Value + 2</tspan><tspan x="745" dy="33.75">updates Number.</tspan></text><rect x="35" y="565" width="1030" height="65" rx="10" fill="#fff4dd" stroke="#176b70" stroke-width="2"/><text x="550" y="606.25" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="550" dy="0">Output order: 7 (inside copy), 5 (caller), 7 (after reference call).</tspan></text></g></svg>
