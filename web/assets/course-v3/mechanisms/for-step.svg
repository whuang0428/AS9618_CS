<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="535" viewBox="0 0 1100 535" role="img" aria-labelledby="title desc"><title id="title">A negative step stops before crossing the lower endpoint</title><desc id="desc">FOR Index &lt;- 6 TO 0 STEP -2 executes at 6, 4, 2 and 0, then stops. FOR Index &lt;- 5 TO 0 STEP -2 executes at 5, 3 and 1; -1 lies past the endpoint and is not executed. An inclusive endpoint is visited only if the step sequence reaches it. STEP 0 does not make progress.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176b70"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a43c35"/></marker></defs><rect width="1100" height="535" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="50" text-anchor="start" fill="#17374d" font-size="32"><tspan x="35" dy="0">A negative step stops before crossing the lower endpoint</tspan></text><text x="35" y="124" text-anchor="start" fill="#17374d" font-size="28"><tspan x="35" dy="0">6 TO 0 STEP -2</tspan></text><g data-state="for-even"><g data-cell="1" data-active="true"><rect x="35" y="165" width="202" height="64" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="136" y="206.8" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="136" dy="0">6</tspan></text></g><g data-cell="2" data-active="true"><rect x="245" y="165" width="202" height="64" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="346" y="206.8" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="346" dy="0">4</tspan></text></g><g data-cell="3" data-active="true"><rect x="455" y="165" width="202" height="64" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="556" y="206.8" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="556" dy="0">2</tspan></text></g><g data-cell="4" data-active="true"><rect x="665" y="165" width="202" height="64" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="766" y="206.8" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="766" dy="0">0</tspan></text></g></g><text x="902" y="205" text-anchor="start" fill="#17374d" font-size="25"><tspan x="902" dy="0">4 iterations</tspan></text><text x="35" y="307" text-anchor="start" fill="#17374d" font-size="28"><tspan x="35" dy="0">5 TO 0 STEP -2</tspan></text><g data-state="for-odd"><g data-cell="1" data-active="true"><rect x="35" y="350" width="202" height="64" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="136" y="391.8" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="136" dy="0">5</tspan></text></g><g data-cell="2" data-active="true"><rect x="245" y="350" width="202" height="64" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="346" y="391.8" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="346" dy="0">3</tspan></text></g><g data-cell="3" data-active="true"><rect x="455" y="350" width="202" height="64" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="556" y="391.8" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="556" dy="0">1</tspan></text></g></g><rect x="665" y="350" width="202" height="64" rx="10" fill="#ffe0d9" stroke="#176b70" stroke-width="2"/><text x="766" y="391.8" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="766" dy="0">-1</tspan></text><text x="912" y="386" text-anchor="start" fill="#17374d" font-size="24"><tspan x="912" dy="0">Stop here</tspan><tspan x="912" dy="32.400000000000006">No body</tspan></text><text x="35" y="489" text-anchor="start" fill="#17374d" font-size="25"><tspan x="35" dy="0">0 is used in the first sequence; the second sequence never reaches 0.</tspan></text></g></svg>
