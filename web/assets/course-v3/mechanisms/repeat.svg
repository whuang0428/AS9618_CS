<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc"><title id="title">REPEAT: execute the body before testing</title><desc id="desc">INPUT Mark runs before the first UNTIL test, so at least one input is read. The condition is (Mark &gt;= 0) AND (Mark &lt;= 100). TRUE exits; FALSE returns to INPUT Mark. For inputs -1, 101, 100, the outcomes are FALSE, FALSE, TRUE. The final output is 100.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176b70"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a43c35"/></marker></defs><rect width="1100" height="850" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="50" text-anchor="start" fill="#17374d" font-size="32"><tspan x="35" dy="0">REPEAT: execute the body before testing</tspan></text><rect x="345" y="100" width="350" height="65" rx="32" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="520" y="141.6" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="520" dy="0">Start</tspan></text><path d="M520 165V215" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><polygon points="367,215 695,215 673,280 345,280" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="520" y="256.5" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="520" dy="0">INPUT Mark</tspan></text><path d="M520 280V340" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><polygon points="520,340 730,425 520,510 310,425" fill="#fff4dd" stroke="#176b70" stroke-width="2"/><text x="520" y="417" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="520" dy="0">Mark &gt;= 0 AND</tspan><tspan x="520" dy="33.75">Mark &lt;= 100?</tspan></text><path d="M520 510V580" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><text x="636" y="556" text-anchor="middle" fill="#176b70" font-size="23"><tspan x="636" dy="0">TRUE · stop</tspan></text><polygon points="367,580 695,580 673,645 345,645" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="520" y="621.5" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="520" dy="0">OUTPUT Mark</tspan></text><path d="M520 645V690" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><rect x="395" y="690" width="250" height="60" rx="32" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="520" y="729.1" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="520" dy="0">End</tspan></text><path d="M310 425H145V247H356" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><text x="230" y="322" text-anchor="middle" fill="#176b70" font-size="23"><tspan x="230" dy="0">FALSE · repeat</tspan></text><text x="35" y="811" text-anchor="start" fill="#17374d" font-size="24"><tspan x="35" dy="0">Input trace: -1 → FALSE; 101 → FALSE; 100 → TRUE → output 100.</tspan></text></g></svg>
