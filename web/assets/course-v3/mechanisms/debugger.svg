<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="690" viewBox="0 0 1100 690" role="img" aria-labelledby="title desc"><title id="title">Pause before the line, then inspect its effect</title><desc id="desc">Initial Total = 12 and Increment = 4. The intended operation adds Increment. Line 5 is faulty: Total &lt;- Total - Increment. A breakpoint pauses before it executes. Before line 5, Total + Increment evaluates to 16; after stepping, Total is 8 and that expression evaluates to 12. Line 6 OUTPUT Total has not executed immediately after stepping line 5. Correcting line 5 to addition and rerunning outputs 16.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176b70"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a43c35"/></marker></defs><rect width="1100" height="690" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="50" text-anchor="start" fill="#17374d" font-size="32"><tspan x="35" dy="0">Pause before the line, then inspect its effect</tspan></text><text x="35" y="99" text-anchor="start" fill="#17374d" font-size="25"><tspan x="35" dy="0">Task: add Increment to Total. The subtraction below is the fault.</tspan></text><rect x="35" y="135" width="585" height="325" rx="10" fill="#f3f7fa" stroke="#176b70" stroke-width="2"/><text x="327.5" y="324.15000000000003" text-anchor="middle" fill="#17374d" font-size="26"></text><text x="58" y="186" text-anchor="start" fill="#17374d" font-size="25"><tspan x="58" dy="0">1  DECLARE Total : INTEGER</tspan></text><text x="58" y="229" text-anchor="start" fill="#17374d" font-size="25"><tspan x="58" dy="0">2  DECLARE Increment : INTEGER</tspan></text><text x="58" y="272" text-anchor="start" fill="#17374d" font-size="25"><tspan x="58" dy="0">3  Total &lt;- 12</tspan></text><text x="58" y="315" text-anchor="start" fill="#17374d" font-size="25"><tspan x="58" dy="0">4  Increment &lt;- 4</tspan></text><rect x="48" y="328" width="560" height="41" fill="#ffe0d9"/><text x="58" y="358" text-anchor="start" fill="#17374d" font-size="25"><tspan x="58" dy="0">5  Total &lt;- Total - Increment</tspan></text><text x="58" y="401" text-anchor="start" fill="#17374d" font-size="25"><tspan x="58" dy="0">6  OUTPUT Total</tspan></text><rect x="695" y="140" width="360" height="116" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="875" y="173" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="875" dy="0">Breakpoint before line 5</tspan><tspan x="875" dy="33.75">Total = 12</tspan><tspan x="875" dy="33.75">Increment = 4</tspan></text><path d="M875 256V320" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><text x="967" y="296" text-anchor="middle" fill="#176b70" font-size="23"><tspan x="967" dy="0">Step line 5</tspan></text><rect x="695" y="320" width="360" height="130" rx="10" fill="#fff0df" stroke="#176b70" stroke-width="2"/><text x="875" y="360" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="875" dy="0">Paused before line 6</tspan><tspan x="875" dy="33.75">Total = 8</tspan><tspan x="875" dy="33.75">No output yet</tspan></text><rect x="35" y="502" width="490" height="130" rx="10" fill="#fff4dd" stroke="#176b70" stroke-width="2"/><text x="280" y="540" text-anchor="middle" fill="#17374d" font-size="27"><tspan x="280" dy="0">Predict: 12 + 4 = 16</tspan><tspan x="280" dy="36.45">Observe: 12 - 4 = 8</tspan><tspan x="280" dy="36.45">Compare: wrong operator</tspan></text><rect x="575" y="502" width="480" height="130" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="815" y="542" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="815" dy="0">Fix: Total &lt;- Total + Increment</tspan><tspan x="815" dy="33.75">Restart from the initial state.</tspan><tspan x="815" dy="33.75">Run again: output 16.</tspan></text></g></svg>
