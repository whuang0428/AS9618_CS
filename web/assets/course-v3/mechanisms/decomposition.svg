<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570" viewBox="0 0 1100 570" role="img" aria-labelledby="title desc"><title id="title">Decompose a library loan into responsibilities</title><desc id="desc">ProcessLoan is the whole task, decomposed into IdentifyCopy, CheckAvailability, RecordLoan and ReportOutcome. The tree shows whole-to-part responsibility; its connectors do not mean that all branches execute unconditionally. CopyID links identification to checking. Recording requires an available copy; reporting gives confirmation or a refusal reason.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176b70"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a43c35"/></marker></defs><rect width="1100" height="570" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="50" text-anchor="start" fill="#17374d" font-size="32"><tspan x="35" dy="0">Decompose a library loan into responsibilities</tspan></text><rect x="365" y="105" width="370" height="88" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="550" y="158.1" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="550" dy="0">Process a library loan</tspan></text><path d="M550 193V238H147V276M550 238H953V276M415 238V276M685 238V276" stroke="#176b70" stroke-width="3" fill="none"/><rect x="35" y="276" width="220" height="106" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="145" y="320.875" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="145" dy="0">Identify</tspan><tspan x="145" dy="33.75">copy</tspan></text><text x="145" y="419" text-anchor="middle" fill="#17374d" font-size="19"><tspan x="145" dy="0">CopyID</tspan></text><rect x="305" y="276" width="220" height="106" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="415" y="320.875" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="415" dy="0">Check</tspan><tspan x="415" dy="33.75">availability</tspan></text><text x="415" y="419" text-anchor="middle" fill="#17374d" font-size="19"><tspan x="415" dy="0">CopyID → availability</tspan></text><rect x="575" y="276" width="220" height="106" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="685" y="320.875" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="685" dy="0">Record</tspan><tspan x="685" dy="33.75">loan</tspan></text><text x="685" y="419" text-anchor="middle" fill="#17374d" font-size="19"><tspan x="685" dy="0">Available copy + borrower</tspan></text><rect x="845" y="276" width="220" height="106" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="955" y="320.875" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="955" dy="0">Report</tspan><tspan x="955" dy="33.75">outcome</tspan></text><text x="955" y="419" text-anchor="middle" fill="#17374d" font-size="19"><tspan x="955" dy="0">Confirmation or refusal</tspan></text><rect x="35" y="465" width="1030" height="72" rx="10" fill="#fff4dd" stroke="#176b70" stroke-width="2"/><text x="550" y="509.75" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="550" dy="0">These are responsibilities, not a sequence of unconditional actions.</tspan></text></g></svg>
