<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570" viewBox="0 0 1100 570" role="img" aria-labelledby="title desc"><title id="title">Pass a calculated result to the module that uses it</title><desc id="desc">CalculateCharge receives Quantity and UnitPrice and returns an amount. DisplayReceipt receives that amount and outputs it; it does not independently recalculate the charge. The function returns a value; the procedure performs a task. Define input, result and effect at each interface.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176b70"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a43c35"/></marker></defs><rect width="1100" height="570" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="50" text-anchor="start" fill="#17374d" font-size="32"><tspan x="35" dy="0">Pass a calculated result to the module that uses it</tspan></text><rect x="35" y="155" width="265" height="110" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="167.5" y="201.54999999999998" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="167.5" dy="0">Inputs</tspan><tspan x="167.5" dy="35.1">Quantity; UnitPrice</tspan></text><g data-from="inputs" data-to="calculate"><path d="M300 210H415" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="415" y="155" width="310" height="110" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="570" y="201.54999999999998" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="570" dy="0">CalculateCharge</tspan><tspan x="570" dy="35.1">Returns Amount</tspan></text><g data-from="calculate" data-to="display"><path d="M725 210H825" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="825" y="155" width="240" height="110" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="945" y="201.54999999999998" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="945" dy="0">DisplayReceipt</tspan><tspan x="945" dy="35.1">Outputs Amount</tspan></text><rect x="35" y="365" width="1030" height="90" rx="10" fill="#fff4dd" stroke="#176b70" stroke-width="2"/><text x="550" y="402.2" text-anchor="middle" fill="#17374d" font-size="24"><tspan x="550" dy="0">One calculation owns the charging rule; the display uses its result.</tspan><tspan x="550" dy="32.400000000000006">If the rule changes, the calculation and its tests identify where to amend it.</tspan></text></g></svg>
