<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc"><title id="title">A record type is a template; a variable holds field values</title><desc id="desc">MemberRecord defines Name as STRING, YearGroup as INTEGER and FeesPaid as BOOLEAN. DECLARE Member : MemberRecord creates one variable. Assigning field values is a separate step. The illustrated values Ada, 12 and FALSE are explicitly assigned example values, not declaration defaults.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176b70"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a43c35"/></marker></defs><rect width="1100" height="620" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="50" text-anchor="start" fill="#17374d" font-size="32"><tspan x="35" dy="0">A record type is a template; a variable holds field values</tspan></text><text x="35" y="115" text-anchor="start" fill="#17374d" font-size="28"><tspan x="35" dy="0">Type definition</tspan></text><rect x="35" y="155" width="440" height="265" rx="10" fill="#f3f7fa" stroke="#176b70" stroke-width="2"/><text x="255" y="240.60000000000002" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="255" dy="0">MemberRecord</tspan><tspan x="255" dy="37.800000000000004">Name : STRING</tspan><tspan x="255" dy="37.800000000000004">YearGroup : INTEGER</tspan><tspan x="255" dy="37.800000000000004">FeesPaid : BOOLEAN</tspan></text><g data-from="type" data-to="instance"><path d="M475 285H625" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><text x="550" y="226" text-anchor="middle" fill="#17374d" font-size="20"><tspan x="550" dy="0">Declare,</tspan><tspan x="550" dy="27">then assign</tspan></text><rect x="625" y="155" width="440" height="265" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="845" y="240.60000000000002" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="845" dy="0">Member</tspan><tspan x="845" dy="37.800000000000004">Name = &quot;Ada&quot;</tspan><tspan x="845" dy="37.800000000000004">YearGroup = 12</tspan><tspan x="845" dy="37.800000000000004">FeesPaid = FALSE</tspan></text><rect x="35" y="480" width="1030" height="90" rx="10" fill="#fff4dd" stroke="#176b70" stroke-width="2"/><text x="550" y="517.2" text-anchor="middle" fill="#17374d" font-size="24"><tspan x="550" dy="0">Member.YearGroup selects one named field; changing it preserves the others.</tspan><tspan x="550" dy="32.400000000000006">Creating a record in RAM does not save it to a file.</tspan></text></g></svg>
