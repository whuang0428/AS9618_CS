<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="740" viewBox="0 0 1100 740" role="img" aria-labelledby="title desc"><title id="title">Save the interrupted context before running the ISR</title><desc id="desc">The current instruction finishes before the basic model checks for a pending enabled interrupt. If a request is accepted, save the return address and required state, run the appropriate ISR, restore state and resume. If no request is accepted, continue normal execution. Priority and enable rules govern acceptance.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176b70"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a43c35"/></marker></defs><rect width="1100" height="740" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="50" text-anchor="start" fill="#17374d" font-size="32"><tspan x="35" dy="0">Save the interrupted context before running the ISR</tspan></text><rect x="35" y="130" width="290" height="85" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="180" y="164.04999999999998" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="180" dy="0">Finish current</tspan><tspan x="180" dy="35.1">instruction</tspan></text><g data-from="finish" data-to="check"><path d="M325 172H430" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><polygon points="590,105 750,172.5 590,240 430,172.5" fill="#fff4dd" stroke="#176b70" stroke-width="2"/><text x="590" y="164.5" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="590" dy="0">Accept an</tspan><tspan x="590" dy="33.75">interrupt?</tspan></text><g data-from="check" data-to="normal"><path d="M750 172H835" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><text x="790" y="152" text-anchor="middle" fill="#176b70" font-size="23"><tspan x="790" dy="0">NO</tspan></text></g><rect x="835" y="130" width="230" height="85" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="950" y="164.04999999999998" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="950" dy="0">Continue</tspan><tspan x="950" dy="35.1">normal work</tspan></text><g data-from="check" data-to="save"><path d="M590 240V320" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><text x="636" y="286" text-anchor="middle" fill="#176b70" font-size="23"><tspan x="636" dy="0">YES</tspan></text></g><rect x="350" y="320" width="480" height="70" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="590" y="364.1" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="590" dy="0">Save return address and state</tspan></text><g data-from="save" data-to="isr"><path d="M590 390V435" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="350" y="435" width="480" height="70" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="590" y="479.1" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="590" dy="0">Run ISR; service the event</tspan></text><g data-from="isr" data-to="restore"><path d="M590 505V550" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="350" y="550" width="480" height="70" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="590" y="594.1" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="590" dy="0">Restore state and resume</tspan></text><text x="35" y="691" text-anchor="start" fill="#17374d" font-size="25"><tspan x="35" dy="0">The ISR must not destroy values the interrupted program needs on return.</tspan></text></g></svg>
