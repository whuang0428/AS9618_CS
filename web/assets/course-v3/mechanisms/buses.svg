<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610" role="img" aria-labelledby="title desc"><title id="title">A memory read and a memory write use different data directions</title><desc id="desc">In the processor-controlled model, the address goes from CPU to memory for both reads and writes. For a read, data returns from memory to CPU; for a write, data goes from CPU to memory. READ and WRITE are CPU control outputs. Other control lines, such as interrupt requests, can be inputs.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176b70"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a43c35"/></marker></defs><rect width="1100" height="610" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="50" text-anchor="start" fill="#17374d" font-size="32"><tspan x="35" dy="0">A memory read and a memory write use different data directions</tspan></text><text x="35" y="113" text-anchor="start" fill="#17374d" font-size="26"><tspan x="35" dy="0">1 · READ operation</tspan></text><rect x="35" y="145" width="210" height="135" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="140" y="221.6" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="140" dy="0">CPU</tspan></text><rect x="845" y="145" width="220" height="135" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="955" y="221.6" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="955" dy="0">Memory</tspan></text><g data-from="READ-cpu" data-to="READ-memory"><path d="M245 165H845" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><text x="540" y="155" text-anchor="middle" fill="#176b70" font-size="23"><tspan x="540" dy="0">Address selects location</tspan></text></g><g data-from="READ-cpu" data-to="READ-memory"><path d="M245 213H845" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><text x="540" y="203" text-anchor="middle" fill="#176b70" font-size="23"><tspan x="540" dy="0">READ control signal</tspan></text></g><g data-from="READ-memory" data-to="READ-cpu"><path d="M845 262H245" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><text x="540" y="252" text-anchor="middle" fill="#176b70" font-size="23"><tspan x="540" dy="0">Instruction or data</tspan></text></g><text x="35" y="318" text-anchor="start" fill="#17374d" font-size="26"><tspan x="35" dy="0">2 · WRITE operation</tspan></text><rect x="35" y="350" width="210" height="135" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="140" y="426.6" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="140" dy="0">CPU</tspan></text><rect x="845" y="350" width="220" height="135" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="955" y="426.6" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="955" dy="0">Memory</tspan></text><g data-from="WRITE-cpu" data-to="WRITE-memory"><path d="M245 370H845" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><text x="540" y="360" text-anchor="middle" fill="#176b70" font-size="23"><tspan x="540" dy="0">Address selects location</tspan></text></g><g data-from="WRITE-cpu" data-to="WRITE-memory"><path d="M245 418H845" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><text x="540" y="408" text-anchor="middle" fill="#176b70" font-size="23"><tspan x="540" dy="0">WRITE control signal</tspan></text></g><g data-from="WRITE-cpu" data-to="WRITE-memory"><path d="M245 467H845" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><text x="540" y="457" text-anchor="middle" fill="#176b70" font-size="23"><tspan x="540" dy="0">Data to store</tspan></text></g><text x="35" y="575" text-anchor="start" fill="#17374d" font-size="24"><tspan x="35" dy="0">The control bus is a collection of signal lines with defined individual directions.</tspan></text></g></svg>
