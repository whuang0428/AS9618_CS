<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590" role="img" aria-labelledby="title desc"><title id="title">READ preserves, WRITE replaces, APPEND extends</title><desc id="desc">Each independent example starts with a file containing the lines Ada and Dan. READ Ada leaves both stored lines unchanged. Opening for WRITE replaces old contents; writing Eve leaves only Eve. Opening for APPEND and writing Eve leaves Ada, Dan, Eve in that order. Close the file after access.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176b70"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a43c35"/></marker></defs><rect width="1100" height="590" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="50" text-anchor="start" fill="#17374d" font-size="32"><tspan x="35" dy="0">READ preserves, WRITE replaces, APPEND extends</tspan></text><text x="35" y="130" text-anchor="start" fill="#17374d" font-size="27"><tspan x="35" dy="0">READ one line</tspan></text><rect x="35" y="165" width="300" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="185" y="201.54999999999998" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="185" dy="0">Before: Ada</tspan><tspan x="185" dy="35.1">Dan</tspan></text><path d="M185 255V325" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><rect x="35" y="325" width="300" height="130" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="185" y="381.55" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="185" dy="0">After: Ada</tspan><tspan x="185" dy="35.1">Dan</tspan></text><text x="35" y="492" text-anchor="start" fill="#17374d" font-size="24"><tspan x="35" dy="0">Returned line: Ada</tspan></text><text x="400" y="130" text-anchor="start" fill="#17374d" font-size="27"><tspan x="400" dy="0">WRITE &quot;Eve&quot;</tspan></text><rect x="400" y="165" width="300" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="550" y="201.54999999999998" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="550" dy="0">Before: Ada</tspan><tspan x="550" dy="35.1">Dan</tspan></text><path d="M550 255V325" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><rect x="400" y="325" width="300" height="130" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="550" y="399.1" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="550" dy="0">After: Eve</tspan></text><text x="400" y="492" text-anchor="start" fill="#17374d" font-size="24"><tspan x="400" dy="0">Old lines replaced</tspan></text><text x="765" y="130" text-anchor="start" fill="#17374d" font-size="27"><tspan x="765" dy="0">APPEND &quot;Eve&quot;</tspan></text><rect x="765" y="165" width="300" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="915" y="201.54999999999998" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="915" dy="0">Before: Ada</tspan><tspan x="915" dy="35.1">Dan</tspan></text><path d="M915 255V325" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><rect x="765" y="325" width="300" height="130" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="915" y="364" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="915" dy="0">After: Ada</tspan><tspan x="915" dy="35.1">Dan</tspan><tspan x="915" dy="35.1">Eve</tspan></text><text x="765" y="492" text-anchor="start" fill="#17374d" font-size="24"><tspan x="765" dy="0">Old lines retained</tspan></text><text x="35" y="558" text-anchor="start" fill="#17374d" font-size="24"><tspan x="35" dy="0">Choose a mode before access. All three panels start from the original file.</tspan></text></g></svg>
