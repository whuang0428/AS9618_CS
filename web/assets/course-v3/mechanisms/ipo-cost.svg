<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="630" viewBox="0 0 1100 630" role="img" aria-labelledby="title desc"><title id="title">Inputs and a fixed constant take different routes into the calculation</title><desc id="desc">ItemPrice is 4.25 and Quantity is 3; fixed postage is 3.50. Processing calculates 4.25 × 3 + 3.50 = 16.25, then outputs Total. Postage is supplied by the problem as a constant, so it need not be input on every run.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176b70"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a43c35"/></marker></defs><rect width="1100" height="630" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="50" text-anchor="start" fill="#17374d" font-size="32"><tspan x="35" dy="0">Inputs and a fixed constant take different routes into the calculation</tspan></text><rect x="35" y="150" width="285" height="120" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="177.5" y="184" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="177.5" dy="0">INPUT</tspan><tspan x="177.5" dy="35.1">ItemPrice = 4.25</tspan><tspan x="177.5" dy="35.1">Quantity = 3</tspan></text><g data-from="input" data-to="process"><path d="M320 210H430" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="430" y="150" width="330" height="120" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="595" y="184" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="595" dy="0">PROCESS</tspan><tspan x="595" dy="35.1">4.25 × 3 + 3.50</tspan><tspan x="595" dy="35.1">= 16.25</tspan></text><g data-from="process" data-to="output"><path d="M760 210H865" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="865" y="150" width="200" height="120" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="965" y="184" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="965" dy="0">OUTPUT</tspan><tspan x="965" dy="35.1">Total</tspan><tspan x="965" dy="35.1">16.25</tspan></text><rect x="430" y="380" width="330" height="100" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="595" y="421.55" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="595" dy="0">Fixed postage</tspan><tspan x="595" dy="35.1">3.50</tspan></text><g data-from="constant" data-to="process"><path d="M595 380V270" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><text x="35" y="578" text-anchor="start" fill="#17374d" font-size="24"><tspan x="35" dy="0">Use a positive whole Quantity and a non-negative ItemPrice for this example.</tspan></text></g></svg>
