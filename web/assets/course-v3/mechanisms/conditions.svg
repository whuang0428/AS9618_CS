<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570" viewBox="0 0 1100 570" role="img" aria-labelledby="title desc"><title id="title">Two required restrictions form an intersection</title><desc id="desc">Eligibility is (Age &gt;= 18) AND NOT Suspended. Both tests must be true: an adult who is suspended is ineligible, and an unsuspended child is ineligible. For (Age &lt; 12) OR Member, either complete condition is sufficient; both can also be true.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176b70"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a43c35"/></marker></defs><rect width="1100" height="570" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="50" text-anchor="start" fill="#17374d" font-size="32"><tspan x="35" dy="0">Two required restrictions form an intersection</tspan></text><rect x="35" y="130" width="300" height="105" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="185" y="174.04999999999998" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="185" dy="0">Age &gt;= 18</tspan><tspan x="185" dy="35.1">Adult?</tspan></text><rect x="35" y="310" width="300" height="105" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="185" y="354.05" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="185" dy="0">NOT Suspended</tspan><tspan x="185" dy="35.1">Not suspended?</tspan></text><g data-from="adult" data-to="and"><path d="M335 182H420V265H470" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><g data-from="allowed" data-to="and"><path d="M335 362H420V285H470" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="470" y="220" width="210" height="110" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="575" y="284.1" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="575" dy="0">AND</tspan></text><g data-from="and" data-to="eligible"><path d="M680 275H795" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="795" y="220" width="270" height="110" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="930" y="266.55" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="930" dy="0">Eligible only</tspan><tspan x="930" dy="35.1">if BOTH are true</tspan></text><rect x="35" y="465" width="1030" height="90" rx="10" fill="#fff4dd" stroke="#176b70" stroke-width="2"/><text x="550" y="502.2" text-anchor="middle" fill="#17374d" font-size="24"><tspan x="550" dy="0">Age 20, Suspended TRUE → TRUE AND FALSE → FALSE.</tspan><tspan x="550" dy="32.400000000000006">Age 20, Suspended FALSE → TRUE AND TRUE → TRUE.</tspan></text></g></svg>
