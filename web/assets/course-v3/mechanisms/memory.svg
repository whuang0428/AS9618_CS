<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-labelledby="title desc"><title id="title">Allocate, protect and release main memory</title><desc id="desc">The simplified memory contains region A, region B and other free space; sizes are illustrative. The editor receives region A; the browser later receives a separate region B. When the editor exits, A becomes available again while B remains allocated. Memory protection prevents one process from freely overwriting another process; releasing RAM does not save a file.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176b70"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a43c35"/></marker></defs><rect width="1100" height="640" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="50" text-anchor="start" fill="#17374d" font-size="32"><tspan x="35" dy="0">Allocate, protect and release main memory</tspan></text><text x="35" y="100" text-anchor="start" fill="#17374d" font-size="25"><tspan x="35" dy="0">A simplified RAM map: the OS records which process may use each region.</tspan></text><text x="35" y="155" text-anchor="start" fill="#17374d" font-size="27"><tspan x="35" dy="0">1 · Editor starts</tspan></text><rect x="35" y="185" width="285" height="76" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="177.5" y="215.20000000000002" text-anchor="middle" fill="#17374d" font-size="24"><tspan x="177.5" dy="0">Region A</tspan><tspan x="177.5" dy="32.400000000000006">Editor</tspan></text><rect x="35" y="273" width="285" height="76" rx="10" fill="#f2f4f6" stroke="#176b70" stroke-width="2"/><text x="177.5" y="303.2" text-anchor="middle" fill="#17374d" font-size="24"><tspan x="177.5" dy="0">Region B</tspan><tspan x="177.5" dy="32.400000000000006">Free</tspan></text><rect x="35" y="361" width="285" height="76" rx="10" fill="#f2f4f6" stroke="#176b70" stroke-width="2"/><text x="177.5" y="391.2" text-anchor="middle" fill="#17374d" font-size="24"><tspan x="177.5" dy="0">Region C</tspan><tspan x="177.5" dy="32.400000000000006">Free</tspan></text><path d="M330 310H387" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><text x="400" y="155" text-anchor="start" fill="#17374d" font-size="27"><tspan x="400" dy="0">2 · Browser starts</tspan></text><rect x="400" y="185" width="285" height="76" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="542.5" y="215.20000000000002" text-anchor="middle" fill="#17374d" font-size="24"><tspan x="542.5" dy="0">Region A</tspan><tspan x="542.5" dy="32.400000000000006">Editor</tspan></text><rect x="400" y="273" width="285" height="76" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="542.5" y="303.2" text-anchor="middle" fill="#17374d" font-size="24"><tspan x="542.5" dy="0">Region B</tspan><tspan x="542.5" dy="32.400000000000006">Browser</tspan></text><rect x="400" y="361" width="285" height="76" rx="10" fill="#f2f4f6" stroke="#176b70" stroke-width="2"/><text x="542.5" y="391.2" text-anchor="middle" fill="#17374d" font-size="24"><tspan x="542.5" dy="0">Region C</tspan><tspan x="542.5" dy="32.400000000000006">Free</tspan></text><path d="M695 310H752" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><text x="765" y="155" text-anchor="start" fill="#17374d" font-size="27"><tspan x="765" dy="0">3 · Editor exits</tspan></text><rect x="765" y="185" width="285" height="76" rx="10" fill="#f2f4f6" stroke="#176b70" stroke-width="2"/><text x="907.5" y="215.20000000000002" text-anchor="middle" fill="#17374d" font-size="24"><tspan x="907.5" dy="0">Region A</tspan><tspan x="907.5" dy="32.400000000000006">Free</tspan></text><rect x="765" y="273" width="285" height="76" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="907.5" y="303.2" text-anchor="middle" fill="#17374d" font-size="24"><tspan x="907.5" dy="0">Region B</tspan><tspan x="907.5" dy="32.400000000000006">Browser</tspan></text><rect x="765" y="361" width="285" height="76" rx="10" fill="#f2f4f6" stroke="#176b70" stroke-width="2"/><text x="907.5" y="391.2" text-anchor="middle" fill="#17374d" font-size="24"><tspan x="907.5" dy="0">Region C</tspan><tspan x="907.5" dy="32.400000000000006">Free</tspan></text><rect x="35" y="488" width="1030" height="102" rx="10" fill="#fff4dd" stroke="#176b70" stroke-width="2"/><text x="550" y="530.875" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="550" dy="0">Protection: the editor may not overwrite the browser’s allocated region.</tspan><tspan x="550" dy="33.75">Release: an exited process’s region becomes available for reuse.</tspan></text></g></svg>
