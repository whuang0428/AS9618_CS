<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Build bytecode once; execute it on a compatible JVM</title><desc id="desc">javac compiles .java source into .class bytecode. Bytecode targets the JVM, not a universal physical CPU. Compatible JVMs execute the bytecode on their hosts, using interpretation and possibly JIT compilation. Platform-specific native dependencies and incompatible JVM versions can limit portability.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176b70"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a43c35"/></marker></defs><rect width="1100" height="650" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="50" text-anchor="start" fill="#17374d" font-size="32"><tspan x="35" dy="0">Build bytecode once; execute it on a compatible JVM</tspan></text><rect x="35" y="140" width="235" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="152.5" y="176.875" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="152.5" dy="0">Source</tspan><tspan x="152.5" dy="33.75">.java</tspan></text><g data-from="source" data-to="javac"><path d="M270 185H300" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="300" y="140" width="235" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="417.5" y="176.875" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="417.5" dy="0">javac</tspan><tspan x="417.5" dy="33.75">compiler</tspan></text><g data-from="javac" data-to="bytecode"><path d="M535 185H565" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="565" y="140" width="235" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="682.5" y="176.875" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="682.5" dy="0">Bytecode</tspan><tspan x="682.5" dy="33.75">.class</tspan></text><g data-from="bytecode" data-to="jvm"><path d="M800 185H830" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="830" y="140" width="235" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="947.5" y="176.875" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="947.5" dy="0">Compatible</tspan><tspan x="947.5" dy="33.75">JVM</tspan></text><g data-from="jvm" data-to="interpreter"><path d="M947 230V310H405V360" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><text x="675" y="296" text-anchor="middle" fill="#176b70" font-size="23"><tspan x="675" dy="0">Host execution</tspan></text></g><rect x="255" y="360" width="300" height="100" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="405" y="401.55" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="405" dy="0">Interpreter</tspan><tspan x="405" dy="35.1">executes bytecode</tspan></text><g data-from="jvm" data-to="jit"><path d="M947 310V360" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="760" y="360" width="305" height="100" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="912.5" y="401.55" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="912.5" dy="0">JIT compiles code</tspan><tspan x="912.5" dy="35.1">for this host CPU</tspan></text><rect x="35" y="510" width="1030" height="90" rx="10" fill="#fff4dd" stroke="#176b70" stroke-width="2"/><text x="550" y="547.1999999999999" text-anchor="middle" fill="#17374d" font-size="24"><tspan x="550" dy="0">Editing source requires another build before the bytecode reflects the edit.</tspan><tspan x="550" dy="32.400000000000006">A JVM is required on each host; the .class file is not native code for every CPU.</tspan></text></g></svg>
