<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Review a working version, then use feedback in the next cycle</title><desc id="desc">Each iteration revisits analysis, design, coding and testing to produce a version for review. User feedback changes the priorities or requirements for the next version. A cycle needs agreed scope and stopping criteria; the process is not an instruction to repeat forever.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176b70"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a43c35"/></marker></defs><rect width="1100" height="650" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="50" text-anchor="start" fill="#17374d" font-size="32"><tspan x="35" dy="0">Review a working version, then use feedback in the next cycle</tspan></text><rect x="35" y="140" width="235" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="152.5" y="193.75" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="152.5" dy="0">Analyse</tspan></text><g data-from="analyse" data-to="design"><path d="M270 185H300" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="300" y="140" width="235" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="417.5" y="193.75" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="417.5" dy="0">Design</tspan></text><g data-from="design" data-to="code"><path d="M535 185H565" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="565" y="140" width="235" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="682.5" y="193.75" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="682.5" dy="0">Code</tspan></text><g data-from="code" data-to="test"><path d="M800 185H830" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="830" y="140" width="235" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="947.5" y="193.75" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="947.5" dy="0">Test</tspan></text><g data-from="test" data-to="review"><path d="M947 230V330H715" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="395" y="330" width="320" height="100" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="555" y="371.55" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="555" dy="0">Working version</tspan><tspan x="555" dy="35.1">User review</tspan></text><g data-from="review" data-to="analyse"><path d="M395 380H150V230" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><text x="258" y="358" text-anchor="middle" fill="#176b70" font-size="23"><tspan x="258" dy="0">Feedback</tspan></text></g><g data-from="review" data-to="release"><path d="M555 430V505" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><text x="711" y="477" text-anchor="middle" fill="#176b70" font-size="23"><tspan x="711" dy="0">Agreed criteria met</tspan></text></g><rect x="395" y="505" width="320" height="80" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="555" y="554.1" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="555" dy="0">Deliver this version</tspan></text><text x="35" y="627" text-anchor="start" fill="#17374d" font-size="24"><tspan x="35" dy="0">Control scope, versions and schedule while findings guide the next cycle.</tspan></text></g></svg>
