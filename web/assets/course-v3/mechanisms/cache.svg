<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc"><title id="title">A cache hit avoids a main-memory read</title><desc id="desc">This is a simplified read path: the CPU requests an instruction or data item. On a cache hit the cache supplies it. On a miss it is fetched from RAM and supplied to the CPU, with a copy placed in cache. Cache holds copies, not the only permanent copy of a program. Benefit depends on the working set and hit rate.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176b70"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a43c35"/></marker></defs><rect width="1100" height="660" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="50" text-anchor="start" fill="#17374d" font-size="32"><tspan x="35" dy="0">A cache hit avoids a main-memory read</tspan></text><rect x="35" y="140" width="225" height="80" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="147.5" y="171.54999999999998" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="147.5" dy="0">CPU requests</tspan><tspan x="147.5" dy="35.1">an item</tspan></text><g data-from="request" data-to="lookup"><path d="M260 180H360" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><polygon points="520,115 680,180 520,245 360,180" fill="#fff4dd" stroke="#176b70" stroke-width="2"/><text x="520" y="172" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="520" dy="0">Item in</tspan><tspan x="520" dy="33.75">cache?</tspan></text><g data-from="lookup" data-to="hit"><path d="M680 180H830" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><text x="756" y="164" text-anchor="middle" fill="#176b70" font-size="23"><tspan x="756" dy="0">YES · hit</tspan></text></g><rect x="830" y="140" width="235" height="80" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="947.5" y="171.54999999999998" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="947.5" dy="0">Cache supplies</tspan><tspan x="947.5" dy="35.1">the item</tspan></text><g data-from="lookup" data-to="ram"><path d="M520 245V330" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><text x="618" y="298" text-anchor="middle" fill="#176b70" font-size="23"><tspan x="618" dy="0">NO · miss</tspan></text></g><rect x="350" y="330" width="340" height="80" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="520" y="361.55" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="520" dy="0">Read the item</tspan><tspan x="520" dy="35.1">from RAM</tspan></text><g data-from="ram" data-to="fill"><path d="M520 410V480" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="230" y="480" width="580" height="80" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="520" y="529.1" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="520" dy="0">Supply CPU and keep a copy in cache</tspan></text><text x="35" y="618" text-anchor="start" fill="#17374d" font-size="25"><tspan x="35" dy="0">A larger cache helps only when the extra retained items are useful.</tspan></text></g></svg>
