<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="765" viewBox="0 0 1100 765" role="img" aria-labelledby="title desc"><title id="title">A node belongs to either the active chain or the free chain</title><desc id="desc">Initially the active chain is 2 → 4 → 0 and the free chain is 1 → 3 → 0. Allocating slot 1 after node 2 gives active 2 → 1 → 4 → 0 and free 3 → 0. Deleting node 4 and releasing it gives active 2 → 1 → 0 and free 4 → 3 → 0. No node is shared between chains.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176b70"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a43c35"/></marker></defs><rect width="1100" height="765" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="50" text-anchor="start" fill="#17374d" font-size="32"><tspan x="35" dy="0">A node belongs to either the active chain or the free chain</tspan></text><text x="35" y="105" text-anchor="start" fill="#17374d" font-size="25"><tspan x="35" dy="0">Initial</tspan></text><text x="170" y="160" text-anchor="start" fill="#17374d" font-size="22"><tspan x="170" dy="0">Active</tspan></text><text x="170" y="240" text-anchor="start" fill="#17374d" font-size="22"><tspan x="170" dy="0">Free</tspan></text><rect x="300" y="125" width="110" height="56" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="355" y="162.45" text-anchor="middle" fill="#17374d" font-size="27"><tspan x="355" dy="0">2</tspan></text><g data-from="0-0-2" data-to="0-0-4"><path d="M410 153H465" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="465" y="125" width="110" height="56" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="520" y="162.45" text-anchor="middle" fill="#17374d" font-size="27"><tspan x="520" dy="0">4</tspan></text><g data-from="0-0-4" data-to="0-0-0"><path d="M575 153H630" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="630" y="125" width="110" height="56" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="685" y="162.45" text-anchor="middle" fill="#17374d" font-size="27"><tspan x="685" dy="0">0</tspan></text><rect x="300" y="205" width="110" height="56" rx="10" fill="#fff4dd" stroke="#176b70" stroke-width="2"/><text x="355" y="242.45" text-anchor="middle" fill="#17374d" font-size="27"><tspan x="355" dy="0">1</tspan></text><g data-from="0-1-1" data-to="0-1-3"><path d="M410 233H465" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="465" y="205" width="110" height="56" rx="10" fill="#fff4dd" stroke="#176b70" stroke-width="2"/><text x="520" y="242.45" text-anchor="middle" fill="#17374d" font-size="27"><tspan x="520" dy="0">3</tspan></text><g data-from="0-1-3" data-to="0-1-0"><path d="M575 233H630" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="630" y="205" width="110" height="56" rx="10" fill="#fff4dd" stroke="#176b70" stroke-width="2"/><text x="685" y="242.45" text-anchor="middle" fill="#17374d" font-size="27"><tspan x="685" dy="0">0</tspan></text><text x="35" y="295" text-anchor="start" fill="#17374d" font-size="25"><tspan x="35" dy="0">Insert slot 1</tspan></text><text x="170" y="350" text-anchor="start" fill="#17374d" font-size="22"><tspan x="170" dy="0">Active</tspan></text><text x="170" y="430" text-anchor="start" fill="#17374d" font-size="22"><tspan x="170" dy="0">Free</tspan></text><rect x="300" y="315" width="110" height="56" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="355" y="352.45" text-anchor="middle" fill="#17374d" font-size="27"><tspan x="355" dy="0">2</tspan></text><g data-from="1-0-2" data-to="1-0-1"><path d="M410 343H465" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="465" y="315" width="110" height="56" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="520" y="352.45" text-anchor="middle" fill="#17374d" font-size="27"><tspan x="520" dy="0">1</tspan></text><g data-from="1-0-1" data-to="1-0-4"><path d="M575 343H630" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="630" y="315" width="110" height="56" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="685" y="352.45" text-anchor="middle" fill="#17374d" font-size="27"><tspan x="685" dy="0">4</tspan></text><g data-from="1-0-4" data-to="1-0-0"><path d="M740 343H795" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="795" y="315" width="110" height="56" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="850" y="352.45" text-anchor="middle" fill="#17374d" font-size="27"><tspan x="850" dy="0">0</tspan></text><rect x="300" y="395" width="110" height="56" rx="10" fill="#fff4dd" stroke="#176b70" stroke-width="2"/><text x="355" y="432.45" text-anchor="middle" fill="#17374d" font-size="27"><tspan x="355" dy="0">3</tspan></text><g data-from="1-1-3" data-to="1-1-0"><path d="M410 423H465" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="465" y="395" width="110" height="56" rx="10" fill="#fff4dd" stroke="#176b70" stroke-width="2"/><text x="520" y="432.45" text-anchor="middle" fill="#17374d" font-size="27"><tspan x="520" dy="0">0</tspan></text><text x="35" y="485" text-anchor="start" fill="#17374d" font-size="25"><tspan x="35" dy="0">Delete slot 4</tspan></text><text x="170" y="540" text-anchor="start" fill="#17374d" font-size="22"><tspan x="170" dy="0">Active</tspan></text><text x="170" y="620" text-anchor="start" fill="#17374d" font-size="22"><tspan x="170" dy="0">Free</tspan></text><rect x="300" y="505" width="110" height="56" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="355" y="542.45" text-anchor="middle" fill="#17374d" font-size="27"><tspan x="355" dy="0">2</tspan></text><g data-from="2-0-2" data-to="2-0-1"><path d="M410 533H465" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="465" y="505" width="110" height="56" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="520" y="542.45" text-anchor="middle" fill="#17374d" font-size="27"><tspan x="520" dy="0">1</tspan></text><g data-from="2-0-1" data-to="2-0-0"><path d="M575 533H630" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="630" y="505" width="110" height="56" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="685" y="542.45" text-anchor="middle" fill="#17374d" font-size="27"><tspan x="685" dy="0">0</tspan></text><rect x="300" y="585" width="110" height="56" rx="10" fill="#fff4dd" stroke="#176b70" stroke-width="2"/><text x="355" y="622.45" text-anchor="middle" fill="#17374d" font-size="27"><tspan x="355" dy="0">4</tspan></text><g data-from="2-1-4" data-to="2-1-3"><path d="M410 613H465" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="465" y="585" width="110" height="56" rx="10" fill="#fff4dd" stroke="#176b70" stroke-width="2"/><text x="520" y="622.45" text-anchor="middle" fill="#17374d" font-size="27"><tspan x="520" dy="0">3</tspan></text><g data-from="2-1-3" data-to="2-1-0"><path d="M575 613H630" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="630" y="585" width="110" height="56" rx="10" fill="#fff4dd" stroke="#176b70" stroke-width="2"/><text x="685" y="622.45" text-anchor="middle" fill="#17374d" font-size="27"><tspan x="685" dy="0">0</tspan></text><text x="35" y="735" text-anchor="start" fill="#17374d" font-size="25"><tspan x="35" dy="0">0 is a null link, not a node. Save the old free link before reusing a slot.</tspan></text></g></svg>
