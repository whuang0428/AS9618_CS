<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610" role="img" aria-labelledby="title desc"><title id="title">A waiting process lets another ready process use the core</title><desc id="desc">In this simplified single-core sequence, process A runs, waits for I/O, then becomes ready when I/O completes. While A waits, the OS schedules ready process B. A cannot run again until it is ready and selected. Saving and restoring execution context allows the processes to resume correctly; one core does not execute both instructions at once.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176b70"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a43c35"/></marker></defs><rect width="1100" height="610" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="50" text-anchor="start" fill="#17374d" font-size="32"><tspan x="35" dy="0">A waiting process lets another ready process use the core</tspan></text><text x="35" y="112" text-anchor="start" fill="#17374d" font-size="25"><tspan x="35" dy="0">Time advances from left to right. Scheduling policy is illustrative.</tspan></text><text x="35" y="185" text-anchor="start" fill="#17374d" font-size="26"><tspan x="35" dy="0">CPU core</tspan></text><rect x="35" y="215" width="235" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="152.5" y="268.75" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="152.5" dy="0">A runs</tspan></text><g data-from="n0" data-to="n1"><path d="M270 260H300" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="300" y="215" width="235" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="417.5" y="268.75" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="417.5" dy="0">B runs</tspan></text><g data-from="n1" data-to="n2"><path d="M535 260H565" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="565" y="215" width="235" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="682.5" y="268.75" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="682.5" dy="0">B runs</tspan></text><g data-from="n2" data-to="n3"><path d="M800 260H830" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="830" y="215" width="235" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="947.5" y="268.75" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="947.5" dy="0">A resumes</tspan></text><text x="35" y="370" text-anchor="start" fill="#17374d" font-size="26"><tspan x="35" dy="0">Process A</tspan></text><rect x="35" y="405" width="235" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="152.5" y="458.75" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="152.5" dy="0">Running</tspan></text><g data-from="n0" data-to="n1"><path d="M270 450H300" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="300" y="405" width="235" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="417.5" y="441.875" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="417.5" dy="0">Waiting</tspan><tspan x="417.5" dy="33.75">for I/O</tspan></text><g data-from="n1" data-to="n2"><path d="M535 450H565" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="565" y="405" width="235" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="682.5" y="441.875" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="682.5" dy="0">Ready</tspan><tspan x="682.5" dy="33.75">I/O complete</tspan></text><g data-from="n2" data-to="n3"><path d="M800 450H830" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="830" y="405" width="235" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="947.5" y="458.75" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="947.5" dy="0">Running</tspan></text><text x="35" y="567" text-anchor="start" fill="#17374d" font-size="25"><tspan x="35" dy="0">I/O completion makes A ready; the scheduler still decides when A runs.</tspan></text></g></svg>
