<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540" role="img" aria-labelledby="title desc"><title id="title">Evaluate the right-hand expression before storing its result</title><desc id="desc">Illustrative update: Total starts at 12 and Increment at 4; execute Total &lt;- Total + Increment. Read the old values 12 and 4, calculate 16, then replace Total with 16. Increment stays 4. The assignment arrow means store; an equals comparison tests whether two values are equal.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176b70"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a43c35"/></marker></defs><rect width="1100" height="540" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="50" text-anchor="start" fill="#17374d" font-size="32"><tspan x="35" dy="0">Evaluate the right-hand expression before storing its result</tspan></text><text x="35" y="120" text-anchor="start" fill="#17374d" font-size="30"><tspan x="35" dy="0">Statement: Total &lt;- Total + Increment</tspan></text><rect x="35" y="185" width="235" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="152.5" y="221.875" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="152.5" dy="0">Read old values</tspan><tspan x="152.5" dy="33.75">12 and 4</tspan></text><g data-from="n0" data-to="n1"><path d="M270 230H300" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="300" y="185" width="235" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="417.5" y="221.875" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="417.5" dy="0">Evaluate RHS</tspan><tspan x="417.5" dy="33.75">12 + 4 = 16</tspan></text><g data-from="n1" data-to="n2"><path d="M535 230H565" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="565" y="185" width="235" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="682.5" y="221.875" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="682.5" dy="0">Store result</tspan><tspan x="682.5" dy="33.75">Total becomes 16</tspan></text><g data-from="n2" data-to="n3"><path d="M800 230H830" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="830" y="185" width="235" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="947.5" y="221.875" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="947.5" dy="0">Other storage</tspan><tspan x="947.5" dy="33.75">Increment stays 4</tspan></text><rect x="35" y="345" width="1030" height="90" rx="10" fill="#fff4dd" stroke="#176b70" stroke-width="2"/><text x="550" y="382.2" text-anchor="middle" fill="#17374d" font-size="24"><tspan x="550" dy="0">An assignment may read the same variable that it later overwrites.</tspan><tspan x="550" dy="32.400000000000006">INPUT must obtain required values before an expression uses them.</tspan></text></g></svg>
