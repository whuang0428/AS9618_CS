<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc"><title id="title">Test on a copy; reload the original before changing a control bit</title><desc id="desc">Bits are numbered 7 on the left to 0 on the right. The original device byte is 00010001. AND 00010000 tests ready bit 4, producing 00010000 in the working copy. Reload 00010001, then OR 00000100 sets motor bit 2. Store 00010101 back; original bits 4 and 0 stay set.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176b70"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a43c35"/></marker></defs><rect width="1100" height="680" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="50" text-anchor="start" fill="#17374d" font-size="32"><tspan x="35" dy="0">Test on a copy; reload the original before changing a control bit</tspan></text><text x="368" y="105" text-anchor="middle" fill="#17374d" font-size="21"><tspan x="368" dy="0">b7</tspan></text><text x="453" y="105" text-anchor="middle" fill="#17374d" font-size="21"><tspan x="453" dy="0">b6</tspan></text><text x="538" y="105" text-anchor="middle" fill="#17374d" font-size="21"><tspan x="538" dy="0">b5</tspan></text><text x="623" y="105" text-anchor="middle" fill="#17374d" font-size="21"><tspan x="623" dy="0">b4</tspan></text><text x="708" y="105" text-anchor="middle" fill="#17374d" font-size="21"><tspan x="708" dy="0">b3</tspan></text><text x="793" y="105" text-anchor="middle" fill="#17374d" font-size="21"><tspan x="793" dy="0">b2</tspan></text><text x="878" y="105" text-anchor="middle" fill="#17374d" font-size="21"><tspan x="878" dy="0">b1</tspan></text><text x="963" y="105" text-anchor="middle" fill="#17374d" font-size="21"><tspan x="963" dy="0">b0</tspan></text><text 