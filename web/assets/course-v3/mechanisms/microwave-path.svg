<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="630" viewBox="0 0 1100 630" role="img" aria-labelledby="title desc"><title id="title">A directional link needs an unobstructed path</title><desc id="desc">A point-to-point microwave link uses aligned antennas and normally requires clear line of sight. The upper schematic has an unobstructed path; the lower path is blocked by a hill. Masts or relay sites can help clear obstacles. This is a path schematic, not a scale drawing or a link-budget calculation.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176b70"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a43c35"/></marker></defs><rect width="1100" height="630" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="50" text-anchor="start" fill="#17374d" font-size="32"><tspan x="35" dy="0">A directional link needs an unobstructed path</tspan></text><text x="35" y="112" text-anchor="start" fill="#17374d" font-size="27"><tspan x="35" dy="0">Clear path</tspan></text><rect x="35" y="155" width="220" height="80" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="145" y="186.54999999999998" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="145" dy="0">Aligned</tspan><tspan x="145" dy="35.1">antenna A</tspan></text><rect x="845" y="155" width="220" height="80" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="955" y="186.54999999999998" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="955" dy="0">Aligned</tspan><tspan x="955" dy="35.1">antenna B</tspan></text><g data-from="clear-a" data-to="clear-b"><path d="M255 195H845" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><text x="550" y="175" text-anchor="middle" fill="#176b70" font-size="23"><tspan x="550" dy="0">Directional beam</tspan></text></g><text x="35" y="326" text-anchor="start" fill="#17374d" font-size="27"><tspan x="35" dy="0">Blocked path</tspan></text><rect x="35" y="405" width="220" height="80" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="145" y="454.1" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="145" dy="0">Antenna A</tspan></text><rect x="845" y="405" width="220" height="80" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="955" y="454.1" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="955" dy="0">Antenna B</tspan></text><path d="M340 535L550 365L760 535Z" fill="#e5e9de" stroke="#176b70" stroke-width="2"/><path d="M255 445H445" fill="none" stroke="#a43c35" stroke-width="3" marker-end="url(#red-arrow)"/><text x="350" y="420" text-anchor="middle" fill="#a43c35" font-size="23"><tspan x="350" dy="0">Blocked</tspan></text><text x="550" y="493" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="550" dy="0">Hill</tspan></text><text x="35" y="595" text-anchor="start" fill="#17374d" font-size="25"><tspan x="35" dy="0">Alignment, obstructions, interference and weather affect the usable link.</tspan></text></g></svg>
