<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="565" viewBox="0 0 1100 565" role="img" aria-labelledby="title desc"><title id="title">An array index selects a cell; it is not the stored value</title><desc id="desc">Ages is ARRAY[3:7] OF INTEGER with values 15, 17, 16, 15, 18. Ages[4] selects the cell at index 4 and reads the value 17. Inclusive capacity is 7 - 3 + 1 = 5. The indices need not begin at 0 or 1.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176b70"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a43c35"/></marker></defs><rect width="1100" height="565" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="50" text-anchor="start" fill="#17374d" font-size="32"><tspan x="35" dy="0">An array index selects a cell; it is not the stored value</tspan></text><text x="35" y="117" text-anchor="start" fill="#17374d" font-size="28"><tspan x="35" dy="0">Ages : ARRAY[3:7] OF INTEGER</tspan></text><text x="345" y="197" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="345" dy="0">3</tspan></text><text x="495" y="197" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="495" dy="0">4</tspan></text><text x="645" y="197" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="645" dy="0">5</tspan></text><text x="795" y="197" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="795" dy="0">6</tspan></text><text x="945" y="197" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="945" dy="0">7</tspan></text><text x="35" y="195" text-anchor="start" fill="#17374d" font-size="26"><tspan x="35" dy="0">Index</tspan></text><text x="35" y="276" text-anchor="start" fill="#17374d" font-size="26"><tspan x="35" dy="0">Stored value</tspan></text><g data-state="ages"><g data-cell="1" data-active="true"><rect x="275" y="230" width="142" height="64" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="346" y="271.8" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="346" dy="0">15</tspan></text></g><g data-cell="2" data-active="true"><rect x="425" y="230" width="142" height="64" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="496" y="271.8" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="496" dy="0">17</tspan></text></g><g data-cell="3" data-active="true"><rect x="575" y="230" width="142" height="64" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="646" y="271.8" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="646" dy="0">16</tspan></text></g><g data-cell="4" data-active="true"><rect x="725" y="230" width="142" height="64" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="796" y="271.8" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="796" dy="0">15</tspan></text></g><g data-cell="5" data-active="true"><rect x="875" y="230" width="142" height="64" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="946" y="271.8" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="946" dy="0">18</tspan></text></g></g><g data-from="index-4" data-to="value-17"><path d="M495 205V230" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><text x="35" y="387" text-anchor="start" fill="#17374d" font-size="25"><tspan x="35" dy="0">Ages[4] = 17; index 4 selects one of the five INTEGER elements.</tspan></text><text x="35" y="510" text-anchor="start" fill="#17374d" font-size="24"><tspan x="35" dy="0">The same value can occur in several cells without making their indices equal.</tspan></text></g></svg>
