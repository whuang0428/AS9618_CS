<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="675" viewBox="0 0 1100 675" role="img" aria-labelledby="title desc"><title id="title">A stub tests a caller’s response before the real callee exists</title><desc id="desc">In this illustrative interface, ProcessOrder calls GetPrice(ItemCode) and expects a REAL price. A temporary stub returns the controlled REAL value 12.50 so the caller can be exercised. Replace the stub with the real pricing module and repeat integration tests. The stub test has not tested the real lookup.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176b70"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a43c35"/></marker></defs><rect width="1100" height="675" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="50" text-anchor="start" fill="#17374d" font-size="32"><tspan x="35" dy="0">A stub tests a caller’s response before the real callee exists</tspan></text><text x="35" y="118" text-anchor="start" fill="#17374d" font-size="27"><tspan x="35" dy="0">During early integration</tspan></text><rect x="35" y="160" width="375" height="110" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="222.5" y="206.54999999999998" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="222.5" dy="0">ProcessOrder</tspan><tspan x="222.5" dy="35.1">GetPrice(ItemCode)</tspan></text><g data-from="caller" data-to="stub"><path d="M410 190H680" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><text x="545" y="174" text-anchor="middle" fill="#176b70" font-size="23"><tspan x="545" dy="0">ItemCode</tspan></text></g><rect x="680" y="160" width="385" height="110" rx="10" fill="#fff4dd" stroke="#176b70" stroke-width="2"/><text x="872.5" y="206.875" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="872.5" dy="0">Temporary GetPrice stub</tspan><tspan x="872.5" dy="33.75">RETURN 12.50</tspan></text><g data-from="stub" data-to="caller"><path d="M680 242H410" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><text x="545" y="231" text-anchor="middle" fill="#176b70" font-size="23"><tspan x="545" dy="0">REAL 12.50</tspan></text></g><text x="35" y="384" text-anchor="start" fill="#17374d" font-size="27"><tspan x="35" dy="0">After the real module is available</tspan></text><rect x="35" y="430" width="375" height="110" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="222.5" y="476.55" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="222.5" dy="0">ProcessOrder</tspan><tspan x="222.5" dy="35.1">Same interface</tspan></text><g data-from="caller-real" data-to="real"><path d="M410 460H680" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><text x="545" y="443" text-anchor="middle" fill="#176b70" font-size="23"><tspan x="545" dy="0">ItemCode</tspan></text></g><rect x="680" y="430" width="385" height="110" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="872.5" y="476.55" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="872.5" dy="0">Real pricing module</tspan><tspan x="872.5" dy="35.1">Look up the correct price</tspan></text><g data-from="real" data-to="caller-real"><path d="M680 511H410" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><text x="545" y="499" text-anchor="middle" fill="#176b70" font-size="23"><tspan x="545" dy="0">REAL result</tspan></text></g><text x="35" y="622" text-anchor="start" fill="#17374d" font-size="24"><tspan x="35" dy="0">Retest argument order, types, units and meaning with the real implementation.</tspan></text></g></svg>
