<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc"><title id="title">An empty line is data; end of file is a position</title><desc id="desc">This text file contains Ada, an empty line, and Dan: three lines in total. Before each READFILE, EOF is false if a line remains. Reading the empty line returns an empty STRING and still advances the position. After Dan, EOF is true and no further READFILE should execute. An empty file starts with EOF true and yields zero lines.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176b70"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a43c35"/></marker></defs><rect width="1100" height="620" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="50" text-anchor="start" fill="#17374d" font-size="32"><tspan x="35" dy="0">An empty line is data; end of file is a position</tspan></text><text x="35" y="123" text-anchor="start" fill="#17374d" font-size="26"><tspan x="35" dy="0">After 0 reads</tspan></text><rect x="60" y="165" width="190" height="65" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="155" y="206.6" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="155" dy="0">Ada</tspan></text><rect x="60" y="242" width="190" height="65" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="155" y="283.6" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="155" dy="0">&quot;&quot; (blank)</tspan></text><rect x="60" y="319" width="190" height="65" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="155" y="360.6" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="155" dy="0">Dan</tspan></text><g data-from="position-0" data-to="line-1"><path d="M35 197H59" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><text x="150" y="460" text-anchor="middle" fill="#17374d" font-size="24"><tspan x="150" dy="0">EOF = FALSE</tspan></text><text x="300" y="123" text-anchor="start" fill="#17374d" font-size="26"><tspan x="300" dy="0">After 1 reads</tspan></text><rect x="325" y="165" width="190" height="65" rx="10" fill="#f2f4f6" stroke="#176b70" stroke-width="2"/><text x="420" y="206.6" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="420" dy="0">Ada</tspan></text><rect x="325" y="242" width="190" height="65" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="420" y="283.6" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="420" dy="0">&quot;&quot; (blank)</tspan></text><rect x="325" y="319" width="190" height="65" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="420" y="360.6" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="420" dy="0">Dan</tspan></text><g data-from="position-1" data-to="line-2"><path d="M300 274H324" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><text x="415" y="460" text-anchor="middle" fill="#17374d" font-size="24"><tspan x="415" dy="0">EOF = FALSE</tspan></text><text x="565" y="123" text-anchor="start" fill="#17374d" font-size="26"><tspan x="565" dy="0">After 2 reads</tspan></text><rect x="590" y="165" width="190" height="65" rx="10" fill="#f2f4f6" stroke="#176b70" stroke-width="2"/><text x="685" y="206.6" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="685" dy="0">Ada</tspan></text><rect x="590" y="242" width="190" height="65" rx="10" fill="#f2f4f6" stroke="#176b70" stroke-width="2"/><text x="685" y="283.6" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="685" dy="0">&quot;&quot; (blank)</tspan></text><rect x="590" y="319" width="190" height="65" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="685" y="360.6" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="685" dy="0">Dan</tspan></text><g data-from="position-2" data-to="line-3"><path d="M565 351H589" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><text x="680" y="460" text-anchor="middle" fill="#17374d" font-size="24"><tspan x="680" dy="0">EOF = FALSE</tspan></text><text x="830" y="123" text-anchor="start" fill="#17374d" font-size="26"><tspan x="830" dy="0">After 3 reads</tspan></text><rect x="855" y="165" width="190" height="65" rx="10" fill="#f2f4f6" stroke="#176b70" stroke-width="2"/><text x="950" y="206.6" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="950" dy="0">Ada</tspan></text><rect x="855" y="242" width="190" height="65" rx="10" fill="#f2f4f6" stroke="#176b70" stroke-width="2"/><text x="950" y="283.6" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="950" dy="0">&quot;&quot; (blank)</tspan></text><rect x="855" y="319" width="190" height="65" rx="10" fill="#f2f4f6" stroke="#176b70" stroke-width="2"/><text x="950" y="360.6" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="950" dy="0">Dan</tspan></text><g data-from="position-3" data-to="end"><path d="M830 428H854" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><text x="945" y="460" text-anchor="middle" fill="#17374d" font-size="24"><tspan x="945" dy="0">EOF = TRUE</tspan></text><rect x="35" y="515" width="1030" height="90" rx="10" fill="#fff4dd" stroke="#176b70" stroke-width="2"/><text x="550" y="552.1999999999999" text-anchor="middle" fill="#17374d" font-size="24"><tspan x="550" dy="0">Count every successful read, including the empty string: total 3 lines.</tspan><tspan x="550" dy="32.400000000000006">Guard each read with NOT EOF; close the file after the loop.</tspan></text></g></svg>
