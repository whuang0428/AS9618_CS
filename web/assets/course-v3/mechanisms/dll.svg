<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="645" viewBox="0 0 1100 645" role="img" aria-labelledby="title desc"><title id="title">Static copies and a separate shared library</title><desc id="desc">Static linking incorporates the required library code in each built executable. Dynamic linking keeps a compatible library separate; multiple applications can call it at load time or runtime. A compatible library update can serve the callers without recompiling each caller, but a reload or restart may be required.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176b70"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a43c35"/></marker></defs><rect width="1100" height="645" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="50" text-anchor="start" fill="#17374d" font-size="32"><tspan x="35" dy="0">Static copies and a separate shared library</tspan></text><text x="35" y="118" text-anchor="start" fill="#17374d" font-size="28"><tspan x="35" dy="0">Static linking</tspan></text><rect x="35" y="155" width="450" height="125" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="260" y="209.04999999999998" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="260" dy="0">Executable A</tspan><tspan x="260" dy="35.1">Application + library code</tspan></text><rect x="585" y="155" width="480" height="125" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="825" y="209.04999999999998" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="825" dy="0">Executable B</tspan><tspan x="825" dy="35.1">Application + library code</tspan></text><text x="35" y="355" text-anchor="start" fill="#17374d" font-size="28"><tspan x="35" dy="0">Dynamic linking</tspan></text><rect x="35" y="395" width="250" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="160" y="449.1" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="160" dy="0">Application A</tspan></text><rect x="815" y="395" width="250" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="940" y="449.1" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="940" dy="0">Application B</tspan></text><rect x="365" y="395" width="370" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="550" y="431.55" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="550" dy="0">Separate DLL</tspan><tspan x="550" dy="35.1">Compatible interface</tspan></text><g data-from="app-a" data-to="dll"><path d="M285 440H365" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><g data-from="app-b" data-to="dll"><path d="M815 440H735" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="35" y="525" width="1030" height="90" rx="10" fill="#fff4dd" stroke="#176b70" stroke-width="2"/><text x="550" y="562.1999999999999" text-anchor="middle" fill="#17374d" font-size="24"><tspan x="550" dy="0">The arrows show calls to the library, not the copying of two library files.</tspan><tspan x="550" dy="32.400000000000006">A missing or incompatible DLL can prevent the callers from working.</tspan></text></g></svg>
