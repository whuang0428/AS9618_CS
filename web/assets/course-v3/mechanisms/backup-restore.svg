<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-labelledby="title desc"><title id="title">A saved recovery version can outlive loss of the working file</title><desc id="desc">At time 1, version V1 is copied from the working disk to a separate recovery destination. At time 2 the working file becomes V2; it is then lost before another backup. Restoring the saved copy recovers V1, not the unbacked-up V2. Test restoration and keep recovery copies outside the same failure.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176b70"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a43c35"/></marker></defs><rect width="1100" height="640" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="50" text-anchor="start" fill="#17374d" font-size="32"><tspan x="35" dy="0">A saved recovery version can outlive loss of the working file</tspan></text><rect x="35" y="145" width="355" height="100" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="212.5" y="186.54999999999998" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="212.5" dy="0">Time 1: working disk</tspan><tspan x="212.5" dy="35.1">V1</tspan></text><g data-from="original" data-to="backup"><path d="M390 195H710" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><text x="550" y="176" text-anchor="middle" fill="#176b70" font-size="23"><tspan x="550" dy="0">Backup copy</tspan></text></g><rect x="710" y="145" width="355" height="100" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="887.5" y="186.54999999999998" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="887.5" dy="0">Separate recovery copy</tspan><tspan x="887.5" dy="35.1">V1</tspan></text><g data-from="original" data-to="lost"><path d="M212 245V345" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="35" y="345" width="355" height="110" rx="10" fill="#fff4dd" stroke="#176b70" stroke-width="2"/><text x="212.5" y="391.875" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="212.5" dy="0">Time 2: edited to V2</tspan><tspan x="212.5" dy="33.75">Then working file is lost</tspan></text><g data-from="backup" data-to="restored"><path d="M887 245V520H660" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><text x="953" y="389" text-anchor="middle" fill="#176b70" font-size="23"><tspan x="953" dy="0">Restore V1</tspan></text></g><rect x="295" y="475" width="365" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="477.5" y="511.55" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="477.5" dy="0">Recovered working file</tspan><tspan x="477.5" dy="35.1">V1</tspan></text><text x="35" y="614" text-anchor="start" fill="#17374d" font-size="24"><tspan x="35" dy="0">Backup frequency determines how much work since the last backup may be lost.</tspan></text></g></svg>
