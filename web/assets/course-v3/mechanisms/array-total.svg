<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-labelledby="title desc"><title id="title">Keep the accumulator while the index advances</title><desc id="desc">Marks[1:4] receives 6, 9, 4 and 7. Total is initialised once to 0. After each addition, Total is 6, 15, 19 and 26. All four marks remain in the array. The final outputs are Total = 26 and Marks[3] = 4. Resetting Total inside the loop would lose earlier contributions.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176b70"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a43c35"/></marker></defs><rect width="1100" height="600" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="50" text-anchor="start" fill="#17374d" font-size="32"><tspan x="35" dy="0">Keep the accumulator while the index advances</tspan></text><text x="35" y="120" text-anchor="start" fill="#17374d" font-size="27"><tspan x="35" dy="0">Before the loop: Total &lt;- 0</tspan></text><text x="340" y="193" text-anchor="middle" fill="#17374d" font-size="24"><tspan x="340" dy="0">Index 1</tspan></text><text x="525" y="193" text-anchor="middle" fill="#17374d" font-size="24"><tspan x="525" dy="0">Index 2</tspan></text><text x="710" y="193" text-anchor="middle" fill="#17374d" font-size="24"><tspan x="710" dy="0">Index 3</tspan></text><text x="895" y="193" text-anchor="middle" fill="#17374d" font-size="24"><tspan x="895" dy="0">Index 4</tspan></text><text x="35" y="270" text-anchor="start" fill="#17374d" font-size="25"><tspan x="35" dy="0">Marks[Index]</tspan></text><g data-state="marks"><g data-cell="1" data-active="true"><rect x="250" y="230" width="177" height="64" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="338.5" y="271.8" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="338.5" dy="0">6</tspan></text></g><g data-cell="2" data-active="true"><rect x="435" y="230" width="177" height="64" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="523.5" y="271.8" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="523.5" dy="0">9</tspan></text></g><g data-cell="3" data-active="true"><rect x="620" y="230" width="177" height="64" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="708.5" y="271.8" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="708.5" dy="0">4</tspan></text></g><g data-cell="4" data-active="true"><rect x="805" y="230" width="177" height="64" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="893.5" y="271.8" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="893.5" dy="0">7</tspan></text></g></g><g data-from="mark-1" data-to="total-1"><path d="M338 294V360" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><g data-from="mark-2" data-to="total-2"><path d="M523 294V360" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><g data-from="mark-3" data-to="total-3"><path d="M708 294V360" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><g data-from="mark-4" data-to="total-4"><path d="M893 294V360" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><text x="35" y="404" text-anchor="start" fill="#17374d" font-size="25"><tspan x="35" dy="0">Total after add</tspan></text><g data-state="totals"><g data-cell="1" data-active="true"><rect x="250" y="360" width="177" height="64" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="338.5" y="401.8" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="338.5" dy="0">6</tspan></text></g><g data-cell="2" data-active="true"><rect x="435" y="360" width="177" height="64" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="523.5" y="401.8" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="523.5" dy="0">15</tspan></text></g><g data-cell="3" data-active="true"><rect x="620" y="360" width="177" height="64" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="708.5" y="401.8" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="708.5" dy="0">19</tspan></text></g><g data-cell="4" data-active="true"><rect x="805" y="360" width="177" height="64" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="893.5" y="401.8" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="893.5" dy="0">26</tspan></text></g></g><text x="35" y="537" text-anchor="start" fill="#17374d" font-size="26"><tspan x="35" dy="0">OUTPUT after the loop: 26, then the retained third mark 4.</tspan></text></g></svg>
