<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580" role="img" aria-labelledby="title desc"><title id="title">The character code and the drawn glyph are different things</title><desc id="desc">ASCII assigns uppercase A the decimal code 65, represented in 7 bits as 1000001. An 8-bit storage representation with leading zero is 01000001. The leading zero does not change the value. A font controls the shape drawn for A; the agreed encoding controls the interpretation of the bits.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176b70"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a43c35"/></marker></defs><rect width="1100" height="580" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="50" text-anchor="start" fill="#17374d" font-size="32"><tspan x="35" dy="0">The character code and the drawn glyph are different things</tspan></text><rect x="35" y="145" width="235" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="152.5" y="181.875" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="152.5" dy="0">Character</tspan><tspan x="152.5" dy="33.75">A</tspan></text><g data-from="character" data-to="code"><path d="M270 190H300" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="300" y="145" width="235" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="417.5" y="181.875" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="417.5" dy="0">ASCII code</tspan><tspan x="417.5" dy="33.75">65</tspan></text><g data-from="code" data-to="bits"><path d="M535 190H565" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="565" y="145" width="235" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="682.5" y="181.875" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="682.5" dy="0">7-bit value</tspan><tspan x="682.5" dy="33.75">1000001</tspan></text><g data-from="bits" data-to="byte"><path d="M800 190H830" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="830" y="145" width="235" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="947.5" y="181.875" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="947.5" dy="0">8-bit storage</tspan><tspan x="947.5" dy="33.75">01000001</tspan></text><text x="35" y="320" text-anchor="start" fill="#17374d" font-size="27"><tspan x="35" dy="0">One character, different glyphs</tspan></text><text x="140" y="427" font-family="serif" font-size="86" fill="#176b70">A</text><text x="325" y="427" font-family="sans-serif" font-size="86" fill="#176b70">A</text><text x="535" y="372" text-anchor="start" fill="#17374d" font-size="25"><tspan x="535" dy="0">Changing the font changes the drawing.</tspan><tspan x="535" dy="33.75">It does not turn ASCII code 65</tspan><tspan x="535" dy="33.75">into a different character code.</tspan></text><text x="35" y="535" text-anchor="start" fill="#17374d" font-size="24"><tspan x="35" dy="0">Use the specified character set or encoding when converting between bits and text.</tspan></text></g></svg>
