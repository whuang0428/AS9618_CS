<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc"><title id="title">Wrap the rear index while preserving arrival order</title><desc id="desc">Capacity is 3. Initially Front = 2, Rear = 3, Count = 2; B and C are waiting at indices 2 and 3. ENQUEUE D wraps Rear to 1 and increases Count to 3. Front stays 2. Array cells now hold D, B, C; logical removal order is B, C, D, following indices 2, 3, 1.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176b70"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a43c35"/></marker></defs><rect width="1100" height="660" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="50" text-anchor="start" fill="#17374d" font-size="32"><tspan x="35" dy="0">Wrap the rear index while preserving arrival order</tspan></text><text x="35" y="115" text-anchor="start" fill="#17374d" font-size="25"><tspan x="35" dy="0">Physical array indices →</tspan></text><text x="365" y="163" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="365" dy="0">1</tspan></text><text x="585" y="163" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="585" dy="0">2</tspan></text><text x="805" y="163" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="805" dy="0">3</tspan></text><text x="35" y="220" text-anchor="start" fill="#17374d" font-size="26"><tspan x="35" dy="0">Before</tspan></text><g data-state="queue-before"><g data-cell="1" data-active="false"><rect x="260" y="185" width="212" height="64" rx="10" fill="#f2f4f6" stroke="#176b70" stroke-width="2"/><text x="366" y="226.8" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="366" dy="0">—</tspan></text></g><g data-cell="2" data-active="true"><rect x="480" y="185" width="212" height="64" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="586" y="226.8" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="586" dy="0">B</tspan></text></g><g data-cell="3" data-active="true"><rect x="700" y="185" width="212" height="64" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="806" y="226.8" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="806" dy="0">C</tspan></text></g></g><text x="35" y="290" text-anchor="start" fill="#17374d" font-size="26"><tspan x="35" dy="0">Before: Front = 2     Rear = 3     Count = 2</tspan></text><text x="35" y="385" text-anchor="start" fill="#17374d" font-size="26"><tspan x="35" dy="0">ENQUEUE D</tspan></text><g data-state="queue-after"><g data-cell="1" data-active="true"><rect x="260" y="350" width="212" height="64" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="366" y="391.8" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="366" dy="0">D</tspan></text></g><g data-cell="2" data-active="true"><rect x="480" y="350" width="212" height="64" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="586" y="391.8" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="586" dy="0">B</tspan></text></g><g data-cell="3" data-active="true"><rect x="700" y="350" width="212" height="64" rx="10" fill="#e1f0ed" stroke="#176b70" stroke-width="2"/><text x="806" y="391.8" text-anchor="middle" fill="#17374d" font-size="28"><tspan x="806" dy="0">C</tspan></text></g></g><text x="35" y="325" text-anchor="start" fill="#17374d" font-size="26"><tspan x="35" dy="0">After: Front = 2     Rear = 1     Count = 3 (full)</tspan></text><g data-from="index-2" data-to="index-3"><path d="M590 414V510H810V414" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><g data-from="index-3" data-to="index-1"><path d="M912 382H990V565H305V414" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><text x="590" y="547" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="590" dy="0">Next removals: B → C → D</tspan></text><text x="35" y="625" text-anchor="start" fill="#17374d" font-size="25"><tspan x="35" dy="0">Read from Front around the array; index 1 is not automatically served first.</tspan></text></g></svg>
