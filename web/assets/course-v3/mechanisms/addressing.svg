<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="845" viewBox="0 0 1100 845" role="img" aria-labelledby="title desc"><title id="title">Follow the address to find the value</title><desc id="desc">Memory[100] = 150; Memory[150] = 7; Memory[102] = 9; IX = 2. Immediate #100 supplies 100; direct 100 reads 150; indirect 100 reads 7. Indexed 100 + IX selects address 102 and reads 9. Relative addressing with stated PC base 40 and displacement -5 gives target address 35, not the contents of address 35.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176b70"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a43c35"/></marker></defs><rect width="1100" height="845" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="50" text-anchor="start" fill="#17374d" font-size="32"><tspan x="35" dy="0">Follow the address to find the value</tspan></text><text x="35" y="99" text-anchor="start" fill="#17374d" font-size="25"><tspan x="35" dy="0">Same operand 100; IX = 2. Boxes distinguish locations from values.</tspan></text><text x="35" y="162" text-anchor="start" fill="#17374d" font-size="27"><tspan x="35" dy="0">Immediate</tspan></text><rect x="210" y="120" width="210" height="86" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="315" y="172.1" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="315" dy="0">#100</tspan></text><path d="M420 163H465" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><rect x="465" y="120" width="270" height="86" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="600" y="172.1" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="600" dy="0">Value 100</tspan></text><text x="35" y="294" text-anchor="start" fill="#17374d" font-size="27"><tspan x="35" dy="0">Direct</tspan></text><rect x="210" y="252" width="210" height="86" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="315" y="304.1" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="315" dy="0">Address 100</tspan></text><path d="M420 295H465" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><rect x="465" y="252" width="270" height="86" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="600" y="286.55" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="600" dy="0">Memory[100]</tspan><tspan x="600" dy="35.1">contains 150</tspan></text><path d="M735 295H780" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><rect x="780" y="252" width="285" height="86" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="922.5" y="304.1" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="922.5" dy="0">Value 150</tspan></text><text x="35" y="426" text-anchor="start" fill="#17374d" font-size="27"><tspan x="35" dy="0">Indirect</tspan></text><rect x="210" y="384" width="210" height="86" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="315" y="436.1" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="315" dy="0">Address 100</tspan></text><path d="M420 427H465" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><rect x="465" y="384" width="270" height="86" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="600" y="418.55" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="600" dy="0">Memory[100]</tspan><tspan x="600" dy="35.1">contains address 150</tspan></text><path d="M735 427H780" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><rect x="780" y="384" width="285" height="86" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="922.5" y="418.55" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="922.5" dy="0">Memory[150]</tspan><tspan x="922.5" dy="35.1">contains value 7</tspan></text><text x="35" y="558" text-anchor="start" fill="#17374d" font-size="27"><tspan x="35" dy="0">Indexed</tspan></text><rect x="210" y="516" width="210" height="86" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="315" y="550.5500000000001" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="315" dy="0">100 + IX</tspan><tspan x="315" dy="35.1">= 102</tspan></text><path d="M420 559H465" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><rect x="465" y="516" width="270" height="86" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="600" y="550.5500000000001" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="600" dy="0">Memory[102]</tspan><tspan x="600" dy="35.1">contains 9</tspan></text><path d="M735 559H780" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><rect x="780" y="516" width="285" height="86" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="922.5" y="568.1" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="922.5" dy="0">Value 9</tspan></text><text x="35" y="690" text-anchor="start" fill="#17374d" font-size="27"><tspan x="35" dy="0">Relative</tspan></text><rect x="210" y="648" width="210" height="86" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="315" y="682.5500000000001" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="315" dy="0">Stated PC base</tspan><tspan x="315" dy="35.1">40</tspan></text><path d="M420 691H465" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><rect x="465" y="648" width="270" height="86" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="600" y="700.1" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="600" dy="0">40 + (-5)</tspan></text><path d="M735 691H780" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><rect x="780" y="648" width="285" height="86" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="922.5" y="700.1" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="922.5" dy="0">Target address 35</tspan></text><text x="35" y="812" text-anchor="start" fill="#17374d" font-size="25"><tspan x="35" dy="0">An address selects storage. Its contents can be a different number.</tspan></text></g></svg>
