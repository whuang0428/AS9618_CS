<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1160" viewBox="0 0 1100 1160" role="img" aria-labelledby="title desc"><title id="title">Continue only while the password is wrong and attempts remain</title><desc id="desc">Password starts as an empty string and Attempts as 0. The continuation test is (Password &lt;&gt; &quot;open&quot;) AND (Attempts &lt; 3). TRUE reads input and increments Attempts; FALSE exits. Input open exits after one attempt. Inputs x, y, open succeed on attempt 3; x, y, z fail after 3. Every input increments the counter.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176b70"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a43c35"/></marker></defs><rect width="1100" height="1160" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="50" text-anchor="start" fill="#17374d" font-size="32"><tspan x="35" dy="0">Continue only while the password is wrong and attempts remain</tspan></text><rect x="390" y="100" width="300" height="60" rx="32" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="540" y="139.1" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="540" dy="0">Start</tspan></text><g data-from="start" data-to="init"><path d="M540 160V205" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="290" y="205" width="500" height="85" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="540" y="239.04999999999998" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="540" dy="0">Password &lt;- &quot;&quot;</tspan><tspan x="540" dy="35.1">Attempts &lt;- 0</tspan></text><g data-from="init" data-to="condition"><path d="M540 290V350" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><polygon points="540,350 795,435 540,520 285,435" fill="#fff4dd" stroke="#176b70" stroke-width="2"/><text x="540" y="427" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="540" dy="0">Password &lt;&gt; &quot;open&quot;</tspan><tspan x="540" dy="33.75">AND Attempts &lt; 3?</tspan></text><g data-from="condition" data-to="input"><path d="M540 520V585" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><text x="593" y="558" text-anchor="middle" fill="#176b70" font-size="23"><tspan x="593" dy="0">TRUE</tspan></text></g><polygon points="387,585 715,585 693,655 365,655" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="540" y="629" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="540" dy="0">INPUT Password</tspan></text><g data-from="input" data-to="increment"><path d="M540 655V710" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="330" y="710" width="420" height="75" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="540" y="756.6" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="540" dy="0">Attempts &lt;- Attempts + 1</tspan></text><g data-from="increment" data-to="condition"><path d="M330 747H115V435H285" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><g data-from="condition" data-to="output"><path d="M795 435H935V860" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><text x="991" y="645" text-anchor="middle" fill="#176b70" font-size="23"><tspan x="991" dy="0">FALSE</tspan></text></g><polygon points="567,860 1065,860 1043,945 545,945" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="805" y="911.5" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="805" dy="0">OUTPUT Password = &quot;open&quot;, Attempts</tspan></text><g data-from="output" data-to="end"><path d="M805 945V1000" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="655" y="1000" width="300" height="60" rx="32" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="805" y="1039.1" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="805" dy="0">End</tspan></text><text x="35" y="888" text-anchor="start" fill="#17374d" font-size="24"><tspan x="35" dy="0">open → TRUE, 1</tspan><tspan x="35" dy="32.400000000000006">x, y, open → TRUE, 3</tspan><tspan x="35" dy="32.400000000000006">x, y, z → FALSE, 3</tspan></text><text x="35" y="1121" text-anchor="start" fill="#17374d" font-size="25"><tspan x="35" dy="0">Third-attempt success is counted as attempt 3, not 2 or 4.</tspan></text></g></svg>
