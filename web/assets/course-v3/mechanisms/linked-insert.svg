<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc"><title id="title">Preserve the successor before linking the new node</title><desc id="desc">Initially Head = 2 and the chain is 2:A → 4:B → 1:C → 0. Slot 3 is free. To insert X after A, store X in slot 3 and set Next[3] = 4 before setting Next[2] = 3. The resulting chain is 2:A → 3:X → 4:B → 1:C → 0. To delete X, restore Next[2] = 4 and release slot 3.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176b70"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a43c35"/></marker></defs><rect width="1100" height="680" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="50" text-anchor="start" fill="#17374d" font-size="32"><tspan x="35" dy="0">Preserve the successor before linking the new node</tspan></text><text x="35" y="118" text-anchor="start" fill="#17374d" font-size="26"><tspan x="35" dy="0">Before · Head = 2; 0 is the null link</tspan></text><rect x="35" y="150" width="235" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="152.5" y="186.875" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="152.5" dy="0">Index 2</tspan><tspan x="152.5" dy="33.75">A | Next 4</tspan></text><g data-from="before-2" data-to="before-4"><path d="M270 195H300" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="300" y="150" width="235" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="417.5" y="186.875" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="417.5" dy="0">Index 4</tspan><tspan x="417.5" dy="33.75">B | Next 1</tspan></text><g data-from="before-4" data-to="before-1"><path d="M535 195H565" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="565" y="150" width="235" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="682.5" y="186.875" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="682.5" dy="0">Index 1</tspan><tspan x="682.5" dy="33.75">C | Next 0</tspan></text><g data-from="before-1" data-to="before-0"><path d="M800 195H830" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="830" y="150" width="235" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="947.5" y="203.75" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="947.5" dy="0">0 (end)</tspan></text><text x="35" y="307" text-anchor="start" fill="#17374d" font-size="25"><tspan x="35" dy="0">1 · Save X in slot 3; set Next[3] = 4.    2 · Set Next[2] = 3.</tspan></text><text x="35" y="379" text-anchor="start" fill="#17374d" font-size="26"><tspan x="35" dy="0">After · Head still equals 2</tspan></text><rect x="35" y="415" width="235" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="152.5" y="451.875" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="152.5" dy="0">Index 2</tspan><tspan x="152.5" dy="33.75">A | Next 3</tspan></text><g data-from="after-2" data-to="after-3"><path d="M270 460H300" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="300" y="415" width="235" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="417.5" y="451.875" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="417.5" dy="0">Index 3</tspan><tspan x="417.5" dy="33.75">X | Next 4</tspan></text><g data-from="after-3" data-to="after-4"><path d="M535 460H565" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="565" y="415" width="235" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="682.5" y="451.875" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="682.5" dy="0">Index 4</tspan><tspan x="682.5" dy="33.75">B | Next 1</tspan></text><g data-from="after-4" data-to="after-1"><path d="M800 460H830" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="830" y="415" width="235" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="947.5" y="451.875" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="947.5" dy="0">Index 1</tspan><tspan x="947.5" dy="33.75">C | Next 0</tspan></text><g data-from="after-1" data-to="after-0"><path d="M1065 460H1080V545H947" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><text x="989" y="576" text-anchor="middle" fill="#176b70" font-size="23"><tspan x="989" dy="0">0 · end</tspan></text></g><text x="35" y="631" text-anchor="start" fill="#17374d" font-size="25"><tspan x="35" dy="0">Deleting X reverses the bypass: Next[2] &lt;- 4, then release slot 3.</tspan></text></g></svg>
