<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Refine an average calculation until every step is programmable</title><desc id="desc">The high-level task is to calculate the mean of N values, where N is a positive integer. Refinement defines initialisation, repeated input and accumulation, then division and output. N &gt; 0 is a precondition: division by zero is not a valid refinement for an empty input set.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176b70"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a43c35"/></marker></defs><rect width="1100" height="650" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="50" text-anchor="start" fill="#17374d" font-size="32"><tspan x="35" dy="0">Refine an average calculation until every step is programmable</tspan></text><rect x="330" y="110" width="440" height="85" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="550" y="161.6" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="550" dy="0">Calculate the mean of N values</tspan></text><path d="M550 195V240H200V290M550 240V290M550 240H900V290" stroke="#176b70" stroke-width="3" fill="none"/><rect x="35" y="290" width="320" height="140" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="195" y="336" text-anchor="middle" fill="#17374d" font-size="24"><tspan x="195" dy="0">Prepare</tspan><tspan x="195" dy="32.400000000000006">Require INTEGER N &gt; 0</tspan><tspan x="195" dy="32.400000000000006">Total &lt;- 0</tspan></text><rect x="390" y="290" width="320" height="140" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="550" y="336" text-anchor="middle" fill="#17374d" font-size="24"><tspan x="550" dy="0">Repeat N times</tspan><tspan x="550" dy="32.400000000000006">INPUT Value</tspan><tspan x="550" dy="32.400000000000006">Total &lt;- Total + Value</tspan></text><rect x="745" y="290" width="320" height="140" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="905" y="336" text-anchor="middle" fill="#17374d" font-size="24"><tspan x="905" dy="0">Finish</tspan><tspan x="905" dy="32.400000000000006">Mean &lt;- Total / N</tspan><tspan x="905" dy="32.400000000000006">OUTPUT Mean</tspan></text><rect x="35" y="495" width="1030" height="90" rx="10" fill="#fff4dd" stroke="#176b70" stroke-width="2"/><text x="550" y="532.1999999999999" text-anchor="middle" fill="#17374d" font-size="24"><tspan x="550" dy="0">Read the three responsibilities from left to right for this algorithm.</tspan><tspan x="550" dy="32.400000000000006">Refinement adds the rules inside each step; a heading alone is not enough.</tspan></text></g></svg>
