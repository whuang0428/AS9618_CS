<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590" role="img" aria-labelledby="title desc"><title id="title">Test both sides of each inclusive limit</title><desc id="desc">The input rule accepts integers from 0 to 100 inclusive. -1 and 101 are outside the permitted range and are rejected; 0, 1, 55, 99 and 100 are accepted. 0 and 100 are valid extremes; 55 is an ordinary normal value. Boundary testing includes valid and invalid neighbours. The axis is broken between the limit details and the ordinary example; spacing is not to scale. Text &quot;fifty&quot; fails the integer type check before the range test.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176b70"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a43c35"/></marker></defs><rect width="1100" height="590" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="50" text-anchor="start" fill="#17374d" font-size="32"><tspan x="35" dy="0">Test both sides of each inclusive limit</tspan></text><text x="35" y="103" text-anchor="start" fill="#17374d" font-size="25"><tspan x="35" dy="0">Rule: INTEGER, 0 &lt;= Mark &lt;= 100. Broken axis; spacing is not to scale.</tspan></text><path d="M65 265H1035" stroke="#17374d" stroke-width="3"/><path d="M345 257l8 16 8-16 8 16M735 257l8 16 8-16 8 16" fill="none" stroke="#17374d" stroke-width="3"/><circle cx="90" cy="265" r="11" fill="#a43c35"/><text x="90" y="227" text-anchor="middle" fill="#17374d" font-size="31"><tspan x="90" dy="0">-1</tspan></text><text x="90" y="315" text-anchor="middle" fill="#a43c35" font-size="23"><tspan x="90" dy="0">Reject</tspan></text><circle cx="210" cy="265" r="11" fill="#176b70"/><text x="210" y="227" text-anchor="middle" fill="#17374d" font-size="31"><tspan x="210" dy="0">0</tspan></text><text x="210" y="315" text-anchor="middle" fill="#176b70" font-size="23"><tspan x="210" dy="0">Accept</tspan></text><circle cx="310" cy="265" r="11" fill="#176b70"/><text x="310" y="227" text-anchor="middle" fill="#17374d" font-size="31"><tspan x="310" dy="0">1</tspan></text><text x="310" y="315" text-anchor="middle" fill="#176b70" font-size="23"><tspan x="310" dy="0">Accept</tspan></text><circle cx="550" cy="265" r="11" fill="#176b70"/><text x="550" y="227" text-anchor="middle" fill="#17374d" font-size="31"><tspan x="550" dy="0">55</tspan></text><text x="550" y="315" text-anchor="middle" fill="#176b70" font-size="23"><tspan x="550" dy="0">Accept</tspan></text><circle cx="790" cy="265" r="11" fill="#176b70"/><text x="790" y="227" text-anchor="middle" fill="#17374d" font-size="31"><tspan x="790" dy="0">99</tspan></text><text x="790" y="315" text-anchor="middle" fill="#176b70" font-size="23"><tspan x="790" dy="0">Accept</tspan></text><circle cx="890" cy="265" r="11" fill="#176b70"/><text x="890" y="227" text-anchor="middle" fill="#17374d" font-size="31"><tspan x="890" dy="0">100</tspan></text><text x="890" y="315" text-anchor="middle" fill="#176b70" font-size="23"><tspan x="890" dy="0">Accept</tspan></text><circle cx="1010" cy="265" r="11" fill="#a43c35"/><text x="1010" y="227" text-anchor="middle" fill="#17374d" font-size="31"><tspan x="1010" dy="0">101</tspan></text><text x="1010" y="315" text-anchor="middle" fill="#a43c35" font-size="23"><tspan x="1010" dy="0">Reject</tspan></text><path d="M210 342V368H890V342" fill="none" stroke="#176b70" stroke-width="3"/><text x="550" y="409" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="550" dy="0">0 and 100 are included: both are valid extremes.</tspan></text><rect x="35" y="467" width="1030" height="84" rx="10" fill="#fff4dd" stroke="#176b70" stroke-width="2"/><text x="550" y="500.875" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="550" dy="0">Boundary describes position; state acceptance or rejection separately.</tspan><tspan x="550" dy="33.75">Text &quot;fifty&quot; fails the type check, so it does not belong on this integer axis.</tspan></text></g></svg>
