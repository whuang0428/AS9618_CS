<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610" role="img" aria-labelledby="title desc"><title id="title">A queue, driver and buffer solve different printing problems</title><desc id="desc">Jobs A and B are submitted. B waits in the print queue while A is serviced. The driver supplies device-specific commands; the buffer temporarily holds data being transferred. A completion notification lets the OS coordinate the next work. A queue of jobs is not the same as the buffer of outgoing data.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176b70"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a43c35"/></marker></defs><rect width="1100" height="610" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="50" text-anchor="start" fill="#17374d" font-size="32"><tspan x="35" dy="0">A queue, driver and buffer solve different printing problems</tspan></text><rect x="35" y="170" width="235" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="152.5" y="206.875" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="152.5" dy="0">Print queue</tspan><tspan x="152.5" dy="33.75">A active; B waiting</tspan></text><g data-from="queue" data-to="driver"><path d="M270 215H300" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="300" y="170" width="235" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="417.5" y="206.875" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="417.5" dy="0">Device driver</tspan><tspan x="417.5" dy="33.75">Device commands</tspan></text><g data-from="driver" data-to="buffer"><path d="M535 215H565" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="565" y="170" width="235" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="682.5" y="206.875" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="682.5" dy="0">Output buffer</tspan><tspan x="682.5" dy="33.75">Hold transfer data</tspan></text><g data-from="buffer" data-to="printer"><path d="M800 215H830" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="830" y="170" width="235" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="947.5" y="206.875" text-anchor="middle" fill="#17374d" font-size="25"><tspan x="947.5" dy="0">Printer</tspan><tspan x="947.5" dy="33.75">Print job A</tspan></text><g data-from="printer" data-to="os"><path d="M947 260V390H775" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><text x="765" y="315" text-anchor="middle" fill="#176b70" font-size="23"><tspan x="765" dy="0">Completion notification</tspan></text></g><rect x="365" y="345" width="410" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="570" y="381.55" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="570" dy="0">OS responds</tspan><tspan x="570" dy="35.1">Schedule further work</tspan></text><text x="35" y="546" text-anchor="start" fill="#17374d" font-size="24"><tspan x="35" dy="0">Permission is checked before protected data is released to these device services.</tspan></text></g></svg>
