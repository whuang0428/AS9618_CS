<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="690" viewBox="0 0 1100 690" role="img" aria-labelledby="title desc"><title id="title">Merit marks must also contribute to the pass count</title><desc id="desc">Pass requires Mark &gt;= 50 and merit requires Mark &gt;= 70. Two independent IF statements are required: a mark of 70 increments both counts. Inputs 49, 50, 69, 70 give PassCount 3 and MeritCount 1. An ELSE between the pass and merit tests would wrongly make them exclusive.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176b70"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a43c35"/></marker></defs><rect width="1100" height="690" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="50" text-anchor="start" fill="#17374d" font-size="32"><tspan x="35" dy="0">Merit marks must also contribute to the pass count</tspan></text><rect x="390" y="125" width="320" height="75" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="550" y="171.6" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="550" dy="0">Read one Mark</tspan></text><g data-from="mark" data-to="pass-test"><path d="M550 200V260" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/></g><rect x="220" y="260" width="660" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="550" y="296.55" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="550" dy="0">IF Mark &gt;= 50</tspan><tspan x="550" dy="35.1">Increment PassCount when true</tspan></text><g data-from="pass-test" data-to="merit-test"><path d="M550 350V410" fill="none" stroke="#176b70" stroke-width="3" marker-end="url(#arrow)"/><text x="737" y="392" text-anchor="middle" fill="#176b70" font-size="23"><tspan x="737" dy="0">Then test independently</tspan></text></g><rect x="220" y="410" width="660" height="90" rx="10" fill="#eef7f6" stroke="#176b70" stroke-width="2"/><text x="550" y="446.55" text-anchor="middle" fill="#17374d" font-size="26"><tspan x="550" dy="0">IF Mark &gt;= 70</tspan><tspan x="550" dy="35.1">Increment MeritCount when true</tspan></text><text x="35" y="568" text-anchor="start" fill="#17374d" font-size="25"><tspan x="35" dy="0">Mark 70 passes both tests: PassCount +1 AND MeritCount +1.</tspan></text><text x="35" y="637" text-anchor="start" fill="#17374d" font-size="26"><tspan x="35" dy="0">49, 50, 69, 70 → PassCount = 3; MeritCount = 1.</tspan></text></g></svg>
