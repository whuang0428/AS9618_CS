<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title"><title id="title">Reconstruct a vector drawing, then scale its geometry</title><rect width="1280" height="800" fill="#fbfcfd"/><g font-family="Arial, sans-serif" fill="#17243a"><text x="48" y="65" font-size="40">Reconstruct a vector drawing, then scale its geometry</text><text x="48" y="125" font-size="26">1. Blue rectangle: top-left (10,10), width 40, height 20; no outline.</text><text x="48" y="166" font-size="26">2. Black line: (10,30) to (50,30), thickness 2; drawn last.</text><text x="80" y="235" font-size="30">Original: 60 × 45 units</text><text x="630" y="235" font-size="30">Scale factor 2: 120 × 90 units</text><g transform="translate(80,295)"><rect width="240" height="180" fill="#edf3f8" stroke="#91a3b7"/><g transform="scale(4)"><rect data-object="rectangle" x="10" y="10" width="40" height="20" fill="#1765a0"/><line data-object="line" x1="10" y1="30" x2="50" y2="30" stroke="#17243a" stroke-width="2"/></g><text x="0" y="-15" font-size="24">(0,0)</text><text x="140" y="-15" font-size="24">x →</text><text x="-35" y="80" font-size="24">y ↓</text></g><g transform="translate(630,295)"><rect width="480" height="360" fill="#edf3f8" stroke="#91a3b7"/><g transform="scale(4)"><rect data-object="rectangle" x="20" y="20" width="80" height="40" fill="#1765a0"/><line data-object="line" x1="20" y1="60" x2="100" y2="60" stroke="#17243a" stroke-width="4"/></g><text x="0" y="-15" font-size="24">(0,0)</text><text x="380" y="-15" font-size="24">x →</text><text x="-35" y="80" font-size="24">y ↓</text></g><text x="80" y="515" font-size="26">Rectangle: (10,10) → (50,30)</text><text x="80" y="556" font-size="26">The line covers its lower edge.</text><text x="630" y="700" font-size="26">Rectangle: (20,20), size 80 × 40</text><text x="48" y="763" font-size="24">Coordinates, dimensions and stroke width all double. Scaled line: (20,60) → (100,60), width 4.</text></g></svg>
