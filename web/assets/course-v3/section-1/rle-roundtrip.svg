<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title"><title id="title">RLE preserves every consecutive run in its original order</title><rect width="1280" height="800" fill="#fbfcfd"/><g font-family="Arial, sans-serif" fill="#17243a"><text x="48" y="65" font-size="40">RLE preserves every consecutive run in its original order</text><text x="48" y="130" font-size="26">Source: 16 characters × 8 bits = 128 bits</text><g data-run="0" data-count="4" data-value="A"><rect x="48" y="200" width="72" height="66" fill="#edf3f8" stroke="#91a3b7"/><text x="71" y="244" font-size="32">A</text><rect x="120" y="200" width="72" height="66" fill="#edf3f8" stroke="#91a3b7"/><text x="143" y="244" font-size="32">A</text><rect x="192" y="200" width="72" height="66" fill="#edf3f8" stroke="#91a3b7"/><text x="215" y="244" font-size="32">A</text><rect x="264" y="200" width="72" height="66" fill="#edf3f8" stroke="#91a3b7"/><text x="287" y="244" font-size="32">A</text><text x="48" y="309" font-size="28">4 × A</text></g><g data-run="1" data-count="2" data-value="B"><rect x="336" y="200" width="72" height="66" fill="#e5f3ee" stroke="#91a3b7"/><text x="359" y="244" font-size="32">B</text><rect x="408" y="200" width="72" height="66" fill="#e5f3ee" stroke="#91a3b7"/><text x="431" y="244" font-size="32">B</text><text x="336" y="309" font-size="28">2 × B</text></g><g data-run="2" data-count="8" data-value="C"><rect x="480" y="200" width="72" height="66" fill="#fff0cf" stroke="#91a3b7"/><text x="503" y="244" font-size="32">C</text><rect x="552" y="200" width="72" height="66" fill="#fff0cf" stroke="#91a3b7"/><text x="575" y="244" font-size="32">C</text><rect x="624" y="200" width="72" height="66" fill="#fff0cf" stroke="#91a3b7"/><text x="647" y="244" font-size="32">C</text><rect x="696" y="200" width="72" height="66" fill="#fff0cf" stroke="#91a3b7"/><text x="719" y="244" font-size="32">C</text><rect x="768" y="200" width="72" height="66" fill="#fff0cf" stroke="#91a3b7"/><text x="791" y="244" font-size="32">C</text><rect x="840" y="200" width="72" height="66" fill="#fff0cf" stroke="#91a3b7"/><text x="863" y="244" font-size="32">C</text><rect x="912" y="200" width="72" height="66" fill="#fff0cf" stroke="#91a3b7"/><text x="935" y="244" font-size="32">C</text><rect x="984" y="200" width="72" height="66" fill="#fff0cf" stroke="#91a3b7"/><text x="1007" y="244" font-size="32">C</text><text x="480" y="309" font-size="28">8 × C</text></g><g data-run="3" data-count="2" data-value="D"><rect x="1056" y="200" width="72" height="66" fill="#eeeaf9" stroke="#91a3b7"/><text x="1079" y="244" font-size="32">D</text><rect x="1128" y="200" width="72" height="66" fill="#eeeaf9" stroke="#91a3b7"/><text x="1151" y="244" font-size="32">D</text><text x="1056" y="309" font-size="28">2 × D</text></g><text x="48" y="381" font-size="34">Encode → (4, A)   (2, B)   (8, C)   (2, D)</text><text x="48" y="441" font-size="26">Stored: 4 pairs × (8-bit count + 8-bit value) = 64 bits</text><text x="48" y="513" font-size="33">Decode → AAAA | BB | CCCCCCCC | DD</text><text x="48" y="563" font-size="25">Remove the guide separators: the original ordered text is recovered exactly.</text><rect x="48" y="605" width="1184" height="116" rx="10" fill="#fff0cf"/><text x="70" y="650" font-size="29">Counterexample: ABC → (1, A)  (1, B)  (1, C)</text><text x="70" y="693" font-size="28">24 source bits become 48 encoded bits: short runs can increase size.</text><text x="48" y="773" font-size="25">All costs exclude headers. Human-readable pair labels stand for fixed binary fields.</text></g></svg>
