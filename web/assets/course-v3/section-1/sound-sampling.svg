<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title"><title id="title">Sample → quantise → encode → decode</title><rect width="1280" height="800" fill="#fbfcfd"/><g font-family="Arial, sans-serif" fill="#17243a"><text x="48" y="65" font-size="40">Sample → quantise → encode → decode</text><text x="48" y="120" font-size="26">4 Hz · 3 bits per sample · levels −4 to +3 · code value = level + 4</text><text x="48" y="165" font-size="25">Brown: analogue teaching trace. Blue: quantised samples and their stored codes.</text><path d="M105 520 H1195" stroke="#d4e0e9"/><text x="63" y="528" font-size="23">-4</text><path d="M105 480.625 H1195" stroke="#d4e0e9"/><text x="63" y="488.625" font-size="23">-3</text><path d="M105 441.25 H1195" stroke="#d4e0e9"/><text x="63" y="449.25" font-size="23">-2</text><path d="M105 401.875 H1195" stroke="#d4e0e9"/><text x="63" y="409.875" font-size="23">-1</text><path d="M105 362.5 H1195" stroke="#d4e0e9"/><text x="63" y="370.5" font-size="23">0</text><path d="M105 323.125 H1195" stroke="#d4e0e9"/><text x="63" y="331.125" font-size="23">1</text><path d="M105 283.75 H1195" stroke="#d4e0e9"/><text x="63" y="291.75" font-size="23">2</text><path d="M105 244.375 H1195" stroke="#d4e0e9"/><text x="63" y="252.375" font-size="23">3</text><path d="M105 205 V520 H1195" stroke="#17243a" fill="none" stroke-width="2"/><polyline points="105,488.5 241.25,429.4375 377.5,386.125 513.75,260.125 650,299.5 786.25,350.6875 922.5,256.1875 1058.75,342.8125 1195,417.625" fill="none" stroke="#9a5727" stroke-width="3"/><path d="M105 520 V480.625" stroke="#1765a0" stroke-width="2" stroke-dasharray="5 5"/><circle data-time="0" data-level="-3" cx="105" cy="480.625" r="7" fill="#1765a0"/><text x="115" y="468.625" font-size="26">001</text><path d="M377.5 520 V401.875" stroke="#1765a0" stroke-width="2" stroke-dasharray="5 5"/><circle data-time="0.25" data-level="-1" cx="377.5" cy="401.875" r="7" fill="#1765a0"/><text x="387.5" y="389.875" font-size="26">011</text><path d="M650 520 V283.75" stroke="#1765a0" stroke-width="2" stroke-dasharray="5 5"/><circle data-time="0.5" data-level="2" cx="650" cy="283.75" r="7" fill="#1765a0"/><text x="660" y="271.75" font-size="26">110</text><path d="M922.5 520 V244.375" stroke="#1765a0" stroke-width="2" stroke-dasharray="5 5"/><circle data-time="0.75" data-level="3" cx="922.5" cy="244.375" r="7" fill="#1765a0"/><text x="932.5" y="232.375" font-size="26">111</text><text x="90" y="554" font-size="23">0</text><text x="362.5" y="554" font-size="23">0.25</text><text x="635" y="554" font-size="23">0.5</text><text x="907.5" y="554" font-size="23">0.75</text><text x="1180" y="554" font-size="23">1</text><text x="1060" y="585" font-size="23">Time (s)</text><text x="48" y="634" font-size="27">Time (s)</text><text x="330" y="634" font-size="27">0.00</text><text x="590" y="634" font-size="27">0.25</text><text x="850" y="634" font-size="27">0.50</text><text x="1110" y="634" font-size="27">0.75</text><text x="48" y="679" font-size="27">Measured</text><text x="330" y="679" font-size="27">-3.2</text><text x="590" y="679" font-size="27">-0.6</text><text x="850" y="679" font-size="27">1.6</text><text x="1110" y="679" font-size="27">2.7</text><text x="48" y="724" font-size="27">Decoded</text><text x="330" y="724" font-size="27">-3</text><text x="590" y="724" font-size="27">-1</text><text x="850" y="724" font-size="27">2</text><text x="1110" y="724" font-size="27">3</text><text x="48" y="771" font-size="24">The four codes occupy 12 sample-data bits. Decoding recovers levels, not the original trace.</text></g></svg>
