<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="950" viewBox="0 0 960 760" role="img" aria-labelledby="title"><title id="title">Use a different symbol for each operation</title><rect width="960" height="760" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="55" font-size="32" fill="#15354d">Use a different symbol for each operation</text><g data-node="start" transform="translate(240 150)" fill="#eef4fb" stroke="#244b65" stroke-width="2"><rect x="-180" y="-40" width="360" height="80" rx="40"/><text text-anchor="middle" fill="#142f45" stroke="none" font-size="23"><tspan x="0" y="8">START / END</tspan></text></g><g data-node="io" transform="translate(240 280)" fill="#eef4fb" stroke="#244b65" stroke-width="2"><polygon points="-155,-40 180,-40 155,40 -180,40"/><text text-anchor="middle" fill="#142f45" stroke="none" font-size="23"><tspan x="0" y="8">INPUT / OUTPUT</tspan></text></g><g data-node="assignment" transform="translate(240 410)" fill="#eef4fb" stroke="#244b65" stroke-width="2"><rect x="-180" y="-40" width="360" height="80" rx="0"/><text text-anchor="middle" fill="#142f45" stroke="none" font-size="23"><tspan x="0" y="8">Total &lt;- Price * Quantity</tspan></text></g><g data-node="decision" transform="translate(240 585)" fill="#e4f3ee" stroke="#244b65" stroke-width="2"><polygon points="0,-80 180,0 0,80 -180,0"/><text text-anchor="middle" fill="#142f45" stroke="none" font-size="23"><tspan x="0" y="8">Mark &gt;= 50</tspan></text></g><g fill="#244b65" font-size="26"><text x="470" y="160">Terminator: begin or finish</text><text x="470" y="290">Parallelogram: input or output</text><text x="470" y="420">Rectangle: processing</text><text x="470" y="590">Diamond: labelled Yes/No paths</text><text x="40" y="715">Flow lines have arrowheads showing the direction of execution.</text></g></g></svg>