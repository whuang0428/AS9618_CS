<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1038" viewBox="0 0 960 830" role="img" aria-labelledby="title desc"><title id="title">Check the minimum height for entry</title><desc id="desc">START; next: INPUT Height INPUT Height; next: Height &gt;= 120 Height &gt;= 120: Yes leads to OUTPUT &quot;Enter&quot;; No leads to OUTPUT &quot;Wait&quot;. OUTPUT &quot;Enter&quot;; next: END OUTPUT &quot;Wait&quot;; next: END END.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#286477"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="480" y="50" text-anchor="middle" font-size="29" font-weight="700" fill="#15354d">Check the minimum height for entry</text><g data-from="start" data-to="input" data-branch="next"><path d="M480 170V190H480V210" fill="none" stroke="#286477" stroke-width="3" marker-end="url(#arrow)"/></g><g data-from="input" data-to="test" data-branch="next"><path d="M480 290V300H480V310" fill="none" stroke="#286477" stroke-width="3" marker-end="url(#arrow)"/></g><g data-from="test" data-to="yes" data-branch="yes"><path d="M480 470V500H240V530" fill="none" stroke="#286477" stroke-width="3" marker-end="url(#arrow)"/><text x="360" y="488" text-anchor="middle" font-size="24" fill="#163e4f">Yes</text></g><g data-from="test" data-to="no" data-branch="no"><path d="M480 470V500H720V530" fill="none" stroke="#286477" stroke-width="3" marker-end="url(#arrow)"/><text x="600" y="488" text-anchor="middle" font-size="24" fill="#163e4f">No</text></g><g data-from="yes" data-to="end" data-branch="next"><path d="M240 610V645H480V680" fill="none" stroke="#286477" stroke-width="3" marker-end="url(#arrow)"/></g><g data-from="no" data-to="end" data-branch="next"><path d="M720 610V645H480V680" fill="none" stroke="#286477" stroke-width="3" marker-end="url(#arrow)"/></g><g data-node="start" transform="translate(480 130)" fill="#eef4fb" stroke="#244b65" stroke-width="2"><rect x="-180" y="-40" width="360" height="80" rx="40"/><text text-anchor="middle" fill="#142f45" stroke="none" font-size="23"><tspan x="0" y="8">START</tspan></text></g><g data-node="input" transform="translate(480 250)" fill="#eef4fb" stroke="#244b65" stroke-width="2"><polygon points="-155,-40 180,-40 155,40 -180,40"/><text text-anchor="middle" fill="#142f45" stroke="none" font-size="23"><tspan x="0" y="8">INPUT Height</tspan></text></g><g data-node="test" transform="translate(480 390)" fill="#e4f3ee" stroke="#244b65" stroke-width="2"><polygon points="0,-80 180,0 0,80 -180,0"/><text text-anchor="middle" fill="#142f45" stroke="none" font-size="23"><tspan x="0" y="8">Height &gt;= 120</tspan></text></g><g data-node="yes" transform="translate(240 570)" fill="#eef4fb" stroke="#244b65" stroke-width="2"><polygon points="-155,-40 180,-40 155,40 -180,40"/><text text-anchor="middle" fill="#142f45" stroke="none" font-size="23"><tspan x="0" y="8">OUTPUT &quot;Enter&quot;</tspan></text></g><g data-node="no" transform="translate(720 570)" fill="#eef4fb" stroke="#244b65" stroke-width="2"><polygon points="-155,-40 180,-40 155,40 -180,40"/><text text-anchor="middle" fill="#142f45" stroke="none" font-size="23"><tspan x="0" y="8">OUTPUT &quot;Wait&quot;</tspan></text></g><g data-node="end" transform="translate(480 720)" fill="#eef4fb" stroke="#244b65" stroke-width="2"><rect x="-180" y="-40" width="360" height="80" rx="40"/><text text-anchor="middle" fill="#142f45" stroke="none" font-size="23"><tspan x="0" y="8">END</tspan></text></g></g></svg>