<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1563" viewBox="0 0 960 1250" role="img" aria-labelledby="title desc"><title id="title">Four inputs contribute to one total</title><desc id="desc">START; next: Total &lt;- 0; Index &lt;- 1 Total &lt;- 0; Index &lt;- 1; next: Index &lt;= 4 Index &lt;= 4: Yes leads to INPUT Value; No leads to OUTPUT Total. INPUT Value; next: Total &lt;- Total + Value Total &lt;- Total + Value; next: Index &lt;- Index + 1 Index &lt;- Index + 1; next: Index &lt;= 4 OUTPUT Total; next: END END.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#286477"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="480" y="50" text-anchor="middle" font-size="29" font-weight="700" fill="#15354d">Four inputs contribute to one total</text><g data-from="start" data-to="initialise" data-branch="next"><path d="M480 160V185H480V210" fill="none" stroke="#286477" stroke-width="3" marker-end="url(#arrow)"/></g><g data-from="initialise" data-to="test" data-branch="next"><path d="M480 290V305H480V320" fill="none" stroke="#286477" stroke-width="3" marker-end="url(#arrow)"/></g><g data-from="test" data-to="input" data-branch="yes"><path d="M480 480V500H480V520" fill="none" stroke="#286477" stroke-width="3" marker-end="url(#arrow)"/><text x="518" y="488" text-anchor="middle" font-size="24" fill="#163e4f">Yes</text></g><g data-from="test" data-to="output" data-branch="no"><path d="M660 400H850V1030H647.5" fill="none" stroke="#286477" stroke-width="3" marker-end="url(#arrow)"/><text x="745" y="386" text-anchor="middle" font-size="24" fill="#163e4f">No</text></g><g data-from="input" data-to="add" data-branch="next"><path d="M480 600V625H480V650" fill="none" stroke="#286477" stroke-width="3" marker-end="url(#arrow)"/></g><g data-from="add" data-to="increment" data-branch="next"><path d="M480 730V755H480V780" fill="none" stroke="#286477" stroke-width="3" marker-end="url(#arrow)"/></g><g data-from="increment" data-to="test" data-branch="next"><path d="M300 820H130V400H300" fill="none" stroke="#286477" stroke-width="3" marker-end="url(#arrow)"/></g><g data-from="output" data-to="end" data-branch="next"><path d="M480 1070V1095H480V1120" fill="none" stroke="#286477" stroke-width="3" marker-end="url(#arrow)"/></g><g data-node="start" transform="translate(480 120)" fill="#eef4fb" stroke="#244b65" stroke-width="2"><rect x="-180" y="-40" width="360" height="80" rx="40"/><text text-anchor="middle" fill="#142f45" stroke="none" font-size="23"><tspan x="0" y="8">START</tspan></text></g><g data-node="initialise" transform="translate(480 250)" fill="#eef4fb" stroke="#244b65" stroke-width="2"><rect x="-180" y="-40" width="360" height="80" rx="0"/><text text-anchor="middle" fill="#142f45" stroke="none" font-size="23"><tspan x="0" y="-6">Total &lt;- 0</tspan><tspan x="0" y="22">Index &lt;- 1</tspan></text></g><g data-node="test" transform="translate(480 400)" fill="#e4f3ee" stroke="#244b65" stroke-width="2"><polygon points="0,-80 180,0 0,80 -180,0"/><text text-anchor="middle" fill="#142f45" stroke="none" font-size="23"><tspan x="0" y="8">Index &lt;= 4</tspan></text></g><g data-node="input" transform="translate(480 560)" fill="#eef4fb" stroke="#244b65" stroke-width="2"><polygon points="-155,-40 180,-40 155,40 -180,40"/><text text-anchor="middle" fill="#142f45" stroke="none" font-size="23"><tspan x="0" y="8">INPUT Value</tspan></text></g><g data-node="add" transform="translate(480 690)" fill="#eef4fb" stroke="#244b65" stroke-width="2"><rect x="-180" y="-40" width="360" height="80" rx="0"/><text text-anchor="middle" fill="#142f45" stroke="none" font-size="23"><tspan x="0" y="8">Total &lt;- Total + Value</tspan></text></g><g data-node="increment" transform="translate(480 820)" fill="#eef4fb" stroke="#244b65" stroke-width="2"><rect x="-180" y="-40" width="360" height="80" rx="0"/><text text-anchor="middle" fill="#142f45" stroke="none" font-size="23"><tspan x="0" y="8">Index &lt;- Index + 1</tspan></text></g><g data-node="output" transform="translate(480 1030)" fill="#eef4fb" stroke="#244b65" stroke-width="2"><polygon points="-155,-40 180,-40 155,40 -180,40"/><text text-anchor="middle" fill="#142f45" stroke="none" font-size="23"><tspan x="0" y="8">OUTPUT Total</tspan></text></g><g data-node="end" transform="translate(480 1160)" fill="#eef4fb" stroke="#244b65" stroke-width="2"><rect x="-180" y="-40" width="360" height="80" rx="40"/><text text-anchor="middle" fill="#142f45" stroke="none" font-size="23"><tspan x="0" y="8">END</tspan></text></g></g></svg>