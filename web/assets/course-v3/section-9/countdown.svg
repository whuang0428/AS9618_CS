<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1300" viewBox="0 0 960 1040" role="img" aria-labelledby="title desc"><title id="title">A loop returns to its condition</title><desc id="desc">START; next: INPUT Count INPUT Count; next: Count &gt; 0 Count &gt; 0: Yes leads to OUTPUT Count; No leads to OUTPUT &quot;Finished&quot;. OUTPUT Count; next: Count &lt;- Count - 1 Count &lt;- Count - 1; next: Count &gt; 0 OUTPUT &quot;Finished&quot;; next: END END.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#286477"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="480" y="50" text-anchor="middle" font-size="29" font-weight="700" fill="#15354d">A loop returns to its condition</text><g data-from="start" data-to="input" data-branch="next"><path d="M480 165V180H480V195" fill="none" stroke="#286477" stroke-width="3" marker-end="url(#arrow)"/></g><g data-from="input" data-to="test" data-branch="next"><path d="M480 275V285H480V295" fill="none" stroke="#286477" stroke-width="3" marker-end="url(#arrow)"/></g><g data-from="test" data-to="output" data-branch="yes"><path d="M480 455V475H480V495" fill="none" stroke="#286477" stroke-width="3" marker-end="url(#arrow)"/><text x="518" y="463" text-anchor="middle" font-size="24" fill="#163e4f">Yes</text></g><g data-from="test" data-to="finished" data-branch="no"><path d="M660 375H850V825H647.5" fill="none" stroke="#286477" stroke-width="3" marker-end="url(#arrow)"/><text x="745" y="361" text-anchor="middle" font-size="24" fill="#163e4f">No</text></g><g data-from="output" data-to="decrement" data-branch="next"><path d="M480 575V595H480V615" fill="none" stroke="#286477" stroke-width="3" marker-end="url(#arrow)"/></g><g data-from="decrement" data-to="test" data-branch="next"><path d="M300 655H130V375H300" fill="none" stroke="#286477" stroke-width="3" marker-end="url(#arrow)"/></g><g data-from="finished" data-to="end" data-branch="next"><path d="M480 865V887.5H480V910" fill="none" stroke="#286477" stroke-width="3" marker-end="url(#arrow)"/></g><g data-node="start" transform="translate(480 125)" fill="#eef4fb" stroke="#244b65" stroke-width="2"><rect x="-180" y="-40" width="360" height="80" rx="40"/><text text-anchor="middle" fill="#142f45" stroke="none" font-size="23"><tspan x="0" y="8">START</tspan></text></g><g data-node="input" transform="translate(480 235)" fill="#eef4fb" stroke="#244b65" stroke-width="2"><polygon points="-155,-40 180,-40 155,40 -180,40"/><text text-anchor="middle" fill="#142f45" stroke="none" font-size="23"><tspan x="0" y="8">INPUT Count</tspan></text></g><g data-node="test" transform="translate(480 375)" fill="#e4f3ee" stroke="#244b65" stroke-width="2"><polygon points="0,-80 180,0 0,80 -180,0"/><text text-anchor="middle" fill="#142f45" stroke="none" font-size="23"><tspan x="0" y="8">Count &gt; 0</tspan></text></g><g data-node="output" transform="translate(480 535)" fill="#eef4fb" stroke="#244b65" stroke-width="2"><polygon points="-155,-40 180,-40 155,40 -180,40"/><text text-anchor="middle" fill="#142f45" stroke="none" font-size="23"><tspan x="0" y="8">OUTPUT Count</tspan></text></g><g data-node="decrement" transform="translate(480 655)" fill="#eef4fb" stroke="#244b65" stroke-width="2"><rect x="-180" y="-40" width="360" height="80" rx="0"/><text text-anchor="middle" fill="#142f45" stroke="none" font-size="23"><tspan x="0" y="8">Count &lt;- Count - 1</tspan></text></g><g data-node="finished" transform="translate(480 825)" fill="#eef4fb" stroke="#244b65" stroke-width="2"><polygon points="-155,-40 180,-40 155,40 -180,40"/><text text-anchor="middle" fill="#142f45" stroke="none" font-size="23"><tspan x="0" y="8">OUTPUT &quot;Finished&quot;</tspan></text></g><g data-node="end" transform="translate(480 950)" fill="#eef4fb" stroke="#244b65" stroke-width="2"><rect x="-180" y="-40" width="360" height="80" rx="40"/><text text-anchor="middle" fill="#142f45" stroke="none" font-size="23"><tspan x="0" y="8">END</tspan></text></g></g></svg>