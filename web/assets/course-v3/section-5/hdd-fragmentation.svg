<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" role="img"><title>One file, different block positions</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#14747b"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#142b45}</style><rect width="1120" height="720" fill="white"/><text x="30" y="48" font-size="29">One file, different block positions</text><circle cx="180" cy="215" r="100" fill="#edf6f8" stroke="#4c7185" stroke-width="3"/><circle cx="180" cy="215" r="76" fill="none" stroke="#a9c4cf" stroke-width="2"/><circle cx="180" cy="215" r="50" fill="none" stroke="#a9c4cf" stroke-width="2"/><circle cx="180" cy="215" r="18" fill="#4c7185"/><path d="M325 290L205 170L196 188L316 306Z" fill="#e8af62" stroke="#825720" stroke-width="2"/><text x="325" y="150" font-size="28">Magnetic HDD</text><text x="325" y="195" font-size="25">The platter rotates.</text><text x="325" y="240" font-size="25">The head moves to another track.</text><text x="325" y="285" font-size="25">Scattered blocks can require more movement.</text><text x="30" y="355" font-size="23">Simplified block order — not a physical scale drawing</text><text x="30" y="403" font-size="25">Before</text><rect x="180" y="370" width="132" height="70" rx="6" fill="#cde9ee" stroke="#4c7185"/><text x="205" y="414" font-size="28">A1</text><rect x="328" y="370" width="132" height="70" rx="6" fill="#f2f4f5" stroke="#4c7185"/><text x="353" y="414" font-size="28">B1</text><rect x="476" y="370" width="132" height="70" rx="6" fill="#f2f4f5" stroke="#4c7185"/><text x="501" y="414" font-size="28">Free</text><rect x="624" y="370" width="132" height="70" rx="6" fill="#cde9ee" stroke="#4c7185"/><text x="649" y="414" font-size="28">A2</text><rect x="772" y="370" width="132" height="70" rx="6" fill="#f2f4f5" stroke="#4c7185"/><text x="797" y="414" font-size="28">C</text><rect x="920" y="370" width="132" height="70" rx="6" fill="#cde9ee" stroke="#4c7185"/><text x="945" y="414" font-size="28">A3</text><path data-from="a1" data-to="a2" d="M245 442V477H689V442" fill="none" stroke="#14747b" stroke-width="3" marker-end="url(#arrow)"/><path data-from="a2" data-to="a3" d="M689 442V498H985V442" fill="none" stroke="#14747b" stroke-width="3" marker-end="url(#arrow)"/><text x="30" y="565" font-size="25">After</text><rect x="180" y="532" width="132" height="70" rx="6" fill="#cde9ee" stroke="#4c7185"/><text x="205" y="576" font-size="28">A1</text><rect x="328" y="532" width="132" height="70" rx="6" fill="#cde9ee" stroke="#4c7185"/><text x="353" y="576" font-size="28">A2</text><rect x="476" y="532" width="132" height="70" rx="6" fill="#cde9ee" stroke="#4c7185"/><text x="501" y="576" font-size="28">A3</text><rect x="624" y="532" width="132" height="70" rx="6" fill="#f2f4f5" stroke="#4c7185"/><text x="649" y="576" font-size="28">B1</text><rect x="772" y="532" width="132" height="70" rx="6" fill="#f2f4f5" stroke="#4c7185"/><text x="797" y="576" font-size="28">C</text><rect x="920" y="532" width="132" height="70" rx="6" fill="#f2f4f5" stroke="#4c7185"/><text x="945" y="576" font-size="28">Free</text><path data-from="a1-after" data-to="a3-after" d="M245 604V642H541V604" fill="none" stroke="#14747b" stroke-width="3" marker-end="url(#arrow)"/><text x="30" y="694" font-size="25">Same A1, A2 and A3. Less scattered placement; unchanged file size.</text></svg>