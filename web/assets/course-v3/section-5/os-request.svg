<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img"><title>A file request returns success or an error</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#14747b"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#142b45}</style><rect width="1120" height="700" fill="white"/><text x="30" y="48" font-size="29">A file request returns success or an error</text><rect x="30" y="100" width="370" height="110" rx="9" fill="#edf6f8" stroke="#4c7185" stroke-width="2"/><text x="48" y="134" font-size="25">Application</text><text x="48" y="170" font-size="23">Request a named file write</text><path data-from="application" data-to="permission" d="M400 155H580" fill="none" stroke="#14747b" stroke-width="3" marker-end="url(#arrow)"/><rect x="580" y="100" width="510" height="110" rx="9" fill="#edf6f8" stroke="#4c7185" stroke-width="2"/><text x="598" y="134" font-size="25">OS security check</text><text x="598" y="170" font-size="23">Is this identity allowed to write?</text><path data-from="permission" data-to="file-service" d="M690 210V255H275V320" fill="none" stroke="#14747b" stroke-width="3" marker-end="url(#arrow)"/><text x="300" y="280" font-size="24">Allowed</text><path data-from="permission" data-to="denied" d="M940 210V320" fill="none" stroke="#14747b" stroke-width="3" marker-end="url(#arrow)"/><text x="960" y="280" font-size="24">Denied</text><rect x="30" y="320" width="490" height="165" rx="9" fill="#edf6f8" stroke="#4c7185" stroke-width="2"/><text x="48" y="354" font-size="25">File and device services</text><text x="48" y="390" font-size="23">Locate file; coordinate the write.</text><text x="48" y="421" font-size="23">Driver and storage perform transfer.</text><text x="48" y="452" font-size="23">Wait for completion or a device error.</text><rect x="650" y="320" width="440" height="165" rx="9" fill="#edf6f8" stroke="#4c7185" stroke-width="2"/><text x="668" y="354" font-size="25">Refuse the write</text><text x="668" y="390" font-size="23">Saved content stays unchanged.</text><text x="668" y="421" font-size="23">No protected write is performed.</text><path data-from="file-service" data-to="result" d="M275 485V575H350" fill="none" stroke="#14747b" stroke-width="3" marker-end="url(#arrow)"/><path data-from="denied" data-to="result" d="M875 485V575H770" fill="none" stroke="#14747b" stroke-width="3" marker-end="url(#arrow)"/><rect x="350" y="530" width="420" height="115" rx="9" fill="#edf6f8" stroke="#4c7185" stroke-width="2"/><text x="368" y="564" font-size="25">Result to application</text><text x="368" y="600" font-size="23">Completion or error</text><text x="368" y="631" font-size="23">Show the actual save outcome.</text></svg>