<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img"><title>Identify the source, translator and execution stage</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#14747b"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#142b45}</style><rect width="1120" height="700" fill="white"/><text x="30" y="48" font-size="29">Identify the source, translator and execution stage</text><text x="30" y="106" font-size="22">ASSEMBLY</text><rect x="30" y="130" width="300" height="120" rx="9" fill="#edf6f8" stroke="#4c7185" stroke-width="2"/><text x="48" y="164" font-size="25">Assembly source</text><text x="48" y="200" font-size="23">Mnemonics + operands</text><path data-from="assembly-source" data-to="assembler" d="M330 190H400" fill="none" stroke="#14747b" stroke-width="3" marker-end="url(#arrow)"/><rect x="400" y="130" width="300" height="120" rx="9" fill="#edf6f8" stroke="#4c7185" stroke-width="2"/><text x="418" y="164" font-size="25">Assembler</text><text x="418" y="200" font-size="23">Target instruction set</text><path data-from="assembler" data-to="machine-code" d="M700 190H770" fill="none" stroke="#14747b" stroke-width="3" marker-end="url(#arrow)"/><rect x="770" y="130" width="320" height="120" rx="9" fill="#edf6f8" stroke="#4c7185" stroke-width="2"/><text x="788" y="164" font-size="25">Object / machine code</text><text x="788" y="200" font-size="23">Link if needed; then run</text><text x="30" y="296" font-size="22">NATIVE COMPILATION MODEL</text><rect x="30" y="320" width="300" height="120" rx="9" fill="#edf6f8" stroke="#4c7185" stroke-width="2"/><text x="48" y="354" font-size="25">High-level source</text><text x="48" y="390" font-size="23">Saved program version</text><path data-from="source" data-to="compiler" d="M330 380H400" fill="none" stroke="#14747b" stroke-width="3" marker-end="url(#arrow)"/><rect x="400" y="320" width="300" height="120" rx="9" fill="#edf6f8" stroke="#4c7185" stroke-width="2"/><text x="418" y="354" font-size="25">Compiler / build</text><text x="418" y="390" font-size="23">Translate; link if needed</text><path data-from="compiler" data-to="executable" d="M700 380H770" fill="none" stroke="#14747b" stroke-width="3" marker-end="url(#arrow)"/><rect x="770" y="320" width="320" height="120" rx="9" fill="#edf6f8" stroke="#4c7185" stroke-width="2"/><text x="788" y="354" font-size="25">Native executable</text><text x="788" y="390" font-size="23">Run the built version</text><text x="30" y="486" font-size="22">HIGH-LEVEL INTERPRETATION MODEL</text><rect x="30" y="510" width="300" height="120" rx="9" fill="#edf6f8" stroke="#4c7185" stroke-width="2"/><text x="48" y="544" font-size="25">High-level source</text><text x="48" y="580" font-size="23">Valid program input</text><path data-from="interpreted-source" data-to="interpreter" d="M330 570H400" fill="none" stroke="#14747b" stroke-width="3" marker-end="url(#arrow)"/><rect x="400" y="510" width="300" height="120" rx="9" fill="#edf6f8" stroke="#4c7185" stroke-width="2"/><text x="418" y="544" font-size="25">Interpreter</text><text x="418" y="580" font-size="23">Follow control flow</text><path data-from="interpreter" data-to="effects" d="M700 570H770" fill="none" stroke="#14747b" stroke-width="3" marker-end="url(#arrow)"/><rect x="770" y="510" width="320" height="120" rx="9" fill="#edf6f8" stroke="#4c7185" stroke-width="2"/><text x="788" y="544" font-size="25">Execution effects</text><text x="788" y="580" font-size="23">Changed state / output</text><text x="30" y="676" font-size="23">Translation is not proof that the program implements the required calculation.</text></svg>