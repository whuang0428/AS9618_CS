<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="625" viewBox="0 0 1120 625" role="img"><title>Java: compile the source, then run the class file</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#14747b"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#142b45}</style><rect width="1120" height="625" fill="white"/><text x="30" y="48" font-size="29">Java: compile the source, then run the class file</text><rect x="30" y="110" width="300" height="120" rx="9" fill="#edf6f8" stroke="#4c7185" stroke-width="2"/><text x="48" y="144" font-size="25">Hello.java</text><text x="48" y="180" font-size="23">Human-readable source</text><path data-from="source" data-to="javac" d="M330 170H405" fill="none" stroke="#14747b" stroke-width="3" marker-end="url(#arrow)"/><rect x="405" y="110" width="300" height="120" rx="9" fill="#edf6f8" stroke="#4c7185" stroke-width="2"/><text x="423" y="144" font-size="25">javac Hello.java</text><text x="423" y="180" font-size="23">Build step</text><path data-from="javac" data-to="bytecode" d="M705 170H780" fill="none" stroke="#14747b" stroke-width="3" marker-end="url(#arrow)"/><rect x="780" y="110" width="310" height="120" rx="9" fill="#edf6f8" stroke="#4c7185" stroke-width="2"/><text x="798" y="144" font-size="25">Hello.class</text><text x="798" y="180" font-size="23">JVM bytecode</text><path data-from="bytecode" data-to="runtime" d="M935 230V325H810" fill="none" stroke="#14747b" stroke-width="3" marker-end="url(#arrow)"/><text x="480" y="265" font-size="24">Launch with java Hello</text><rect x="340" y="280" width="470" height="160" rx="9" fill="#edf6f8" stroke="#4c7185" stroke-width="2"/><text x="358" y="314" font-size="25">Compatible host JVM</text><text x="358" y="350" font-size="23">Executes the bytecode on this host</text><text x="358" y="381" font-size="23">Requires a compatible runtime</text><text x="358" y="412" font-size="23">Does not rebuild edited source</text><path data-from="runtime" data-to="output" d="M575 440V490" fill="none" stroke="#14747b" stroke-width="3" marker-end="url(#arrow)"/><rect x="340" y="490" width="470" height="90" rx="9" fill="#edf6f8" stroke="#4c7185" stroke-width="2"/><text x="358" y="524" font-size="25">Console: Hello, World!</text><text x="30" y="610" font-size="23">Edit source → rebuild successfully → run updated class. Old class → old result.</text></svg>