<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="710" viewBox="0 0 1120 710" role="img"><title>IDE assistance: see what each tool actually changes</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#14747b"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#142b45}</style><rect width="1120" height="710" fill="white"/><text x="30" y="48" font-size="29">IDE assistance: see what each tool actually changes</text><text x="30" y="95" font-size="22">Illustrative editor • Cambridge-style notation • no interactive controls</text><rect x="30" y="135" width="555" height="145" rx="9" fill="#edf6f8" stroke="#4c7185" stroke-width="2"/><text x="48" y="169" font-size="25">Source being entered</text><text x="48" y="205" font-size="23">Cost &lt;- Quantity *</text><text x="48" y="236" font-size="23">Choose the intended right operand.</text><rect x="635" y="135" width="455" height="145" rx="9" fill="#edf6f8" stroke="#4c7185" stroke-width="2"/><text x="653" y="169" font-size="25">Context-sensitive prompts</text><text x="653" y="205" font-size="23">UnitPrice : INTEGER</text><text x="653" y="236" font-size="23">Delivery : INTEGER</text><path data-from="source-position" data-to="suggestions" d="M585 207H635" fill="none" stroke="#14747b" stroke-width="3" marker-end="url(#arrow)"/><rect x="30" y="320" width="555" height="135" rx="9" fill="#edf6f8" stroke="#4c7185" stroke-width="2"/><text x="48" y="354" font-size="25">Incomplete expression</text><text x="48" y="390" font-size="23">Total &lt;- Total +</text><text x="48" y="421" font-size="23">The right operand is missing.</text><rect x="635" y="320" width="455" height="135" rx="9" fill="#edf6f8" stroke="#4c7185" stroke-width="2"/><text x="653" y="354" font-size="25">Syntax diagnostic</text><text x="653" y="390" font-size="23">Expected an operand</text><text x="653" y="421" font-size="23">Inspect and complete the expression.</text><path data-from="incomplete-source" data-to="diagnostic" d="M585 390H635" fill="none" stroke="#14747b" stroke-width="3" marker-end="url(#arrow)"/><rect x="30" y="500" width="1060" height="145" rx="9" fill="#edf6f8" stroke="#4c7185" stroke-width="2"/><text x="48" y="534" font-size="25">Collapsed code block — display only</text><text x="48" y="570" font-size="23">IF Mark &gt;= 50 THEN … ENDIF</text><text x="48" y="601" font-size="23">The body is hidden, not deleted. Input 60 still selects the Pass branch.</text></svg>