<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="730" viewBox="0 0 1120 730" role="img"><title>Fetch each instruction, then execute its operation</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#14747b"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#142b45} .title{font-size:30px;font-weight:700}.label{font-size:24px;font-weight:700}.note{font-size:21px}.wire{fill:none;stroke:#14747b;stroke-width:3;marker-end:url(#arrow)}.box{fill:#edf6f8;stroke:#4c7185;stroke-width:2}</style><rect width="100%" height="100%" fill="white"/><text x="30" y="45" class="title">Fetch each instruction, then execute its operation</text>
<rect class="box" x="30" y="85" width="440" height="115" rx="8"/><text x="48" y="120" class="label">0: fetch LDD 4</text><text x="48" y="155" class="note">Read instruction 0 into CIR</text><rect class="box" x="630" y="85" width="460" height="115" rx="8"/><text x="648" y="120" class="label">Read operand at address 4</text><text x="648" y="155" class="note">MDR = 18 → ACC = 18</text>
<path class="wire" d="M470 145 H630"/><text x="489" y="124" class="note">execute</text>
<rect class="box" x="30" y="240" width="440" height="115" rx="8"/><text x="48" y="275" class="label">1: fetch ADD 5</text><text x="48" y="310" class="note">Read instruction 1 into CIR</text><rect class="box" x="630" y="240" width="460" height="115" rx="8"/><text x="648" y="275" class="label">Read operand at address 5</text><text x="648" y="310" class="note">MDR = 24; ACC = 18 + 24 = 42</text>
<path class="wire" d="M470 300 H630"/><text x="489" y="279" class="note">execute</text>
<rect class="box" x="30" y="395" width="440" height="115" rx="8"/><text x="48" y="430" class="label">2: fetch STO 6</text><text x="48" y="465" class="note">Read instruction 2 into CIR</text><rect class="box" x="630" y="395" width="460" height="115" rx="8"/><text x="648" y="430" class="label">Write result at address 6</text><text x="648" y="465" class="note">MAR = 6; MDR = 42; write</text>
<path class="wire" d="M470 455 H630"/><text x="489" y="434" class="note">execute</text>
<rect class="box" x="30" y="550" width="1060" height="105" rx="8"/><text x="48" y="585" class="label">3: fetch END, then return control to the OS</text><text x="48" y="620" class="note">Final ACC = 42; IX = 0; Memory[6] = 42; source data unchanged.</text>
<text x="30" y="700" class="note">Initial PC = 0, ACC = 0, IX = 0; Memory[4] = 18, Memory[5] = 24, Memory[6] = 0.</text></svg>