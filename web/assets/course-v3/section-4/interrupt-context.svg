<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="570" viewBox="0 0 1120 570" role="img"><title>Save, service, restore, resume</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#14747b"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#142b45} .title{font-size:30px;font-weight:700}.label{font-size:24px;font-weight:700}.note{font-size:21px}.wire{fill:none;stroke:#14747b;stroke-width:3;marker-end:url(#arrow)}.box{fill:#edf6f8;stroke:#4c7185;stroke-width:2}</style><rect width="100%" height="100%" fill="white"/><text x="30" y="45" class="title">Save, service, restore, resume</text>
<rect class="box" x="30" y="100" width="320" height="250" rx="8"/><text x="48" y="135" class="label">Interrupted program</text><text x="48" y="170" class="note">Next PC = 330</text><text x="48" y="199" class="note">ACC = 18</text><text x="48" y="228" class="note">IX = 4</text><text x="48" y="257" class="note">Comparison = True</text>
<rect class="box" x="400" y="100" width="320" height="250" rx="8"/><text x="418" y="135" class="label">ISR working state</text><text x="418" y="170" class="note">Runs the selected handler</text><text x="418" y="199" class="note">ACC becomes 65</text><text x="418" y="228" class="note">IX becomes 0</text><text x="418" y="257" class="note">Comparison becomes False</text>
<rect class="box" x="770" y="100" width="320" height="250" rx="8"/><text x="788" y="135" class="label">Restored program</text><text x="788" y="170" class="note">PC = 330</text><text x="788" y="199" class="note">ACC = 18</text><text x="788" y="228" class="note">IX = 4</text><text x="788" y="257" class="note">Comparison = True</text>
<path class="wire" d="M350 225 H400"/><path class="wire" d="M720 225 H770"/>
<rect class="box" x="30" y="400" width="660" height="100" rx="8"/><text x="48" y="435" class="label">Saved context remains available during service</text><text x="48" y="470" class="note">Return address, live registers and required status</text>
<path class="wire" d="M190 350 V400"/><path class="wire" d="M690 450 H930 V350"/>
<text x="30" y="548" class="note">Resume ADD #2 at 330: ACC becomes 20. Keeping the ISR value would wrongly give 67.</text></svg>