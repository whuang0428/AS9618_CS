<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="520" viewBox="0 0 1160 520" role="img"><title>Fetch one instruction: keep addresses and instructions distinct</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#14747b"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#142b45} .title{font-size:30px;font-weight:700}.label{font-size:24px;font-weight:700}.note{font-size:21px}.wire{fill:none;stroke:#14747b;stroke-width:3;marker-end:url(#arrow)}.box{fill:#edf6f8;stroke:#4c7185;stroke-width:2}</style><rect width="100%" height="100%" fill="white"/><text x="30" y="45" class="title">Fetch one instruction: keep addresses and instructions distinct</text>
<rect class="box" x="30" y="125" width="150" height="120" rx="8"/><text x="48" y="160" class="label">PC</text><text x="48" y="195" class="note">Next address</text><rect class="box" x="265" y="125" width="155" height="120" rx="8"/><text x="283" y="160" class="label">MAR</text><text x="283" y="195" class="note">Address</text><rect class="box" x="500" y="125" width="180" height="120" rx="8"/><text x="518" y="160" class="label">Memory</text><text x="518" y="195" class="note">Instruction</text><rect class="box" x="760" y="125" width="155" height="120" rx="8"/><text x="778" y="160" class="label">MDR</text><text x="778" y="195" class="note">Instruction</text><rect class="box" x="990" y="125" width="145" height="120" rx="8"/><text x="1008" y="160" class="label">CIR</text><text x="1008" y="195" class="note">Instruction</text>
<path class="wire" data-from="PC" data-to="MAR" d="M180 185 H265"/><text x="204" y="164" class="label">1</text>
<path class="wire" data-from="MAR" data-to="Memory" d="M420 185 H500"/><text x="445" y="164" class="label">2</text>
<path class="wire" data-from="Memory" data-to="MDR" d="M680 185 H760"/><text x="705" y="164" class="label">3</text>
<path class="wire" data-from="MDR" data-to="CIR" d="M915 185 H990"/><text x="939" y="164" class="label">4</text>
<text x="30" y="300" class="note">1. MAR ← [PC]</text><text x="380" y="300" class="note">2. Address bus selects memory; CU sends read.</text>
<text x="30" y="344" class="note">3. MDR ← [[MAR]]</text><text x="380" y="344" class="note">4. CIR ← [MDR]</text>
<text x="30" y="390" class="note">After copying the current address, advance PC to the next instruction (PC ← [PC] + 1 here).</text>
<text x="30" y="424" class="note">Decode the instruction in CIR; execution depends on that instruction.</text></svg>