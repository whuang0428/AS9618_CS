<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img"><title>One addressable memory holds instructions and data</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#14747b"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#142b45} .title{font-size:30px;font-weight:700}.label{font-size:24px;font-weight:700}.note{font-size:21px}.wire{fill:none;stroke:#14747b;stroke-width:3;marker-end:url(#arrow)}.box{fill:#edf6f8;stroke:#4c7185;stroke-width:2}</style><rect width="100%" height="100%" fill="white"/><text x="30" y="45" class="title">One addressable memory holds instructions and data</text>
<rect class="box" x="30" y="85" width="430" height="335" rx="12"/><text x="55" y="125" class="label">CPU</text>
<rect class="box" x="55" y="150" width="175" height="90" rx="8"/><text x="73" y="185" class="label">CU</text><text x="73" y="220" class="note">Directs work</text><rect class="box" x="255" y="150" width="175" height="90" rx="8"/><text x="273" y="185" class="label">ALU</text><text x="273" y="220" class="note">Calculates</text>
<rect class="box" x="55" y="275" width="375" height="100" rx="8"/><text x="73" y="310" class="label">Registers</text><text x="73" y="345" class="note">Temporary processor state</text>
<rect class="box" x="690" y="85" width="400" height="335" rx="8"/><text x="708" y="120" class="label">Immediate access store (IAS)</text><text x="708" y="155" class="note">Address 0: LDD 4 (encoded)</text><text x="708" y="184" class="note">Address 1: ADD 5 (encoded)</text><text x="708" y="213" class="note">Address 2: STO 6; 3: END</text><text x="708" y="242" class="note">Address 4: 18; address 5: 24</text><text x="708" y="271" class="note">Address 6: 0, then 42</text>
<path class="wire" data-from="CPU" data-to="IAS" d="M460 180 H690"/><text x="485" y="162" class="note">Address</text>
<path class="wire" marker-start="url(#arrow)" data-from="CPU" data-to="IAS" data-direction="both" d="M460 270 H690"/><text x="485" y="251" class="note">Data / instructions</text>
<path class="wire" marker-start="url(#arrow)" data-from="CPU" data-to="IAS" data-direction="both" d="M460 360 H690"/><text x="485" y="341" class="note">Control signals</text>
<rect class="box" x="690" y="480" width="400" height="135" rx="8"/><text x="708" y="515" class="label">Input/output interface</text><text x="708" y="550" class="note">Connects external peripherals</text><text x="708" y="579" class="note">Exchanges data and signals</text>
<path class="wire" marker-start="url(#arrow)" d="M245 420 V550 H690"/><text x="290" y="530" class="note">System buses to the interface</text>
<text x="30" y="670" class="note">Programs change the stored instruction sequence; the CPU fetches each instruction.</text>
<text x="30" y="710" class="note">Instruction and data addresses belong to the same memory space in this model.</text></svg>