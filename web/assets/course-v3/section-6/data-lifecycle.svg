<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">Follow the data and the working service</title><desc id="desc">The same examination record can face different problems at different stages.</desc><rect width="1200" height="660" fill="#fff"/><g fill="#183448" font-family="Arial, Helvetica, sans-serif"><text x="45" y="58" font-size="36" font-weight="700">Follow the data and the working service</text><text x="45" y="99" font-size="23" >The same examination record can face different problems at different stages.</text><rect x="40" y="150" width="260" height="245" rx="10" fill="#edf6f5" stroke="#bdd3d4"/><text x="58" y="194" font-size="25" >ENTER</text><text x="58" y="252" font-size="21" >Source mark: 46</text><text x="58" y="287" font-size="21" >Teacher enters 64</text><text x="58" y="322" font-size="21" >Inaccurate value</text><rect x="335" y="150" width="260" height="245" rx="10" fill="#edf6f5" stroke="#bdd3d4"/><text x="353" y="194" font-size="25" >STORE</text><text x="353" y="252" font-size="21" >Correct mark saved</text><text x="353" y="287" font-size="21" >Only copy deleted</text><text x="353" y="322" font-size="21" >Data unavailable</text><rect x="630" y="150" width="260" height="245" rx="10" fill="#edf6f5" stroke="#bdd3d4"/><text x="648" y="194" font-size="25" >USE</text><text x="648" y="252" font-size="21" >Correct file exists</text><text x="648" y="287" font-size="21" >Application cannot start</text><text x="648" y="322" font-size="21" >Service unavailable</text><rect x="925" y="150" width="260" height="245" rx="10" fill="#edf6f5" stroke="#bdd3d4"/><text x="943" y="194" font-size="25" >SHARE</text><text x="943" y="252" font-size="21" >Record stays unchanged</text><text x="943" y="287" font-size="21" >Unauthorised disclosure</text><text x="943" y="322" font-size="21" >Privacy affected</text><text x="55" y="465" font-size="26" >Security protects against unauthorised access, loss and damage.</text><text x="55" y="514" font-size="26" >Privacy concerns appropriate access, use and disclosure of personal data.</text><text x="55" y="563" font-size="26" >Integrity concerns accuracy, completeness and consistency.</text><text x="55" y="617" font-size="23" >One event may affect more than one property. Explain the actual consequence.</text></g></svg>