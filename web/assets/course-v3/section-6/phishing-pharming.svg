<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc"><title id="title">Phishing and pharming: identify the route</title><desc id="desc">Both routes can reach an imitation sign-in page; their causes and precautions differ.</desc><rect width="1200" height="820" fill="#fff"/><g fill="#183448" font-family="Arial, Helvetica, sans-serif"><text x="45" y="58" font-size="36" font-weight="700">Phishing and pharming: identify the route</text><text x="45" y="99" font-size="23" >Both routes can reach an imitation sign-in page; their causes and precautions differ.</text><text x="48" y="150" font-size="27" font-weight="700">PHISHING: a deceptive message persuades the user</text><rect x="45" y="175" width="265" height="180" rx="10" fill="#edf6f5" stroke="#bdd3d4"/><text x="64" y="218" font-size="23" >Urgent message</text><text x="64" y="253" font-size="23" >impersonates support</text><path d="M310 262H320" stroke="#23676b" stroke-width="4" fill="none"/><path d="M319 255L333 262L319 269" fill="#23676b"/><rect x="335" y="175" width="265" height="180" rx="10" fill="#edf6f5" stroke="#bdd3d4"/><text x="354" y="218" font-size="23" >User follows</text><text x="354" y="253" font-size="23" >the supplied link</text><path d="M600 262H610" stroke="#23676b" stroke-width="4" fill="none"/><path d="M609 255L623 262L609 269" fill="#23676b"/><rect x="625" y="175" width="265" height="180" rx="10" fill="#edf6f5" stroke="#bdd3d4"/><text x="644" y="218" font-size="23" >Imitation page</text><text x="644" y="253" font-size="23" >collects credentials</text><path d="M890 262H900" stroke="#23676b" stroke-width="4" fill="none"/><path d="M899 255L913 262L899 269" fill="#23676b"/><rect x="915" y="175" width="265" height="180" rx="10" fill="#edf6f5" stroke="#bdd3d4"/><text x="934" y="218" font-size="23" >Attacker receives</text><text x="934" y="253" font-size="23" >the entered secret</text><text x="48" y="420" font-size="27" font-weight="700">PHARMING: the intended name is mapped to the wrong destination</text><rect x="45" y="445" width="265" height="180" rx="10" fill="#fff4e9" stroke="#bdd3d4"/><text x="64" y="488" font-size="23" >User types the</text><text x="64" y="523" font-size="23" >correct known name</text><path d="M310 532H320" stroke="#23676b" stroke-width="4" fill="none"/><path d="M319 525L333 532L319 539" fill="#23676b"/><rect x="335" y="445" width="265" height="180" rx="10" fill="#fff4e9" stroke="#bdd3d4"/><text x="354" y="488" font-size="23" >Corrupted DNS or</text><text x="354" y="523" font-size="23" >local name mapping</text><path d="M600 532H610" stroke="#23676b" stroke-width="4" fill="none"/><path d="M609 525L623 532L609 539" fill="#23676b"/><rect x="625" y="445" width="265" height="180" rx="10" fill="#fff4e9" stroke="#bdd3d4"/><text x="644" y="488" font-size="23" >Wrong server sends</text><text x="644" y="523" font-size="23" >an imitation page</text><path d="M890 532H900" stroke="#23676b" stroke-width="4" fill="none"/><path d="M899 525L913 532L899 539" fill="#23676b"/><rect x="915" y="445" width="265" height="180" rx="10" fill="#fff4e9" stroke="#bdd3d4"/><text x="934" y="488" font-size="23" >Attacker receives</text><text x="934" y="523" font-size="23" >the entered secret</text><text x="48" y="696" font-size="23" >Phishing: use an independently known contact or address to check the request.</text><text x="48" y="739" font-size="23" >Pharming: protect or repair resolution settings; investigate certificate warnings.</text><text x="48" y="782" font-size="22" >Typing the correct address avoids the supplied link; it does not repair a corrupted mapping.</text></g></svg>