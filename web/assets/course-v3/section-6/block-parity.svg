404" width="68" height="55" rx="10" fill="#edf6f5" stroke="#bdd3d4"/><text x="870" y="443" font-size="30" text-anchor="middle" >0</text><rect x="921" y="404" width="68" height="55" rx="10" fill="#edf6f5" stroke="#bdd3d4"/><text x="955" y="443" font-size="30" text-anchor="middle" >0</text><text x="1030" y="294" font-size="24" fill="#aa4824" font-weight="700">FAIL</text><text x="700" y="507" font-size="24" text-anchor="middle" fill="#aa4824" font-weight="700">FAIL</text><text x="52" y="565" font-size="27" >Row 2 and column 5 fail. Their intersection contains the changed bit.</text><text x="52" y="611" font-size="25" >Correct row 2, column 5: 1 → 0. Then check all rows and columns again.</text><text x="52" y="657" font-size="23" >Original row 2: 01100000. Sent parity row: 00010100.</text><text x="52" y="700" font-size="23" >Single-bit assumption: several changed bits may not be located or even detected.</text></g></svg>