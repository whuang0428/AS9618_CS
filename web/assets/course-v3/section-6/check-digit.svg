<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">Check digit: a stated rule</title><desc id="desc">Data digits 4726 · weights 3, 1, 3, 1 · choose a final digit for a multiple of 10</desc><rect width="1200" height="660" fill="#fff"/><g fill="#183448" font-family="Arial, Helvetica, sans-serif"><text x="45" y="58" font-size="36" font-weight="700">Check digit: a stated rule</text><text x="45" y="99" font-size="23" >Data digits 4726 · weights 3, 1, 3, 1 · choose a final digit for a multiple of 10</text><rect x="45" y="135" width="1110" height="285" rx="10" fill="#edf6f5" stroke="#bdd3d4"/><text x="70" y="194" font-size="24" >Data digit</text><text x="70" y="282" font-size="24" >Weight</text><text x="70" y="370" font-size="24" >Product</text><text x="405" y="194" font-size="32" text-anchor="middle" >4</text><text x="405" y="282" font-size="32" text-anchor="middle" >3</text><text x="405" y="370" font-size="32" text-anchor="middle" >12</text><text x="605" y="194" font-size="32" text-anchor="middle" >7</text><text x="605" y="282" font-size="32" text-anchor="middle" >1</text><text x="605" y="370" font-size="32" text-anchor="middle" >7</text><text x="805" y="194" font-size="32" text-anchor="middle" >2</text><text x="805" y="282" font-size="32" text-anchor="middle" >3</text><text x="805" y="370" font-size="32" text-anchor="middle" >6</text><text x="1005" y="194" font-size="32" text-anchor="middle" >6</text><text x="1005" y="282" font-size="32" text-anchor="middle" >1</text><text x="1005" y="370" font-size="32" text-anchor="middle" >6</text><text x="70" y="469" font-size="28" >Weighted sum = 12 + 7 + 6 + 6 = 31</text><text x="70" y="519" font-size="28" font-weight="700">31 + 9 = 40  →  check digit = 9  →  full code = 47269</text><text x="70" y="588" font-size="24" >On entry: recalculate from 4726 and compare with the supplied final digit.</text><text x="70" y="625" font-size="22" >The rule detects some entry errors; it does not prove that the code is the intended one.</text></g></svg>