<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">Byte parity: include the parity bit</title><desc id="desc">This example uses seven data bits followed by one parity bit, forming an eight-bit group.</desc><rect width="1200" height="660" fill="#fff"/><g fill="#183448" font-family="Arial, Helvetica, sans-serif"><text x="45" y="58" font-size="36" font-weight="700">Byte parity: include the parity bit</text><text x="45" y="99" font-size="23" >This example uses seven data bits followed by one parity bit, forming an eight-bit group.</text><text x="344" y="152" font-size="24" >Seven data bits</text><text x="998" y="152" font-size="23" >Parity</text><text x="55" y="217" font-size="24" >Even parity sent</text><rect x="342" y="177" width="76" height="62" rx="10" fill="#edf6f5" stroke="#bdd3d4"/><text x="380" y="219" font-size="32" text-anchor="middle" >1</text><rect x="438" y="177" width="76" height="62" rx="10" fill="#edf6f5" stroke="#bdd3d4"/><text x="476" y="219" font-size="32" text-anchor="middle" >0</text><rect x="534" y="177" width="76" height="62" rx="10" fill="#edf6f5" stroke="#bdd3d4"/><text x="572" y="219" font-size="32" text-anchor="middle" >1</text><rect x="630" y="177" width="76" height="62" rx="10" fill="#edf6f5" stroke="#bdd3d4"/><text x="668" y="219" font-size="32" text-anchor="middle" >1</text><rect x="726" y="177" width="76" height="62" rx="10" fill="#edf6f5" stroke="#bdd3d4"/><text x="764" y="219" font-size="32" text-anchor="middle" >0</text><rect x="822" y="177" width="76" height="62" rx="10" fill="#edf6f5" stroke="#bdd3d4"/><text x="860" y="219" font-size="32" text-anchor="middle" >0</text><rect x="918" y="177" width="76" height="62" rx="10" fill="#edf6f5" stroke="#bdd3d4"/><text x="956" y="219" font-size="32" text-anchor="middle" >1</text><rect x="1014" y="177" width="76" height="62" rx="10" fill="#fff0e5" stroke="#b35328"/><text x="1052" y="219" font-size="32" text-anchor="middle" >0</text><text x="345" y="283" font-size="24" >Four 1 bits in the data + parity bit 0 = four 1 bits in total.</text><text x="55" y="365" font-size="24" >Received</text><rect x="342" y="325" width="76" height="62" rx="10" fill="#edf6f5" stroke="#bdd3d4"/><text x="380" y="367" font-size="32" text-anchor="middle" >1</text><rect x="438" y="325" width="76" height="62" rx="10" fill="#edf6f5" stroke="#bdd3d4"/><text x="476" y="367" font-size="32" text-anchor="middle" >0</text><rect x="534" y="325" width="76" height="62" rx="10" fill="#edf6f5" stroke="#bdd3d4"/><text x="572" y="367" font-size="32" text-anchor="middle" >1</text><rect x="630" y="325" width="76" height="62" rx="10" fill="#fff0e5" stroke="#b35328"/><text x="668" y="367" font-size="32" text-anchor="middle" >0</text><rect x="726" y="325" width="76" height="62" rx="10" fill="#edf6f5" stroke="#bdd3d4"/><text x="764" y="367" font-size="32" text-anchor="middle" >0</text><rect x="822" y="325" width="76" height="62" rx="10" fill="#edf6f5" stroke="#bdd3d4"/><text x="860" y="367" font-size="32" text-anchor="middle" >0</text><rect x="918" y="325" width="76" height="62" rx="10" fill="#edf6f5" stroke="#bdd3d4"/><text x="956" y="367" font-size="32" text-anchor="middle" >1</text><rect x="1014" y="325" width="76" height="62" rx="10" fill="#edf6f5" stroke="#bdd3d4"/><text x="1052" y="367" font-size="32" text-anchor="middle" >0</text><text x="345" y="431" font-size="24" >One bit changed: only three 1 bits remain. Even parity fails.</text><rect x="45" y="470" width="1110" height="138" rx="10" fill="#f1f5f9" stroke="#bdd3d4"/><text x="70" y="516" font-size="25" >Odd parity for the same data would append 1, giving five 1 bits.</text><text x="70" y="561" font-size="24" >Two bit flips may preserve parity: a passed check does not prove no error.</text></g></svg>