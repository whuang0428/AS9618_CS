<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">Spyware: collection, disclosure and consequences</title><desc id="desc">The installation, the captured information and the recipient are separate parts of the mechanism.</desc><rect width="1200" height="660" fill="#fff"/><g fill="#183448" font-family="Arial, Helvetica, sans-serif"><text x="45" y="58" font-size="36" font-weight="700">Spyware: collection, disclosure and consequences</text><text x="45" y="99" font-size="23" >The installation, the captured information and the recipient are separate parts of the mechanism.</text><rect x="40" y="155" width="260" height="240" rx="10" fill="#edf6f5" stroke="#bdd3d4"/><text x="58" y="200" font-size="24" >1  INSTALL</text><text x="58" y="257" font-size="22" >Unknown utility runs</text><text x="58" y="292" font-size="22" >with a hidden</text><text x="58" y="327" font-size="22" >monitoring component</text><path d="M300 278H320" stroke="#23676b" stroke-width="4" fill="none"/><path d="M319 271L333 278L319 285" fill="#23676b"/><rect x="335" y="155" width="260" height="240" rx="10" fill="#edf6f5" stroke="#bdd3d4"/><text x="353" y="200" font-size="24" >2  COLLECT</text><text x="353" y="257" font-size="22" >Keylogger records</text><text x="353" y="292" font-size="22" >the typed account</text><text x="353" y="327" font-size="22" >name and password</text><path d="M595 278H615" stroke="#23676b" stroke-width="4" fill="none"/><path d="M614 271L628 278L614 285" fill="#23676b"/><rect x="630" y="155" width="260" height="240" rx="10" fill="#edf6f5" stroke="#bdd3d4"/><text x="648" y="200" font-size="24" >3  DISCLOSE</text><text x="648" y="257" font-size="22" >A hidden log is sent</text><text x="648" y="292" font-size="22" >over a connection</text><text x="648" y="327" font-size="22" >to a third party</text><path d="M890 278H910" stroke="#23676b" stroke-width="4" fill="none"/><path d="M909 271L923 278L909 285" fill="#23676b"/><rect x="925" y="155" width="260" height="240" rx="10" fill="#edf6f5" stroke="#bdd3d4"/><text x="943" y="200" font-size="24" >4  MISUSE</text><text x="943" y="257" font-size="22" >The recipient can</text><text x="943" y="292" font-size="22" >attempt to sign in</text><text x="943" y="327" font-size="22" >as the account owner</text><text x="52" y="463" font-size="24" >Controlled installation reduces entry; anti-spyware can detect and isolate the component.</text><text x="52" y="518" font-size="26" >Removal stops this installed component from collecting more information.</text><text x="52" y="573" font-size="22" >It cannot erase the recipient’s existing log. Replace exposed credentials from a trusted device.</text><text x="52" y="624" font-size="23" >Covert collection defines spyware; it does not have to replicate into other host files.</text></g></svg>