<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">Checksum: calculate and compare</title><desc id="desc">Specified algorithm for this example: add the data bytes, then take the remainder modulo 256.</desc><rect width="1200" height="660" fill="#fff"/><g fill="#183448" font-family="Arial, Helvetica, sans-serif"><text x="45" y="58" font-size="36" font-weight="700">Checksum: calculate and compare</text><text x="45" y="99" font-size="23" >Specified algorithm for this example: add the data bytes, then take the remainder modulo 256.</text><rect x="45" y="142" width="530" height="315" rx="10" fill="#edf6f5" stroke="#bdd3d4"/><rect x="610" y="142" width="545" height="315" rx="10" fill="#fff4e9" stroke="#bdd3d4"/><text x="70" y="190" font-size="24" font-weight="700">SENDER</text><text x="70" y="246" font-size="30" >Data: 84, 121, 77</text><text x="70" y="302" font-size="30" >Sum = 282</text><text x="70" y="359" font-size="30" font-weight="700">282 mod 256 = 26</text><text x="70" y="418" font-size="24" >Send the data and checksum 26.</text><text x="635" y="190" font-size="23" font-weight="700">RECEIVER: ONE BYTE CHANGED</text><text x="635" y="246" font-size="30" >Data: 84, 120, 77</text><text x="635" y="302" font-size="30" >Sum = 281</text><text x="635" y="359" font-size="30" font-weight="700">281 mod 256 = 25</text><text x="635" y="418" font-size="24" >Compare 25 with the received 26.</text><text x="70" y="519" font-size="28" font-weight="700">25 ≠ 26  →  mismatch  →  reject the block or request retransmission</text><text x="70" y="578" font-size="25" >A match cannot prove no error: 85, 120, 77 also gives checksum 26.</text><text x="70" y="624" font-size="23" >Always use the algorithm stated in the question; checksum algorithms vary.</text></g></svg>